<style>
    :root {
        --po-dark: #2C2C2C; --po-medium: #4C4C4C; --po-light: #BCBCBC;
        --po-white: #FFFFFF; --po-green: #25F464; --po-purple: #6D10FF;
        --po-bg: #1a1a1a; --po-card: #242424; --po-border: #3a3a3a;
    }
    html, body { overflow-x: hidden; max-width: 100%; }
    body { font-family: Arimo, Arial, Helvetica, system-ui, sans-serif; background: var(--po-bg); color: var(--po-light); }
    h1, h2, h3, .font-heading { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.01em; }
    .card { background: var(--po-card); border: 1px solid var(--po-border); border-radius: 10px; }
    .accent-green { color: var(--po-green); }
    .fade-in { animation: fadeIn .28s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .btn-primary { background: var(--po-purple); color: #fff; transition: all .2s; }
    .btn-primary:hover { background: #5a0dd6; }
    .btn-secondary { background: transparent; color: var(--po-light); border: 1px solid var(--po-border); transition: all .2s; }
    .btn-secondary:hover { border-color: var(--po-medium); color: #fff; }

    /* --- Rótulo de sección --------------------------------------------------
       Sustituye a los emojis como marca visual de cada tarjeta. Versalitas
       pequeñas y muy espaciadas: es lo que hace que un panel de datos se lea
       como una herramienta y no como una app de consumo. */
    .rotulo {
        font-size: 10px; font-weight: 700; letter-spacing: .12em;
        text-transform: uppercase; color: #7a7a7a;
    }
    /* Punto de estado. Reemplaza a los semáforos de emoji. */
    .punto { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
    /* Cifras de ancho fijo, para que las columnas de números no bailen. */
    .cifra { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

    .tab { border-bottom: 2px solid transparent; transition: all .18s; white-space: nowrap; }
    .tab:hover { color: #fff; }
    .tab.on { border-bottom-color: var(--po-white); color: #fff; }
    .barra-fondo { background: #1c1c1c; border: 1px solid var(--po-border); border-radius: 3px; overflow: hidden; }
    .enlace { color: var(--po-light); text-decoration: none; border-bottom: 1px solid #3a3a3a; transition: all .15s; }
    .enlace:hover { color: #fff; border-bottom-color: var(--po-light); }
    ::-webkit-scrollbar { height: 6px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--po-border); border-radius: 4px; }
    /* Barra de la prueba, no forma parte del diseño */
    .demo-bar { background: #101010; border-bottom: 1px solid #2a2a2a; }
</style>
