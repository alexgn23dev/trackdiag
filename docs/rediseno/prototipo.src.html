<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mentotrack — prueba de rediseño del diagnóstico</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --po-dark: #2C2C2C; --po-medium: #4C4C4C; --po-light: #BCBCBC;
        --po-white: #FFFFFF; --po-green: #25F464; --po-purple: #6D10FF;
        --po-bg: #1a1a1a; --po-card: #242424; --po-border: #3a3a3a;
    }
    html, body { overflow-x: hidden; max-width: 100%; }
    body { font-family: Arimo, Arial, Helvetica, system-ui, sans-serif; background: var(--po-bg); color: var(--po-light); }
    h1, h2, h3, .font-heading { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.01em; }
    .card { background: var(--po-card); border: 1px solid var(--po-border); border-radius: 12px; }
    .accent-green { color: var(--po-green); }
    .fade-in { animation: fadeIn .28s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .btn-primary { background: var(--po-purple); color: #fff; transition: all .2s; }
    .btn-primary:hover { background: #5a0dd6; }
    .btn-secondary { background: var(--po-dark); color: var(--po-light); border: 1px solid var(--po-border); transition: all .2s; }
    .btn-secondary:hover { background: var(--po-medium); }
    /* Pestañas */
    .tab { border-bottom: 2px solid transparent; transition: all .18s; white-space: nowrap; }
    .tab:hover { color: #fff; }
    .tab.on { border-bottom-color: var(--po-purple); color: #fff; }
    .barra-fondo { background: #1c1c1c; border: 1px solid var(--po-border); border-radius: 999px; overflow: hidden; }
    ::-webkit-scrollbar { height: 6px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--po-border); border-radius: 4px; }
    /* Barra del prototipo, no forma parte del diseño */
    .demo-bar { background: #120b22; border-bottom: 1px solid #2b1a4d; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const CASOS = __CASOS_JSON__;

// ===========================================================================
// Piezas reutilizables
// ===========================================================================

/** Miles con separador. 253164 es ilegible; 253.164 no. */
function num(n) {
    return typeof n === 'number' ? n.toLocaleString('es-ES') : n;
}

/** Pastilla compacta para un dato suelto. Sustituye a media frase de texto. */
function Chip({ etiqueta, valor, tono = 'neutro', title }) {
    const tonos = {
        neutro: 'text-gray-300 border-[#3a3a3a]',
        ok: 'text-[#25F464] border-[#1c4a2a]',
        aviso: 'text-yellow-400 border-[#5c4a12]',
        alerta: 'text-red-400 border-[#5c2020]',
    };
    return (
        <div title={title} className={`inline-flex flex-col px-3 py-1.5 rounded-lg border bg-[#1e1e1e] ${tonos[tono]}`}>
            <span className="text-[10px] uppercase tracking-wider text-gray-500 leading-tight">{etiqueta}</span>
            <span className="text-sm font-semibold leading-tight">{valor}</span>
        </div>
    );
}

/**
 * El patrón que resuelve el "mucho texto": se ve un avance y el resto se
 * despliega solo si el usuario quiere saber más. La explicación no se pierde,
 * deja de estar toda a la vez.
 */
function Desplegable({ avance, children, etiqueta = 'Saber más', abiertoPorDefecto = false }) {
    const [abierto, setAbierto] = useState(abiertoPorDefecto);
    return (
        <div>
            {avance && <p className="text-gray-300 text-sm leading-relaxed">{avance}</p>}
            {abierto && <div className="mt-3 text-gray-400 text-sm leading-relaxed space-y-2 fade-in">{children}</div>}
            <button
                onClick={() => setAbierto(!abierto)}
                className="mt-2 text-xs text-gray-500 hover:text-white transition inline-flex items-center gap-1">
                {abierto ? 'Ocultar' : etiqueta}
                <span className={`transition-transform inline-block ${abierto ? 'rotate-180' : ''}`}>▾</span>
            </button>
        </div>
    );
}

/** Tarjeta con severidad opcional en el borde superior. */
function Tarjeta({ titulo, icono, tono = 'neutro', chips, children, ancho = '' }) {
    const bordes = { neutro: '#3a3a3a', ok: '#25F464', aviso: '#facc15', alerta: '#f87171' };
    return (
        <div className={`card p-5 ${ancho}`} style={{ borderTop: `2px solid ${bordes[tono]}` }}>
            <div className="flex items-start justify-between gap-3 mb-3">
                <h3 className="text-white font-semibold text-sm flex items-center gap-2">
                    {icono && <span className="text-base">{icono}</span>}{titulo}
                </h3>
                {chips && <div className="flex gap-2 flex-wrap justify-end">{chips}</div>}
            </div>
            {children}
        </div>
    );
}

/** Barra con zona objetivo marcada. Un número suelto no dice si está bien. */
function BarraRango({ valor, min, max, objetivoMin, objetivoMax, unidad = '', invertir = false }) {
    const pct = v => Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
    const dentro = valor >= objetivoMin && valor <= objetivoMax;
    return (
        <div>
            <div className="relative h-6 barra-fondo">
                <div className="absolute top-0 bottom-0 bg-[#25F464]/15 border-x border-[#25F464]/40"
                     style={{ left: `${pct(objetivoMin)}%`, width: `${pct(objetivoMax) - pct(objetivoMin)}%` }} />
                <div className="absolute top-0 bottom-0 w-[3px] rounded"
                     style={{ left: `calc(${pct(valor)}% - 1.5px)`, background: dentro ? '#25F464' : '#facc15' }} />
            </div>
            <div className="flex justify-between text-[10px] text-gray-600 mt-1">
                <span>{min}{unidad}</span>
                <span className="text-gray-400">objetivo {objetivoMin} a {objetivoMax}{unidad}</span>
                <span>{max}{unidad}</span>
            </div>
        </div>
    );
}

/** Tres bandas del espectro, de un vistazo. */
function Espectro({ grave, media, aguda }) {
    const vals = [
        { n: 'Graves', v: grave }, { n: 'Medios', v: media }, { n: 'Agudos', v: aguda },
    ];
    const suelo = -75, techo = -20;
    const alto = v => Math.max(4, Math.min(100, ((v - suelo) / (techo - suelo)) * 100));
    return (
        <div className="flex items-end gap-3 h-24">
            {vals.map(b => (
                <div key={b.n} className="flex-1 flex flex-col items-center justify-end h-full">
                    <span className="text-[10px] text-gray-500 mb-1">{b.v?.toFixed(0)} dB</span>
                    <div className="w-full rounded-t"
                         style={{ height: `${alto(b.v)}%`, background: 'linear-gradient(180deg,#6D10FF,#3b0a99)' }} />
                    <span className="text-[10px] text-gray-400 mt-1.5">{b.n}</span>
                </div>
            ))}
        </div>
    );
}

/** Anillo de porcentaje: correlación mono, concentración, etc. */
function Anillo({ pct, etiqueta, tono = '#25F464' }) {
    const r = 26, c = 2 * Math.PI * r;
    return (
        <div className="flex items-center gap-3">
            <svg width="64" height="64" viewBox="0 0 64 64" className="flex-shrink-0">
                <circle cx="32" cy="32" r={r} fill="none" stroke="#2a2a2a" strokeWidth="6" />
                <circle cx="32" cy="32" r={r} fill="none" stroke={tono} strokeWidth="6" strokeLinecap="round"
                        strokeDasharray={`${(c * pct) / 100} ${c}`} transform="rotate(-90 32 32)" />
                <text x="32" y="37" textAnchor="middle" fill="#fff" fontSize="15" fontWeight="600">{Math.round(pct)}%</text>
            </svg>
            <span className="text-xs text-gray-400 leading-snug">{etiqueta}</span>
        </div>
    );
}

/**
 * Corta un texto largo por la primera frase completa, sin partir palabras.
 * Devuelve [avance, resto]; si el texto ya era corto, resto va vacío.
 */
function partirEnAvance(texto, minimo = 90, tope = 240) {
    if (!texto || texto.length <= minimo + 40) return [texto, ''];
    // Primero se busca un punto: es el corte que respeta el sentido.
    const re = /\.\s/g;
    let m;
    while ((m = re.exec(texto)) !== null) {
        if (m.index >= minimo) {
            const avance = texto.slice(0, m.index + 1);
            if (avance.length <= tope) return [avance, texto.slice(m.index + 2)];
            break;
        }
    }
    // Red de seguridad: algunas prioridades del motor son UNA sola frase de
    // 400 caracteres encadenada con puntos y coma, y sin esto no se cortarían.
    // Se busca hacia atrás un ';' y, si no hay, el último espacio.
    const trozo = texto.slice(0, tope);
    const corte = Math.max(trozo.lastIndexOf('; '), trozo.lastIndexOf(', '));
    const i = corte > minimo ? corte : trozo.lastIndexOf(' ');
    if (i <= minimo) return [texto, ''];
    return [texto.slice(0, i) + '…', texto.slice(i + 1)];
}

/**
 * Lista numerada de acciones. Cada paso enseña la primera frase y guarda el
 * resto: las prioridades del motor son párrafos de 400 caracteres y verlas
 * las tres seguidas es justo lo que hace que no se lea ninguna.
 */
function Pasos({ items, desde = 1, soloContenido = false }) {
    const contenido = p => {
        const [avance, resto] = partirEnAvance(p);
        return resto
            ? <Desplegable avance={avance} etiqueta="Cómo se hace"><p>{resto}</p></Desplegable>
            : <p className="text-gray-300 text-sm leading-relaxed">{avance}</p>;
    };
    // `soloContenido` lo usa el resumen, que pinta su propia numeración para
    // poder colocar los pasos en columnas en vez de en una lista vertical.
    if (soloContenido) return contenido(items[0]);
    return (
        <ol className="space-y-3">
            {items.map((p, i) => (
                <li key={i} className="flex gap-3 items-start">
                    <span className="flex-shrink-0 w-6 h-6 rounded-full bg-[#1c3a24] accent-green flex items-center justify-center text-xs font-bold mt-0.5">
                        {i + desde}
                    </span>
                    <div className="min-w-0">{contenido(p)}</div>
                </li>
            ))}
        </ol>
    );
}

// ===========================================================================
// Contenido por pestaña
// ===========================================================================

/**
 * El resumen manda las prioridades ARRIBA y a lo ancho, en tres columnas.
 *
 * El qué-está-mal ya lo dice la cabecera; repetirlo en una tarjeta era
 * duplicar la misma frase dos veces en la misma pantalla. Lo que el productor
 * necesita del cuerpo es el qué-hago, y eso merece el ancho entero.
 */
function TabResumen({ r }) {
    const prioridades = r.prioridades.slice(0, 3);
    return (
        <div className="space-y-5">
            <Tarjeta titulo="Qué hacer ahora" icono="✅" tono="ok">
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-6 gap-y-4">
                    {prioridades.map((p, i) => (
                        <div key={i} className="flex gap-3 items-start">
                            <span className="flex-shrink-0 w-6 h-6 rounded-full bg-[#1c3a24] accent-green flex items-center justify-center text-xs font-bold mt-0.5">
                                {i + 1}
                            </span>
                            <div className="min-w-0">
                                <Pasos items={[p]} soloContenido />
                            </div>
                        </div>
                    ))}
                </div>
                {r.prioridades.length > 3 && (
                    <p className="text-gray-600 text-xs mt-4">
                        Hay {r.prioridades.length - 3} más en «Plan de acción».
                    </p>
                )}
            </Tarjeta>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <Tarjeta titulo="Por qué lo decimos" icono="🎯" tono="aviso">
                    <p className="text-gray-500 text-xs mb-2">
                        Señales del análisis que han disparado el diagnóstico.
                    </p>
                    {r.diagnostico_principal.explicacion.split('\n').filter(Boolean).map((l, i) => (
                        <p key={i} className="text-gray-300 text-sm leading-relaxed">{l}</p>
                    ))}
                </Tarjeta>

                {r.nota_contextual && (
                    <Tarjeta titulo="Para tu caso concreto" icono="💬">
                        <Desplegable avance={partirEnAvance(r.nota_contextual, 110)[0]}>
                            <p>{partirEnAvance(r.nota_contextual, 110)[1]}</p>
                        </Desplegable>
                    </Tarjeta>
                )}

                {r.siguiente_sesion && (
                    <Tarjeta titulo="Tu próxima sesión" icono="🗓️">
                        <Desplegable avance={partirEnAvance(r.siguiente_sesion, 100)[0]}>
                            <p>{partirEnAvance(r.siguiente_sesion, 100)[1]}</p>
                        </Desplegable>
                    </Tarjeta>
                )}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                {r.error_de_foco && (
                    <Tarjeta titulo="Ojo con dónde pones el esfuerzo" icono="⚠️" tono="aviso"
                             ancho="lg:col-span-2">
                        <p className="text-gray-300 text-sm leading-relaxed">{r.error_de_foco_mensaje}</p>
                    </Tarjeta>
                )}
                {r.diagnostico_secundario && (
                    <Tarjeta titulo="Segundo frente" icono="↪️">
                        <p className="text-gray-300 text-sm leading-relaxed">{r.diagnostico_secundario.titulo}</p>
                    </Tarjeta>
                )}
                {r.referencia_temporal && (
                    <div className="card p-5">
                        <p className="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Referencia de tiempo</p>
                        <p className="text-gray-300 text-sm">{r.referencia_temporal}</p>
                    </div>
                )}
            </div>
        </div>
    );
}

function TabPlan({ r }) {
    return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div className="space-y-5">
                <Tarjeta titulo="Todas las prioridades, en orden" icono="📋" tono="ok">
                    <Pasos items={r.prioridades} />
                </Tarjeta>
                {r.sugerencias_estructura?.length > 0 && (
                    <Tarjeta titulo="Estructura: dónde tocar" icono="🧱">
                        <ul className="space-y-2">
                            {r.sugerencias_estructura.map((s, i) => (
                                <li key={i} className="text-gray-300 text-sm leading-relaxed flex gap-2">
                                    <span className="text-gray-600">—</span>{s}
                                </li>
                            ))}
                        </ul>
                    </Tarjeta>
                )}
            </div>
            <div className="space-y-5">
                {r.no_tocar_aun?.length > 0 && (
                    <Tarjeta titulo="No toques esto todavía" icono="🚫" tono="aviso">
                        <p className="text-xs text-gray-500 mb-3">
                            Tan importante como lo que hay que hacer: lo que va a hacerte perder el tiempo ahora.
                        </p>
                        <ul className="space-y-3">
                            {r.no_tocar_aun.map((n, i) => (
                                <li key={i} className="text-gray-300 text-sm leading-relaxed flex gap-2">
                                    <span className="text-gray-600 flex-shrink-0">✕</span>{n}
                                </li>
                            ))}
                        </ul>
                    </Tarjeta>
                )}
                {(r.tips_genero?.length > 0 || r.tip_objetivo) && (
                    <Tarjeta titulo="Por tu género y tu objetivo" icono="🎚️">
                        {r.tips_genero?.map((t, i) => (
                            <p key={i} className="text-gray-300 text-sm leading-relaxed mb-2">{t}</p>
                        ))}
                        {r.tip_objetivo && (
                            <Desplegable avance={r.tip_objetivo.split('. ')[0] + '.'}>
                                <p>{r.tip_objetivo}</p>
                            </Desplegable>
                        )}
                    </Tarjeta>
                )}
            </div>
        </div>
    );
}

function TabMezcla({ r }) {
    const d = r.datos_audio, s = r.senales || {}, m = d.mono_compat || {}, h = d.harshness || {};
    const tonoBalance = d.balance_grave === 'elevado' ? 'aviso' : 'ok';
    return (
        <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
            <Tarjeta titulo="Balance espectral" icono="📊" tono={tonoBalance}
                     chips={<Chip etiqueta="Graves" valor={d.balance_grave} tono={tonoBalance} />}>
                <Espectro grave={s.db_grave} media={s.db_media} aguda={s.db_aguda} />
                <p className="text-gray-400 text-xs mt-3">
                    Diferencia graves–medios: <span className="text-white">{s.diff_grave_media?.toFixed(1)} dB</span>
                </p>
                <Desplegable etiqueta="Qué significa">
                    <p>Una diferencia grande entre graves y medios suele significar que el low end
                       se está comiendo el sitio del resto. No es que falten agudos: es que hay
                       demasiado grave tapándolos.</p>
                </Desplegable>
            </Tarjeta>

            <Tarjeta titulo="Densidad y dinámica" icono="🌊"
                     chips={<Chip etiqueta="Densidad" valor={d.densidad} />}>
                <div className="space-y-3">
                    <div className="flex justify-between text-sm">
                        <span className="text-gray-400">Rango dinámico</span>
                        <span className="text-white font-medium">{s.rango_dinamico?.toFixed(1)} dB</span>
                    </div>
                    <div className="flex justify-between text-sm">
                        <span className="text-gray-400">Contraste entre secciones</span>
                        <span className="text-white font-medium">{d.contraste}</span>
                    </div>
                    <div className="flex justify-between text-sm">
                        <span className="text-gray-400">Cambios significativos</span>
                        <span className="text-white font-medium">{s.cambios_significativos}</span>
                    </div>
                </div>
            </Tarjeta>

            <Tarjeta titulo="Compatibilidad mono" icono="🔊"
                     tono={m.nivel_compatibilidad === 'excelente' ? 'ok' : 'aviso'}
                     chips={<Chip etiqueta="Estado" valor={m.nivel_compatibilidad}
                                  tono={m.nivel_compatibilidad === 'excelente' ? 'ok' : 'aviso'} />}>
                <Anillo pct={(m.correlacion_lr || 0) * 100}
                        etiqueta={`Correlación L/R · pérdida en mono ${m.perdida_mono_db} dB`} />
                <Desplegable etiqueta="Ver el detalle por bandas">
                    <p>{m.resumen}</p>
                    {m.bandas && Object.entries(m.bandas).map(([banda, v]) => (
                        <div key={banda} className="flex justify-between text-xs">
                            <span className="capitalize text-gray-500">{banda}</span>
                            <span className="text-gray-300">
                                {(v.correlacion * 100).toFixed(0)}% · {v.perdida_db} dB · {v.estado}
                            </span>
                        </div>
                    ))}
                </Desplegable>
            </Tarjeta>

            <Tarjeta titulo="Aspereza en medios-altos" icono="🔪"
                     tono={h.tiene_harshness ? 'aviso' : 'ok'}
                     chips={<Chip etiqueta="Frames ásperos" valor={`${h.pct_frames_harsh}%`}
                                  tono={h.tiene_harshness ? 'aviso' : 'ok'} />}>
                {h.tiene_harshness ? (
                    <p className="text-gray-300 text-sm">
                        Zona: <span className="text-white">{h.zona_problema}</span> · pico en {h.peak_freq_hz} Hz · carácter {h.caracter}
                    </p>
                ) : (
                    <p className="text-gray-400 text-sm">Sin picos molestos en la zona de 2 a 6 kHz.</p>
                )}
            </Tarjeta>
        </div>
    );
}

function TabMaster({ r }) {
    const lo = r.datos_audio.loudness || {};
    const tonoPicos = lo.severidad_picos === 'atencion' ? 'aviso' : 'ok';
    const tonoRec = lo.severidad_recorte === 'atencion' ? 'alerta' : 'ok';
    const tp = lo.true_peak_dbtp;
    return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <Tarjeta titulo="Loudness" icono="📈"
                     chips={<><Chip etiqueta="LUFS" valor={lo.lufs_integrado} />
                              <Chip etiqueta="Rango" valor={`${lo.rango_loudness} LU`} /></>}>
                <BarraRango valor={lo.lufs_integrado} min={-24} max={-4}
                            objetivoMin={-9} objetivoMax={-7} unidad="" />
                <p className="text-gray-400 text-xs mt-3">{lo.referencia_genero}</p>
                <Desplegable etiqueta="Qué hacer con esto">
                    <p>{lo.referencia}</p>
                    <p>{lo.consejo_master}</p>
                </Desplegable>
            </Tarjeta>

            <Tarjeta titulo="Picos" icono="⛰️" tono={tonoPicos}
                     chips={<><Chip etiqueta="True peak" valor={`${tp?.toFixed(1)} dBTP`} tono={tonoPicos} />
                              <Chip etiqueta="Sample peak" valor={`${lo.sample_peak_dbfs?.toFixed(1)} dBFS`} /></>}>
                {/* La escala llega a +6 porque un máster recortado se va a +4
                    o +5 con facilidad, y con el tope en +3 la marca se quedaba
                    pegada al borde sin poder leerse. */}
                {(() => {
                    const MIN = -3, MAX = 6;
                    const p = v => Math.max(0, Math.min(100, ((v - MIN) / (MAX - MIN)) * 100));
                    return (
                        <>
                            <div className="relative h-6 barra-fondo mb-1">
                                <div className="absolute top-0 bottom-0 bg-[#25F464]/15"
                                     style={{ left: 0, width: `${p(-1)}%` }} />
                                <div className="absolute top-0 bottom-0 bg-yellow-400/10"
                                     style={{ left: `${p(-1)}%`, width: `${p(0.3) - p(-1)}%` }} />
                                <div className="absolute top-0 bottom-0 bg-red-400/10"
                                     style={{ left: `${p(0.3)}%`, right: 0 }} />
                                <div className="absolute top-0 bottom-0 w-[3px] rounded"
                                     style={{ left: `calc(${p(tp)}% - 1.5px)`,
                                              background: tonoPicos === 'ok' ? '#25F464' : '#facc15' }} />
                            </div>
                            <div className="flex justify-between text-[10px] text-gray-600 mb-3">
                                <span>{MIN} dBTP</span>
                                <span className="text-gray-400">-1 recomendado · 0 el techo</span>
                                <span>+{MAX}</span>
                            </div>
                        </>
                    );
                })()}
                <p className="text-white text-sm font-medium mb-1">{lo.titulo_picos}</p>
                <Desplegable avance={lo.aviso_picos?.split('. ').slice(0, 1).join('. ') + '.'}>
                    <p>{lo.aviso_picos}</p>
                    {lo.nota_lossy_picos && <p className="text-gray-500">{lo.nota_lossy_picos}</p>}
                </Desplegable>
            </Tarjeta>

            <Tarjeta titulo="Recorte de muestras" icono="✂️" tono={tonoRec}
                     chips={lo.recorte_medible
                         ? <><Chip etiqueta="En el techo" valor={num(lo.muestras_en_techo_total)} tono={tonoRec} />
                             <Chip etiqueta="Meseta máx" valor={`${(lo.racha_maxima_ms || 0).toFixed(2)} ms`} tono={tonoRec} /></>
                         : <Chip etiqueta="Medible" valor="no aplica" />}>
                <p className="text-white text-sm font-medium mb-1">{lo.titulo_recorte}</p>
                <Desplegable avance={lo.aviso_recorte?.split('. ').slice(0, 1).join('. ') + '.'}>
                    <p>{lo.aviso_recorte}</p>
                </Desplegable>
            </Tarjeta>

            <Tarjeta titulo="Saturación dinámica" icono="🧱"
                     tono={lo.saturacion_dinamica === 'ok' ? 'ok' : 'aviso'}
                     chips={<Chip etiqueta="Estado" valor={lo.saturacion_dinamica}
                                  tono={lo.saturacion_dinamica === 'ok' ? 'ok' : 'aviso'} />}>
                {lo.aviso_saturacion
                    ? <Desplegable avance={partirEnAvance(lo.aviso_saturacion, 90)[0]}>
                          <p>{partirEnAvance(lo.aviso_saturacion, 90)[1]}</p>
                      </Desplegable>
                    : lo.saturacion_dinamica === 'ok'
                    ? <p className="text-gray-400 text-sm">El limitador no ha aplastado la dinámica.</p>
                    /* Sin este caso, un estado 'moderada' sin texto asociado
                       enseñaba el chip en amarillo y debajo "no ha aplastado
                       la dinámica": la tarjeta se contradecía a sí misma. */
                    : <p className="text-gray-400 text-sm">
                          La compresión del máster está en <span className="text-white">{lo.saturacion_dinamica}</span>.
                          No llega a nivel de aviso, pero es la zona en la que conviene
                          comparar con una referencia del género antes de apretar más.
                      </p>}
            </Tarjeta>
        </div>
    );
}

function TabDetalle({ r }) {
    const d = r.datos_audio, a = d.armonia || {}, f = d.formato || {}, lo = d.loudness || {};
    const fila = (k, v) => (
        <div key={k} className="flex justify-between py-1.5 border-b border-[#2e2e2e] last:border-0">
            <span className="text-gray-500 text-xs">{k}</span>
            <span className="text-gray-300 text-xs text-right">{String(v)}</span>
        </div>
    );
    return (
        <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
            <Tarjeta titulo="Estructura" icono="🧩">
                {fila('Duración', d.duracion)}
                {fila('BPM', d.bpm ?? 'no detectado')}
                {fila('Bloques', d.n_bloques)}
                {fila('Contraste', d.contraste)}
                {fila('Desarrollo', d.desarrollo_temporal ? 'sí' : 'no')}
            </Tarjeta>
            <Tarjeta titulo="Armonía" icono="🎹">
                {fila('Tonalidad', `${a.key} ${a.modo}`)}
                {fila('Confianza', a.key_confidence)}
                {fila('Complejidad', a.complejidad_armonica)}
                {fila('Tonal vs percusivo', a.ratio_tonal_percusivo)}
                <p className="text-gray-600 text-[11px] mt-3 leading-relaxed">
                    El motor no juzga si las notas o los acordes son acertados. Esto es
                    descripción, no criterio.
                </p>
            </Tarjeta>
            <Tarjeta titulo="El archivo que subiste" icono="📁">
                {fila('Formato', `${f.archivo_container} · ${f.archivo_codec}`)}
                {fila('Sample rate', `${f.archivo_sample_rate} Hz`)}
                {fila('Canales', f.archivo_canales)}
                {fila('Con pérdida', f.archivo_lossy ? 'sí' : 'no')}
            </Tarjeta>
            <Tarjeta titulo="Cómo se ha medido" icono="🔬" ancho="lg:col-span-2">
                {fila('Método de picos', `${lo.true_peak_method} (${lo.true_peak_oversampling}×)`)}
                {fila('Medidor certificado', lo.true_peak_validated ? 'sí' : 'no')}
                {fila('Motor', r.versiones?.analysis_engine_version)}
                {fila('Taxonomía de picos', `v${lo.peak_taxonomy_version}`)}
            </Tarjeta>
            <Tarjeta titulo="Alcance del análisis" icono="ℹ️">
                <p className="text-gray-400 text-xs leading-relaxed">{r.alcance_analisis}</p>
            </Tarjeta>
        </div>
    );
}

// ===========================================================================
// Cabecera y armazón
// ===========================================================================

function Cabecera({ r }) {
    const d = r.datos_audio, lo = d.loudness || {};
    const cfg = r.estado_track === 'verde'
        ? { color: '#f87171', label: 'Fase temprana', icon: '🔴' }
        : r.estado_track === 'avanzado'
        ? { color: '#60a5fa', label: 'Listo para pulir', icon: '🔵' }
        : { color: '#facc15', label: 'En desarrollo', icon: '🟡' };
    const tonoPicos = lo.severidad_picos === 'atencion' ? 'aviso' : 'ok';
    return (
        <div className="card p-5 mb-5" style={{ borderTop: `3px solid ${cfg.color}` }}>
            <div className="flex flex-col xl:flex-row xl:items-center gap-5 justify-between">
                <div className="min-w-0">
                    <div className="flex items-center gap-2 mb-1.5">
                        <span>{cfg.icon}</span>
                        <span className="text-xs font-medium uppercase tracking-wider" style={{ color: cfg.color }}>
                            {cfg.label}
                        </span>
                        <span className="text-gray-600 text-xs">· {r.estado_texto}</span>
                    </div>
                    <h1 className="text-white text-lg xl:text-xl font-bold leading-snug break-words">
                        {r.diagnostico_principal.titulo}
                    </h1>
                </div>
                <div className="flex gap-2 flex-wrap xl:justify-end xl:flex-shrink-0 min-w-0">
                    <Chip etiqueta="Duración" valor={d.duracion} />
                    <Chip etiqueta="BPM" valor={d.bpm ?? '—'} />
                    <Chip etiqueta="LUFS" valor={lo.lufs_integrado} />
                    <Chip etiqueta="True peak" valor={`${lo.true_peak_dbtp?.toFixed(1)}`} tono={tonoPicos} />
                    <Chip etiqueta="Mono" valor={d.mono_compat?.nivel_compatibilidad || '—'} />
                </div>
            </div>
        </div>
    );
}

const TABS = [
    { id: 'resumen', label: 'Resumen', icono: '🎯' },
    { id: 'plan', label: 'Plan de acción', icono: '📋' },
    { id: 'mezcla', label: 'Mezcla', icono: '🎛️' },
    { id: 'master', label: 'Máster', icono: '📈' },
    { id: 'detalle', label: 'Detalle', icono: '🔬' },
];

/** Lee ?tab= y ?caso= de la URL. Sirve para enlazar una pestaña concreta. */
function deLaUrl(clave, porDefecto) {
    try {
        const v = new URLSearchParams(location.search).get(clave);
        return v || porDefecto;
    } catch (e) { return porDefecto; }
}

function Diagnostico({ r }) {
    const [tab, setTab] = useState(() => deLaUrl('tab', 'resumen'));
    const avisos = useMemo(() => {
        const lo = r.datos_audio.loudness || {};
        return {
            master: (lo.severidad_picos === 'atencion' || lo.severidad_recorte === 'atencion'
                     || lo.saturacion_dinamica !== 'ok'),
            mezcla: (r.datos_audio.harshness?.tiene_harshness
                     || r.datos_audio.mono_compat?.nivel_compatibilidad === 'problematica'),
        };
    }, [r]);

    return (
        <div className="max-w-7xl mx-auto px-5 py-6">
            <Cabecera r={r} />

            <div className="flex gap-1 mb-5 border-b border-[#2e2e2e] overflow-x-auto">
                {TABS.map(t => (
                    <button key={t.id} onClick={() => setTab(t.id)}
                            className={`tab px-4 py-2.5 text-sm text-gray-400 flex items-center gap-2 ${tab === t.id ? 'on' : ''}`}>
                        <span>{t.icono}</span>{t.label}
                        {((t.id === 'master' && avisos.master) || (t.id === 'mezcla' && avisos.mezcla)) && (
                            <span className="w-1.5 h-1.5 rounded-full bg-yellow-400" title="Hay algo que mirar aquí" />
                        )}
                    </button>
                ))}
            </div>

            <div className="fade-in" key={tab}>
                {tab === 'resumen' && <TabResumen r={r} />}
                {tab === 'plan' && <TabPlan r={r} />}
                {tab === 'mezcla' && <TabMezcla r={r} />}
                {tab === 'master' && <TabMaster r={r} />}
                {tab === 'detalle' && <TabDetalle r={r} />}
            </div>

            <div className="mt-8 flex flex-wrap gap-3 items-center justify-between border-t border-[#2e2e2e] pt-5">
                <p className="text-gray-600 text-xs max-w-xl">{r.nota_motivacional}</p>
                <div className="flex gap-3">
                    <button className="btn-secondary px-4 py-2 rounded-lg text-sm">Descargar informe</button>
                    <button className="btn-primary px-4 py-2 rounded-lg text-sm font-medium">Analizar otra versión</button>
                </div>
            </div>
        </div>
    );
}

// ===========================================================================
// Envoltorio de la prueba (esta barra NO forma parte del diseño)
// ===========================================================================

function App() {
    const claves = Object.keys(CASOS);
    const [caso, setCaso] = useState(() => {
        const c = deLaUrl('caso', '');
        return claves.includes(c) ? c : (claves[1] || claves[0]);
    });

    // Aquí había unos botones de "ancho" (completo / portátil / tablet /
    // móvil) y se han quitado a propósito: solo estrechaban el contenedor,
    // pero los puntos de ruptura de CSS dependen de la VENTANA, no del
    // contenedor. El resultado era una rejilla de tres columnas metida en 420
    // píxeles, que no se parece a lo que ve un móvil de verdad. Para probar
    // el móvil hay que estrechar la ventana del navegador.
    return (
        <div>
            <div className="demo-bar px-4 py-2.5 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm sticky top-0 z-50">
                <span className="text-white font-semibold">Prueba de rediseño</span>
                <div className="flex gap-2 items-center flex-wrap">
                    <span className="text-gray-500 text-xs">Análisis:</span>
                    {claves.map(k => (
                        <button key={k} onClick={() => setCaso(k)}
                                className={`px-2.5 py-1 rounded text-xs ${caso === k ? 'btn-primary' : 'btn-secondary'}`}>
                            {CASOS[k].etiqueta}
                        </button>
                    ))}
                </div>
                <span className="text-gray-600 text-xs sm:ml-auto">
                    Datos reales del motor · para ver el móvil, estrecha la ventana
                </span>
            </div>
            <Diagnostico key={caso} r={CASOS[caso].resultado} />
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
