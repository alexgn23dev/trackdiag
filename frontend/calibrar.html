<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentotrack — Calibración</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #09090b; color: #e5e5e5; margin: 0; }
        .card { background: #141414; border: 1px solid #222; border-radius: 12px; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .pill-verde { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
        .pill-amarillo { background: rgba(250, 204, 21, 0.15); color: #facc15; border: 1px solid rgba(250,204,21,0.3); }
        .pill-rojo { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
        .pill-gris { background: rgba(75,85,99,0.2); color: #9ca3af; border: 1px solid #333; }
        .pill-descartado { background: rgba(75,85,99,0.15); color: #6b7280; border: 1px dashed #4b5563; text-decoration: line-through; }
        .card-descartado { opacity: 0.55; }
        .vbtn { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #333; background: transparent; color: #9ca3af; transition: all 0.15s; }
        .vbtn:hover { border-color: #555; color: #e5e5e5; }
        .vbtn.active-verde { background: rgba(74,222,128,0.2); border-color: #4ade80; color: #4ade80; }
        .vbtn.active-amarillo { background: rgba(250,204,21,0.2); border-color: #facc15; color: #facc15; }
        .vbtn.active-rojo { background: rgba(248,113,113,0.2); border-color: #f87171; color: #f87171; }
        textarea, input { background: #0a0a0a; border: 1px solid #333; color: #e5e5e5; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; width: 100%; box-sizing: border-box; }
        textarea:focus, input:focus { outline: none; border-color: #8b5cf6; }
        .save-btn { background: #8b5cf6; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .save-btn:hover:not(:disabled) { background: #7c3aed; }
        .diag-block { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.6; color: #d4d4d8; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        .diag-block.expanded { max-height: none; }
        .spinner { border: 3px solid #222; border-top: 3px solid #8b5cf6; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .filter-btn { padding: 4px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #333; background: transparent; color: #9ca3af; cursor: pointer; }
        .filter-btn.active { background: #8b5cf6; border-color: #8b5cf6; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:8000' : '';

    function detectarPlataforma(url) {
        if (!url) return null;
        const u = url.toLowerCase();
        if (u.includes('soundcloud.com')) return 'soundcloud';
        if (u.includes('dropbox.com')) return 'dropbox';
        if (u.includes('drive.google.com')) return 'drive';
        if (u.includes('wetransfer.com')) return 'wetransfer';
        if (u.includes('spotify.com')) return 'spotify';
        if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
        if (u.includes('music.apple.com')) return 'apple';
        return 'otro';
    }

    function SoundCloudEmbed({ url }) {
        const src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%238b5cf6&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false`;
        return (
            <iframe
                src={src}
                width="100%"
                height="166"
                frameBorder="0"
                scrolling="no"
                style={{ borderRadius: 8, background: '#0a0a0a' }}
                title="SoundCloud player"
            />
        );
    }

    function PlayerExterno({ url }) {
        const plataforma = detectarPlataforma(url);
        const etiquetaPlataforma = {
            soundcloud: 'SoundCloud',
            dropbox: 'Dropbox',
            drive: 'Google Drive',
            wetransfer: 'WeTransfer',
            spotify: 'Spotify',
            youtube: 'YouTube',
            apple: 'Apple Music',
            otro: 'externo',
        }[plataforma] || 'externo';
        return (
            <a
                href={url}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-2 text-sm text-purple-400 hover:text-purple-300 underline"
                title={url}
            >
                ▶ Enlace externo a la canción
                <span className="text-xs text-gray-500">({etiquetaPlataforma})</span>
            </a>
        );
    }

    function formatearFecha(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('es-ES', {
            year: 'numeric', month: 'short', day: '2-digit',
            hour: '2-digit', minute: '2-digit',
        });
    }

    function parseDiagnostico(diag) {
        const out = {
            estado: '', diagPrincipal: '', explicacion: '', prioridades: [],
            notaContextual: '', motivacion: '', tipObjetivo: '',
            siguienteSesion: '', referenciaTemporal: '',
            balanceGrave: '', densidad: '', loudness: '', monoCompat: '', harshness: '',
            bpm: '', duracion: '', lufs: '', noTocar: [], diagSecundario: '',
        };
        if (!diag) return out;
        const line = (label) => {
            const re = new RegExp('^' + label + ':\\s*(.+)$', 'im');
            const m = diag.match(re);
            return m ? m[1].trim() : '';
        };
        out.estado = line('ESTADO');
        const dpRaw = line('DIAGN[ÓO]STICO PRINCIPAL');
        out.diagPrincipal = dpRaw.replace(/\s*\([^)]*\)\s*$/, '');
        out.diagSecundario = line('DIAGN[ÓO]STICO SECUNDARIO').replace(/\s*\([^)]*\)\s*$/, '');
        out.explicacion = line('Explicación');
        const prioRaw = line('PRIORIDADES');
        out.prioridades = prioRaw
            ? prioRaw.split(' | ').map(p => p.replace(/^\d+\.\s*/, '').trim()).filter(Boolean)
            : [];
        const noTocarRaw = line('NO TOCAR AÚN');
        out.noTocar = noTocarRaw
            ? noTocarRaw.split(' | ').map(s => s.trim()).filter(Boolean)
            : [];
        out.notaContextual = line('NOTA CONTEXTUAL');
        out.motivacion = line('MOTIVACIÓN');
        out.tipObjetivo = line('TIP OBJETIVO');
        out.siguienteSesion = line('SIGUIENTE SESIÓN');
        out.referenciaTemporal = line('REFERENCIA TEMPORAL');
        out.balanceGrave = line('Balance grave');
        out.densidad = line('Densidad');
        out.loudness = line('Loudness');
        out.monoCompat = line('Mono compat');
        out.harshness = line('Harshness');
        const bpmMatch = diag.match(/BPM:\s*(\d+)/);
        out.bpm = bpmMatch ? bpmMatch[1] : '';
        const durMatch = diag.match(/Duración:\s*(.+)/);
        out.duracion = durMatch ? durMatch[1].trim().split(/\s*\|\s*|\n/)[0] : '';
        const lufsMatch = diag.match(/([-\d.]+)\s*LUFS/);
        out.lufs = lufsMatch ? lufsMatch[1] : '';
        return out;
    }

    function estadoVisual(estadoTexto) {
        const e = (estadoTexto || '').toLowerCase();
        if (e.includes('construc') || e.includes('temprana') || e.includes('iteraci') || e.includes('prematura') || e.includes('buena base')) {
            return { color: '#f87171', bg: 'rgba(248,113,113,0.08)', border: 'rgba(248,113,113,0.25)', dot: '#f87171' };
        }
        if (e.includes('lista') && !e.includes('casi')) {
            return { color: '#4ade80', bg: 'rgba(74,222,128,0.08)', border: 'rgba(74,222,128,0.25)', dot: '#4ade80' };
        }
        return { color: '#facc15', bg: 'rgba(250,204,21,0.08)', border: 'rgba(250,204,21,0.25)', dot: '#facc15' };
    }

    function metricColor(val, good, warn) {
        const v = (val || '').toLowerCase();
        if (good.some(g => v.includes(g))) return '#4ade80';
        if (warn.some(w => v.includes(w))) return '#facc15';
        return '#f87171';
    }

    function DiagnosticoVisual({ diagnostico }) {
        const p = parseDiagnostico(diagnostico);
        const sem = estadoVisual(p.estado);
        const tieneMetricas = p.bpm || p.duracion || p.balanceGrave || p.densidad || p.loudness || p.monoCompat || p.harshness;
        return (
            <div className="space-y-2.5">
                {p.estado && (
                    <div className="rounded-lg px-3 py-2"
                         style={{ background: sem.bg, border: `1px solid ${sem.border}` }}>
                        <span className="inline-block rounded-full mr-2" style={{ width: 8, height: 8, background: sem.dot, verticalAlign: 'middle' }} />
                        <span className="text-sm" style={{ color: sem.color }}>{p.estado}</span>
                    </div>
                )}

                {p.diagPrincipal && (
                    <div className="rounded-lg p-3" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.18)' }}>
                        <div className="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-1">Diagnóstico principal</div>
                        <div className="text-sm font-medium" style={{ color: '#fb923c' }}>{p.diagPrincipal}</div>
                        {p.explicacion && <div className="text-xs text-gray-300 mt-1.5 leading-relaxed">{p.explicacion}</div>}
                        {p.diagSecundario && (
                            <div className="text-xs text-gray-400 mt-2">
                                <span className="text-gray-500">Secundario:</span> {p.diagSecundario}
                            </div>
                        )}
                    </div>
                )}

                {(p.motivacion || p.notaContextual || p.referenciaTemporal) && (
                    <div className="rounded-lg p-3" style={{ background: 'rgba(139,92,246,0.06)', borderLeft: '3px solid #8b5cf6' }}>
                        {p.motivacion && <div className="text-sm font-medium mb-1.5" style={{ color: '#c4b5fd' }}>{p.motivacion}</div>}
                        {p.notaContextual && <div className="text-xs text-gray-300 leading-relaxed">{p.notaContextual}</div>}
                        {p.referenciaTemporal && <div className="text-[11px] text-gray-500 mt-1.5">{p.referenciaTemporal}</div>}
                    </div>
                )}

                {p.prioridades.length > 0 && (
                    <div className="rounded-lg p-3" style={{ background: 'rgba(74,222,128,0.05)', border: '1px solid rgba(74,222,128,0.15)' }}>
                        <div className="text-[10px] font-semibold uppercase tracking-wider mb-2" style={{ color: '#4ade80' }}>Prioridades sugeridas</div>
                        <ol className="space-y-1.5">
                            {p.prioridades.map((pr, i) => (
                                <li key={i} className="flex gap-2 items-start text-xs text-gray-200 leading-relaxed">
                                    <span className="flex-shrink-0 w-4 h-4 rounded-full flex items-center justify-center font-bold mt-0.5"
                                          style={{ background: 'rgba(74,222,128,0.2)', color: '#4ade80', fontSize: 10 }}>{i+1}</span>
                                    <span>{pr}</span>
                                </li>
                            ))}
                        </ol>
                    </div>
                )}

                {p.noTocar.length > 0 && (
                    <div className="rounded-lg p-3" style={{ background: 'rgba(75,85,99,0.15)', border: '1px solid rgba(75,85,99,0.3)' }}>
                        <div className="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2">No tocar aún</div>
                        <ul className="space-y-1">
                            {p.noTocar.map((n, i) => (
                                <li key={i} className="text-xs text-gray-400 leading-relaxed">— {n}</li>
                            ))}
                        </ul>
                    </div>
                )}

                {p.tipObjetivo && (
                    <div className="rounded-lg p-3" style={{ background: 'rgba(245,158,11,0.06)', borderLeft: '3px solid #f59e0b' }}>
                        <div className="text-[10px] font-semibold uppercase tracking-wider mb-1.5" style={{ color: '#facc15' }}>Según tu objetivo</div>
                        <div className="text-xs text-gray-300 leading-relaxed">{p.tipObjetivo}</div>
                    </div>
                )}

                {p.siguienteSesion && (
                    <div className="rounded-lg p-3" style={{ background: 'rgba(139,92,246,0.06)', border: '1px solid rgba(139,92,246,0.2)' }}>
                        <div className="text-[10px] font-semibold uppercase tracking-wider mb-1.5" style={{ color: '#c4b5fd' }}>Próxima sesión sugerida</div>
                        <div className="text-xs text-white leading-relaxed">{p.siguienteSesion}</div>
                    </div>
                )}

                {tieneMetricas && (
                    <div className="rounded-lg p-3" style={{ background: '#0a0a0a', border: '1px solid #222' }}>
                        <div className="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Métricas de mezcla</div>
                        {(p.bpm || p.duracion) && (
                            <div className="flex flex-wrap gap-1.5 mb-2">
                                {p.bpm && <span className="px-2 py-0.5 rounded text-[11px]" style={{ background: '#1f2937', color: '#d4d4d8' }}>{p.bpm} BPM</span>}
                                {p.duracion && <span className="px-2 py-0.5 rounded text-[11px]" style={{ background: '#1f2937', color: '#d4d4d8' }}>{p.duracion}</span>}
                                {p.lufs && <span className="px-2 py-0.5 rounded text-[11px]" style={{ background: '#1f2937', color: '#d4d4d8' }}>{p.lufs} LUFS</span>}
                            </div>
                        )}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-[11px]">
                            {p.balanceGrave && (
                                <div className="flex justify-between"><span className="text-gray-500">Balance grave</span>
                                    <span style={{ color: metricColor(p.balanceGrave, ['normal'], ['elevado']) }}>{p.balanceGrave}</span></div>
                            )}
                            {p.densidad && (
                                <div className="flex justify-between"><span className="text-gray-500">Densidad</span>
                                    <span style={{ color: metricColor(p.densidad, ['baja','media'], ['alta']) }}>{p.densidad}</span></div>
                            )}
                            {p.loudness && (
                                <div className="flex justify-between"><span className="text-gray-500">Loudness</span>
                                    <span className="text-gray-300">{p.loudness}</span></div>
                            )}
                            {p.monoCompat && (
                                <div className="flex justify-between"><span className="text-gray-500">Mono compat</span>
                                    <span className="text-gray-300">{p.monoCompat}</span></div>
                            )}
                            {p.harshness && (
                                <div className="flex justify-between"><span className="text-gray-500">Harshness</span>
                                    <span className="text-gray-300">{p.harshness}</span></div>
                            )}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    function parseFormulario(formularioObj) {
        if (!formularioObj || typeof formularioObj !== 'object') return [];
        const out = [];
        const orden = ['genero', 'fase', 'objetivo', 'experiencia', 'dificultad', 'bloqueo'];
        const labels = {
            genero: 'Género',
            fase: 'Fase',
            objetivo: 'Objetivo',
            experiencia: 'Experiencia',
            dificultad: 'Qué te cuesta',
            bloqueo: 'Bloqueo',
        };
        for (const k of orden) {
            if (formularioObj[k]) out.push([labels[k] || k, formularioObj[k]]);
        }
        return out;
    }

    function TrackCard({ track, index, onSave }) {
        const inicial = track.etiqueta || {};
        const [comentario, setComentario] = useState(inicial.comentario || '');
        const [guardando, setGuardando] = useState(false);
        const [mensaje, setMensaje] = useState('');
        const [diagRawOpen, setDiagRawOpen] = useState(false);
        // El diagnóstico se pliega para que la lista sea escaneable de un vistazo.
        // El enlace a la canción es siempre visible (link externo, sin embed).
        const [diagOpen, setDiagOpen] = useState(false);
        // Descartado vive en el server; espejo local para feedback inmediato.
        const descartado = !!inicial.descartado;
        // Veredicto legacy: preservado en DB si existía, pero ya no se edita.
        const veredictoLegacy = inicial.veredicto || '';

        const dirty = comentario !== (inicial.comentario || '');
        const yaEtiquetado = !!inicial.comentario;

        async function enviarEtiqueta(payload, mensajeExito) {
            setGuardando(true);
            setMensaje('');
            try {
                const r = await fetch(`${API_URL}/api/calibrar/etiqueta`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ analisis_id: track.id, ...payload }),
                });
                const data = await r.json();
                if (!r.ok || !data.ok) {
                    setMensaje(data.error || 'Error guardando');
                } else {
                    setMensaje(mensajeExito);
                    onSave(track.id, data.etiqueta || null, data.deleted);
                    setTimeout(() => setMensaje(''), 2000);
                }
            } catch (e) {
                setMensaje('Error de red');
            } finally {
                setGuardando(false);
            }
        }

        async function guardar() {
            await enviarEtiqueta({
                veredicto: veredictoLegacy || null,
                comentario: comentario || null,
                descartado: descartado,
            }, 'Guardado ✓');
        }

        async function toggleDescartado() {
            // Si pasamos a descartado, mantenemos comentario actual (preservar
            // trabajo). Al restaurar, también — y el backend borrará la fila
            // si todo queda vacío.
            await enviarEtiqueta({
                veredicto: veredictoLegacy || null,
                comentario: comentario || null,
                descartado: !descartado,
            }, descartado ? 'Restaurado ✓' : 'Descartado ✓');
        }

        const formularioEntries = parseFormulario(track.formulario);
        const urlEmbed = track.feedback_real_resuelto || track.feedback_real || '';

        return (
            <div className={`card p-5 ${descartado ? 'card-descartado' : ''}`}>
                <div className="flex items-start justify-between mb-3 gap-3 flex-wrap">
                    <div className="flex items-baseline gap-3 flex-wrap">
                        <span className="text-xs text-gray-500 font-mono">#{index + 1}</span>
                        <span className="text-sm font-semibold text-white">{track.email || 'anónimo'}</span>
                        <span className="text-xs text-gray-500">{formatearFecha(track.timestamp)}</span>
                        {track.nombre_proyecto_legacy && (
                            <span className="text-xs text-gray-400 italic">"{track.nombre_proyecto_legacy}"</span>
                        )}
                    </div>
                    <div>
                        {descartado ? (
                            <span className="pill pill-descartado">descartado · no electrónica</span>
                        ) : yaEtiquetado ? (
                            <span className="pill pill-verde">comentado</span>
                        ) : (
                            <span className="pill pill-gris">pendiente</span>
                        )}
                    </div>
                </div>

                {formularioEntries.length > 0 && (
                    <div className="text-xs text-gray-400 mb-3 leading-relaxed">
                        {formularioEntries.map(([k, v], i) => (
                            <span key={i}>
                                <span className="text-gray-500">{k}:</span> <span className="text-gray-300">{v}</span>
                                {i < formularioEntries.length - 1 && <span className="text-gray-600"> · </span>}
                            </span>
                        ))}
                    </div>
                )}

                <div className="mb-3">
                    {urlEmbed ? (
                        <PlayerExterno url={urlEmbed} />
                    ) : (
                        <span className="text-xs text-gray-500">Sin enlace de audio</span>
                    )}
                </div>

                <div className="mb-4">
                    <button
                        onClick={() => setDiagOpen(o => !o)}
                        className="w-full flex items-center justify-between text-left text-xs font-semibold text-gray-400 uppercase tracking-wide py-1 hover:text-gray-200"
                    >
                        <span>
                            <span className="mr-2 text-gray-500">{diagOpen ? '▾' : '▸'}</span>
                            Diagnóstico del motor
                        </span>
                    </button>
                    {diagOpen && (
                        <div className="mt-2">
                            <div className="flex items-center justify-end mb-2">
                                <button
                                    onClick={() => setDiagRawOpen(d => !d)}
                                    className="text-xs text-purple-400 hover:text-purple-300"
                                >
                                    {diagRawOpen ? 'Ocultar texto crudo ▴' : 'Ver texto crudo ▾'}
                                </button>
                            </div>
                            {track.diagnostico
                                ? <DiagnosticoVisual diagnostico={track.diagnostico} />
                                : <div className="text-xs text-gray-500">(sin diagnóstico guardado)</div>
                            }
                            {diagRawOpen && (
                                <div className="diag-block expanded mt-3">
                                    {track.diagnostico || '(sin diagnóstico guardado)'}
                                </div>
                            )}
                        </div>
                    )}
                </div>

                <div className="mb-3">
                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Tu feedback</div>
                    <textarea
                        value={comentario}
                        onChange={e => setComentario(e.target.value)}
                        placeholder="Qué oyes tú: qué arreglarías y en qué orden, dónde el motor acierta, exagera o se queda corto, problemas que no captó, lenguaje del consejo que no encaja, observaciones de producción/arreglo/estructura/dirección… Escribe libre."
                        rows={6}
                    />
                </div>

                <div className="flex items-center justify-between gap-3 flex-wrap">
                    <div className="flex items-center gap-3 flex-wrap">
                        <button
                            onClick={toggleDescartado}
                            disabled={guardando}
                            className="text-xs text-gray-500 hover:text-gray-200 underline-offset-2 hover:underline"
                            title={descartado ? 'Volver a incluir este track en la calibración' : 'Excluir este track (p. ej. no es electrónica)'}
                        >
                            {descartado ? '↩ Restaurar' : '✕ Descartar (no es electrónica)'}
                        </button>
                        {yaEtiquetado && !descartado && (
                            <span className="text-xs text-gray-500">Guardado el {formatearFecha(inicial.fecha)}</span>
                        )}
                    </div>
                    <div className="flex items-center gap-3">
                        {mensaje && (
                            <span className={`text-xs ${mensaje.includes('Error') ? 'text-red-400' : 'text-green-400'}`}>
                                {mensaje}
                            </span>
                        )}
                        <button
                            onClick={guardar}
                            disabled={guardando || !dirty}
                            className="save-btn"
                        >
                            {guardando ? 'Guardando…' : (yaEtiquetado && !comentario ? 'Borrar' : 'Guardar')}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    function StatsSection({ refreshKey }) {
        const [open, setOpen] = useState(false);
        const [stats, setStats] = useState(null);
        const [loading, setLoading] = useState(false);
        const [err, setErr] = useState('');

        // Recarga al abrir o al cambiar refreshKey (cuando hay un nuevo guardado).
        useEffect(() => {
            if (!open) return;
            let cancelado = false;
            (async () => {
                setLoading(true);
                setErr('');
                try {
                    const r = await fetch(`${API_URL}/api/calibrar/stats`, { credentials: 'include' });
                    const data = await r.json();
                    if (!cancelado) {
                        if (!r.ok || !data.ok) setErr(data.error || 'Error');
                        else setStats(data);
                    }
                } catch (e) {
                    if (!cancelado) setErr('Error de red');
                } finally {
                    if (!cancelado) setLoading(false);
                }
            })();
            return () => { cancelado = true; };
        }, [open, refreshKey]);

        // Palabras frecuentes bucketeadas por color que sacó el MOTOR. Un
        // término que aparece mucho en comentarios sobre tracks que el motor
        // llamó "verde" sugiere algo que el motor está subestimando.
        const PalabrasPorMotor = ({ porMotor }) => {
            const buckets = [
                { key: 'verde', label: 'Motor lo llamó verde', color: '#4ade80' },
                { key: 'amarillo', label: 'Motor lo llamó amarillo', color: '#facc15' },
                { key: 'rojo', label: 'Motor lo llamó rojo', color: '#f87171' },
                { key: 'desconocido', label: 'Motor sin clasificar', color: '#9ca3af' },
            ];
            const algo = buckets.some(b => (porMotor?.[b.key] || []).length > 0);
            if (!algo) return <span className="text-xs text-gray-500">Aún sin comentarios para extraer patrones</span>;
            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {buckets.map(b => {
                        const items = porMotor?.[b.key] || [];
                        if (items.length === 0) return null;
                        return (
                            <div key={b.key} className="border border-gray-800 rounded-lg p-3">
                                <div className="text-xs font-semibold mb-2" style={{ color: b.color }}>
                                    <span>●</span> {b.label}
                                </div>
                                <div className="flex flex-wrap gap-1.5">
                                    {items.map((it, i) => (
                                        <span key={i} className="text-xs px-2 py-0.5 rounded" style={{ background: '#1f2937', color: '#d4d4d8' }}>
                                            {it.palabra} <span className="text-gray-500">×{it.n}</span>
                                        </span>
                                    ))}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        return (
            <div className="card p-4 mb-5">
                <div onClick={() => setOpen(o => !o)} className="flex items-baseline justify-between cursor-pointer select-none">
                    <h2 className="text-sm font-bold text-white">
                        Progreso y patrones léxicos
                        <span className="text-xs font-normal text-gray-500 ml-2">(click para desplegar)</span>
                    </h2>
                    <span className="text-xs text-gray-500">{open ? '▾' : '▸'}</span>
                </div>
                {open && (
                    <div className="mt-4 space-y-5">
                        {loading && <div className="text-xs text-gray-500">Calculando…</div>}
                        {err && <div className="text-xs text-red-400">{err}</div>}
                        {!loading && !err && stats && (
                            <>
                                <div className="flex gap-6 text-sm flex-wrap">
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wide">Comentados</div>
                                        <div className="text-xl font-bold text-white">{stats.total_etiquetados}<span className="text-gray-600 text-base">/{stats.total_disponibles}</span></div>
                                    </div>
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wide">Pendientes</div>
                                        <div className="text-xl font-bold text-white">{stats.pendientes}</div>
                                    </div>
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wide">Descartados</div>
                                        <div className="text-xl font-bold text-gray-400">{stats.descartados || 0}</div>
                                    </div>
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wide">Long. media</div>
                                        <div className="text-xl font-bold text-white">{stats.longitud_media_comentario || 0}<span className="text-gray-600 text-base"> chars</span></div>
                                    </div>
                                </div>

                                <div>
                                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Palabras frecuentes en tus comentarios, agrupadas por color del motor</div>
                                    <PalabrasPorMotor porMotor={stats.palabras_por_color_motor} />
                                    <div className="text-xs text-gray-500 mt-3 leading-relaxed">
                                        Cómo leer esto: si una palabra como "harshness" aparece muchas veces en tus comentarios sobre tracks que el motor clasificó <span style={{color:'#4ade80'}}>verde</span>, probablemente el motor está subestimando algo que tú oyes claramente. Es señal preliminar — el reporte real lo genero yo cuando me lo pidas en chat.
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                )}
            </div>
        );
    }

    function App() {
        const [tracks, setTracks] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState('');
        const [filtro, setFiltro] = useState('todos');
        const [statsRefresh, setStatsRefresh] = useState(0);

        useEffect(() => {
            (async () => {
                try {
                    const r = await fetch(`${API_URL}/api/calibrar/tracks`, { credentials: 'include' });
                    if (r.status === 403) {
                        window.location.href = '/dashboard';
                        return;
                    }
                    const data = await r.json();
                    if (!r.ok || !data.ok) {
                        setError(data.error || 'Error cargando tracks');
                    } else {
                        setTracks(data.tracks || []);
                    }
                } catch (e) {
                    setError('Error de red');
                } finally {
                    setLoading(false);
                }
            })();
        }, []);

        function handleSave(trackId, etiqueta, deleted) {
            setTracks(prev => prev.map(t => {
                if (t.id !== trackId) return t;
                return { ...t, etiqueta: deleted ? null : etiqueta };
            }));
            // Invalida las stats para que se recalculen la próxima vez que se abra el panel
            setStatsRefresh(n => n + 1);
        }

        const isDescartado = (t) => !!(t.etiqueta && t.etiqueta.descartado);
        const isEvaluado = (t) => !!(t.etiqueta && !t.etiqueta.descartado && t.etiqueta.comentario);
        const isPendiente = (t) => !isDescartado(t) && !isEvaluado(t);

        const filtrados = useMemo(() => {
            if (filtro === 'pendientes') return tracks.filter(isPendiente);
            if (filtro === 'etiquetados') return tracks.filter(isEvaluado);
            if (filtro === 'descartados') return tracks.filter(isDescartado);
            // 'todos' por defecto, pero esconde descartados para que no estorben.
            return tracks.filter(t => !isDescartado(t));
        }, [tracks, filtro]);

        const stats = useMemo(() => {
            const total = tracks.length;
            const etiquetados = tracks.filter(isEvaluado).length;
            const descartados = tracks.filter(isDescartado).length;
            const pendientes = total - etiquetados - descartados;
            return { total, etiquetados, descartados, pendientes };
        }, [tracks]);

        if (loading) {
            return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="spinner"></div>
                </div>
            );
        }

        return (
            <div className="min-h-screen p-6 max-w-4xl mx-auto">
                <header className="mb-6">
                    <div className="flex items-baseline justify-between flex-wrap gap-3 mb-2">
                        <h1 className="text-2xl font-bold text-white">Calibración del motor</h1>
                        <a href="/dashboard" className="text-xs text-gray-400 hover:text-white">← Dashboard</a>
                    </div>
                    <p className="text-sm text-gray-400">
                        Por cada track: escucha el enlace externo, lee lo que dijo el motor, y escribe libre tu
                        feedback cualitativo — qué oyes tú, dónde acierta, dónde exagera, qué no captó, lenguaje
                        que no encaja, observaciones de mezcla/producción/arreglo/dirección. Cuando hayas hecho
                        un lote me lo dices en chat y saco el reporte de divergencias.
                    </p>
                </header>

                {error && (
                    <div className="card p-4 mb-4 border-red-900 bg-red-950/30 text-sm text-red-300">
                        {error}
                    </div>
                )}

                <StatsSection refreshKey={statsRefresh} />

                <div className="card p-4 mb-5">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-baseline gap-2 text-sm">
                            <span className="text-2xl font-bold text-white">{stats.etiquetados}</span>
                            <span className="text-gray-500">/{stats.total - stats.descartados} activos</span>
                            {stats.descartados > 0 && (
                                <span className="text-xs text-gray-500 ml-3">+ {stats.descartados} descartados</span>
                            )}
                        </div>
                        <div className="flex gap-2 flex-wrap">
                            <button onClick={() => setFiltro('todos')} className={`filter-btn ${filtro === 'todos' ? 'active' : ''}`}>Activos ({stats.total - stats.descartados})</button>
                            <button onClick={() => setFiltro('pendientes')} className={`filter-btn ${filtro === 'pendientes' ? 'active' : ''}`}>Pendientes ({stats.pendientes})</button>
                            <button onClick={() => setFiltro('etiquetados')} className={`filter-btn ${filtro === 'etiquetados' ? 'active' : ''}`}>Comentados ({stats.etiquetados})</button>
                            <button onClick={() => setFiltro('descartados')} className={`filter-btn ${filtro === 'descartados' ? 'active' : ''}`}>Descartados ({stats.descartados})</button>
                        </div>
                    </div>
                </div>

                {filtrados.length === 0 ? (
                    <div className="card p-8 text-center text-gray-500 text-sm">
                        {tracks.length === 0
                            ? 'No hay tracks con feedback_real.'
                            : 'Sin tracks para este filtro.'}
                    </div>
                ) : (
                    <div className="space-y-4">
                        {filtrados.map((t, i) => (
                            <TrackCard
                                key={t.id}
                                track={t}
                                index={tracks.indexOf(t)}
                                onSave={handleSave}
                            />
                        ))}
                    </div>
                )}

                <footer className="mt-8 text-xs text-gray-600 text-center">
                    Mentotrack admin · página interna
                </footer>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
