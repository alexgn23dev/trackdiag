<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Mentotrack OG image 1200x630 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25F464"/>
      <stop offset="100%" stop-color="#6D10FF"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.25" cy="0.4" r="0.4">
      <stop offset="0%" stop-color="#25F464" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#25F464" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.85" cy="0.7" r="0.45">
      <stop offset="0%" stop-color="#6D10FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6D10FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowG)"/>
  <rect width="1200" height="630" fill="url(#glowP)"/>

  <!-- Grid sutil -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Marca de agua: forma de onda detrás -->
  <g opacity="0.08" stroke="#25F464" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 60 530 Q 120 460 180 530 T 300 530 T 420 530 T 540 530 T 660 530 T 780 530 T 900 530 T 1020 530 T 1140 530"/>
  </g>

  <!-- Logo "M" tipo Mentotrack -->
  <g transform="translate(80,110)">
    <!-- M geométrica -->
    <path d="M0 200V20h40l54 95 54-95h40v180h-40v-119L96 175h-20L20 81v119H0z" fill="#ffffff"/>
    <!-- Wave verde cruzando -->
    <path d="M-15 130 Q 5 105 25 130 T 65 130 T 105 130 T 145 130 T 185 130 T 200 132"
          stroke="#25F464" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="320" y="240" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700"
        fill="#ffffff" letter-spacing="-2">mentotrack</text>

  <!-- Claim principal -->
  <text x="80" y="380" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700"
        fill="#ffffff" letter-spacing="-1">Diagnóstico inteligente</text>
  <text x="80" y="450" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700"
        letter-spacing="-1">
    <tspan fill="#ffffff">para tus </tspan><tspan fill="#25F464">tracks</tspan>
  </text>

  <!-- Subclaim -->
  <text x="80" y="510" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400"
        fill="#BCBCBC">Sube tu bounce, recibe prioridades reales en segundos.</text>

  <!-- Pill inferior -->
  <g transform="translate(80,548)">
    <rect width="240" height="44" rx="22" fill="rgba(37,244,100,0.08)" stroke="#25F464" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5" fill="#25F464"/>
    <text x="38" y="29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600"
          fill="#25F464">www.mentotrack.com</text>
  </g>

  <!-- Banda lateral derecha: barras tipo espectro -->
  <g transform="translate(900,150)" opacity="0.85">
    <rect x="0"   y="170" width="14" height="60"  rx="3" fill="#6D10FF"/>
    <rect x="22"  y="120" width="14" height="160" rx="3" fill="#6D10FF" opacity="0.85"/>
    <rect x="44"  y="80"  width="14" height="240" rx="3" fill="#25F464"/>
    <rect x="66"  y="40"  width="14" height="320" rx="3" fill="#25F464" opacity="0.9"/>
    <rect x="88"  y="100" width="14" height="200" rx="3" fill="#6D10FF"/>
    <rect x="110" y="140" width="14" height="120" rx="3" fill="#6D10FF" opacity="0.7"/>
    <rect x="132" y="60"  width="14" height="280" rx="3" fill="#25F464" opacity="0.95"/>
    <rect x="154" y="110" width="14" height="180" rx="3" fill="#6D10FF" opacity="0.8"/>
    <rect x="176" y="150" width="14" height="100" rx="3" fill="#25F464" opacity="0.6"/>
    <rect x="198" y="90"  width="14" height="220" rx="3" fill="#6D10FF" opacity="0.85"/>
    <rect x="220" y="170" width="14" height="60"  rx="3" fill="#25F464" opacity="0.7"/>
  </g>

  <!-- Borde -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
</svg>
