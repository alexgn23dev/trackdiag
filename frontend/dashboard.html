<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentotrack — Dashboard Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- PWA -->
    <link rel="manifest" href="/manifest-admin.json">
    <link rel="apple-touch-icon" href="/pwa-admin-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MT Admin">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Dashboard interno: NO indexar -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #09090b; color: #e5e5e5; margin: 0; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: #141414; border: 1px solid #222; border-radius: 12px; }
        .stat-card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 20px; }
        .bar { transition: width 0.6s ease-out; border-radius: 4px; min-width: 2px; }
        .filter-btn { padding: 4px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #333; background: transparent; color: #9ca3af; cursor: pointer; transition: all 0.15s; }
        .filter-btn:hover { border-color: #555; color: #e5e5e5; }
        .filter-btn.active { background: #8b5cf6; border-color: #8b5cf6; color: white; }
        .table-row:hover { background: rgba(139, 92, 246, 0.05); }
        .spinner { border: 3px solid #222; border-top: 3px solid #8b5cf6; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Dashboard data is fetched via backend proxy (no direct Sheets access)
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:8000' : '';

    // =========================================================================
    // Utilidades
    // =========================================================================

    function parseRow(row) {
        const ts = row.timestamp || row.fecha || '';
        const date = ts ? new Date(ts) : null;

        // Parsear formulario — formato: "Tech House | Arreglo en progreso | Publicar... | 2 a 5 años | Mezcla..."
        // Los campos van en orden fijo: género, fase, objetivo, experiencia, dificultad, [bloqueo]
        // El género puede venir como "Otro: <texto libre>" cuando el usuario escribió uno custom.
        const formulario = row.formulario || '';
        const formData = {};
        let generoCustom = '';
        if (formulario) {
            const parts = formulario.split(' | ').map(p => p.trim());
            const fieldNames = ['Género', 'Fase', 'Objetivo', 'Experiencia', 'Dificultad habitual'];
            parts.forEach((val, idx) => {
                if (val.startsWith('Bloqueo: ')) {
                    formData['Bloqueo'] = val.replace('Bloqueo: ', '');
                } else if (idx < fieldNames.length) {
                    formData[fieldNames[idx]] = val;
                }
            });
            // Normalizar "Otro: texto" → género "Otros" + guardar el texto libre aparte
            const rawGenero = formData['Género'] || '';
            if (rawGenero.startsWith('Otro:')) {
                generoCustom = rawGenero.replace(/^Otro:\s*/, '').trim();
                formData['Género'] = 'Otros';
            } else if (rawGenero === 'Otro') {
                formData['Género'] = 'Otros';
            }
        }

        // Parsear diagnóstico para extraer datos clave
        const diag = row.diagnostico || '';
        let estadoTrack = 'desconocido';
        let diagPrincipal = '';
        let diagSecundario = '';
        let prioridades = [];

        const estadoMatch = diag.match(/ESTADO:\s*(.+)/i);
        if (estadoMatch) estadoTrack = estadoMatch[1].trim();

        const dpMatch = diag.match(/DIAGNÓSTICO PRINCIPAL:\s*(.+)/i);
        if (dpMatch) diagPrincipal = dpMatch[1].trim();

        const dsMatch = diag.match(/DIAGNÓSTICO SECUNDARIO:\s*(.+)/i);
        if (dsMatch) diagSecundario = dsMatch[1].trim();

        const prioMatch = diag.match(/PRIORIDADES:\s*(.+?)(?:\n[A-Z]|\n\n|$)/is);
        if (prioMatch) {
            prioridades = prioMatch[1].split(/\n/).map(l => l.replace(/^[\d\.\-\s]+/, '').trim()).filter(Boolean);
        }

        // Comparación con track de referencia (sección del informe desde v0.5.32)
        const refMatch = diag.match(/COMPARACIÓN CON REFERENCIA(?:\s*\(([^)]*)\))?:\s*([^\n]+)/);

        return {
            timestamp: ts,
            date,
            email: row.email || '',
            nombreProyecto: row.nombre_proyecto || '',
            formulario,
            formData,
            diagnostico: diag,
            usoReferencia: !!refMatch,
            referenciaFilename: refMatch ? (refMatch[1] || '').trim() : '',
            comparacionReferencia: refMatch ? (refMatch[2] || '').trim() : '',
            estadoTrack,
            diagPrincipal,
            diagSecundario,
            prioridades,
            fueUtil: row.fue_util || '',
            motorVersion: row.motor_version || '',
            comentario: row.comentario || '',
            enlaceFeedback: row.feedback_real || '',
            tutorialesSugeridos: row.tutoriales_sugeridos || '',
            tutorialClickado: row.tutorial_clickado || '',
            genero: formData['Género'] || '',
            generoCustom,
            experiencia: formData['Experiencia'] || '',
            fase: formData['Fase'] || '',
            objetivo: formData['Objetivo'] || '',
            dificultad: formData['Dificultad habitual'] || '',
            pais: (row.pais || '').toUpperCase(),
        };
    }

    function formatDate(d) {
        if (!d) return '—';
        return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function countBy(arr, key) {
        const counts = {};
        arr.forEach(item => {
            const val = item[key] || 'Sin dato';
            counts[val] = (counts[val] || 0) + 1;
        });
        return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    }

    // =========================================================================
    // Componentes
    // =========================================================================

    function StatCard({ label, value, sub, color = '#8b5cf6', icon }) {
        return (
            <div className="stat-card fade-in">
                <div className="flex items-center justify-between mb-2">
                    <span className="text-gray-500 text-xs uppercase tracking-wide">{label}</span>
                    {icon && <span className="text-lg">{icon}</span>}
                </div>
                <div className="text-2xl font-bold" style={{ color }}>{value}</div>
                {sub && <div className="text-gray-500 text-xs mt-1">{sub}</div>}
            </div>
        );
    }

    function BarChart({ data, color = '#8b5cf6', maxBars = 8 }) {
        const sliced = data.slice(0, maxBars);
        const max = Math.max(...sliced.map(d => d[1]), 1);
        return (
            <div className="space-y-2">
                {sliced.map(([label, count]) => (
                    <div key={label} className="flex items-center gap-3">
                        <div className="text-xs text-gray-400 w-32 truncate text-right" title={label}>{label}</div>
                        <div className="flex-1 h-5 bg-gray-800 rounded overflow-hidden">
                            <div className="bar h-full" style={{ width: `${(count / max) * 100}%`, background: color }}></div>
                        </div>
                        <div className="text-xs text-gray-300 w-8 text-right">{count}</div>
                    </div>
                ))}
            </div>
        );
    }

    function FilterBar({ label, options, value, onChange }) {
        return (
            <div className="flex items-center gap-2 flex-wrap">
                <span className="text-gray-500 text-xs">{label}:</span>
                <button className={`filter-btn ${value === 'todos' ? 'active' : ''}`} onClick={() => onChange('todos')}>Todos</button>
                {options.map(opt => (
                    <button key={opt} className={`filter-btn ${value === opt ? 'active' : ''}`} onClick={() => onChange(opt)}>{opt}</button>
                ))}
            </div>
        );
    }

    function UserRow({ entry, onClick }) {
        const estadoEmoji = entry.estadoTrack.includes('temprana') || entry.estadoTrack.includes('verde')
            ? '🔴'
            : entry.estadoTrack.includes('desarrollo') || entry.estadoTrack.includes('amarillo')
            ? '🟡'
            : entry.estadoTrack.includes('pulir') || entry.estadoTrack.includes('avanzado') || entry.estadoTrack.includes('azul')
            ? '🔵'
            : '⚪';

        const sugeridos = entry.tutorialesSugeridos ? entry.tutorialesSugeridos.split(' | ') : [];
        const clickados = entry.tutorialClickado ? entry.tutorialClickado.split(' || ').map(t => t.trim()) : [];

        return (
            <React.Fragment>
                <tr className="table-row border-t border-gray-800 cursor-pointer" onClick={onClick}>
                    <td className="py-3 px-4 text-xs text-gray-500">{formatDate(entry.date)}</td>
                    <td className="py-3 px-4 text-sm text-gray-300">{entry.email || '—'}</td>
                    <td className="py-3 px-4 text-xs text-gray-300">
                        {entry.nombreProyecto || '—'}
                        {entry.usoReferencia && (
                            <span className="text-xs px-1.5 py-0.5 rounded ml-1.5 font-medium" style={{ background: 'rgba(34,211,238,0.15)', color: '#22d3ee' }} title={entry.referenciaFilename ? `Referencia: ${entry.referenciaFilename}` : 'Usó track de referencia'}>REF</span>
                        )}
                    </td>
                    <td className="py-3 px-4 text-xs text-gray-400">{entry.genero || '—'}</td>
                    <td className="py-3 px-4 text-xs">{estadoEmoji} <span className="text-gray-400">{entry.estadoTrack}</span></td>
                    <td className="py-3 px-4 text-xs text-gray-400 max-w-xs truncate">{entry.diagPrincipal || '—'}</td>
                    <td className="py-3 px-4 text-xs">
                        {entry.fueUtil === 'Sí' ? <span className="text-green-400">Sí</span>
                         : entry.fueUtil === 'Parcial' ? <span className="text-yellow-400">Parcial</span>
                         : entry.fueUtil === 'No' ? <span className="text-red-400">No</span>
                         : <span className="text-gray-600">—</span>}
                    </td>
                    <td className="py-3 px-4 text-xs">
                        {entry.enlaceFeedback ? <span className="text-purple-400">Solicitado</span> : <span className="text-gray-600">—</span>}
                    </td>
                    <td className="py-3 px-4 text-xs">
                        {sugeridos.length > 0
                            ? <span className="text-blue-400">{clickados.length}/{sugeridos.length}</span>
                            : <span className="text-gray-600">—</span>}
                    </td>
                </tr>
                {sugeridos.length > 0 && (
                    <tr className="border-0">
                        <td colSpan="9" className="px-4 pb-3 pt-0">
                            <div className="flex flex-wrap gap-1 ml-4">
                                {sugeridos.map((t, ti) => {
                                    const titulo = t.trim();
                                    const clicked = clickados.some(c => c === titulo);
                                    return (
                                        <span key={ti} className={`text-xs px-2 py-0.5 rounded-full ${clicked ? 'bg-blue-500/20 text-blue-400 font-medium' : 'bg-white/5 text-gray-600'}`}>
                                            {clicked ? '▶ ' : ''}{titulo.length > 50 ? titulo.substring(0, 50) + '…' : titulo}
                                        </span>
                                    );
                                })}
                            </div>
                        </td>
                    </tr>
                )}
            </React.Fragment>
        );
    }

    function parseDiagnostico(text) {
        if (!text) return {};
        const get = (regex) => { const m = text.match(regex); return m ? m[1].trim() : ''; };
        const getAll = (regex) => { const m = text.match(regex); return m ? m[1].trim() : ''; };

        // Estado
        const estado = get(/^ESTADO:\s*(.+)$/m);

        // Diagnóstico principal
        const diagPrincipalRaw = get(/^DIAGNÓSTICO PRINCIPAL:\s*(.+)$/m);
        const diagPrincipalTitulo = diagPrincipalRaw.replace(/\s*\([^)]*\)\s*$/, '');
        const diagPrincipalId = (diagPrincipalRaw.match(/\(([^)]+)\)/) || [])[1] || '';
        const explicacion = get(/^Explicación:\s*(.+)$/m);

        // Diagnóstico secundario
        const diagSecundarioRaw = get(/^DIAGNÓSTICO SECUNDARIO:\s*(.+)$/m);
        const diagSecundarioTitulo = diagSecundarioRaw.replace(/\s*\([^)]*\)\s*$/, '');

        // Prioridades
        const prioRaw = get(/^PRIORIDADES:\s*(.+)$/m);
        const prioridades = prioRaw ? prioRaw.split(' | ').map(p => p.replace(/^\d+\.\s*/, '').trim()).filter(Boolean) : [];

        // Contexto y tips
        const notaContextual = get(/^NOTA CONTEXTUAL:\s*(.+)$/m);
        const motivacion = get(/^MOTIVACIÓN:\s*(.+)$/m);
        const tipsGeneroRaw = get(/^TIPS GÉNERO:\s*(.+)$/m);
        const tipsGenero = tipsGeneroRaw ? tipsGeneroRaw.split(' | ').filter(Boolean) : [];
        const noTocarRaw = get(/^NO TOCAR AÚN:\s*(.+)$/m);
        const noTocar = noTocarRaw ? noTocarRaw.split(' | ').filter(Boolean) : [];
        const tipObjetivo = get(/^TIP OBJETIVO:\s*(.+)$/m);
        const siguienteSesion = get(/^SIGUIENTE SESIÓN:\s*(.+)$/m);
        const atencion = get(/^ATENCIÓN:\s*(.+)$/m);
        const refTemporal = get(/^REFERENCIA TEMPORAL:\s*(.+)$/m);
        const disclaimer = get(/^DISCLAIMER:\s*(.+)$/m);

        // Mezcla
        const bpmDur = get(/^BPM:\s*(.+)$/m);
        const bpm = (bpmDur.match(/^(\d+)/) || [])[1] || '?';
        const duracion = (bpmDur.match(/Duración:\s*(.+)/) || [])[1] || '?';
        const balanceGrave = get(/^Balance grave:\s*(.+)$/m);
        const densidad = get(/^Densidad:\s*(.+)$/m);

        // Loudness
        const loudnessRaw = get(/^Loudness:\s*(.+)$/m);
        let loudness = {};
        if (loudnessRaw) {
            loudness.lufs = (loudnessRaw.match(/([-\d.]+)\s*LUFS/) || [])[1] || '';
            loudness.nivel = (loudnessRaw.match(/\(([^)]+)\)/) || [])[1] || '';
            loudness.pico = (loudnessRaw.match(/Pico:\s*([-\d.]+)/) || [])[1] || '';
            loudness.rango = (loudnessRaw.match(/Rango:\s*([-\d.]+)/) || [])[1] || '';
        }

        // Mono compat
        const monoRaw = get(/^Mono compat:\s*(.+)$/m);
        let mono = {};
        if (monoRaw) {
            mono.nivel = monoRaw.split('|')[0].trim();
            mono.correlacion = (monoRaw.match(/Correlación:\s*(\d+)%/) || [])[1] || '';
            mono.perdida = (monoRaw.match(/Pérdida:\s*([-\d.]+)dB/) || [])[1] || '';
            mono.graves = (monoRaw.match(/Graves:\s*(\w+)/) || [])[1] || '';
            mono.medios = (monoRaw.match(/Medios:\s*(\w+)/) || [])[1] || '';
            mono.agudos = (monoRaw.match(/Agudos:\s*(\w+)/) || [])[1] || '';
        }

        // Harshness
        const harshnessRaw = get(/^Harshness:\s*(.+)$/m);
        let harshness = {};
        if (harshnessRaw) {
            harshness.nivel = harshnessRaw.split('|')[0].trim();
            harshness.pico = (harshnessRaw.match(/p95:\s*([-\d.]+)dB/) || [])[1] || '';
            harshness.frames = (harshnessRaw.match(/([\d.]+)%\s*frames/) || [])[1] || '';
        }

        // Scores
        const scoresRaw = get(/^SCORES:\s*(.+)$/m);
        let scores = {};
        if (scoresRaw) {
            scoresRaw.split(',').forEach(pair => {
                const [k, v] = pair.split('=').map(s => s.trim());
                if (k && v) scores[k] = v;
            });
        }

        return { estado, diagPrincipalTitulo, diagPrincipalId, explicacion, diagSecundarioTitulo,
                 prioridades, notaContextual, motivacion, tipsGenero, noTocar, tipObjetivo,
                 siguienteSesion, atencion, refTemporal, disclaimer,
                 bpm, duracion, balanceGrave, densidad, loudness, mono, harshness, scores };
    }

    function estadoSemaforo(estado) {
        const e = (estado || '').toLowerCase();
        if (e.includes('temprana') || e.includes('verde')) return { emoji: '🔴', color: '#f87171', bg: 'rgba(248,113,113,0.10)', border: '#7f1d1d' };
        if (e.includes('pulir') || e.includes('avanzado') || e.includes('azul')) return { emoji: '🔵', color: '#60a5fa', bg: 'rgba(96,165,250,0.10)', border: '#1e3a5f' };
        return { emoji: '🟡', color: '#facc15', bg: 'rgba(250,204,21,0.10)', border: '#713f12' };
    }

    function MixMeter({ label, value, status }) {
        const colorMap = { ok: '#4ade80', buena: '#4ade80', normal: '#4ade80', mono: '#4ade80',
                          elevado: '#facc15', alta: '#facc15', alto: '#facc15', notable: '#facc15', moderado: '#facc15', revisar: '#facc15',
                          excesivo: '#f87171', saturada: '#f87171', severo: '#f87171', critica: '#f87171', problema: '#f87171', problematica: '#f87171',
                          no: '#4ade80' };
        const s = (status || '').toLowerCase();
        const color = Object.entries(colorMap).find(([k]) => s.includes(k))?.[1] || '#6b7280';
        return (
            <div className="flex items-center justify-between py-2 px-3 rounded-lg" style={{ background: 'rgba(255,255,255,0.03)' }}>
                <span className="text-gray-400 text-xs">{label}</span>
                <div className="flex items-center gap-2">
                    <span className="text-gray-200 text-xs">{value}</span>
                    <div className="w-2 h-2 rounded-full" style={{ background: color }}></div>
                </div>
            </div>
        );
    }

    function ScoreBar({ label, value, max = 100 }) {
        const v = parseFloat(value) || 0;
        const pct = Math.min((v / max) * 100, 100);
        const color = v >= 70 ? '#4ade80' : v >= 40 ? '#facc15' : '#f87171';
        return (
            <div className="mb-2">
                <div className="flex justify-between mb-1">
                    <span className="text-gray-400 text-xs">{label}</span>
                    <span className="text-xs" style={{ color }}>{value}</span>
                </div>
                <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                    <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: color }}></div>
                </div>
            </div>
        );
    }

    function DetailModal({ entry, onClose }) {
        if (!entry) return null;
        const d = parseDiagnostico(entry.diagnostico);
        const sem = estadoSemaforo(d.estado);

        return (
            <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4" onClick={onClose}>
                <div className="card p-0 max-w-2xl w-full max-h-screen overflow-y-auto" onClick={e => e.stopPropagation()} style={{ maxHeight: '90vh' }}>

                    {/* Header con estado */}
                    <div className="p-5 border-b border-gray-800">
                        <div className="flex justify-between items-start">
                            <div>
                                <p className="text-gray-500 text-xs mb-1">{formatDate(entry.date)}</p>
                                <h3 className="text-white font-semibold text-sm">{entry.email || 'Sin email'}</h3>
                            </div>
                            <button onClick={onClose} className="text-gray-500 hover:text-white text-xl leading-none">&times;</button>
                        </div>
                        {d.estado && (
                            <div className="mt-3 px-4 py-3 rounded-lg" style={{ background: sem.bg, border: `1px solid ${sem.border}` }}>
                                <div className="flex items-center gap-2">
                                    <span className="text-lg">{sem.emoji}</span>
                                    <span className="text-sm font-medium" style={{ color: sem.color }}>{d.estado}</span>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Formulario */}
                    {Object.keys(entry.formData).length > 0 && (
                        <div className="px-5 py-4 border-b border-gray-800">
                            <h4 className="text-gray-500 text-xs uppercase tracking-wide mb-3">Formulario</h4>
                            <div className="flex flex-wrap gap-2">
                                {Object.entries(entry.formData).map(([k, v]) => (
                                    <span key={k} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs" style={{ background: 'rgba(139,92,246,0.1)', border: '1px solid rgba(139,92,246,0.2)' }}>
                                        <span className="text-gray-500">{k}:</span>
                                        <span className="text-gray-200">{v}</span>
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Diagnóstico principal + secundario */}
                    {d.diagPrincipalTitulo && (
                        <div className="px-5 py-4 border-b border-gray-800">
                            <h4 className="text-gray-500 text-xs uppercase tracking-wide mb-3">Diagnóstico</h4>
                            <div className="rounded-lg p-4 mb-2" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.15)' }}>
                                <p className="text-orange-400 text-sm font-medium mb-1">{d.diagPrincipalTitulo}</p>
                                {d.diagPrincipalId && <span className="text-gray-600 text-xs">#{d.diagPrincipalId}</span>}
                                {d.explicacion && <p className="text-gray-300 text-xs mt-2 leading-relaxed">{d.explicacion}</p>}
                            </div>
                            {d.diagSecundarioTitulo && (
                                <div className="rounded-lg p-3 mt-2" style={{ background: 'rgba(255,255,255,0.03)' }}>
                                    <p className="text-gray-400 text-xs"><span className="text-gray-500">Secundario:</span> {d.diagSecundarioTitulo}</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Prioridades */}
                    {d.prioridades.length > 0 && (
                        <div className="px-5 py-4 border-b border-gray-800">
                            <h4 className="text-gray-500 text-xs uppercase tracking-wide mb-3">Prioridades</h4>
                            <div className="space-y-2">
                                {d.prioridades.map((p, i) => (
                                    <div key={i} className="flex items-start gap-3">
                                        <span className="flex-shrink-0 w-5 h-5 rounded-full bg-purple-900/40 text-purple-400 text-xs flex items-center justify-center font-medium">{i + 1}</span>
                                        <p className="text-gray-300 text-xs leading-relaxed pt-0.5">{p}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Comparación con track de referencia */}

    }

    // =========================================================================
    // Tab Motor — telemetría del motor de diagnóstico
    // =========================================================================

    // Emoji bandera desde código ISO-2 (regional indicator letters).
    function flagEmoji(iso2) {
        if (!iso2 || iso2.length !== 2) return '🏳️';
        const base = 0x1F1E6;
        const A = 'A'.charCodeAt(0);
        return String.fromCodePoint(base + iso2.charCodeAt(0) - A) +
               String.fromCodePoint(base + iso2.charCodeAt(1) - A);
    }

    // Nombres de país en español para los códigos más probables en la audiencia.
    const PAIS_NOMBRES = {
        ES: 'España', MX: 'México', AR: 'Argentina', CL: 'Chile', CO: 'Colombia',
        PE: 'Perú', UY: 'Uruguay', VE: 'Venezuela', EC: 'Ecuador', BO: 'Bolivia',
        PY: 'Paraguay', CR: 'Costa Rica', CU: 'Cuba', DO: 'R. Dominicana',
        GT: 'Guatemala', HN: 'Honduras', NI: 'Nicaragua', PA: 'Panamá',
        SV: 'El Salvador', PR: 'Puerto Rico',
        US: 'Estados Unidos', CA: 'Canadá', BR: 'Brasil',
        FR: 'Francia', DE: 'Alemania', IT: 'Italia', PT: 'Portugal',
        GB: 'Reino Unido', NL: 'Países Bajos', BE: 'Bélgica', CH: 'Suiza',
        AT: 'Austria', SE: 'Suecia', NO: 'Noruega', DK: 'Dinamarca',
        FI: 'Finlandia', PL: 'Polonia', IE: 'Irlanda', RU: 'Rusia',
        UA: 'Ucrania', GR: 'Grecia', CZ: 'Chequia', HU: 'Hungría',
        RO: 'Rumanía', TR: 'Turquía', JP: 'Japón', KR: 'Corea del Sur',
        CN: 'China', IN: 'India', AU: 'Australia', NZ: 'Nueva Zelanda',
        ZA: 'Sudáfrica', IL: 'Israel',
    };

    function MotorTab({ entries, diagLabels }) {
        const toISODate = (d) => d.toISOString().slice(0, 10);
        const today = new Date();
        const sevenDaysAgo = new Date(today.getTime() - 7 * 86400000);
        const fourteenDaysAgo = new Date(today.getTime() - 14 * 86400000);

        const [curFrom, setCurFrom] = useState(toISODate(sevenDaysAgo));
        const [curTo, setCurTo] = useState(toISODate(today));
        const [prevFrom, setPrevFrom] = useState(toISODate(fourteenDaysAgo));
        const [prevTo, setPrevTo] = useState(toISODate(sevenDaysAgo));

        // Reanálisis histórico — pasa el motor actual sobre las señales guardadas
        const [reaData, setReaData] = useState(null);
        const [reaLoading, setReaLoading] = useState(false);
        const [reaError, setReaError] = useState(null);
        const [reaSamplesOpen, setReaSamplesOpen] = useState(false);

        const lanzarReanalisis = async () => {
            setReaLoading(true);
            setReaError(null);
            try {
                const resp = await fetch(`${API_URL}/api/admin/reanalisis`, { credentials: 'same-origin' });
                if (!resp.ok) {
                    setReaError(`HTTP ${resp.status}`);
                    setReaLoading(false);
                    return;
                }
                const data = await resp.json();
                setReaData(data);
            } catch (e) {
                setReaError(String(e));
            } finally {
                setReaLoading(false);
            }
        };

        // Inventario del cierre del cutover B (usuarios __MIGRATED__ que aún
        // dependen del fallback Sheets para autenticar).
        const [cutoverData, setCutoverData] = useState(null);
        const [cutoverLoading, setCutoverLoading] = useState(false);

        const comprobarCutoverB = async () => {
            setCutoverLoading(true);
            try {
                const resp = await fetch(`${API_URL}/api/admin/cutover-b`, { credentials: 'same-origin' });
                if (resp.ok) setCutoverData(await resp.json());
                else setCutoverData({ error: `HTTP ${resp.status}` });
            } catch (e) {
                setCutoverData({ error: String(e) });
            } finally {
                setCutoverLoading(false);
            }
        };

        // Self-heal bulk del cutover B (dry-run o real)
        const [healData, setHealData] = useState(null);
        const [healLoading, setHealLoading] = useState(false);

        const lanzarHealCutoverB = async (dryRun) => {
            const total = cutoverData?.migrated_pending || 0;
            if (!dryRun && total > 0) {
                if (!confirm(`Heal REAL sobre ${total} usuarios __MIGRATED__: escribe en Postgres los hashes que devuelva Sheets. ¿Continuar?`)) return;
            }
            setHealLoading(true);
            setHealData(null);
            try {
                const url = `${API_URL}/api/admin/cutover-b/heal${dryRun ? '?dry_run=1' : ''}`;
                const resp = await fetch(url, { method: 'POST', credentials: 'same-origin' });
                if (resp.ok) {
                    setHealData(await resp.json());
                    // Refrescar el inventario tras el heal real
                    if (!dryRun) await comprobarCutoverB();
                } else {
                    setHealData({ error: `HTTP ${resp.status}` });
                }
            } catch (e) {
                setHealData({ error: String(e) });
            } finally {
                setHealLoading(false);
            }
        };

        const inRange = (date, fromStr, toStr) => {
            if (!date) return false;
            const fromD = new Date(fromStr + 'T00:00:00Z');
            const toD = new Date(toStr + 'T23:59:59Z');
            return date >= fromD && date <= toD;
        };

        const diagIdOf = (e) => {
            if (!e.diagPrincipal) return 'sin_diagnostico';
            const m = e.diagPrincipal.match(/\(([^)]+)\)\s*$/);
            return m ? m[1].trim() : 'sin_id';
        };

        const estadoBucket = (e) => {
            const est = (e.estadoTrack || '').toLowerCase();
            if (est.includes('temprana') || est.includes('verde')) return 'verde';
            if (est.includes('lista') && !est.includes('casi')) return 'avanzado';
            if (est.includes('casi') || est.includes('punto') || est.includes('pendiente')) return 'casi_listo';
            if (est.includes('pulir') || est.includes('avanzado') || est.includes('azul')) return 'avanzado';
            if (est.includes('iteraci') || est.includes('construc') || est.includes('buena base')) return 'iteracion';
            return 'otro';
        };

        const computeStats = (filtered) => {
            const total = filtered.length;
            const diagCounts = {};
            const estadoCounts = { verde: 0, casi_listo: 0, avanzado: 0, iteracion: 0, otro: 0 };
            filtered.forEach(e => {
                const id = diagIdOf(e);
                diagCounts[id] = (diagCounts[id] || 0) + 1;
                const eb = estadoBucket(e);
                estadoCounts[eb] = (estadoCounts[eb] || 0) + 1;
            });
            return { total, diagCounts, estadoCounts };
        };

        const curEntries = useMemo(
            () => entries.filter(e => inRange(e.date, curFrom, curTo)),
            [entries, curFrom, curTo]
        );
        const prevEntries = useMemo(
            () => entries.filter(e => inRange(e.date, prevFrom, prevTo)),
            [entries, prevFrom, prevTo]
        );

        const curStats = useMemo(() => computeStats(curEntries), [curEntries]);
        const prevStats = useMemo(() => computeStats(prevEntries), [prevEntries]);

        // Diagnósticos en cualquiera de los dos periodos, ordenados por frecuencia total
        const allDiagIds = useMemo(() => {
            const ids = new Set([...Object.keys(curStats.diagCounts), ...Object.keys(prevStats.diagCounts)]);
            return [...ids].sort((a, b) => {
                const sumA = (curStats.diagCounts[a] || 0) + (prevStats.diagCounts[a] || 0);
                const sumB = (curStats.diagCounts[b] || 0) + (prevStats.diagCounts[b] || 0);
                return sumB - sumA;
            });
        }, [curStats, prevStats]);

        const pct = (n, total) => total > 0 ? (n / total) * 100 : 0;
        const deltaLabel = (curPct, prevPct) => {
            const d = curPct - prevPct;
            if (Math.abs(d) < 0.5) return { txt: '≈', color: '#6b7280' };
            const sign = d > 0 ? '+' : '';
            return { txt: `${sign}${d.toFixed(1)}pp`, color: d > 0 ? '#facc15' : '#4ade80' };
        };

        const labelOf = (id) => diagLabels[id] || id;
        const estadoColor = {
            verde: '#f87171',     // fase temprana = rojo en semáforo
            iteracion: '#f87171',
            casi_listo: '#facc15',
            avanzado: '#60a5fa',
            otro: '#6b7280',
        };
        const estadoLabel = {
            verde: 'Fase temprana',
            iteracion: 'Iteración / construcción',
            casi_listo: 'Casi listo',
            avanzado: 'Avanzado / listo',
            otro: 'Otro',
        };

        // ---- Cruces sobre todo el dataset (no filtrados por periodo) ----

        // Filtro de versión del motor para la card de satisfacción (mide impacto
        // de recalibraciones: comparar mismo dx en versiones distintas del motor).
        const [motorVersionFilter, setMotorVersionFilter] = useState('todas');

        // Versiones distintas presentes en los datos (orden semver descendente)
        const versionesDisponibles = useMemo(() => {
            const set = new Set();
            entries.forEach(e => { if (e.motorVersion) set.add(e.motorVersion); });
            return [...set].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
        }, [entries]);

        // Diagnóstico × Satisfacción: para cada dx, qué % de usuarios respondió útil
        const dxVsSatisfaccion = useMemo(() => {
            const buckets = {};
            entries.forEach(e => {
                if (motorVersionFilter === 'con_version' && !e.motorVersion) return;
                if (motorVersionFilter === 'sin_version' && e.motorVersion) return;
                if (motorVersionFilter !== 'todas' && motorVersionFilter !== 'con_version'
                    && motorVersionFilter !== 'sin_version'
                    && e.motorVersion !== motorVersionFilter) return;
                const u = e.fueUtil;
                if (u !== 'Sí' && u !== 'Parcial' && u !== 'No') return;
                const id = diagIdOf(e);
                if (!buckets[id]) buckets[id] = { id, total: 0, si: 0, parcial: 0, no: 0 };
                buckets[id].total += 1;
                if (u === 'Sí') buckets[id].si += 1;
                else if (u === 'Parcial') buckets[id].parcial += 1;
                else buckets[id].no += 1;
            });
            // Solo dx con >= 3 respuestas (resto = ruido estadístico)
            return Object.values(buckets)
                .filter(b => b.total >= 3)
                .map(b => ({ ...b, pctUtil: (b.si / b.total) * 100 }))
                .sort((a, b) => b.total - a.total);
        }, [entries, motorVersionFilter]);

        // Género × Diagnóstico: matriz de count para detectar qué dx predomina por género
        const generoVsDx = useMemo(() => {
            const matrix = {};      // generoLabel -> dxId -> count
            const totalPorGenero = {};
            const totalPorDx = {};
            entries.forEach(e => {
                const g = (e.genero || '').trim();
                if (!g) return;
                const id = diagIdOf(e);
                if (!matrix[g]) matrix[g] = {};
                matrix[g][id] = (matrix[g][id] || 0) + 1;
                totalPorGenero[g] = (totalPorGenero[g] || 0) + 1;
                totalPorDx[id] = (totalPorDx[id] || 0) + 1;
            });
            // Géneros con al menos 2 análisis; diagnósticos top 8 por frecuencia
            const generos = Object.entries(totalPorGenero)
                .filter(([, n]) => n >= 2)
                .sort((a, b) => b[1] - a[1])
                .map(([g]) => g);
            const diagnosticos = Object.entries(totalPorDx)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8)
                .map(([d]) => d);
            return { matrix, generos, diagnosticos, totalPorGenero };
        }, [entries]);

        // País × Género: solo entries con país detectado
        const paisVsGenero = useMemo(() => {
            const matrix = {};
            const totalPorPais = {};
            const totalPorGenero = {};
            entries.forEach(e => {
                if (!e.pais || e.pais.length !== 2) return;
                const g = (e.genero || '').trim() || '—';
                const p = e.pais;
                if (!matrix[p]) matrix[p] = {};
                matrix[p][g] = (matrix[p][g] || 0) + 1;
                totalPorPais[p] = (totalPorPais[p] || 0) + 1;
                totalPorGenero[g] = (totalPorGenero[g] || 0) + 1;
            });
            const paises = Object.entries(totalPorPais)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10)
                .map(([p]) => p);
            const generos = Object.entries(totalPorGenero)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6)
                .map(([g]) => g);
            return { matrix, paises, generos, totalPorPais };
        }, [entries]);

        // Color de celda según densidad (0-1) → púrpura translúcido sobre fondo gris
        const cellBg = (count, max) => {
            if (count === 0 || max === 0) return 'transparent';
            const alpha = Math.max(0.08, Math.min(0.65, count / max));
            return `rgba(139, 92, 246, ${alpha})`;
        };

        const PeriodPicker = ({ label, from, to, setFrom, setTo, total, color }) => (
            <div className="card p-4">
                <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-semibold text-gray-400 uppercase">{label}</span>
                    <span className="text-lg font-bold" style={{ color }}>{total}<span className="text-xs text-gray-500 font-normal ml-1">tracks</span></span>
                </div>
                <div className="flex gap-2 text-xs">
                    <input type="date" value={from} onChange={e => setFrom(e.target.value)}
                           className="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-gray-300 flex-1" />
                    <input type="date" value={to} onChange={e => setTo(e.target.value)}
                           className="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-gray-300 flex-1" />
                </div>
            </div>
        );

        return (
            <div className="fade-in space-y-6">
                <div className="card p-4 mb-2">
                    <p className="text-xs text-gray-400 leading-relaxed">
                        Compara la distribución de diagnósticos entre dos periodos. Útil para detectar cambios
                        de comportamiento del motor tras una recalibración (p.ej. v0.5.4 → v0.5.7).
                        Δ en puntos porcentuales: <span style={{color:'#facc15'}}>amarillo</span> si subió,
                        <span style={{color:'#4ade80'}}> verde</span> si bajó (menos diagnóstico = motor más permisivo).
                    </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <PeriodPicker label="Periodo actual" from={curFrom} to={curTo}
                                   setFrom={setCurFrom} setTo={setCurTo}
                                   total={curStats.total} color="#a78bfa" />
                    <PeriodPicker label="Periodo anterior" from={prevFrom} to={prevTo}
                                   setFrom={setPrevFrom} setTo={setPrevTo}
                                   total={prevStats.total} color="#6b7280" />
                </div>

                <div className="card p-5">
                    <h3 className="text-sm font-semibold text-gray-300 mb-4">Distribución por diagnóstico principal</h3>
                    {allDiagIds.length === 0 ? (
                        <p className="text-xs text-gray-500">Sin datos en los periodos seleccionados.</p>
                    ) : (
                        <div className="space-y-2.5">
                            {allDiagIds.map(id => {
                                const curN = curStats.diagCounts[id] || 0;
                                const prevN = prevStats.diagCounts[id] || 0;
                                const curPct = pct(curN, curStats.total);
                                const prevPct = pct(prevN, prevStats.total);
                                const delta = deltaLabel(curPct, prevPct);
                                return (
                                    <div key={id} className="border-t border-gray-800 pt-2.5">
                                        <div className="flex items-center justify-between text-xs mb-1.5">
                                            <span className="text-gray-300">{labelOf(id)}</span>
                                            <span style={{ color: delta.color }}>{delta.txt}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <div className="bg-gray-800/40 rounded h-2 overflow-hidden">
                                                    <div style={{ width: `${curPct}%`, background: '#a78bfa', height: '100%' }} />
                                                </div>
                                                <div className="text-[10px] text-gray-500 mt-0.5">{curN} ({curPct.toFixed(1)}%)</div>
                                            </div>
                                            <div>
                                                <div className="bg-gray-800/40 rounded h-2 overflow-hidden">
                                                    <div style={{ width: `${prevPct}%`, background: '#6b7280', height: '100%' }} />
                                                </div>
                                                <div className="text-[10px] text-gray-500 mt-0.5">{prevN} ({prevPct.toFixed(1)}%)</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>

                <div className="card p-5">
                    <h3 className="text-sm font-semibold text-gray-300 mb-4">Distribución por estado del track</h3>
                    {curStats.total === 0 && prevStats.total === 0 ? (
                        <p className="text-xs text-gray-500">Sin datos.</p>
                    ) : (
                        <div className="space-y-2.5">
                            {['verde', 'iteracion', 'casi_listo', 'avanzado', 'otro'].map(b => {
                                const curN = curStats.estadoCounts[b] || 0;
                                const prevN = prevStats.estadoCounts[b] || 0;
                                if (curN === 0 && prevN === 0) return null;
                                const curPct = pct(curN, curStats.total);
                                const prevPct = pct(prevN, prevStats.total);
                                const delta = deltaLabel(curPct, prevPct);
                                return (
                                    <div key={b} className="border-t border-gray-800 pt-2.5">
                                        <div className="flex items-center justify-between text-xs mb-1.5">
                                            <span className="text-gray-300">
                                                <span style={{ color: estadoColor[b] }}>●</span> {estadoLabel[b]}
                                            </span>
                                            <span style={{ color: delta.color }}>{delta.txt}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <div className="bg-gray-800/40 rounded h-2 overflow-hidden">
                                                    <div style={{ width: `${curPct}%`, background: estadoColor[b], height: '100%' }} />
                                                </div>
                                                <div className="text-[10px] text-gray-500 mt-0.5">{curN} ({curPct.toFixed(1)}%)</div>
                                            </div>
                                            <div>
                                                <div className="bg-gray-800/40 rounded h-2 overflow-hidden">
                                                    <div style={{ width: `${prevPct}%`, background: '#4b5563', height: '100%' }} />
                                                </div>
                                                <div className="text-[10px] text-gray-500 mt-0.5">{prevN} ({prevPct.toFixed(1)}%)</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>

                <div className="card p-5">
                    <h3 className="text-sm font-semibold text-gray-300 mb-3">Top 5 deltas en porcentaje</h3>
                    {(() => {
                        const ranked = allDiagIds.map(id => {
                            const cp = pct(curStats.diagCounts[id] || 0, curStats.total);
                            const pp = pct(prevStats.diagCounts[id] || 0, prevStats.total);
                            return { id, delta: cp - pp, curPct: cp, prevPct: pp };
                        }).filter(r => Math.abs(r.delta) >= 1).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)).slice(0, 5);
                        if (ranked.length === 0) {
                            return <p className="text-xs text-gray-500">Sin cambios significativos (Δ ≥ 1pp).</p>;
                        }
                        return (
                            <ul className="space-y-1.5">
                                {ranked.map(r => (
                                    <li key={r.id} className="flex justify-between text-xs border-t border-gray-800 pt-1.5">
                                        <span className="text-gray-300">{labelOf(r.id)}</span>
                                        <span style={{ color: r.delta > 0 ? '#facc15' : '#4ade80' }}>
                                            {r.delta > 0 ? '+' : ''}{r.delta.toFixed(1)}pp
                                            <span className="text-gray-600 ml-2">({r.prevPct.toFixed(1)}% → {r.curPct.toFixed(1)}%)</span>
                                        </span>
                                    </li>
                                ))}
                            </ul>
                        );
                    })()}
                </div>

                <div className="card p-5">
                    <div className="flex items-start justify-between gap-3 mb-1">

                            value={motorVersionFilter}

                            className="text-xs bg-gray-900 border border-gray-700 rounded px-2 py-1 text-gray-300"
                        >
                            <option value="todas">Todas las versiones</option>
                            <option value="con_version">Con versión etiquetada</option>
                            <option value="sin_version">Sin versión (legacy)</option>
                            {versionesDisponibles.map(v => (
                                <option key={v} value={v}>Motor v{v}</option>
                            ))}
                        </select>
                    </div>
                    <p className="text-xs text-gray-500 mb-4">
                        Por cada diagnóstico, qué proporción de usuarios contestó que les fue útil. Solo se muestran
                        diagnósticos con al menos 3 respuestas (sí/parcial/no). %útil bajo es señal de que la regla
                        acierta poco o que el feedback no aterriza. Filtra por versión del motor para comparar
                        antes/después de un recalibrado (los análisis previos a 2026-05-26 no tienen versión).
                    </p>
                    {dxVsSatisfaccion.length === 0 ? (
                        <p className="text-xs text-gray-500">Aún sin respuestas de utilidad suficientes (≥3 por diagnóstico).</p>
                    ) : (
                        <div className="space-y-1.5">
                            <div className="grid gap-2 text-[10px] text-gray-500 uppercase tracking-wide pb-1 border-b border-gray-800"
                                 style={{ gridTemplateColumns: '1fr 50px 50px 50px 50px 60px' }}>
                                <span>Diagnóstico</span>
                                <span className="text-right">Total</span>
                                <span className="text-right text-green-400">Sí</span>
                                <span className="text-right text-yellow-400">Parcial</span>
                                <span className="text-right text-red-400">No</span>
                                <span className="text-right">% útil</span>
                            </div>
                            {dxVsSatisfaccion.map(b => {
                                const colorUtil = b.pctUtil >= 70 ? '#4ade80'
                                                : b.pctUtil >= 40 ? '#facc15' : '#f87171';
                                return (
                                    <div key={b.id} className="grid gap-2 text-xs pt-1"
                                         style={{ gridTemplateColumns: '1fr 50px 50px 50px 50px 60px' }}>
                                        <span className="text-gray-300 truncate">{labelOf(b.id)}</span>
                                        <span className="text-right text-gray-400">{b.total}</span>
                                        <span className="text-right text-gray-300">{b.si}</span>
                                        <span className="text-right text-gray-300">{b.parcial}</span>
                                        <span className="text-right text-gray-300">{b.no}</span>
                                        <span className="text-right font-semibold" style={{ color: colorUtil }}>
                                            {b.pctUtil.toFixed(0)}%
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>

                <div className="card p-5">
                    <h3 className="text-sm font-semibold text-gray-300 mb-1">Género × Diagnóstico</h3>
                    <p className="text-xs text-gray-500 mb-4">
                        Cuántas veces ha aparecido cada diagnóstico por género. Una columna que se enciende mucho
                        en un género concreto suele ser señal de que las reglas no están bien calibradas para ese
                        género (falso positivo sistemático) o de un problema real del estilo.
                    </p>
                    {generoVsDx.generos.length === 0 ? (
                        <p className="text-xs text-gray-500">Sin datos suficientes por género (≥2 análisis).</p>
                    ) : (() => {
                        const maxCount = Math.max(
                            1,
                            ...generoVsDx.generos.flatMap(g =>
                                generoVsDx.diagnosticos.map(d => (generoVsDx.matrix[g] || {})[d] || 0)
                            )
                        );
                        return (
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs" style={{ borderCollapse: 'separate', borderSpacing: '2px' }}>
                                    <thead>
                                        <tr>
                                            <th className="text-left text-gray-500 text-[10px] uppercase tracking-wide pb-2 pr-2">Género</th>
                                            {generoVsDx.diagnosticos.map(d => (
                                                <th key={d} className="text-gray-500 text-[10px] font-normal pb-2 px-1 text-center whitespace-nowrap"
                                                    style={{ minWidth: '60px', maxWidth: '90px' }}>
                                                    <div className="truncate" title={labelOf(d)}>{labelOf(d)}</div>
                                                </th>
                                            ))}
                                            <th className="text-gray-500 text-[10px] font-normal pb-2 pl-2 text-right">Tot</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {generoVsDx.generos.map(g => (
                                            <tr key={g}>
                                                <td className="text-gray-300 pr-2 py-0.5 whitespace-nowrap">{g}</td>
                                                {generoVsDx.diagnosticos.map(d => {
                                                    const n = (generoVsDx.matrix[g] || {})[d] || 0;
                                                    return (
                                                        <td key={d} className="text-center text-gray-200 py-1 px-1 rounded"
                                                            style={{ background: cellBg(n, maxCount), minWidth: '40px' }}>
                                                            {n || ''}
                                                        </td>
                                                    );
                                                })}
                                                <td className="text-right text-gray-500 pl-2">{generoVsDx.totalPorGenero[g]}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        );
                    })()}
                </div>

                <div className="card p-5">
                    <h3 className="text-sm font-semibold text-gray-300 mb-1">País × Género</h3>
                    <p className="text-xs text-gray-500 mb-4">
                        Qué géneros se producen en cada país. Solo análisis con país detectado (vía ipapi.co,
                        post-2026-05-21). Útil para entender si Mentotrack está captando ciertos nichos regionales.
                    </p>
                    {paisVsGenero.paises.length === 0 ? (
                        <p className="text-xs text-gray-500">Aún sin datos de país suficientes.</p>
                    ) : (() => {
                        const maxCount = Math.max(
                            1,
                            ...paisVsGenero.paises.flatMap(p =>
                                paisVsGenero.generos.map(g => (paisVsGenero.matrix[p] || {})[g] || 0)
                            )
                        );
                        return (
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs" style={{ borderCollapse: 'separate', borderSpacing: '2px' }}>
                                    <thead>
                                        <tr>
                                            <th className="text-left text-gray-500 text-[10px] uppercase tracking-wide pb-2 pr-2">País</th>
                                            {paisVsGenero.generos.map(g => (
                                                <th key={g} className="text-gray-500 text-[10px] font-normal pb-2 px-1 text-center whitespace-nowrap"
                                                    style={{ minWidth: '60px', maxWidth: '90px' }}>
                                                    <div className="truncate" title={g}>{g}</div>
                                                </th>
                                            ))}
                                            <th className="text-gray-500 text-[10px] font-normal pb-2 pl-2 text-right">Tot</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {paisVsGenero.paises.map(p => (
                                            <tr key={p}>
                                                <td className="text-gray-300 pr-2 py-0.5 whitespace-nowrap">
                                                    <span className="mr-1">{flagEmoji(p)}</span>
                                                    <span className="text-[11px]">{PAIS_NOMBRES[p] || p}</span>
                                                </td>
                                                {paisVsGenero.generos.map(g => {
                                                    const n = (paisVsGenero.matrix[p] || {})[g] || 0;
                                                    return (
                                                        <td key={g} className="text-center text-gray-200 py-1 px-1 rounded"
                                                            style={{ background: cellBg(n, maxCount), minWidth: '40px' }}>
                                                            {n || ''}
                                                        </td>
                                                    );
                                                })}
                                                <td className="text-right text-gray-500 pl-2">{paisVsGenero.totalPorPais[p]}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        );
                    })()}
                </div>

                <div className="card p-5">
                    <h3 className="text-sm font-semibold text-gray-300 mb-1">Distribución por país (todos los análisis)</h3>
                    <p className="text-xs text-gray-500 mb-4">
                        Detectado por IP vía ipapi.co (sin guardar la IP). Solo análisis posteriores al deploy del 2026-05-21.
                    </p>
                    {(() => {
                        const counts = {};
                        let conPais = 0;
                        let sinPais = 0;
                        entries.forEach(e => {
                            if (e.pais && e.pais.length === 2) {
                                counts[e.pais] = (counts[e.pais] || 0) + 1;
                                conPais++;
                            } else {
                                sinPais++;
                            }
                        });
                        const ranked = Object.entries(counts).map(([iso, n]) => ({iso, n}))
                            .sort((a,b) => b.n - a.n);
                        if (ranked.length === 0) {
                            return (
                                <p className="text-xs text-gray-500">
                                    Aún sin datos de país. Espera a los próximos análisis con la v0.5.12 desplegada.
                                </p>
                            );
                        }
                        const max = ranked[0].n;
                        return (
                            <div>
                                <div className="text-xs text-gray-500 mb-3">
                                    {conPais} análisis con país detectado · {sinPais} sin (anteriores al deploy o sin Cloudflare)
                                </div>
                                <div className="space-y-1.5">
                                    {ranked.map(({iso, n}) => {
                                        const pctV = (n / conPais) * 100;
                                        const widthPct = (n / max) * 100;
                                        return (
                                            <div key={iso} className="flex items-center gap-3 text-xs">
                                                <span className="w-32 text-gray-300 flex-shrink-0">

                <div className="card p-5">

                            <p className="text-xs text-gray-500 mt-1 leading-relaxed">
                                Pasa cada análisis ya guardado por el motor de reglas actual (sin tocar la DB) y
                                cuenta cuántos diagnósticos principales seguirían siendo iguales y cuántos cambiarían
                                tras las recalibraciones recientes. Las señales se reconstruyen desde el snapshot
                                guardado en JSONB — algunos campos cosméticos no están y se rellenan con defaults

                        <button

                                    <div className="text-gray-500 text-[10px] uppercase tracking-wide">Procesados</div>

                                </div>
                                <div className="bg-gray-900/40 rounded p-2.5" style={{ borderLeft: '3px solid #4ade80' }}>

                                    <div className="text-green-400 text-lg font-semibold">
                                        {reaData.matches}
                                        <span className="text-gray-500 text-xs font-normal ml-1">

                                    </div>

    // =========================================================================

    const ESTADO_LABELS = {
        nueva:       { txt: 'Nueva',       color: '#facc15', bg: 'rgba(250,204,21,0.10)', border: '#713f12' },
        aceptada:    { txt: 'Aceptada',    color: '#4ade80', bg: 'rgba(74,222,128,0.10)', border: '#14532d' },
        rechazada:   { txt: 'Rechazada',   color: '#f87171', bg: 'rgba(248,113,113,0.10)', border: '#7f1d1d' },
        completada:  { txt: 'Completada',  color: '#60a5fa', bg: 'rgba(96,165,250,0.10)', border: '#1e3a5f' },
        reembolsada: { txt: 'Reembolsada', color: '#94a3b8', bg: 'rgba(148,163,184,0.10)', border: '#334155' },

    function AuditoriasTab() {
        const [solicitudes, setSolicitudes] = useState(null);
        const [error, setError] = useState(null);
        const [loading, setLoading] = useState(true);
        const [filtroEstado, setFiltroEstado] = useState('todas');

        const cargar = async () => {
            setLoading(true);
            setError(null);
            try {
                const resp = await fetch(`${API_URL}/api/admin/consultoria/solicitudes`, { credentials: 'same-origin' });
                if (!resp.ok) {
                    setError(`HTTP ${resp.status}`);
                    setLoading(false);
                    return;
                }
                const data = await resp.json();
                setSolicitudes(data.solicitudes || []);
            } catch (e) {
                setError(String(e));
            } finally {
                setLoading(false);
            }
        };

        useEffect(() => { cargar(); }, []);

        const actualizar = async (id, payload) => {
            try {
                const resp = await fetch(`${API_URL}/api/admin/consultoria/solicitudes/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload),
                });
                if (resp.ok) {
                    // Recarga la lista para reflejar el cambio
                    await cargar();
                } else {
                    alert(`No se pudo actualizar (${resp.status})`);
                }
            } catch (e) {
                alert('Error de red al actualizar');
            }
        };

        const filtradas = useMemo(() => {
            if (!solicitudes) return [];
            if (filtroEstado === 'todas') return solicitudes;
            return solicitudes.filter(s => s.estado === filtroEstado);
        }, [solicitudes, filtroEstado]);

        const conteoEstados = useMemo(() => {
            const c = { todas: solicitudes?.length || 0 };
            (solicitudes || []).forEach(s => {
                c[s.estado] = (c[s.estado] || 0) + 1;
            });
            return c;
        }, [solicitudes]);

        const formatFecha = (iso) => {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleString('es-ES', {
                day: '2-digit', month: 'short',
                hour: '2-digit', minute: '2-digit',
            });
        };

        return (
            <div className="fade-in space-y-4">
                <div className="card p-5 mb-2">
                    <div className="flex items-start justify-between gap-3 flex-wrap mb-3">
                        <div>
                            <h3 className="text-sm font-semibold text-gray-300">Solicitudes de Auditoría 1:1</h3>
                            <p className="text-xs text-gray-500 mt-1">
                                Formularios recibidos desde /consultoria. Cada uno también te llega por email.
                            </p>
                        </div>
                        <button
                            onClick={cargar}
                            disabled={loading}
                            className="text-xs px-3 py-2 rounded-lg"
                            style={{
                                background: loading ? '#3f3f46' : '#8b5cf6',
                                color: '#fff',
                                cursor: loading ? 'not-allowed' : 'pointer',
                            }}
                        >
                            {loading ? 'Cargando…' : 'Refrescar'}
                        </button>
                    </div>

                    {/* Filtros por estado */}
                    <div className="flex flex-wrap gap-2 text-xs">
                        {['todas', 'nueva', 'aceptada', 'rechazada', 'completada', 'reembolsada'].map(e => (
                            <button
                                key={e}
                                onClick={() => setFiltroEstado(e)}
                                className="px-2.5 py-1 rounded-md transition-colors"
                                style={{
                                    background: filtroEstado === e ? '#8b5cf6' : 'rgba(255,255,255,0.04)',
                                    color: filtroEstado === e ? '#fff' : '#a1a1aa',
                                    border: '1px solid rgba(255,255,255,0.06)',
                                }}
                            >
                                {e === 'todas' ? 'Todas' : (ESTADO_LABELS[e]?.txt || e)}
                                <span className="ml-1.5 text-[10px] opacity-70">{conteoEstados[e] || 0}</span>
                            </button>
                        ))}
                    </div>
                </div>

                {error && (
                    <div className="card p-4 text-xs text-red-400">Error: {error}</div>
                )}

                {!loading && solicitudes && filtradas.length === 0 && (
                    <div className="card p-8 text-center">
                        <p className="text-sm text-gray-400">
                            {filtroEstado === 'todas'
                                ? 'Aún no hay solicitudes. Cuando llegue una, aparecerá aquí y te llegará por email.'
                                : `Sin solicitudes en estado "${ESTADO_LABELS[filtroEstado]?.txt || filtroEstado}".`}
                        </p>
                    </div>
                )}

                {filtradas.map(s => {
                    const est = ESTADO_LABELS[s.estado] || ESTADO_LABELS.nueva;
                    return (
                        <div key={s.id} className="card p-5">
                            {/* Cabecera */}
                            <div className="flex items-start justify-between gap-3 mb-3 flex-wrap">
                                <div className="min-w-0">
                                    <div className="flex items-center gap-2 mb-1">
                                        <h4 className="text-white text-sm font-semibold">{s.nombre}</h4>
                                        <span
                                            className="text-[10px] px-2 py-0.5 rounded-full flex-shrink-0"
                                            style={{ color: est.color, background: est.bg, border: `1px solid ${est.border}` }}
                                        >
                                            {est.txt}
                                        </span>
                                    </div>
                                    <a href={`mailto:${s.email}`} className="text-xs text-purple-400 hover:text-purple-300">
                                        {s.email}
                                    </a>
                                    <p className="text-[11px] text-gray-500 mt-1">Recibida {formatFecha(s.timestamp)}</p>
                                </div>
                                <div className="flex gap-1.5 flex-wrap">
                                    {['aceptada', 'rechazada', 'completada', 'reembolsada'].map(e => (
                                        <button
                                            key={e}
                                            onClick={() => actualizar(s.id, { estado: e })}
                                            disabled={s.estado === e}
                                            className="text-[10px] px-2 py-1 rounded-md"
                                            style={{
                                                background: s.estado === e ? ESTADO_LABELS[e].bg : 'rgba(255,255,255,0.04)',
                                                color: s.estado === e ? ESTADO_LABELS[e].color : '#a1a1aa',
                                                border: `1px solid ${s.estado === e ? ESTADO_LABELS[e].border : 'rgba(255,255,255,0.06)'}`,
                                                cursor: s.estado === e ? 'default' : 'pointer',
                                            }}
                                        >
                                            {ESTADO_LABELS[e].txt}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Datos */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                <div>
                                    <p className="text-gray-500 text-[10px] uppercase tracking-wide mb-1">Track</p>
                                    <a href={s.soundcloud} target="_blank" rel="noopener noreferrer"
                                       className="text-gray-200 break-all hover:text-purple-300">{s.soundcloud}</a>
                                </div>
                                {s.ref_cancion && (
                                    <div>
                                        <p className="text-gray-500 text-[10px] uppercase tracking-wide mb-1">Canción de referencia</p>
                                        <p className="text-gray-200">{s.ref_cancion}</p>
                                    </div>
                                )}
                                {s.ref_artistas && (
                                    <div>
                                        <p className="text-gray-500 text-[10px] uppercase tracking-wide mb-1">Artistas de referencia</p>
                                        <p className="text-gray-200">{s.ref_artistas}</p>
                                    </div>
                                )}
                                {s.ref_sellos && (
                                    <div>
                                        <p className="text-gray-500 text-[10px] uppercase tracking-wide mb-1">Sellos de referencia</p>
                                        <p className="text-gray-200">{s.ref_sellos}</p>
                                    </div>
                                )}
                                {s.contexto && (
                                    <div className="md:col-span-2">
                                        <p className="text-gray-500 text-[10px] uppercase tracking-wide mb-1">Contexto</p>
                                        <p className="text-gray-200 whitespace-pre-wrap leading-relaxed">{s.contexto}</p>
                                    </div>
                                )}
                            </div>

                            {/* Notas admin */}
                            <details className="mt-4">
                                <summary className="cursor-pointer text-xs text-gray-500 hover:text-gray-300">
                                    Notas privadas {s.notas_admin ? '(con notas)' : ''}
                                </summary>
                                <NotasEditor
                                    initial={s.notas_admin}
                                    onSave={(notas) => actualizar(s.id, { notas })}
                                />
                            </details>
                        </div>
                    );
                })}
            </div>
        );
    }

    function NotasEditor({ initial, onSave }) {
        const [val, setVal] = useState(initial || '');
        const [saving, setSaving] = useState(false);
        const initialRef = useRef(initial || '');

        const dirty = val !== initialRef.current;

        const guardar = async () => {
            setSaving(true);
            await onSave(val);
            initialRef.current = val;
            setSaving(false);
        };

        return (
            <div className="mt-2">
                <textarea
                    value={val}
                    onChange={(e) => setVal(e.target.value)}
                    rows={3}
                    placeholder="Notas privadas (solo tú las ves) — feedback que has dado, fecha de la sesión, observaciones…"
                    className="w-full text-xs p-2 rounded-md"
                    style={{
                        background: 'rgba(255,255,255,0.04)',
                        border: '1px solid rgba(255,255,255,0.06)',
                        color: '#e4e4e7',
                        resize: 'vertical',
                    }}
                />
                {dirty && (
                    <button
                        onClick={guardar}
                        disabled={saving}
                        className="text-xs px-3 py-1.5 rounded-md mt-2"
                        style={{
                            background: saving ? '#3f3f46' : '#8b5cf6',
                            color: '#fff',
                            cursor: saving ? 'not-allowed' : 'pointer',
                        }}
                    >
                        {saving ? 'Guardando…' : 'Guardar notas'}
                    </button>
                )}
            </div>
        );
    }


    // =========================================================================
    // Tab: Embudo de conversión del CTA de auditoría

    const EMBUDO_STEPS = [
        { key: 'cta_visto',                 label: 'CTA visto',         desc: 'El CTA se renderizó tras un diagnóstico (impresiones)' },
        { key: 'cta_clicked',               label: 'CTA clickado',      desc: 'Pulsó la card e ir a /consultoria' },
        { key: 'consultoria_visit',         label: 'Visita /consultoria', desc: 'Llegó a la página de la oferta' },
        { key: 'consultoria_form_started',  label: 'Form iniciado',     desc: 'Hizo focus en algún campo del formulario' },
        { key: 'consultoria_form_submit',   label: 'Form enviado',      desc: 'Envió la solicitud (paso final antes de Stripe)' },
    ];

    function EmbudoTab() {
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);
        const [loading, setLoading] = useState(true);
        const [dias, setDias] = useState(30);

        const cargar = async (n) => {
            setLoading(true);
            setError(null);
            try {
                const resp = await fetch(`${API_URL}/api/admin/embudo?dias=${n}`, { credentials: 'same-origin' });
                if (!resp.ok) {
                    setError(`HTTP ${resp.status}`);
                    setLoading(false);
                    return;
                }
                const json = await resp.json();
                setData(json);
            } catch (e) {
                setError(String(e));
            } finally {
                setLoading(false);
            }
        };

        useEffect(() => { cargar(dias); }, [dias]);

        // Métricas calculadas para el embudo
        const filas = useMemo(() => {
            if (!data) return [];
            const recientes = data.totales_recientes || {};
            const globales = data.totales_global || {};
            const max = Math.max(1, ...EMBUDO_STEPS.map(s => (recientes[s.key]?.sesiones || 0)));
            return EMBUDO_STEPS.map((s, i) => {
                const sesiones = recientes[s.key]?.sesiones || 0;

    // =========================================================================

    function Dashboard() {
        const [rawData, setRawData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [filterGenero, setFilterGenero] = useState('todos');
