        const [filterEstado, setFilterEstado] = useState('todos');
        const [onlyWithFeedbackReal, setOnlyWithFeedbackReal] = useState(false);
        const [selectedEntry, setSelectedEntry] = useState(null);
        const [selectedUser, setSelectedUser] = useState(null);
        const [userSort, setUserSort] = useState('recent'); // 'recent' | 'analyses'
        const [tab, setTab] = useState('overview'); // overview | analisis | users | feedback
        const [calendarMonth, setCalendarMonth] = useState(() => new Date(2026, 3, 1)); // Abril 2026
        const [showOtrosDetalle, setShowOtrosDetalle] = useState(false);

        // Auth via HttpOnly cookie (set by /api/admin/login or /dashboard?key=)
        useEffect(() => {
            fetch(`${API_URL}/api/sheets/datos`, { credentials: 'same-origin' })
                .then(r => { if (!r.ok) throw new Error('Acceso denegado'); return r.json(); })
                .then(data => {
                    setRawData(data.data || data);
                    setLoading(false);
                })
                .catch(err => {
                    setError('No se pudo conectar con el Sheet o acceso denegado.');
                    setLoading(false);
                });
        }, []);

        const entries = useMemo(() => {
            if (!rawData) return [];
            return rawData.map(parseRow).filter(e => e.email || e.diagnostico);
        }, [rawData]);

        const filtered = useMemo(() => {
            return entries.filter(e => {
                if (filterGenero !== 'todos' && e.genero !== filterGenero) return false;
                if (filterUtil === 'Sí' && e.fueUtil !== 'Sí') return false;
                if (filterUtil === 'Parcial' && e.fueUtil !== 'Parcial') return false;
                if (filterUtil === 'No' && e.fueUtil !== 'No') return false;
                if (filterUtil === 'Sin respuesta' && e.fueUtil) return false;
                if (filterEstado !== 'todos') {
                    const est = e.estadoTrack.toLowerCase();
                    if (filterEstado === '🔴' && !est.includes('temprana') && !est.includes('verde')) return false;
                    if (filterEstado === '🟡' && !est.includes('desarrollo') && !est.includes('amarillo')) return false;
                    if (filterEstado === '🔵' && !est.includes('pulir') && !est.includes('avanzado') && !est.includes('azul')) return false;
                }
                if (onlyWithFeedbackReal && !e.enlaceFeedback) return false;
                return true;
            });
        }, [entries, filterGenero, filterUtil, filterEstado, onlyWithFeedbackReal]);

        // Métricas
        const totalUsers = entries.length;
        const uniqueEmails = new Set(entries.map(e => e.email).filter(Boolean)).size;
        const feedbackReal = entries.filter(e => e.enlaceFeedback).length;
        const utilSi = entries.filter(e => e.fueUtil === 'Sí').length;
        const utilParcial = entries.filter(e => e.fueUtil === 'Parcial').length;
        const utilNo = entries.filter(e => e.fueUtil === 'No').length;
        const utilNeg = utilParcial + utilNo; // Parcial + No = alarmas
        const utilTotal = utilSi + utilNeg;
        const utilRate = utilTotal > 0 ? Math.round((utilSi / utilTotal) * 100) : 0;
        const conComentario = entries.filter(e => e.comentario).length;

        // Agrupar usuarios únicos por email
        const userMap = useMemo(() => {
            const map = {};
            entries.forEach(e => {
                if (!e.email) return;
                if (!map[e.email]) {
                    map[e.email] = { email: e.email, analyses: [], firstSeen: e.date, lastSeen: e.date };
                }
                map[e.email].analyses.push(e);
                if (e.date && (!map[e.email].firstSeen || e.date < map[e.email].firstSeen)) map[e.email].firstSeen = e.date;
                if (e.date && (!map[e.email].lastSeen || e.date > map[e.email].lastSeen)) map[e.email].lastSeen = e.date;
            });
            return map;
        }, [entries]);
        const uniqueUsers = useMemo(() => {
            const users = Object.values(userMap);
            if (userSort === 'analyses') {
                return users.sort((a, b) => b.analyses.length - a.analyses.length || (b.lastSeen || 0) - (a.lastSeen || 0));
            }
            return users.sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
        }, [userMap, userSort]);

        // Engagement: repetición y stickiness
        const engagementData = useMemo(() => {
            const users = Object.values(userMap);
            const total = users.length;
            if (total === 0) return { avgAnalyses: 0, repeatRate: 0, dist1: 0, dist2_3: 0, dist4plus: 0, totalUsers: 0, maxAnalyses: 0, topUser: null };
            const counts = users.map(u => u.analyses.length);
            const avg = counts.reduce((a, b) => a + b, 0) / total;
            const repeaters = counts.filter(c => c >= 2).length;
            const dist1 = counts.filter(c => c === 1).length;
            const dist2_3 = counts.filter(c => c >= 2 && c <= 3).length;
            const dist4plus = counts.filter(c => c >= 4).length;
            const maxVal = Math.max(...counts);
            const topUser = users.find(u => u.analyses.length === maxVal);
            return {
                avgAnalyses: Math.round(avg * 10) / 10,
                repeatRate: Math.round((repeaters / total) * 100),
                dist1, dist2_3, dist4plus,
                totalUsers: total,
                maxAnalyses: maxVal,
                topUser: topUser ? topUser.email : null
            };
        }, [userMap]);

        // Tutoriales: métricas de clicks
        const tutorialData = useMemo(() => {
            const total = entries.length;
            const conSugeridos = entries.filter(e => e.tutorialesSugeridos).length;
            const conClick = entries.filter(e => e.tutorialClickado).length;
            // % de análisis que abrieron el panel de tutoriales (= tienen sugeridos)
            const openRate = total > 0 ? Math.round((conSugeridos / total) * 100) : 0;
            // % de análisis que clickaron un video (de los que abrieron)
            const clickRate = conSugeridos > 0 ? Math.round((conClick / conSugeridos) * 100) : 0;
            return { total, conSugeridos, conClick, openRate, clickRate };
        }, [entries]);

        const generos = [...new Set(entries.map(e => e.genero).filter(Boolean))];
        const generoCounts = countBy(entries.filter(e => e.genero), 'genero');
        // Detalle de "Otros": agrupar generoCustom (texto libre) por conteo,
        // sin agrupar por similaridad — el admin decide qué géneros añadir.
        const otrosCustomCounts = useMemo(() => {
            const counts = {};
            entries.forEach(e => {
                const txt = (e.generoCustom || '').trim();
                if (!txt) return;
                const key = txt.toLowerCase();
                counts[key] = (counts[key] || 0) + 1;
            });
            return Object.entries(counts).sort((a, b) => b[1] - a[1]);
        }, [entries]);
        const experienciaCounts = countBy(entries.filter(e => e.experiencia), 'experiencia');
        const faseCounts = countBy(entries.filter(e => e.fase), 'fase');
        const objetivoCounts = countBy(entries.filter(e => e.objetivo), 'objetivo');
        const dificultadCounts = countBy(entries.filter(e => e.dificultad), 'dificultad');
        // Labels legibles para los IDs internos de diagnóstico
        const DIAG_LABELS = {
            problema_arreglo:    "Problema de arreglo",
            poco_contraste:      "Poco contraste",
            falta_impacto:       "Falta de impacto",
            mezcla_prematura:    "Mezcla prematura",
            exceso_lowend:       "Exceso de graves",
            exceso_densidad:     "Exceso de densidad",
            track_verde:         "Track verde",
            carencia_espectral:  "Carencia espectral",
            conflicto_armonico:  "Conflicto armónico",
            pobreza_armonica:    "Pobreza armónica",
            harshness_mezcla:    "Harshness en mezcla",
            enmascaramiento_bajo:"Enmascaramiento por bajo",
            break_sin_payoff:    "Break sin payoff",
            arreglo_repetitivo:  "Arreglo repetitivo",
            sin_diagnostico:     "Sin diagnóstico",
        };

        // Diagnóstico vs satisfacción: para cada diagnóstico, conteo total + breakdown
        // de respuestas (sí / parcial / no / sin feedback). Los % se calculan sobre el
        // total con feedback (sí+parcial+no), no sobre el total absoluto, para no
        // confundir engagement con satisfacción.
        const diagSatisfaccionData = useMemo(() => {
            const acc = {};
            entries.forEach(e => {
                if (!e.diagPrincipal) return;
                // Extraer ID del paréntesis, ej: "...texto... (harshness_mezcla)" → "harshness_mezcla"
                const m = e.diagPrincipal.match(/\(([^)]+)\)\s*$/);
                const id = m ? m[1].trim() : e.diagPrincipal.slice(0, 40);
                if (!acc[id]) acc[id] = { id, total: 0, si: 0, parcial: 0, no: 0, sinFeedback: 0 };
                acc[id].total++;
                if (e.fueUtil === 'Sí') acc[id].si++;
                else if (e.fueUtil === 'Parcial') acc[id].parcial++;
                else if (e.fueUtil === 'No') acc[id].no++;
                else acc[id].sinFeedback++;
            });
            return Object.values(acc)
                .map(d => {
                    const conFeedback = d.si + d.parcial + d.no;
                    return {
                        ...d,
                        label: DIAG_LABELS[d.id] || d.id,
                        conFeedback,

                    counts[day] = (counts[day] || 0) + 1;
                }

            const days = [];
            for (let d = 1; d <= daysInMonth; d++) {
                days.push({ day: d, count: counts[d] || 0 });
            }
            const maxCount = Math.max(...days.map(d => d.count), 1);
            const totalMonth = days.reduce((sum, d) => sum + d.count, 0);
            return { days, maxCount, totalMonth, daysInMonth };

                                                <div>
                                                    <p className="text-white text-sm font-medium">{user.email}</p>
                                                    <p className="text-gray-500 text-xs">
                                                        {totalAnalyses} {totalAnalyses === 1 ? 'análisis' : 'análisis'}
                                                        {lastGenero ? ` · ${lastGenero}` : ''}
                                                        {lastExperiencia ? ` · ${lastExperiencia}` : ''}
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                {anyTutorialClick && (() => {
                                                    const clickCount = user.analyses.filter(a => a.tutorialClickado).length;
                                                    const totalClicks = user.analyses.reduce((sum, a) => sum + (a.tutorialClickado ? a.tutorialClickado.split(' || ').length : 0), 0);
                                                    return <span className="text-blue-400 text-xs" title={`${totalClicks} video(s) clickado(s) en ${clickCount} análisis`}>🎬 {totalClicks}</span>;
                                                })()}
                                                {anyFeedbackReal && <span className="text-purple-400 text-xs">🎧 Feedback real</span>}
                                                {anyUtil && (
                                                    <span className={`text-xs ${anyUtil.fueUtil === 'Sí' ? 'text-green-400' : anyUtil.fueUtil === 'Parcial' ? 'text-yellow-400' : 'text-red-400'}`}>
                                                        {anyUtil.fueUtil === 'Sí' ? '👍' : anyUtil.fueUtil === 'Parcial' ? '🤔' : '👎'}
                                                    </span>
                                                )}
                                                <span className="text-gray-500 text-xs">{formatDate(user.lastSeen)}</span>
                                                <span className="text-gray-600 text-xs">{isExpanded ? '▲' : '▼'}</span>
                                            </div>
                                        </div>

                                        {/* Expanded: list of analyses */}
                                        {isExpanded && (
                                            <div className="border-t border-gray-800">
                                                {user.analyses.slice().reverse().map((entry, idx) => {
                                                    const estadoEmoji = entry.estadoTrack.includes('temprana') || entry.estadoTrack.includes('verde')
                                                        ? '🔴'
                                                        : entry.estadoTrack.includes('desarrollo') || entry.estadoTrack.includes('amarillo')
                                                        ? '🟡'
                                                        : entry.estadoTrack.includes('pulir') || entry.estadoTrack.includes('avanzado') || entry.estadoTrack.includes('azul')
                                                        ? '🔵' : '⚪';

                                                    return (
                                                        <div key={idx} className="border-t border-gray-800/50">
                                                            <div
                                                                className="px-4 py-3 hover:bg-gray-800/20 cursor-pointer transition-colors flex items-center justify-between"
                                                                onClick={(e) => { e.stopPropagation(); setSelectedEntry(entry); }}
                                                            >
                                                                <div className="flex items-center gap-3">
                                                                    <span className="text-gray-600 text-xs w-5 text-right">#{user.analyses.length - idx}</span>
                                                                    <span className="text-xs">{estadoEmoji}</span>
                                                                    <span className="text-gray-300 text-xs">{entry.genero || 'Sin género'}</span>
                                                                    <span className="text-gray-600 text-xs">·</span>
                                                                    <span className="text-gray-400 text-xs truncate max-w-xs">{entry.diagPrincipal || 'Sin diagnóstico'}</span>
                                                                </div>
                                                                <div className="flex items-center gap-3">
                                                                    {entry.fueUtil && (
                                                                        <span className={`text-xs ${entry.fueUtil === 'Sí' ? 'text-green-400' : entry.fueUtil === 'Parcial' ? 'text-yellow-400' : 'text-red-400'}`}>
                                                                            {entry.fueUtil === 'Sí' ? '👍' : entry.fueUtil === 'Parcial' ? '🤔' : '👎'}
                                                                        </span>
                                                                    )}
                                                                    {entry.comentario && <span className="text-gray-500 text-xs">💬</span>}
                                                                    {entry.enlaceFeedback && <span className="text-purple-400 text-xs">🎧</span>}
                                                                    {entry.tutorialClickado && <span className="text-blue-400 text-xs">🎬 {entry.tutorialClickado.split(' || ').length}</span>}
                                                                    <span className="text-gray-600 text-xs">{formatDate(entry.date)}</span>
                                                                </div>
                                                            </div>
                                                            {(entry.tutorialesSugeridos || entry.tutorialClickado) && (
                                                                <div className="px-4 pb-3 pl-12">
                                                                    {entry.tutorialesSugeridos && entry.tutorialesSugeridos.split(' | ').map((t, ti) => {
                                                                        const titulo = t.trim();
                                                                        const clicked = entry.tutorialClickado && entry.tutorialClickado.includes(titulo);
                                                                        return (
                                                                            <div key={ti} className={`text-xs py-0.5 flex items-center gap-1.5 ${clicked ? 'text-blue-400' : 'text-gray-600'}`}>
                                                                                <span>{clicked ? '▶' : '·'}</span>
                                                                                <span className={clicked ? 'font-medium' : ''}>{titulo.length > 60 ? titulo.substring(0, 60) + '…' : titulo}</span>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                    {entry.tutorialClickado && !entry.tutorialesSugeridos && entry.tutorialClickado.split(' || ').map((t, ti) => (
                                                                        <div key={ti} className="text-xs py-0.5 flex items-center gap-1.5 text-blue-400">
                                                                            <span>▶</span>
                                                                            <span className="font-medium">{t.trim()}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}

                                                {/* User comments summary */}
                                                {lastComment && (
                                                    <div className="px-4 py-3 border-t border-gray-800/50 bg-gray-900/30">
                                                        <p className="text-gray-500 text-xs mb-1">Último comentario:</p>
                                                        <p className="text-gray-300 text-xs italic">"{lastComment.comentario}"</p>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}

                {/* ============ TAB: FEEDBACK ============ */}
                {tab === 'feedback' && (
                    <div className="fade-in">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                            <StatCard label="Respondieron" value={utilTotal} sub={`de ${totalUsers}`} icon="📝" />
                            <StatCard label="Fue útil" value={utilSi} color="#4ade80" icon="👍" />
                            <StatCard label="Parcial / No" value={utilNeg} sub={`${utilParcial} parcial · ${utilNo} no`} color="#f87171" icon="👎" />
                            <StatCard label="Con comentario" value={conComentario} color="#60a5fa" icon="💬" />
                        </div>

                        {/* Comentarios */}
                        <div className="card p-5 mb-6">
                            <h3 className="text-sm font-medium text-gray-300 mb-4">Comentarios de usuarios</h3>
                            <div className="space-y-3">
                                {entries.filter(e => e.comentario).length === 0 && (
                                    <p className="text-gray-500 text-xs">Aún no hay comentarios.</p>
                                )}
                                {entries.filter(e => e.comentario).slice().reverse().map((e, i) => (
                                    <div key={i} className="bg-gray-800/50 rounded-lg p-4">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className={`text-xs ${e.fueUtil === 'Sí' ? 'text-green-400' : e.fueUtil === 'Parcial' ? 'text-yellow-400' : 'text-red-400'}`}>
                                                {e.fueUtil === 'Sí' ? '👍 Útil' : e.fueUtil === 'Parcial' ? '🤔 Parcial' : '👎 No útil'}
                                            </span>
                                            <span className="text-gray-600 text-xs">·</span>
                                            <span className="text-gray-500 text-xs">{e.email}</span>
                                            <span className="text-gray-600 text-xs">·</span>
                                            <span className="text-gray-600 text-xs">{formatDate(e.date)}</span>
                                        </div>
                                        <p className="text-gray-300 text-sm">"{e.comentario}"</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Solicitudes de feedback real */}
                        <div className="card p-5">
                            <h3 className="text-sm font-medium text-gray-300 mb-4">Solicitudes de feedback real ({feedbackReal})</h3>
                            <div className="space-y-2">
                                {entries.filter(e => e.enlaceFeedback).length === 0 && (
                                    <p className="text-gray-500 text-xs">Aún no hay solicitudes.</p>
                                )}
                                {entries.filter(e => e.enlaceFeedback).slice().reverse().map((e, i) => (
                                    <div key={i} className="bg-gray-800/50 rounded-lg p-3 flex items-center justify-between">
                                        <div>
                                            <span className="text-gray-300 text-sm">{e.email}</span>
                                            <span className="text-gray-600 text-xs ml-2">{e.genero} · {formatDate(e.date)}</span>
                                        </div>
                                        <a href={e.enlaceFeedback} target="_blank" rel="noopener" className="text-purple-400 text-xs hover:underline">Abrir enlace</a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

                {/* ============ TAB: MOTOR (telemetría) ============ */}
                {tab === 'motor' && (
                    <MotorTab entries={entries} diagLabels={DIAG_LABELS} />
                )}

                {/* ============ TAB: AUDITORÍAS (solicitudes consultoría) ============ */}
                {tab === 'auditorias' && (
                    <AuditoriasTab />
                )}

                {/* ============ TAB: EMBUDO (CTA conversion funnel) ============ */}
                {tab === 'embudo' && (
                    <EmbudoTab />
                )}

                {/* ============ TAB: ENCUESTA (respuestas en tiempo real) ============ */}
                {tab === 'encuesta' && (
                    <EncuestaTab />
                )}

                {/* Detail Modal */}
                <DetailModal entry={selectedEntry} onClose={() => setSelectedEntry(null)} />
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
    </script>

    <script>
    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw-admin.js', { scope: '/dashboard' })
                .then(reg => console.log('[PWA] SW registrado:', reg.scope))
                .catch(err => console.warn('[PWA] SW falló:', err));
        });
    }
    </script>
</body>
</html>
