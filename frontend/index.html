    <style>
        @font-face {
            font-family: 'Termina';
            src: url('Termina-Demi.woff2') format('woff2'),
                 url('Termina-Demi.woff') format('woff');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --po-dark: #2C2C2C;
            --po-medium: #4C4C4C;
            --po-light: #BCBCBC;
            --po-white: #FFFFFF;
            --po-green: #25F464;
            --po-purple: #6D10FF;
            --po-bg: #1a1a1a;
            --po-card: #242424;
            --po-border: #3a3a3a;
        }
        body { font-family: 'Arimo', sans-serif; background: var(--po-bg); color: var(--po-light); }
        h1, h2, h3, .font-heading { font-family: 'Termina', sans-serif; letter-spacing: -0.01em; }

        .drop-zone.active { border-color: var(--po-green); background: rgba(37, 244, 100, 0.04); }
        .drop-zone:hover { border-color: var(--po-purple); background: rgba(109, 16, 255, 0.03); }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        input[type="range"] { -webkit-appearance: none; background: var(--po-medium); height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--po-purple); border-radius: 50%; cursor: pointer; }
        .card { background: var(--po-card); border: 1px solid var(--po-border); border-radius: 12px; }
        .badge-verde { background: rgba(248,113,113,0.1); color: #f87171; }
        .badge-desarrollo { background: rgba(250,204,21,0.1); color: #facc15; }
        .badge-avanzado { background: rgba(96,165,250,0.1); color: #60a5fa; }
        .btn-primary { background: var(--po-purple); color: var(--po-white); transition: all 0.2s; }
        .btn-primary:hover { background: #5a0dd6; }
        .btn-primary:disabled { background: var(--po-medium); color: #777; cursor: not-allowed; }
        .btn-secondary { background: var(--po-dark); color: var(--po-light); border: 1px solid var(--po-border); transition: all 0.2s; }
        .btn-secondary:hover { background: var(--po-medium); }
        .input-field { background: var(--po-dark); border: 1px solid var(--po-border); color: var(--po-white); }
        .input-field:focus { outline: none; border-color: var(--po-purple); }

        .accent-purple { color: var(--po-purple); }

        .wave-bg::before {

            position: absolute;

            left: -10%;

            color: #F2F2F2;

            width: .7em;
            height: .7em;
            transform: translateY(.06em);

        .mt-logo .mt-ring { fill: none; stroke: currentColor; stroke-width: 5; }

            stroke-width: 5;

<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const API_URL = window.location.hostname === 'localhost'
        ? 'http://localhost:8000'
        : '';

    // =========================================================================
    // Componentes de UI
    // =========================================================================

    function SelectField({ label, options, value, onChange, name }) {
        return (
            <div className="mb-5">
                <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>{label}</label>
                <div className="grid grid-cols-2 gap-2">
                    {options.map(opt => (
                        <button
                            key={opt.value}
                            type="button"
                            onClick={() => onChange(name, opt.value)}
                            className={`px-3 py-2.5 rounded-lg text-sm text-left transition-all ${
                                value === opt.value ? 'opt-selected' : 'opt-default'
                            }`}
                        >
                            {opt.label}
                        </button>
                    ))}
                </div>
            </div>
        );
    }

    function TextInput({ label, value, onChange, name, placeholder, maxLength }) {
        return (
            <div className="mb-5">
                <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>{label}</label>
                <input
                    type="text"
                    value={value}
                    onChange={(e) => onChange(name, e.target.value)}
                    placeholder={placeholder}
                    maxLength={maxLength || 200}
                    className="w-full px-4 py-3 rounded-lg text-sm input-field"
                />
            </div>
        );
    }

    // =========================================================================
    // Pantallas
    // =========================================================================

    // =========================================================================
    // Historial (localStorage)
    // =========================================================================

    const HISTORIAL_KEY = 'mentotrack_historial';

    function guardarEnHistorial(filename, contexto, resultado, proyecto) {
        const historial = JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
        const da = resultado.datos_audio || {};
        historial.unshift({
            id: Date.now(),
            fecha: new Date().toISOString(),
            archivo: filename,
            proyecto: (proyecto || filename || '').trim().toLowerCase(),
            genero: contexto.genero,
            objetivo: contexto.objetivo,
            diagnostico: resultado.diagnostico_principal?.titulo || 'Sin diagnóstico',
            diagnostico_id: resultado.diagnostico_principal?.id || '',
            diagnostico_secundario_id: resultado.diagnostico_secundario?.id || null,
            estado: resultado.estado_track,
            estado_texto: resultado.estado_texto,
            score: resultado.diagnostico_principal?.score || 0,
            // Scores completos para comparación de progreso
            scores: resultado.scores || {},
            // Datos de audio clave para evolución
            lufs: da.loudness?.lufs_integrado ?? null,
            densidad: da.densidad || null,
            balance_grave: da.balance_grave || null,
            bpm: da.bpm || null,
            mono_nivel: da.mono_compat?.nivel_compatibilidad || null,
            harshness_nivel: da.harshness?.nivel || null,
        });
        // Máximo 50 entradas
        if (historial.length > 50) historial.length = 50;
        localStorage.setItem(HISTORIAL_KEY, JSON.stringify(historial));
    }

    function obtenerHistorial() {
        return JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
    }

    function borrarEntradaHistorial(id) {
        const historial = obtenerHistorial().filter(e => e.id !== id);
        localStorage.setItem(HISTORIAL_KEY, JSON.stringify(historial));
        return historial;
    }

    function HistorialScreen({ onBack, onAnalizar }) {
        const [entradas, setEntradas] = useState(obtenerHistorial());

        const handleBorrar = (id) => {
            setEntradas(borrarEntradaHistorial(id));
        };

        const formatFecha = (iso) => {
            const d = new Date(iso);
            return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        const estadoColor = (estado) => {
            if (estado === 'verde') return 'bg-red-900/30 text-red-400';
            if (estado === 'avanzado') return 'bg-blue-900/30 text-blue-400';
            return 'bg-yellow-900/30 text-yellow-400';
        };

        return (
            <div className="min-h-screen px-6 py-8 fade-in">
                <div className="max-w-2xl mx-auto">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-xl font-bold text-white">Historial de análisis</h2>
                        <button onClick={onBack} className="text-gray-500 hover:text-gray-300 text-sm transition-colors">
                            ← Volver
                        </button>
                    </div>

                    {entradas.length === 0 ? (
                        <div className="text-center py-16">
                            <div className="text-3xl mb-3" style={{color: 'var(--po-medium)'}}>—</div>
                            <p className="text-gray-500 mb-4">Aún no has analizado ningún track.</p>
                            <button
                                onClick={onAnalizar}
                                className="px-6 py-3 btn-primary rounded-xl transition-colors"
                            >
                                Analizar mi primer track
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {entradas.map(e => (
                                <div key={e.id} className="card p-4 flex items-center justify-between gap-4">
                                    <div className="flex-1 min-w-0">
                                        <p className="text-gray-200 text-sm font-medium truncate">{e.archivo}</p>
                                        <p className="text-gray-500 text-xs mt-1">{formatFecha(e.fecha)}</p>
                                    </div>
                                    <div className="flex items-center gap-3 flex-shrink-0">
                                        <span className={`text-xs px-2 py-1 rounded-full ${estadoColor(e.estado)}`}>
                                            {e.estado_texto || e.estado}
                                        </span>
                                        <span className="text-gray-400 text-xs max-w-[140px] truncate hidden sm:block" title={e.diagnostico}>
                                            {e.diagnostico}
                                        </span>
                                        <button
                                            onClick={() => handleBorrar(e.id)}
                                            className="text-gray-600 hover:text-red-400 text-xs transition-colors"
                                            title="Eliminar"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>
                            ))}
                            <p className="text-gray-600 text-xs text-center pt-2">
                                {entradas.length} análisis guardados en este navegador
                            </p>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    // =========================================================================
    // Pantallas
    // =========================================================================

    // Mentotrack Wordmark component with knob
    function MentoLogo({ size = 72 }) {
        return (
            <span className="mt-logo" style={{fontSize: size + 'px'}}>
                ment<span className="mt-knob"><svg viewBox="0 0 62 62">
                    <circle className="mt-ring" cx="31" cy="31" r="24"/>
                    <line className="mt-tick" x1="31" y1="31" x2="31" y2="10"/>
                </svg></span>track
            </span>
        );
    }

    // Keep old logo for small icon uses
    function MentotrackLogo({ size = 48 }) {
        return (
            <svg width={size} height={size} viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 38V10h6l8 14 8-14h6v28h-6V20.5L19.5 33h-3L10 20.5V38H4z" fill="currentColor"/>
                <path d="M2 26c3-3 5-5 8-2s5 5 8 2 5-5 8-2 5 5 8 2 5-5 8-2 3 1 4 2" stroke="#25F464" strokeWidth="2.5" strokeLinecap="round" fill="none"/>
            </svg>
        );
    }

    function LandingScreen({ onFileSelected, onHistorial, historialCount }) {
        const [isDragging, setIsDragging] = useState(false);
        const [file, setFile] = useState(null);
        const inputRef = useRef(null);

        const handleDrop = (e) => {
            e.preventDefault();
            setIsDragging(false);
            const f = e.dataTransfer.files[0];
            if (f) { setFile(f); onFileSelected(f); }
        };

        const handleChange = (e) => {
            const f = e.target.files[0];
            if (f) { setFile(f); onFileSelected(f); }
        };

        return (
            <div className="min-h-screen flex items-center justify-center px-6 sm:px-8 fade-in wave-bg">
                <div className="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16 items-center">
                    {/* Left column — branding + text */}
                    <div>
                        <div className="mb-6">
                            <MentoLogo size={72} />
                        </div>
                        <p className="text-lg mb-3" style={{color: 'var(--po-white)', lineHeight: '1.5'}}>
                            Detecta qué debería corregirse antes, qué no conviene tocar todavía
                            y cuál es el siguiente paso para avanzar con tu track.
                        </p>
                        <p className="text-sm mb-6" style={{color: 'var(--po-light)'}}>
                            No te damos más información. Te damos dirección.
                        </p>
                        <div className="flex items-center gap-4">
                            <span className="text-xs px-3 py-1.5 rounded-full" style={{background: 'rgba(37,244,100,0.1)', color: 'var(--po-green)', border: '1px solid rgba(37,244,100,0.2)'}}>WAV</span>
                            <span className="text-xs px-3 py-1.5 rounded-full" style={{background: 'rgba(37,244,100,0.1)', color: 'var(--po-green)', border: '1px solid rgba(37,244,100,0.2)'}}>MP3</span>
                            <span className="text-xs px-3 py-1.5 rounded-full" style={{background: 'rgba(37,244,100,0.1)', color: 'var(--po-green)', border: '1px solid rgba(37,244,100,0.2)'}}>FLAC</span>
                            <span className="text-xs px-3 py-1.5 rounded-full" style={{background: 'rgba(37,244,100,0.1)', color: 'var(--po-green)', border: '1px solid rgba(37,244,100,0.2)'}}>AIFF</span>
                        </div>
                        {historialCount > 0 && (
                            <button
                                onClick={onHistorial}
                                className="mt-6 text-sm transition-colors"
                                style={{color: 'var(--po-light)'}}
                                onMouseOver={(e) => e.target.style.color = 'var(--po-white)'}
                                onMouseOut={(e) => e.target.style.color = 'var(--po-light)'}
                            >
                                Ver historial ({historialCount})
                            </button>
                        )}
                    </div>

                    {/* Right column — drop zone */}
                    <div>
                        <div
                            className={`drop-zone rounded-xl p-12 text-center cursor-pointer ${isDragging ? 'active' : ''}`}
                            style={{minHeight: '280px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}
                            onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                            onDragLeave={() => setIsDragging(false)}
                            onDrop={handleDrop}
                            onClick={() => inputRef.current?.click()}
                        >
                            <input
                                ref={inputRef}
                                type="file"
                                accept=".mp3,.wav,.flac,.aiff,.aif,.ogg"
                                onChange={handleChange}
                                className="hidden"
                            />
                            {file ? (
                                <div>
                                    <div className="mb-3">
                                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#25F464" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{margin: '0 auto'}}>
                                            <path d="M20 6L9 17l-5-5"/>
                                        </svg>
                                    </div>
                                    <p className="font-medium" style={{color: 'var(--po-white)'}}>{file.name}</p>
                                    <p className="text-sm mt-1" style={{color: 'var(--po-light)'}}>
                                        {(file.size / 1024 / 1024).toFixed(1)} MB
                                    </p>
                                </div>
                            ) : (
                                <div>
                                    <div className="mb-4" style={{color: 'var(--po-medium)'}}>
                                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{margin: '0 auto'}}>
                                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                            <polyline points="17 8 12 3 7 8"/>
                                            <line x1="12" y1="3" x2="12" y2="15"/>
                                        </svg>
                                    </div>
                                    <p style={{color: 'var(--po-light)'}}>
                                        Arrastra tu archivo aquí
                                    </p>
                                    <p className="text-sm mt-2" style={{color: 'var(--po-medium)'}}>
                                        o haz clic para seleccionar
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    function QuestionnaireScreen({ opciones, contexto, onChange, onSubmit, isValid, nombreProyecto, onNombreChange }) {
        return (
            <div className="min-h-screen flex flex-col items-center py-12 px-6 fade-in">
                <div className="max-w-lg w-full">
                    <h2 className="text-2xl font-bold mb-1" style={{color: 'var(--po-white)'}}>Cuéntanos sobre tu track</h2>
                    <p className="text-sm mb-8" style={{color: 'var(--po-light)'}}>
                        Esto nos ayuda a no interpretar el audio a ciegas.
                    </p>

                    <div className="mb-5">
                        <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>Nombre del proyecto</label>
                        <input
                            type="text"
                            value={nombreProyecto}
                            onChange={(e) => onNombreChange(e.target.value)}
                            placeholder="Ej.: El nombre de tu track v1"
                            className="w-full px-4 py-3 rounded-lg text-sm input-field"
                        />
                    </div>

                    <SelectField
                        label="¿Qué género estás produciendo?"
                        options={opciones.generos}
                        value={contexto.genero}
                        onChange={onChange}
                        name="genero"
                    />

                    <SelectField
                        label="¿En qué fase crees que está el track?"
                        options={opciones.fases}
                        value={contexto.fase}
                        onChange={onChange}
                        name="fase"
                    />

                    <SelectField
                        label="¿Cuál es tu objetivo con este track?"
                        options={opciones.objetivos}
                        value={contexto.objetivo}
                        onChange={onChange}
                        name="objetivo"
                    />

                    <TextInput
                        label="¿Qué crees que no funciona?"
                        value={contexto.bloqueo_percibido}
                        onChange={onChange}
                        name="bloqueo_percibido"
                        placeholder="Ej: suena repetitivo, no me convence el drop, la mezcla está turbia..."
                    />

                    <SelectField
                        label="¿Cuánto tiempo llevas produciendo?"
                        options={opciones.experiencia}
                        value={contexto.experiencia}
                        onChange={onChange}

    function ProcessingScreen({ datos }) {
        const steps = [
            "Cargando audio...",
            `${datos?.bpm ? datos.bpm + ' BPM detectados' : 'Detectando tempo...'}`,
            "Analizando distribución de energía...",
            "Evaluando balance espectral...",
            "Cruzando con tu contexto...",
            "Generando diagnóstico..."
        ];
        const [currentStep, setCurrentStep] = useState(0);

        useEffect(() => {
            const interval = setInterval(() => {
                setCurrentStep(prev => prev < steps.length - 1 ? prev + 1 : prev);
            }, 800);
            return () => clearInterval(interval);
        }, []);

        return (
            <div className="min-h-screen flex flex-col items-center justify-center px-6 fade-in">

                    <div className="space-y-3">
                        {steps.map((step, i) => (
                            <p
                                key={i}
                                className={`text-sm transition-all duration-300 ${

                                } ${i === currentStep ? 'text-white font-medium' : ''}`}

                    </div>
                </div>
            </div>

                                                        )}
                                                        <div className="p-4">
                                                            <h4 className="text-white text-sm font-medium leading-snug mb-1">{tut.titulo}</h4>
                                                            <p className="text-gray-500 text-xs leading-relaxed">{tut.descripcion}</p>
                                                        </div>
                                                    </a>
                                                );
                                            })}
                                        </>
                                    )}

                                    {/* CTA canal */}
                                    <div className="text-center pt-4 pb-2">
                                        <a
                                            href="https://www.youtube.com/@Prodonline"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="text-purple-400 hover:text-purple-300 text-xs transition-colors"
                                            onClick={() => trackEvent('tutorial_canal_clicked', { diagnostico: diagId })}
                                        >
                                            Ver más en Producción Online →
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer privacidad */}
                    <div className="text-center mb-8">
                        <p className="text-gray-600 text-xs">Mentotrack no almacena el archivo de tu canción, solo los datos extraídos tras el análisis.</p>
                    </div>
                </div>
            </div>
        );
    }

    // =========================================================================
    // App principal
    // =========================================================================

    // =========================================================================
    // Token helpers
    // =========================================================================
    const TOKEN_KEY = 'mentotrack_token';
    const TOKEN_EMAIL_KEY = 'mentotrack_email';

    function saveAuth(email, token) {
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(TOKEN_EMAIL_KEY, email);
    }
    function getAuth() {
        return { email: localStorage.getItem(TOKEN_EMAIL_KEY) || '', token: localStorage.getItem(TOKEN_KEY) || '' };
    }
    function clearAuth() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(TOKEN_EMAIL_KEY);
    }
    function authHeaders() {
        const { token } = getAuth();
        const h = { 'Content-Type': 'application/json' };
        if (token) h['Authorization'] = `Bearer ${token}`;
        return h;
    }

        // Cargar opciones al inicio
        useEffect(() => {

        const handleFileSelected = (f) => {
            setFile(f);
            setScreen('questionnaire');
            trackEvent('funnel_file_uploaded', {
                file_type: f.name.split('.').pop().toLowerCase(),
