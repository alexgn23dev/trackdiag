            setAsignandoId(analisisId);
            try {
                const r = await fetch(`${API_URL}/api/analisis/${analisisId}/asignar-proyecto`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ proyecto_id: proyectoId }),
                });
                if (r.ok) {
                    refreshPanelProyectos();
                    refreshPanelHistorial();
                    // Limpiar selector para esa fila.
                    setProyectoTarget(prev => {
                        const next = {...prev};
                        delete next[analisisId];
                        return next;
                    });
                }
            } finally {
                setAsignandoId(null);
            }
        };

        const loadProyectoDetalle = (proyectoId) => {
            setPanelView('detalle');
            setPanelProyectoActivo(null);
            setPanelExpandedVersion(null);
            fetch(`${API_URL}/api/proyectos/${proyectoId}`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (data && data.proyecto) setPanelProyectoActivo(data);
                })
                .catch(() => {});
        };

        const goBackToProyectos = () => {
            setPanelView('proyectos');
            setPanelProyectoActivo(null);
            setPanelExpandedVersion(null);
        };

        // Normaliza una fila de análisis (sea row del historial panel o versión
        // de proyecto) en los mismos campos parseados que usa la tarjeta rica.
        const parseAnalisisRow = (row) => {
            const diag = row.diagnostico || '';
            let genero = '', fase = '', objetivo = '';
            if (typeof row.formulario === 'string') {
                const parts = row.formulario.split(' | ').map(p => p.trim());
                genero = parts[0] || '';
                fase = parts[1] || '';
                objetivo = parts[2] || '';
            } else if (row.formulario && typeof row.formulario === 'object') {
                genero = row.formulario.genero || '';
                fase = row.formulario.fase || '';
                objetivo = row.formulario.objetivo || '';
            }
            // Helper: lee una línea con prefijo "LABEL:" del texto diag.
            const lineField = (label) => {
                const re = new RegExp('^' + label + ':\\s*(.+)$', 'im');
                const m = diag.match(re);
                return m ? m[1].trim() : '';
            };
            const estado = lineField('ESTADO');
            const diagPrincipalRaw = lineField('DIAGN[ÓO]STICO PRINCIPAL');
            const diagPrincipal = diagPrincipalRaw.replace(/\s*\([^)]*\)\s*$/, '');
            const explicacion = lineField('Explicación');
            const prioRaw = lineField('PRIORIDADES');
            const prioridades = prioRaw
                ? prioRaw.split(' | ').map(p => p.replace(/^\d+\.\s*/, '').trim()).filter(Boolean)
                : [];
            const notaContextual = lineField('NOTA CONTEXTUAL');
            const motivacion = lineField('MOTIVACIÓN');
            const tipObjetivo = lineField('TIP OBJETIVO');
            const siguienteSesion = lineField('SIGUIENTE SESIÓN');
            const referenciaTemporal = lineField('REFERENCIA TEMPORAL');
            const balanceGrave = lineField('Balance grave');
            const densidad = lineField('Densidad');
            const loudnessLine = lineField('Loudness');
            const monoCompatLine = lineField('Mono compat');
            const harshnessLine = lineField('Harshness');
            const bpmMatch = diag.match(/BPM:\s*(\d+)/);
            const bpm = bpmMatch ? bpmMatch[1] : '';
            const durMatch = diag.match(/Duración:\s*(.+)/);
            const duracion = durMatch ? durMatch[1].trim().split(/\s*\|\s*|\n/)[0] : '';
            const lufsMatch = diag.match(/([-\d.]+)\s*LUFS/);
            const lufs = lufsMatch ? lufsMatch[1] : '';
            const fueUtil = row.fue_util || '';
            const comentario = row.comentario || '';
            const enlace = row.feedback_real || row.enlace_feedback_real || '';
            const est = estado.toLowerCase();
            const semaforo = est.includes('temprana') || est.includes('verde')
                ? { emoji: '🔴', color: '#f87171', bg: 'rgba(248,113,113,0.08)', border: '#7f1d1d', label: 'Fase temprana' }
                : est.includes('pulir') || est.includes('avanzado') || est.includes('azul')
                ? { emoji: '🔵', color: '#60a5fa', bg: 'rgba(96,165,250,0.08)', border: '#1e3a5f', label: 'Listo para pulir' }
                : { emoji: '🟡', color: '#facc15', bg: 'rgba(250,204,21,0.08)', border: '#713f12', label: 'En desarrollo' };
            return {
                diag, genero, fase, objetivo, estado, diagPrincipal, explicacion, prioridades,
                bpm, duracion, lufs, fueUtil, comentario, enlace, semaforo,
                notaContextual, motivacion, tipObjetivo, siguienteSesion, referenciaTemporal,
                balanceGrave, densidad, loudnessLine, monoCompatLine, harshnessLine,
            };
        };

        // Renderiza el "Diagnóstico completo" formateado en tarjetas (no <pre>).
        // Toma el row ya parseado y reproduce la estética de la pantalla original
        // de diagnóstico, hasta donde nos llega la información guardada en texto.
        const renderDiagnosticoCompleto = (parsed) => {
            const {
                diagPrincipal, explicacion, prioridades,
                notaContextual, motivacion, tipObjetivo, siguienteSesion, referenciaTemporal,
                balanceGrave, densidad, loudnessLine, monoCompatLine, harshnessLine,
                bpm, duracion, semaforo, estado,
            } = parsed;
            // Helper: color para el valor de una métrica de mezcla.
            const metricColor = (val, good, warn) => {
                const v = (val || '').toLowerCase();
                if (good.some(g => v.includes(g))) return 'accent-green';
                if (warn.some(w => v.includes(w))) return 'text-yellow-400';
                return 'text-red-400';
            };
            return (
                <div className="mt-3 space-y-3">
                    {/* Estado */}
                    {estado && (
                        <div className="rounded-lg px-4 py-3"
                             style={{ background: semaforo.bg, border: `1px solid ${semaforo.border}` }}>
                            <div className="flex items-center gap-2">
                                <span>{semaforo.emoji}</span>
                                <span className="text-sm" style={{ color: semaforo.color }}>{estado}</span>
                            </div>
                        </div>
                    )}
                    {/* Diagnóstico principal + explicación */}
                    {diagPrincipal && (
                        <div className="rounded-lg p-4" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.15)' }}>
                            <p className="text-gray-500 text-xs uppercase tracking-wider mb-2">Diagnóstico principal</p>
                            <p className="text-orange-400 text-sm font-medium">{diagPrincipal}</p>
                            {explicacion && <p className="text-gray-300 text-xs mt-2 leading-relaxed">{explicacion}</p>}
                        </div>
                    )}
                    {/* Nota contextual + motivación + referencia temporal */}
                    {(notaContextual || motivacion || referenciaTemporal) && (
                        <div className="rounded-lg p-4 bg-gray-900/40" style={{borderLeft: '3px solid var(--po-purple)'}}>
                            {motivacion && (
                                <p className="text-purple-300 text-sm font-medium mb-2">{motivacion}</p>
                            )}
                            {notaContextual && (
                                <p className="text-gray-300 text-sm leading-relaxed">{notaContextual}</p>
                            )}
                            {referenciaTemporal && (
                                <p className="text-gray-500 text-xs mt-3">{referenciaTemporal}</p>
                            )}
                        </div>
                    )}
                    {/* Prioridades */}
                    {prioridades.length > 0 && (
                        <div className="rounded-lg p-4 bg-gray-900/40">
                            <p className="text-xs accent-green font-medium uppercase tracking-wider mb-3">Prioridades</p>
                            <div className="space-y-2">
                                {prioridades.map((p, i) => (
                                    <div key={i} className="flex gap-2 items-start">
                                        <span className="flex-shrink-0 w-5 h-5 rounded-full bg-green-900 accent-green flex items-center justify-center text-xs font-bold">{i + 1}</span>
                                        <p className="text-gray-300 text-xs leading-relaxed pt-0.5">{p}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {/* Tip según objetivo */}
                    {tipObjetivo && (
                        <div className="rounded-lg p-4 bg-gray-900/40" style={{borderLeft: '3px solid #f59e0b'}}>
                            <p className="text-xs text-yellow-500 font-medium uppercase tracking-wider mb-2">Según tu objetivo</p>
                            <p className="text-gray-300 text-sm leading-relaxed">{tipObjetivo}</p>
                        </div>
                    )}
                    {/* Siguiente sesión */}
                    {siguienteSesion && (
                        <div className="rounded-lg p-4 bg-gray-900/40 border border-purple-900/40">
                            <p className="text-xs accent-purple font-medium uppercase tracking-wider mb-2">Tu próxima sesión</p>
                            <p className="text-white text-sm leading-relaxed">{siguienteSesion}</p>
                        </div>
                    )}
                    {/* Mezcla */}
                    {(balanceGrave || densidad || loudnessLine || monoCompatLine || harshnessLine || bpm || duracion) && (
                        <div className="rounded-lg p-4 bg-gray-900/40">
                            <p className="text-xs text-gray-400 font-medium uppercase tracking-wider mb-3">Mezcla</p>
                            <div className="space-y-2 text-sm">
                                {(bpm || duracion) && (
                                    <div className="flex flex-wrap gap-2 mb-2">
                                        {bpm && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{bpm} BPM</span>}
                                        {duracion && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{duracion}</span>}
                                    </div>
                                )}
                                {balanceGrave && (
                                    <div className="flex justify-between items-baseline">
                                        <span className="text-gray-400 text-xs">Balance grave</span>
                                        <span className={`text-xs ${metricColor(balanceGrave, ['normal'], ['elevado'])}`}>{balanceGrave}</span>
                                    </div>
                                )}
                                {densidad && (
                                    <div className="flex justify-between items-baseline">
                                        <span className="text-gray-400 text-xs">Densidad</span>
                                        <span className={`text-xs ${metricColor(densidad, ['baja','media'], ['alta'])}`}>{densidad}</span>
                                    </div>
                                )}
                                {loudnessLine && (
                                    <div>
                                        <span className="text-gray-400 text-xs">Loudness:</span>
                                        <span className="text-gray-300 text-xs ml-2">{loudnessLine}</span>
                                    </div>
                                )}
                                {monoCompatLine && (
                                    <div>
                                        <span className="text-gray-400 text-xs">Mono compat:</span>
                                        <span className="text-gray-300 text-xs ml-2">{monoCompatLine}</span>
                                    </div>
                                )}
                                {harshnessLine && (
                                    <div>
                                        <span className="text-gray-400 text-xs">Harshness:</span>
                                        <span className="text-gray-300 text-xs ml-2">{harshnessLine}</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Bloque expandido reutilizable (estado + diagnóstico + prioridades + datos + feedback + ver completo).
        const renderRichDetail = (parsed) => {
            const { diag, estado, semaforo, diagPrincipal, explicacion, prioridades,
                    genero, fase, objetivo, bpm, lufs, duracion, fueUtil, comentario, enlace } = parsed;
            return (
                <div className="border-t border-gray-800 fade-in">
                    <div className="px-4 py-3">
                        <div className="px-4 py-3 rounded-lg" style={{ background: semaforo.bg, border: `1px solid ${semaforo.border}` }}>
                            <span className="text-sm" style={{ color: semaforo.color }}>{estado || semaforo.label}</span>
                        </div>
                    </div>
                    {diagPrincipal && (
                        <div className="px-4 pb-3">
                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Diagnóstico principal</p>
                            <div className="rounded-lg p-3" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.15)' }}>
                                <p className="text-orange-400 text-sm font-medium">{diagPrincipal}</p>
                                {explicacion && <p className="text-gray-300 text-xs mt-2 leading-relaxed">{explicacion}</p>}
                            </div>
                        </div>
                    )}
                    {prioridades.length > 0 && (
                        <div className="px-4 pb-3">
                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Prioridades</p>
                            <div className="space-y-1.5">
                                {prioridades.map((p, i) => (
                                    <div key={i} className="flex items-start gap-2">
                                        <span className="flex-shrink-0 w-5 h-5 rounded-full bg-purple-900/40 accent-purple text-xs flex items-center justify-center font-medium">{i+1}</span>
                                        <p className="text-gray-300 text-xs leading-relaxed pt-0.5">{p}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    <div className="px-4 pb-3">
                        <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Datos</p>
                        <div className="flex flex-wrap gap-2">
                            {genero && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{genero}</span>}
                            {fase && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{fase}</span>}
                            {objetivo && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{objetivo}</span>}
                            {bpm && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{bpm} BPM</span>}
                            {lufs && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{lufs} LUFS</span>}
                            {duracion && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{duracion}</span>}
                        </div>
                    </div>
                    {(fueUtil || comentario || enlace) && (
                        <div className="px-4 pb-4">
                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Feedback</p>
                            {fueUtil && <p className="text-gray-400 text-xs mb-1">¿Fue útil? <span className={fueUtil === 'Sí' ? 'accent-green' : 'text-red-400'}>{fueUtil}</span></p>}
                            {comentario && <p className="text-gray-400 text-xs italic mb-1">"{comentario}"</p>}
                            {enlace && <div className="mt-1"><span className="accent-purple text-xs">🎧 Feedback real solicitado</span></div>}
                        </div>
                    )}
                    <div className="px-4 pb-4">
                        <details className="group">
                            <summary className="text-gray-500 text-xs cursor-pointer hover:text-gray-300 transition-colors">Ver diagnóstico completo</summary>
                            {renderDiagnosticoCompleto(parsed)}
                        </details>
                    </div>
                </div>
            );
        };

        // Devuelve una lista de 6 ítems concretos de salud de la mezcla, cada uno
        // pasado o pendiente, con su detalle. Sin números opacos: el usuario ve
        // exactamente qué falta para que cada ítem pase.
        //
        // Cada item: {label, passed: bool|null, detail}
        //   passed=null si el dato no está disponible (versión legacy / parseable).
        const computeChecklist = (v) => {
            const s = (v && v.senales) || {};
            const diag = (v && v.diagnostico) || '';
            const num = (x) => {
                const n = typeof x === 'number' ? x : parseFloat(x);
                return isNaN(n) ? null : n;
            };
            // Helper para extraer línea "LABEL: valor" del texto del diagnóstico.
            const lineField = (label) => {
                const re = new RegExp('^' + label + ':\\s*([^\\n|]+)', 'im');
                const m = diag.match(re);
                return m ? m[1].trim() : '';
            };
            // Item 1: Balance grave en rango
            const balance = lineField('Balance grave').toLowerCase();
            const balanceOk = balance === 'normal' ? true : (balance ? false : null);
            // Item 2: Sin brillo agresivo
            const h = num(s.harshness_pct);
            const harshOk = h === null ? null : h <= 18;
            // Item 3: Loudness en rango masterizable
            const lufs = num(s.lufs_integrado);
            const lufsOk = lufs === null ? null : (lufs <= -6 && lufs >= -22);
            // Item 4: Densidad sana
            const dens = lineField('Densidad').toLowerCase();
            const densOk = (dens === 'baja' || dens === 'media') ? true : (dens ? false : null);
            // Item 5: Compatibilidad mono
            const mono = lineField('Mono compat').toLowerCase();
            const monoOk = (mono === 'excelente' || mono === 'buena') ? true : (mono ? false : null);
            // Item 6: Estructura y aporte sólidos (catch-all de diagnósticos
            // estructurales/de capas/arreglos con severidad ≥ 2).
            const STRUCT_DIAG_IDS = new Set([
                'poco_contraste', 'problema_arreglo', 'mezcla_prematura',
                'carencia_espectral', 'pobreza_armonica', 'falta_impacto',
                'conflicto_armonico',
            ]);
            let structFailing = [];
            if (s.scores && typeof s.scores === 'object') {
                for (const [k, val] of Object.entries(s.scores)) {
                    const nv = typeof val === 'number' ? val : parseFloat(val);
                    if (!isNaN(nv) && nv >= 2 && STRUCT_DIAG_IDS.has(k)) {
                        structFailing.push(k);
                    }
                }
            }
            const structOk = structFailing.length === 0;

            return [
                { label: 'Mezcla balanceada en graves', passed: balanceOk,
                  detail: balance ? balance : 'sin datos' },
                { label: 'Sin brillo agresivo', passed: harshOk,
                  detail: h === null ? 'sin datos' : `${Math.round(h)}% de frames` },
                { label: 'Loudness apto para masterizar', passed: lufsOk,
                  detail: lufs === null ? 'sin datos' : `${lufs.toFixed(1)} LUFS` },
                { label: 'Densidad espectral sana', passed: densOk,
                  detail: dens ? dens : 'sin datos' },
                { label: 'Buena compatibilidad mono', passed: monoOk,
                  detail: mono ? mono : 'sin datos' },
                { label: 'Estructura, capas y arreglo sólidos', passed: structOk,
                  detail: structOk ? 'sin diagnósticos pendientes'
                                   : `${structFailing.length} ${structFailing.length === 1 ? 'aspecto pendiente' : 'aspectos pendientes'}` },
            ];
        };

        // Resumen del checklist: "N/6 puntos cubiertos".
        const checklistSummary = (items) => {
            const total = items.length;
            const ok = items.filter(i => i.passed === true).length;
            return { ok, total };
        };

        // Cambios significativos entre dos versiones: transiciones de items del
        // checklist (que pasaron / dejaron de pasar) + matices perceptivos en
        // métricas continuas (LUFS, dinámica).
        const describePerceptualDeltas = (vAnt, vAct) => {
            const out = [];
            // 1) Transiciones del checklist (lo más relevante).
            const itemsAnt = computeChecklist(vAnt);
            const itemsAct = computeChecklist(vAct);
            for (let i = 0; i < itemsAct.length; i++) {
                const a = itemsAnt[i], b = itemsAct[i];
                if (!a || !b) continue;
                if (a.passed === false && b.passed === true) {
                    out.push({ texto: `Ahora pasa: ${b.label}`, mejora: true });
                } else if (a.passed === true && b.passed === false) {
                    out.push({ texto: `Dejó de pasar: ${b.label}`, mejora: false });
                }
            }
            // 2) Matices perceptivos continuos (sin contar como pass/fail).
            const sA = (vAnt && vAnt.senales) || {};
            const sB = (vAct && vAct.senales) || {};
            const num = (x) => typeof x === 'number' ? x : parseFloat(x);
            const lA = num(sA.lufs_integrado), lB = num(sB.lufs_integrado);
            if (!isNaN(lA) && !isNaN(lB) && Math.abs(lB - lA) >= 0.5) {
                out.push(lB > lA
                    ? {texto: 'Suena con más nivel (más cuerpo y volumen)', mejora: null}
                    : {texto: 'Suena con más headroom para masterizar', mejora: null});
            }
            const dA = num(sA.rango_dinamico), dB = num(sB.rango_dinamico);
            if (!isNaN(dA) && !isNaN(dB) && Math.abs(dB - dA) >= 0.5) {
                out.push(dB > dA
                    ? {texto: 'Más dinámica, las partes respiran mejor', mejora: null}
                    : {texto: 'Más comprimida, pierde aire entre golpes', mejora: null});
            }
            return out;
        };

        // Fetch proyectos previos del usuario cuando se entra al cuestionario.
        // Lazy: no bloquea el render, si llega tarde el selector aparece tras él.
        useEffect(() => {
            if (screen !== 'questionnaire') return;
            const { token } = getAuth();
            if (!token) {
                setProyectosPrevios([]);
                setProyectoMode('new');
                return;
            }
            fetch(`${API_URL}/api/proyectos`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : { proyectos: [] })
                .then(data => {
                    const proys = (data && data.proyectos) || [];
                    setProyectosPrevios(proys);
                    // Si no tiene proyectos, modo "new" por defecto (input texto).
                    // Si tiene, modo "select" pero sin seleccionar nada todavía.
                    setProyectoMode(proys.length > 0 ? 'select' : 'new');
                })
                .catch(() => {
                    setProyectosPrevios([]);
                    setProyectoMode('new');
                });
        }, [screen]);

        // Al elegir un proyecto existente, prerrellenar género/objetivo/dificultad
        // desde la última versión de ese proyecto. Fase, bloqueo y experiencia
        // se piden de nuevo (cambian entre versiones, o el usuario puede ser
        // distinto si está chequeando un proyecto ajeno).
        //
        // Nota: el `formulario` en Postgres guarda los LABELS (p.ej. "Tech House"),
        // no los `value` ("tech_house"). Mapeamos label → value antes de
        // setContexto para que los SelectField marquen la opción en morado.
        useEffect(() => {
            if (screen !== 'questionnaire') return;
            if (proyectoMode !== 'select' || !proyectoSeleccionadoId) {
                setPrefilledFromProyecto(false);
                return;
            }
            if (!opciones) return; // necesitamos las opciones para mapear label → value
            const ac = new AbortController();
            fetch(`${API_URL}/api/proyectos/${proyectoSeleccionadoId}`, {
                headers: authHeaders(),
                signal: ac.signal,
            })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (!data || !data.versiones || data.versiones.length === 0) return;
                    const ultima = data.versiones[data.versiones.length - 1];
                    const f = ultima.formulario || {};
                    // Mapea label → value usando la lista de opciones cargada.
                    const labelToValue = (opts, raw) => {
                        if (!raw || !opts) return '';
                        const s = String(raw).trim();
                        // Primero por value exacto (legacy o ya normalizado).
                        const byVal = opts.find(o => o.value === s);
                        if (byVal) return byVal.value;
                        // Luego por label exacto (case-insensitive).
                        const byLab = opts.find(o => o.label.toLowerCase() === s.toLowerCase());
                        return byLab ? byLab.value : '';
                    };

                    // Género: si la versión guardada empieza por "Otro:", marcamos 'otro'
                    // y rellenamos genero_custom con el sufijo.
                    let generoValue = '';
                    let generoCustom = ultima.genero_custom || '';
                    const rawGen = (f.genero || '').trim();
                    if (rawGen.toLowerCase().startsWith('otro:')) {
                        generoValue = 'otro';
                        if (!generoCustom) generoCustom = rawGen.slice(5).trim();
                    } else {
                        generoValue = labelToValue(opciones.generos, rawGen);
                    }
                    const objetivoValue = labelToValue(opciones.objetivos, f.objetivo);
                    const dificultadValue = labelToValue(opciones.dificultad_habitual, f.dificultad_habitual);
                    const faseValue = labelToValue(opciones.fases, f.fase);
                    const experienciaValue = labelToValue(opciones.experiencia, f.experiencia);

                    setContexto(prev => ({
                        ...prev,
                        genero: generoValue || prev.genero || '',
                        genero_custom: generoCustom || prev.genero_custom || '',
                        objetivo: objetivoValue || prev.objetivo || '',
                        dificultad_habitual: dificultadValue || prev.dificultad_habitual || '',
                        fase: faseValue || prev.fase || '',
                        experiencia: experienciaValue || prev.experiencia || '',
                        bloqueo_percibido: (f.bloqueo || prev.bloqueo_percibido || ''),
                    }));
                    setPrefilledFromProyecto(true);
                })
                .catch(() => {});
            return () => ac.abort();
        }, [screen, proyectoMode, proyectoSeleccionadoId, opciones]);

        // Si selecciona "Otro", debe escribir el género en el campo libre.
        // 64 de 95 usuarios marcaban "Otro" sin texto en la versión anterior;
        // hacerlo obligatorio nos da info real para futuras decisiones de catálogo.
        const otroGeneroValido = contexto.genero !== 'otro' || (contexto.genero_custom || '').trim().length >= 2;
        const isQuestionnaireValid = contexto.genero && otroGeneroValido && contexto.fase && contexto.objetivo && contexto.experiencia && contexto.dificultad_habitual;

        // ---- Cuestionario completo: si hay sesión analiza ya, si no abre modal de auth ----
        const handleGoToEmail = () => {
            trackEvent('funnel_questionnaire_completed', {
                genero: contexto.genero,
                fase: contexto.fase,
                experiencia: contexto.experiencia,
            });
            const saved = getAuth();
            if (panelAuth || saved.token) {
                runAnalysis();
            } else {
                // Sin sesión: abrir modal y memorizar que hay que analizar tras auth
                setPendingAfterAuth('analyze');
                openAuthModal('login');
            }
        };

        // ---- Lanzar el análisis del track (asume que hay sesión) ----
        const runAnalysis = async () => {
            setEmailError('');
            setScreen('processing');
            setError(null);
            trackEvent('funnel_analysis_started', {
                genero: contexto.genero,
                experiencia: contexto.experiencia,
            });

            const formData = new FormData();
            formData.append('audio', file);
            Object.entries(contexto).forEach(([k, v]) => formData.append(k, v));

            try {
                const resp = await fetch(`${API_URL}/api/diagnostico`, {
                    method: 'POST',
                    body: formData,
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || 'Error procesando el track');
                }
                const data = await resp.json();

                // El email para guardar en Sheets viene de la sesión activa
                const savedAuth = getAuth();
                const sessionEmail = panelAuth || savedAuth.email || '';
                if (sessionEmail) setUserEmail(sessionEmail);

                setResultado(data);
                // Guardar en historial
                guardarEnHistorial(file.name, contexto, data, nombreProyecto);
                setHistorialCount(obtenerHistorial().length);
                // Construir texto formulario
                const labelMap = {
                    genero: opciones?.generos,
                    fase: opciones?.fases,
                    objetivo: opciones?.objetivos,
                    experiencia: opciones?.experiencia,
                    dificultad_habitual: opciones?.dificultad_habitual,
                };
                const getLabel = (field, value) => {
                    const opts = labelMap[field];
                    if (!opts) return value;
                    const found = opts.find(o => o.value === value);
                    return found ? found.label : value;
                };
                const generoLabel = contexto.genero === 'otro' && contexto.genero_custom
                    ? `Otro: ${contexto.genero_custom}`
                    : getLabel('genero', contexto.genero);
                const formularioTexto = [
                    generoLabel,
                    getLabel('fase', contexto.fase),
                    getLabel('objetivo', contexto.objetivo),
                    getLabel('experiencia', contexto.experiencia),
                    getLabel('dificultad_habitual', contexto.dificultad_habitual),
                    contexto.bloqueo_percibido ? `Bloqueo: ${contexto.bloqueo_percibido}` : '',
                ].filter(Boolean).join(' | ');

                // Construir informe diagnóstico completo
                const dx = data;
                const da = dx.datos_audio || {};
                let informe = '';
                // Estado
                informe += `ESTADO: ${dx.estado_texto || dx.estado_track || ''}\n`;
                // Diagnóstico principal
                informe += `DIAGNÓSTICO PRINCIPAL: ${dx.diagnostico_principal?.titulo || ''} (${dx.diagnostico_principal?.id || ''})\n`;
                informe += `Explicación: ${dx.diagnostico_principal?.explicacion || ''}\n`;
                // Diagnóstico secundario
                if (dx.diagnostico_secundario) {
                    informe += `DIAGNÓSTICO SECUNDARIO: ${dx.diagnostico_secundario.titulo} (${dx.diagnostico_secundario.id})\n`;
                }
                // Prioridades
                if (dx.prioridades && dx.prioridades.length > 0) {
                    informe += `PRIORIDADES: ${dx.prioridades.map((p, i) => `${i+1}. ${p}`).join(' | ')}\n`;
                }
                // Nota contextual
                if (dx.nota_contextual) informe += `NOTA CONTEXTUAL: ${dx.nota_contextual}\n`;
                if (dx.nota_motivacional) informe += `MOTIVACIÓN: ${dx.nota_motivacional}\n`;
                // Tips género
                if (dx.tips_genero && dx.tips_genero.length > 0) {
                    informe += `TIPS GÉNERO: ${dx.tips_genero.join(' | ')}\n`;
                }
                // No tocar
                if (dx.no_tocar_aun && dx.no_tocar_aun.length > 0) {
                    informe += `NO TOCAR AÚN: ${dx.no_tocar_aun.join(' | ')}\n`;
                }
                // Tip objetivo
                if (dx.tip_objetivo) informe += `TIP OBJETIVO: ${dx.tip_objetivo}\n`;
                // Siguiente sesión
                if (dx.siguiente_sesion) informe += `SIGUIENTE SESIÓN: ${dx.siguiente_sesion}\n`;
                // Error de foco
                if (dx.error_de_foco) informe += `ATENCIÓN: ${dx.error_de_foco_mensaje}\n`;
                // Referencia temporal
                if (dx.referencia_temporal) informe += `REFERENCIA TEMPORAL: ${dx.referencia_temporal}\n`;
                // Disclaimer
                if (dx.disclaimer) informe += `DISCLAIMER: ${dx.disclaimer}\n`;
                // Datos de mezcla
                informe += `--- MEZCLA ---\n`;
                informe += `BPM: ${da.bpm || '?'} | Duración: ${da.duracion || '?'}\n`;
                informe += `Balance grave: ${da.balance_grave || '?'}\n`;
                informe += `Densidad: ${da.densidad || '?'}\n`;
                if (da.loudness) {
                    informe += `Loudness: ${da.loudness.lufs_integrado} LUFS (${da.loudness.nivel}) | Pico: ${da.loudness.lufs_short_term_max} LUFS | Rango: ${da.loudness.rango_loudness} LU\n`;
                    if (da.loudness.true_peak_dbtp && da.loudness.true_peak_dbtp > -99) {
                        informe += `True peak: ${da.loudness.true_peak_dbtp} dBTP${da.loudness.nivel_true_peak ? ` (${da.loudness.nivel_true_peak})` : ''}\n`;
                    }
                }
                if (da.mono_compat) {
                    informe += `Mono compat: ${da.mono_compat.nivel_compatibilidad || 'N/A'}`;
                    if (da.mono_compat.es_stereo) {
                        informe += ` | Correlación: ${(da.mono_compat.correlacion_lr * 100).toFixed(0)}% | Pérdida: ${da.mono_compat.perdida_mono_db}dB`;
                        if (da.mono_compat.bandas) {
                            informe += ` | Graves: ${da.mono_compat.bandas.graves?.estado} | Medios: ${da.mono_compat.bandas.medios?.estado} | Agudos: ${da.mono_compat.bandas.agudos?.estado}`;
                        }
                    }
                    informe += '\n';
                }
                if (da.harshness) {
                    informe += `Harshness: ${da.harshness.tiene_harshness ? da.harshness.nivel : 'no'} | p95: ${da.harshness.pico_p95?.toFixed(1) || '?'}dB | ${da.harshness.pct_frames_harsh?.toFixed(0) || '?'}% frames\n`;
                }
                // Scores
                if (dx.scores) {
                    informe += `SCORES: ${Object.entries(dx.scores).map(([k,v]) => `${k}=${v}`).join(', ')}\n`;
                }

                // Construir señales crudas para calibración del motor
                const senales = {
                    // Identificación
                    bpm: da.bpm,
                    duracion: da.duracion,
                    // Espectro y balance
                    balance_grave: da.balance_grave,
                    db_grave: dx.senales?.db_grave,
                    db_media: dx.senales?.db_media,
                    db_aguda: dx.senales?.db_aguda,
                    diff_grave_media: dx.senales?.diff_grave_media,
                    densidad: da.densidad,
                    densidad_espectral: dx.senales?.densidad_espectral,
                    // Dinámica y estructura
                    contraste: da.contraste,
                    varianza_energia: dx.senales?.varianza_energia,
                    rango_dinamico: dx.senales?.rango_dinamico,
                    tiene_desarrollo: da.desarrollo_temporal,
                    cambios_significativos: dx.senales?.cambios_significativos,
                    n_bloques: da.n_bloques,
                    madurez: dx.senales?.madurez_estimada,
                    // Distribución
                    break_largo: da.distribucion?.break_largo,
                    drop_corto: da.distribucion?.drop_corto,
                    sin_intro: da.distribucion?.sin_intro,
                    sin_outro: da.distribucion?.sin_outro,
                    estructura_problematica: da.distribucion?.estructura_problematica,
                    // Armonía
                    key: da.armonia?.key,
                    modo: da.armonia?.modo,
                    key_confidence: da.armonia?.key_confidence,
                    contenido_tonal: da.armonia?.contenido_tonal,
                    consistencia_armonica: da.armonia?.consistencia_armonica,
                    complejidad_armonica: da.armonia?.complejidad_armonica,
                    ratio_tonal_percusivo: da.armonia?.ratio_tonal_percusivo,
                    n_notas_activas: da.armonia?.n_notas_activas,
                    // Loudness
                    lufs_integrado: da.loudness?.lufs_integrado,
                    lufs_short_term_max: da.loudness?.lufs_short_term_max,
                    rango_loudness: da.loudness?.rango_loudness,
                    nivel_loudness: da.loudness?.nivel,
                    // Mono compatibility
                    es_stereo: da.mono_compat?.es_stereo,
                    correlacion_lr: da.mono_compat?.correlacion_lr,
                    perdida_mono_db: da.mono_compat?.perdida_mono_db,
                    nivel_mono: da.mono_compat?.nivel_compatibilidad,
                    fase_invertida: da.mono_compat?.fase_invertida,
                    mono_graves: da.mono_compat?.bandas?.graves?.estado,
                    mono_medios: da.mono_compat?.bandas?.medios?.estado,
                    mono_agudos: da.mono_compat?.bandas?.agudos?.estado,
                    // Harshness
                    tiene_harshness: da.harshness?.tiene_harshness,
                    harshness_nivel: da.harshness?.nivel,
                    harshness_p95: da.harshness?.pico_p95,
                    harshness_pct: da.harshness?.pct_frames_harsh,
                    // Carencias
                    carencia_medios: dx.senales?.carencia_medios,
                    carencia_agudos: dx.senales?.carencia_agudos,
                    // Diagnósticos emitidos y scores
                    diag_principal: dx.diagnostico_principal?.id,
                    diag_secundario: dx.diagnostico_secundario?.id || null,
                    scores: dx.scores,
                    estado: dx.estado_track,
                };

                // Determinar proyecto/versión: si el usuario seleccionó uno existente,
                // pasamos proyecto_id. Si está creando uno nuevo, pasamos nombre_proyecto
                // (el backend hará get_or_create). Si por algún motivo ambos van vacíos,
                // el análisis queda como "suelto" (proyecto_id NULL).
                const usingExisting = proyectoMode === 'select' && proyectoSeleccionadoId;
                const proyectoNombrePayload = usingExisting
                    ? ''
                    : (nombreProyecto || '').trim();

                // Enviar registro: Postgres como source of truth + Sheets mirror (cutover B)
                fetch(`${API_URL}/api/sheets/registro`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        timestamp: new Date().toISOString(),
                        email: sessionEmail,
                        nombre_proyecto: proyectoNombrePayload,
                        proyecto_id: usingExisting ? proyectoSeleccionadoId : '',
                        version_etiqueta: (versionEtiqueta || '').trim(),
                        formulario: formularioTexto,
                        diagnostico: informe,
                        senales_json: JSON.stringify(senales),
                        genero_custom: contexto.genero === 'otro' ? (contexto.genero_custom || '').trim() : '',
                    }),
                }).catch(() => {});
                setScreen('diagnostico');
                trackEvent('funnel_result_viewed', {
                    diagnostico_principal: data.diagnostico_principal?.id || '',
                    estado: data.estado_track || '',
                    genero: contexto.genero,
                });
            } catch (err) {
                const msg = err.message || 'Error inesperado';
                setError(msg);
                setScreen('questionnaire');
            }
        };

        // Compat: handleSubmit antigua redirige a runAnalysis (por si algún botón sigue llamándola)
        const handleSubmit = () => runAnalysis();

        const handleReset = () => {
            setFile(null);
            setUserEmail('');
            setUserPassword('');
            setEmailError('');
            setNombreProyecto('');
            setProyectoSeleccionadoId('');
            setVersionEtiqueta('');
            setPrefilledFromProyecto(false);
            setContexto({
                genero: '', genero_custom: '', fase: '', objetivo: '',
                bloqueo_percibido: '', experiencia: '',
                dificultad_habitual: '',
            });
            setResultado(null);
            setError(null);
            setScreen('landing');
        };

        // =====================================================================
        // Auth helpers
        // =====================================================================
        const USERNAME_REGEX = /^[a-zA-Z0-9_-]{3,20}$/;
        const validUsername = (u) => USERNAME_REGEX.test(u);

        const resetAuthFields = () => {
            setAuthIdentifier(''); setAuthEmail(''); setAuthUsername('');
            setAuthPassword(''); setAuthError(''); setAuthInfo('');
        };

        const openAuthModal = (mode = 'login') => {
            resetAuthFields();
            setAuthMode(mode);
            setAuthOpen(true);
            trackEvent('auth_modal_opened', { mode });
        };

        const closeAuthModal = () => {
            setAuthOpen(false);
            setAuthError(''); setAuthInfo('');
            // Si había una acción pendiente y el usuario cierra sin completar, descartar
            if (pendingAfterAuth) setPendingAfterAuth(null);
        };

        // ---- Login (email O username + password) ----
        const handleLogin = async () => {
            const ident = authIdentifier.trim();
            if (!ident || authPassword.length < 8) return;
            setAuthLoading(true); setAuthError(''); setAuthInfo('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ identifier: ident, password: authPassword }),
                });
                const data = await resp.json();
                if (!resp.ok) { setAuthError(data.error || 'Error de autenticación'); setAuthLoading(false); return; }
                if (data.token) saveAuth(data.email, data.token);
                setPanelAuth(data.email);
                setPanelUsername(data.username || '');
                setPanelHistorial(data.historial || []);
                trackEvent('auth_login_success', { had_username: !!data.username });
                if (data.needs_username) {
                    // Usuario antiguo sin username — pedirle que lo elija
                    setAuthMode('set_username');
                    setAuthUsername(''); setAuthError('');
                    setAuthLoading(false);
                } else {
                    setAuthOpen(false);
                    setAuthLoading(false);
                    if (pendingAfterAuth === 'analyze') {
                        setPendingAfterAuth(null);
                        runAnalysis();
                    } else {
                        setScreen('panel');
                    }
                }
            } catch (e) { setAuthError('No se pudo conectar. Inténtalo de nuevo.'); setAuthLoading(false); }
        };

        // ---- Register (email + username + password) ----
        const handleRegister = async () => {
            if (!authEmail.includes('@')) { setAuthError('Email inválido'); return; }
            if (!validUsername(authUsername)) { setAuthError('Nombre de usuario inválido. 3-20 caracteres: letras, números, guion bajo o guion.'); return; }
            if (authPassword.length < 8) { setAuthError('La contraseña debe tener al menos 8 caracteres'); return; }
            setAuthLoading(true); setAuthError(''); setAuthInfo('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: authEmail.trim().toLowerCase(), username: authUsername.trim(), password: authPassword }),
                });
                const data = await resp.json();
                if (!resp.ok) { setAuthError(data.error || 'No se pudo crear la cuenta'); setAuthLoading(false); return; }
                if (data.token) saveAuth(data.email, data.token);
                setPanelAuth(data.email);
                setPanelUsername(data.username || '');
                setPanelHistorial([]);
                trackEvent('auth_register_success');
                setAuthOpen(false);
                setAuthLoading(false);
                if (pendingAfterAuth === 'analyze') {
                    setPendingAfterAuth(null);
                    runAnalysis();
                } else {
                    setScreen('panel');
                }
            } catch (e) { setAuthError('No se pudo conectar. Inténtalo de nuevo.'); setAuthLoading(false); }
        };

        // ---- Set username (migración para usuarios viejos) ----
        const handleSetUsername = async () => {
            if (!validUsername(authUsername)) { setAuthError('Nombre de usuario inválido. 3-20 caracteres: letras, números, guion bajo o guion.'); return; }
            setAuthLoading(true); setAuthError('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/set_username`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ username: authUsername.trim() }),
                });
                const data = await resp.json();
                if (!resp.ok) { setAuthError(data.error || 'No se pudo guardar'); setAuthLoading(false); return; }
                setPanelUsername(data.username);
                trackEvent('auth_set_username_success');
                setAuthOpen(false);
                setAuthLoading(false);
                if (pendingAfterAuth === 'analyze') {
                    setPendingAfterAuth(null);
                    runAnalysis();
                } else {
                    setScreen('panel');
                }
            } catch (e) { setAuthError('No se pudo conectar.'); setAuthLoading(false); }
        };

        // ---- Forgot password ----
        const handleForgot = async () => {
            if (!authEmail.includes('@')) { setAuthError('Email inválido'); return; }
            setAuthLoading(true); setAuthError(''); setAuthInfo('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/forgot`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: authEmail.trim().toLowerCase() }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    setAuthError(data.error || 'No se pudo procesar.');
                } else {
                    setAuthInfo(data.message || 'Si esa cuenta existe, te hemos enviado un email.');
                    trackEvent('auth_forgot_clicked');
                }
            } catch (e) { setAuthError('No se pudo conectar.'); }
            setAuthLoading(false);
        };

        // ---- Cerrar sesión ----
        const handlePanelLogout = () => {
            clearAuth();
            setPanelAuth(null); setPanelUsername(''); setPanelHistorial([]);
            setPanelSelectedEntry(null); resetAuthFields();
            setScreen('landing');
        };

        // ---- Abrir panel: si hay token, entrar; si no, abrir modal de login ----
        const handleOpenPanel = () => {
            const saved = getAuth();
            if (panelAuth || saved.token) {
                const email = panelAuth || saved.email;
                setPanelAuth(email);
                setPanelLoading(true);
                fetch(`${API_URL}/api/auth/historial`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ email }),
                })
                .then(r => {
                    if (r.status === 401) { clearAuth(); setPanelAuth(null); setPanelLoading(false); openAuthModal('login'); return null; }
                    return r.json();
                })
                .then(data => { if (data) { setPanelHistorial(data.historial || []); setPanelLoading(false); } })
                .catch(() => setPanelLoading(false));
                setScreen('panel');
            } else {
                openAuthModal('login');
            }
        };

        if (!opciones) {
            return (
                <div className="min-h-screen flex items-center justify-center">
                    <p className="text-gray-500">Cargando...</p>
                </div>
            );
        }

        return (
            <div>
                {/* Botón Mi panel — siempre visible arriba a la derecha (no en panel) */}
                {screen !== 'panel' && (
                    <div className="fixed top-4 right-4 z-40">
                        <button
                            onClick={handleOpenPanel}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg text-xs transition-colors"
                            style={{ background: 'rgba(109,16,255,0.15)', border: '1px solid rgba(109,16,255,0.3)', color: '#a78bfa' }}
                        >
                            {panelAuth ? (
                                <React.Fragment>
                                    <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'var(--po-green)', display: 'inline-block' }}></span>
                                    Mi panel
                                </React.Fragment>
                            ) : 'Mi panel'}
                        </button>
                    </div>
                )}

                {error && (
                    <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-900 border border-red-700 text-red-200 px-6 py-3 rounded-xl text-sm z-50 fade-in">
                        {error}
                        <button onClick={() => setError(null)} className="ml-3 text-red-400 hover:text-red-200">✕</button>
                    </div>
                )}

                {screen === 'landing' && (
                    <LandingScreen
                        onFileSelected={handleFileSelected}
                        onHistorial={() => setScreen('historial')}
                        historialCount={historialCount}
                    />
                )}
                {screen === 'historial' && (
                    <HistorialScreen
                        onBack={() => setScreen('landing')}
                        onAnalizar={() => setScreen('landing')}
                    />
                )}
                {screen === 'questionnaire' && (
                    <QuestionnaireScreen
                        opciones={opciones}
                        contexto={contexto}
                        onChange={handleContextoChange}
                        onSubmit={handleGoToEmail}
                        isValid={isQuestionnaireValid}
                        nombreProyecto={nombreProyecto}
                        onNombreChange={setNombreProyecto}
                        proyectosPrevios={proyectosPrevios}
                        proyectoMode={proyectoMode}
                        onProyectoModeChange={setProyectoMode}
                        proyectoSeleccionadoId={proyectoSeleccionadoId}
                        onProyectoSeleccionadoChange={setProyectoSeleccionadoId}
                        versionEtiqueta={versionEtiqueta}
                        onVersionEtiquetaChange={setVersionEtiqueta}
                        prefilledFromProyecto={prefilledFromProyecto}
                    />
                )}
                {/* (screen 'email' eliminada — la auth ahora pasa por el AuthModal) */}
                {screen === 'processing' && <ProcessingScreen datos={resultado?.datos_audio} />}
                {screen === 'diagnostico' && resultado && (
                    <DiagnosticoScreen resultado={resultado} onReset={handleReset} contexto={contexto} userEmail={userEmail} />
                )}

                {/* ============ AUTH MODAL (login / register / forgot / set_username) ============ */}
                {authOpen && (
                    <div
                        className="fixed inset-0 z-50 flex items-center justify-center px-4 fade-in"
                        style={{ background: 'rgba(0,0,0,0.72)', backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}
                        onClick={(e) => { if (e.target === e.currentTarget && authMode !== 'set_username') closeAuthModal(); }}
                    >
                        <div
                            className="card relative w-full"
                            style={{ maxWidth: '420px', padding: '28px 28px 24px', borderRadius: '14px' }}
                            onClick={(e) => e.stopPropagation()}
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="authTitle"
                        >
                            {/* X cerrar (oculta en set_username) */}
                            {authMode !== 'set_username' && (
                                <button
                                    onClick={closeAuthModal}
                                    aria-label="Cerrar"
                                    className="text-gray-500 hover:text-white transition-colors"

                                        const est = estado.toLowerCase();
                                        const semaforo = est.includes('temprana') || est.includes('verde')
                                            ? { emoji: '🔴', color: '#f87171', bg: 'rgba(248,113,113,0.08)', border: '#7f1d1d', label: 'Fase temprana' }
                                            : est.includes('pulir') || est.includes('avanzado') || est.includes('azul')
                                            ? { emoji: '🔵', color: '#60a5fa', bg: 'rgba(96,165,250,0.08)', border: '#1e3a5f', label: 'Listo para pulir' }
                                            : { emoji: '🟡', color: '#facc15', bg: 'rgba(250,204,21,0.08)', border: '#713f12', label: 'En desarrollo' };

                                        // Diagnóstico principal
                                        const dpMatch = diag.match(/DIAGNÓSTICO PRINCIPAL:\s*(.+)/i);
                                        const diagPrincipal = dpMatch ? dpMatch[1].trim().replace(/\s*\([^)]*\)\s*$/, '') : '';

                                        // Explicación
                                        const explMatch = diag.match(/Explicación:\s*(.+)/i);
                                        const explicacion = explMatch ? explMatch[1].trim() : '';

                                        // Prioridades
                                        const prioMatch = diag.match(/PRIORIDADES:\s*(.+)/im);
                                        const prioridades = prioMatch ? prioMatch[1].split(' | ').map(p => p.replace(/^\d+\.\s*/, '').trim()).filter(Boolean) : [];

                                        // Mezcla
                                        const bpmMatch = diag.match(/BPM:\s*(\d+)/);
                                        const bpm = bpmMatch ? bpmMatch[1] : '';
                                        const durMatch = diag.match(/Duración:\s*(.+)/);
                                        const duracion = durMatch ? durMatch[1].trim().split('\n')[0] : '';
                                        const lufsMatch = diag.match(/([-\d.]+)\s*LUFS/);
                                        const lufs = lufsMatch ? lufsMatch[1] : '';

                                        const fueUtil = row.fue_util || '';
                                        const comentario = row.comentario || '';
                                        const enlace = row.feedback_real || row.enlace_feedback_real || '';

                                        const isExpanded = panelSelectedEntry === idx;

                                        return (
                                            <div key={idx} className="card overflow-hidden">
                                                {/* Resumen clickable */}
                                                <div
                                                    className="p-4 cursor-pointer hover:bg-gray-800/30 transition-colors"
                                                    onClick={() => setPanelSelectedEntry(isExpanded ? null : idx)}
                                                >
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-lg">{semaforo.emoji}</span>
                                                            <div>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="text-white text-sm font-medium">{genero || 'Sin género'}</span>
                                                                    {bpm && <span className="text-gray-600 text-xs">{bpm} BPM</span>}
                                                                </div>
                                                                <p className="text-gray-400 text-xs mt-0.5 max-w-md truncate">{diagPrincipal || 'Sin diagnóstico'}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            {fueUtil && (
                                                                <span className={fueUtil === 'Sí' ? 'accent-green text-xs' : 'text-red-400 text-xs'}>
                                                                    {fueUtil === 'Sí' ? '👍' : '👎'}
                                                                </span>
                                                            )}
                                                            {enlace && <span className="accent-purple text-xs">🎧</span>}
                                                            <span className="text-gray-600 text-xs">
                                                                {date ? date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''}
                                                            </span>
                                                            <span className="text-gray-600 text-xs">{isExpanded ? '▲' : '▼'}</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Meta de proyecto: chip si está asignado, asignación inline si es huérfano */}
                                                {rowProyectoId && rowProyectoNombre && (
                                                    <div className="px-4 pb-3 -mt-1 flex items-center gap-2 flex-wrap">
                                                        <span
                                                            className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px]"
                                                            style={{background: 'rgba(168,85,247,0.18)', color: '#ffffff', border: '1px solid rgba(168,85,247,0.4)'}}
                                                            title={rowProyectoNombre}
                                                        >
                                                            <span>📁</span>
                                                            <span className="truncate" style={{maxWidth: '180px'}}>{rowProyectoNombre}</span>
                                                            {versionNum != null && <span style={{opacity: 0.8}}>· v{versionNum}</span>}
                                                            {versionEtq && <span style={{opacity: 0.7}} className="truncate" title={versionEtq}>· {versionEtq}</span>}
                                                        </span>
                                                    </div>
                                                )}
                                                {puedeAsignar && (
                                                    <div className="px-4 pb-3 -mt-1 flex items-center gap-2 flex-wrap" onClick={(e) => e.stopPropagation()}>
                                                        <span className="text-[11px] text-gray-500">Sin proyecto:</span>
                                                        <select
                                                            value={proyectoTarget[rowAnalisisId] || ''}
                                                            onChange={(e) => setProyectoTarget(prev => ({...prev, [rowAnalisisId]: e.target.value}))}
                                                            className="px-2 py-1 rounded text-[11px] input-field"
                                                            style={{minWidth: '160px'}}
                                                        >
                                                            <option value="">— Asignar a proyecto —</option>
                                                            {panelProyectos.map(p => (
                                                                <option key={p.id} value={p.id}>{p.nombre}</option>
                                                            ))}
                                                        </select>
                                                        <button
                                                            onClick={() => asignarAnalisisAProyecto(rowAnalisisId)}
                                                            disabled={!proyectoTarget[rowAnalisisId] || asignandoId === rowAnalisisId}
                                                            className="px-2 py-1 btn-primary rounded text-[11px] disabled:opacity-50 disabled:cursor-not-allowed"
                                                        >
                                                            {asignandoId === rowAnalisisId ? '...' : 'Asignar'}
                                                        </button>
                                                    </div>
                                                )}
                                                {!rowProyectoId && rowAnalisisId && (panelProyectos || []).length === 0 && (
                                                    <div className="px-4 pb-3 -mt-1">
                                                        <span className="text-[11px] text-gray-600 italic">
                                                            Sin proyecto · crea uno desde un nuevo análisis para empezar a agrupar.
                                                        </span>
                                                    </div>
                                                )}

                                                {/* Detalle expandido */}
                                                {isExpanded && (
                                                    <div className="border-t border-gray-800 fade-in">
                                                        {/* Estado */}
                                                        <div className="px-4 py-3">
                                                            <div className="px-4 py-3 rounded-lg" style={{ background: semaforo.bg, border: `1px solid ${semaforo.border}` }}>
                                                                <span className="text-sm" style={{ color: semaforo.color }}>{estado}</span>
                                                            </div>
                                                        </div>

                                                        {/* Diagnóstico */}
                                                        {diagPrincipal && (
                                                            <div className="px-4 pb-3">
                                                                <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Diagnóstico principal</p>
                                                                <div className="rounded-lg p-3" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.15)' }}>
                                                                    <p className="text-orange-400 text-sm font-medium">{diagPrincipal}</p>
                                                                    {explicacion && <p className="text-gray-300 text-xs mt-2 leading-relaxed">{explicacion}</p>}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Prioridades */}
                                                        {prioridades.length > 0 && (
                                                            <div className="px-4 pb-3">
                                                                <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Prioridades</p>
                                                                <div className="space-y-1.5">
                                                                    {prioridades.map((p, i) => (
                                                                        <div key={i} className="flex items-start gap-2">
                                                                            <span className="flex-shrink-0 w-5 h-5 rounded-full bg-purple-900/40 accent-purple text-xs flex items-center justify-center font-medium">{i+1}</span>
                                                                            <p className="text-gray-300 text-xs leading-relaxed pt-0.5">{p}</p>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Datos rápidos */}
                                                        <div className="px-4 pb-3">
                                                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Datos</p>
                                                            <div className="flex flex-wrap gap-2">
                                                                {genero && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{genero}</span>}
                                                                {fase && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{fase}</span>}
                                                                {objetivo && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{objetivo}</span>}
                                                                {bpm && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{bpm} BPM</span>}
                                                                {lufs && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{lufs} LUFS</span>}
                                                                {duracion && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{duracion}</span>}
                                                            </div>
                                                        </div>

                                                        {/* Feedback */}
                                                        {(fueUtil || comentario || enlace) && (
                                                            <div className="px-4 pb-4">
                                                                <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Feedback</p>
                                                                {fueUtil && <p className="text-gray-400 text-xs mb-1">¿Fue útil? <span className={fueUtil === 'Sí' ? 'accent-green' : 'text-red-400'}>{fueUtil}</span></p>}
                                                                {comentario && <p className="text-gray-400 text-xs italic mb-1">"{comentario}"</p>}
                                                                {enlace && (
                                                                    <div className="mt-1">
                                                                        <span className="accent-purple text-xs">🎧 Feedback real solicitado</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}

                                                        {/* Ver diagnóstico completo */}
                                                        <div className="px-4 pb-4">
                                                            <details className="group">
                                                                <summary className="text-gray-500 text-xs cursor-pointer hover:text-gray-300 transition-colors">Ver diagnóstico completo</summary>
                                                                {renderDiagnosticoCompleto(parseAnalisisRow(row))}
                                                            </details>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* Footer */}
                            <div className="text-center mt-8 mb-4">
                                <p className="text-gray-600 text-xs">Mentotrack no almacena el archivo de tu canción, solo los datos extraídos tras el análisis.</p>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    </script>
