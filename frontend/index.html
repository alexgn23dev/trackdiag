    // =========================================================================
    // Token helpers
    // =========================================================================
    const TOKEN_KEY = 'mentotrack_token';
    const TOKEN_EMAIL_KEY = 'mentotrack_email';

    function saveAuth(email, token) {
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(TOKEN_EMAIL_KEY, email);
    }
    function getAuth() {
        return { email: localStorage.getItem(TOKEN_EMAIL_KEY) || '', token: localStorage.getItem(TOKEN_KEY) || '' };
    }
    function clearAuth() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(TOKEN_EMAIL_KEY);
    }
    function authHeaders() {
        const { token } = getAuth();
        const h = { 'Content-Type': 'application/json' };
        if (token) h['Authorization'] = `Bearer ${token}`;
        return h;
    }

    // =====================================================================
    // Perfil de comunidad — el usuario rellena quién es (da credibilidad
    // al feedback que dará y recibirá en la futura comunidad).
    // =====================================================================
    function PerfilView({ opciones, onClose, username, onUsernameChange }) {
        const [loading, setLoading] = useState(true);
        const [saving, setSaving] = useState(false);
        const [saved, setSaved] = useState(false);
        const [error, setError] = useState('');
        const [publicadoOpts, setPublicadoOpts] = useState({});
        const [utilesRecibidos, setUtilesRecibidos] = useState(0);
        // Identidad: foto de perfil + nombre de usuario editable
        const fotoInputRef = useRef(null);
        const [foto, setFoto] = useState(null);          // nombre de archivo del avatar
        const [subiendoFoto, setSubiendoFoto] = useState(false);
        const [nombreUsuario, setNombreUsuario] = useState(username || '');
        const [userSaving, setUserSaving] = useState(false);
        const [userMsg, setUserMsg] = useState(null);    // {ok:bool, text:string}
        const [esPro, setEsPro] = useState(false);
        // null = sin responder | true = "Sí" (despliega autoeditado/sellos) | false = "No"
        const [haPublicado, setHaPublicado] = useState(null);
        const [form, setForm] = useState({
            perfil_experiencia: '', perfil_estilos: [],
            perfil_publicado: '', perfil_donde: '', perfil_bio: '',
        });

        // Carga el perfil; si está vacío, usa el prefill de los análisis previos
        useEffect(() => {
            let vivo = true;
            fetch(`${API_URL}/api/perfil`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (!vivo || !data) { setLoading(false); return; }
                    setPublicadoOpts(data.publicado_opciones || {});
                    const p = data.perfil || {};
                    setUtilesRecibidos(p.utiles_recibidos || 0);
                    setFoto(p.perfil_foto || null);
                    setEsPro(!!p.pro);
                    if (p.username) setNombreUsuario(p.username);
                    const pre = data.prefill || {};
                    setForm({
                        perfil_experiencia: p.perfil_experiencia || pre.perfil_experiencia || '',
                        perfil_estilos: (p.perfil_estilos && p.perfil_estilos.length ? p.perfil_estilos : (pre.perfil_estilos || [])),
                        perfil_publicado: p.perfil_publicado || '',
                        perfil_donde: p.perfil_donde || '',
                        perfil_bio: p.perfil_bio || '',
                    });
                    if (p.perfil_publicado === 'no') setHaPublicado(false);
                    else if (p.perfil_publicado) setHaPublicado(true);
                    setLoading(false);
                })
                .catch(() => { if (vivo) { setError('No se pudo cargar el perfil'); setLoading(false); } });
            return () => { vivo = false; };
        }, []);

        const generos = (opciones?.generos || []).filter(g => g.value !== 'otro');
        const experiencias = opciones?.experiencia || [];

        const toggleEstilo = (val) => {
            setForm(f => {
                const tiene = f.perfil_estilos.includes(val);
                if (tiene) return { ...f, perfil_estilos: f.perfil_estilos.filter(e => e !== val) };
                if (f.perfil_estilos.length >= 8) return f; // máx 8
                return { ...f, perfil_estilos: [...f.perfil_estilos, val] };
            });
            setSaved(false);
        };
        const upd = (k, v) => { setForm(f => ({ ...f, [k]: v })); setSaved(false); };

        const labelGenero = (val) => (generos.find(g => g.value === val)?.label) || val;
        const labelExp = (val) => (experiencias.find(e => e.value === val)?.label) || '';

        const guardar = async () => {
            setSaving(true); setError('');
            try {
                const resp = await fetch(`${API_URL}/api/perfil`, {
                    method: 'POST', headers: authHeaders(), body: JSON.stringify(form),
                });
                if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.error || 'Error'); }
                setSaved(true);
            } catch (e) {
                setError(e.message || 'No se pudo guardar');
            } finally {
                setSaving(false);
            }
        };

        const subirFoto = async (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            setSubiendoFoto(true); setError('');
            try {
                const fd = new FormData(); fd.append('foto', f);
                const { token } = getAuth();
                const resp = await fetch(`${API_URL}/api/perfil/foto`, {
                    method: 'POST',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {},
                    body: fd,
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || 'No se pudo subir la imagen');
                setFoto(data.foto);
            } catch (err) {
                setError(err.message || 'No se pudo subir la imagen');
            } finally {
                setSubiendoFoto(false);
                if (fotoInputRef.current) fotoInputRef.current.value = '';
            }
        };

        const quitarFoto = async () => {
            setSubiendoFoto(true); setError('');
            try {
                const resp = await fetch(`${API_URL}/api/perfil/foto`, { method: 'DELETE', headers: authHeaders() });
                if (resp.ok) setFoto(null);
            } catch (err) { /* noop */ }
            finally { setSubiendoFoto(false); }
        };

        const guardarUsuario = async () => {
            const u = (nombreUsuario || '').trim();
            if (!/^[a-zA-Z0-9_-]{3,20}$/.test(u)) {
                setUserMsg({ ok: false, text: '3-20 caracteres: letras, números, guion bajo o guion.' });
                return;
            }
            setUserSaving(true); setUserMsg(null);
            try {
                const resp = await fetch(`${API_URL}/api/auth/set_username`, {
                    method: 'POST', headers: authHeaders(), body: JSON.stringify({ username: u }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || 'No se pudo guardar');
                setUserMsg({ ok: true, text: 'Nombre de usuario actualizado.' });
                onUsernameChange && onUsernameChange(data.username || u);
            } catch (err) {
                setUserMsg({ ok: false, text: err.message || 'No se pudo guardar' });
            } finally {
                setUserSaving(false);
            }
        };

        // Distintivo: cómo se verá junto a sus comentarios en la comunidad
        const distintivo = [
            form.perfil_experiencia ? labelExp(form.perfil_experiencia) : null,
            form.perfil_estilos.length ? form.perfil_estilos.slice(0, 2).map(labelGenero).join(', ') + (form.perfil_estilos.length > 2 ? '…' : '') : null,
            form.perfil_publicado && publicadoOpts[form.perfil_publicado] ? publicadoOpts[form.perfil_publicado] : null,
        ].filter(Boolean);

        if (loading) {
            return <div className="text-center text-gray-500 text-sm py-10">Cargando perfil…</div>;
        }

        return (
            <div className="mb-8 fade-in">
                <div className="flex items-center justify-between mb-1">
                    <h3 className="text-sm font-bold text-white">Mi perfil de comunidad</h3>
                    <button onClick={onClose} className="text-xs text-gray-500 hover:text-gray-300">← Volver</button>
                </div>
                <p className="text-xs text-gray-500 mb-4" style={{maxWidth: '560px'}}>
                    Esto es lo que verán otros productores junto a tus comentarios y tus tracks compartidos. Da credibilidad a tu feedback — y te ayuda a saber con quién hablas.
                </p>

                {/* Identidad: foto de perfil + nombre de usuario */}
                <div className="card p-4 mb-5">
                    <div className="flex items-center gap-4">
                        {foto ? (
                            <img src={`${API_URL}/api/comunidad/foto/${foto}`} alt="Tu foto de perfil"
                                 style={{width: '64px', height: '64px', borderRadius: '50%', objectFit: 'cover', border: '2px solid rgba(255,255,255,0.12)', flexShrink: 0}} />
                        ) : (
                            <div style={{width: '64px', height: '64px', borderRadius: '50%', background: 'rgba(109,16,255,0.25)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 700, fontSize: '1.5rem', flexShrink: 0}}>
                                {((nombreUsuario || username || '?').charAt(0) || '?').toUpperCase()}
                            </div>
                        )}
                        <div className="flex-1">
                            <input ref={fotoInputRef} type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={subirFoto} />
                            <div className="flex items-center gap-3">
                                <button onClick={() => fotoInputRef.current && fotoInputRef.current.click()} disabled={subiendoFoto}
                                    className="px-3 py-1.5 rounded-lg text-xs font-medium" style={{background: 'rgba(255,255,255,0.08)', color: '#fff', border: '1px solid rgba(255,255,255,0.12)'}}>
                                    {subiendoFoto ? 'Subiendo…' : (foto ? 'Cambiar foto' : 'Subir foto')}
                                </button>
                                {foto && <button onClick={quitarFoto} disabled={subiendoFoto} className="text-xs text-gray-500 hover:text-gray-300">Quitar</button>}
                            </div>
                            <p className="text-xs text-gray-600 mt-1.5">JPG, PNG o WebP. Se recorta a cuadrado.</p>
                        </div>
                    </div>
                    <div className="mt-4">
                        <label className="block text-xs font-medium mb-1.5" style={{color: 'var(--po-light)'}}>Nombre de usuario</label>
                        <div className="flex items-center gap-2">
                            <span className="text-gray-500 text-sm">@</span>
                            <input value={nombreUsuario} onChange={e => { setNombreUsuario(e.target.value.replace(/^@+/, '')); setUserMsg(null); }}
                                maxLength={20} placeholder="tu_usuario"
                                className="flex-1 px-3 py-2 rounded-lg text-sm input-field" />
                            <button onClick={guardarUsuario} disabled={userSaving || !nombreUsuario.trim() || nombreUsuario.trim() === username}
                                className="px-3 py-2 rounded-lg text-xs font-semibold btn-primary"
                                style={{opacity: (userSaving || !nombreUsuario.trim() || nombreUsuario.trim() === username) ? 0.5 : 1}}>
                                {userSaving ? '…' : 'Guardar'}
                            </button>
                        </div>
                        {userMsg && <p className="text-xs mt-1.5" style={{color: userMsg.ok ? 'var(--po-green)' : '#f87171'}}>{userMsg.text}</p>}
                    </div>
                </div>

                {/* Vista previa del distintivo */}
                <div className="card p-4 mb-5" style={{borderLeft: '3px solid var(--po-green)'}}>
                    <p className="text-xs text-gray-500 mb-1.5">Así se verá tu distintivo:</p>
                    <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-semibold text-white">{(nombreUsuario || username) ? '@' + (nombreUsuario || username) : 'tu_usuario'}</span>
                        {esPro && <span className="text-xs font-extrabold px-1.5 py-0.5 rounded" style={{background: 'linear-gradient(135deg, #6d10ff, #9a5bff)', color: '#fff', letterSpacing: '.03em'}}>PRO</span>}
                        {utilesRecibidos > 0 && (
                            <span className="text-xs px-2 py-0.5 rounded-full font-semibold" style={{background: 'rgba(250,204,21,0.12)', color: '#fbbf24', border: '1px solid rgba(250,204,21,0.25)'}} title="Feedbacks que otros marcaron como útiles">⭐ {utilesRecibidos} {utilesRecibidos === 1 ? 'útil' : 'útiles'}</span>
                        )}
                        {distintivo.length > 0 ? distintivo.map((d, i) => (
                            <span key={i} className="text-xs px-2 py-0.5 rounded-full" style={{background: 'rgba(37,244,100,0.1)', color: 'var(--po-green)', border: '1px solid rgba(37,244,100,0.2)'}}>{d}</span>
                        )) : <span className="text-xs text-gray-600">— completa los campos para ver tu distintivo —</span>}
                    </div>
                    {utilesRecibidos === 0 && (
                        <p className="text-xs text-gray-600 mt-2">Deja feedback útil en tracks de otros y tu ⭐ irá subiendo — es tu reputación en la comunidad.</p>
                    )}
                </div>

                {/* Sobre ti */}
                <div className="mb-5">
                    <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>Cuenta a la comunidad algo sobre ti <span className="text-xs" style={{color: 'var(--po-medium)'}}>(opcional)</span></label>
                    <textarea value={form.perfil_bio} onChange={e => upd('perfil_bio', e.target.value)}
                        placeholder="Quién eres, qué música haces, qué te inspira..." maxLength={500} rows={2}
                        className="w-full px-4 py-3 rounded-lg text-sm input-field" style={{resize: 'vertical'}} />
                </div>

                {/* Experiencia */}
                <div className="mb-5">
                    <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>¿Cuánto tiempo llevas produciendo?</label>
                    <div className="flex flex-wrap gap-2">
                        {experiencias.map(e => (
                            <button key={e.value} type="button" onClick={() => upd('perfil_experiencia', e.value)}
                                className="px-3 py-2 rounded-lg text-xs transition-colors"
                                style={{
                                    background: form.perfil_experiencia === e.value ? 'var(--po-purple)' : 'transparent',
                                    color: form.perfil_experiencia === e.value ? '#fff' : 'var(--po-light)',
                                    border: '1px solid ' + (form.perfil_experiencia === e.value ? 'var(--po-purple)' : '#333'),
                                }}>{e.label}</button>
                        ))}
                    </div>
                </div>

                {/* Estilos */}
                <div className="mb-5">
                    <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>
                        ¿Qué estilos produces? <span className="text-xs" style={{color: 'var(--po-medium)'}}>(hasta 8)</span>
                    </label>
                    <div className="flex flex-wrap gap-2">
                        {generos.map(g => {
                            const sel = form.perfil_estilos.includes(g.value);
                            return (
                                <button key={g.value} type="button" onClick={() => toggleEstilo(g.value)}
                                    className="px-3 py-1.5 rounded-full text-xs transition-colors"
                                    style={{
                                        background: sel ? 'rgba(37,244,100,0.12)' : 'transparent',
                                        color: sel ? 'var(--po-green)' : 'var(--po-light)',
                                        border: '1px solid ' + (sel ? 'rgba(37,244,100,0.35)' : '#333'),
                                    }}>{sel ? '✓ ' : ''}{g.label}</button>
                            );
                        })}
                    </div>
                </div>

                {/* ¿Has publicado música? — Sí/No; con Sí se despliegan las opciones */}
                <div className="mb-5">
                    <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>¿Has publicado música?</label>
                    <div className="flex gap-2 mb-2">
                        {[[true, 'Sí'], [false, 'No']].map(([val, txt]) => (
                            <button key={txt} type="button"
                                onClick={() => {
                                    setHaPublicado(val);
                                    // "No" fija el valor; "Sí" lo resetea para que elija una opción
                                    upd('perfil_publicado', val ? (form.perfil_publicado !== 'no' ? form.perfil_publicado : '') : 'no');
                                }}
                                className="px-5 py-2 rounded-lg text-xs transition-colors"
                                style={{
                                    background: haPublicado === val ? 'var(--po-purple)' : 'transparent',
                                    color: haPublicado === val ? '#fff' : 'var(--po-light)',
                                    border: '1px solid ' + (haPublicado === val ? 'var(--po-purple)' : '#333'),
                                }}>{txt}</button>
                        ))}
                    </div>
                    {haPublicado === true && (
                        <div className="flex flex-col gap-2 fade-in">
                            {Object.entries(publicadoOpts).filter(([val]) => val !== 'no').map(([val, txt]) => (
                                <button key={val} type="button" onClick={() => upd('perfil_publicado', val)}
                                    className="px-3 py-2 rounded-lg text-xs text-left transition-colors"
                                    style={{
                                        background: form.perfil_publicado === val ? 'var(--po-purple)' : 'transparent',
                                        color: form.perfil_publicado === val ? '#fff' : 'var(--po-light)',
                                        border: '1px solid ' + (form.perfil_publicado === val ? 'var(--po-purple)' : '#333'),
                                    }}>{txt}</button>
                            ))}
                        </div>
                    )}
                </div>

                {/* Dónde — solo si ha publicado algo */}
                {haPublicado === true && form.perfil_publicado && form.perfil_publicado !== 'no' && (
                    <div className="mb-5">
                        <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>¿Dónde? <span className="text-xs" style={{color: 'var(--po-medium)'}}>(opcional)</span></label>
                        <input type="text" value={form.perfil_donde} onChange={e => upd('perfil_donde', e.target.value)}
                            placeholder="Ej: Drumcode, Defected…" maxLength={200}
                            className="w-full px-4 py-3 rounded-lg text-sm input-field" />
                    </div>
                )}

                {error && <p className="text-xs text-red-400 mb-3">{error}</p>}
                <div className="flex items-center gap-3">
                    <button onClick={guardar} disabled={saving}
                        className="px-6 py-3 rounded-xl font-semibold text-sm btn-primary"
                        style={saving ? {opacity: 0.6} : {}}>
                        {saving ? 'Guardando…' : 'Guardar perfil'}
                    </button>
                    {saved && <span className="text-xs" style={{color: 'var(--po-green)'}}>✓ Perfil guardado</span>}
                </div>
            </div>
        );
    }

    function App() {
        const [screen, setScreen] = useState('landing'); // landing | upload | questionnaire | email | processing | diagnostico | historial | panel
        const [file, setFile] = useState(null);
        const [opciones, setOpciones] = useState(null);
        const [userEmail, setUserEmail] = useState('');
        const [userPassword, setUserPassword] = useState('');
        const [emailError, setEmailError] = useState('');
        const [emailLoading, setEmailLoading] = useState(false);
        // ===== Auth modal =====
        const [authOpen, setAuthOpen] = useState(false);
        const [authMode, setAuthMode] = useState('login'); // login | register | forgot | set_username
        const [authIdentifier, setAuthIdentifier] = useState(''); // email o @username (login)
        const [authEmail, setAuthEmail] = useState(''); // registro
        const [authUsername, setAuthUsername] = useState(''); // registro / set_username
        const [authPassword, setAuthPassword] = useState('');
        const [authLoading, setAuthLoading] = useState(false);
        const [authError, setAuthError] = useState('');
        const [authInfo, setAuthInfo] = useState(''); // mensaje informativo (forgot)
        // Panel de usuario
        const [panelHistorial, setPanelHistorial] = useState([]);
        const [panelAuth, setPanelAuth] = useState(null); // email autenticado
        const [panelUsername, setPanelUsername] = useState('');
        const [panelLoading, setPanelLoading] = useState(false);
        const [panelSelectedEntry, setPanelSelectedEntry] = useState(null);
        // Vista por proyectos
        const [panelProyectos, setPanelProyectos] = useState([]);
        const [panelProyectoActivo, setPanelProyectoActivo] = useState(null); // {proyecto, versiones} o null
        const [panelView, setPanelView] = useState('proyectos'); // 'proyectos' | 'detalle' | 'perfil'
        const [panelExpandedVersion, setPanelExpandedVersion] = useState(null);
        const [panelAvanceOpen, setPanelAvanceOpen] = useState(false);
        const [panelAnalisisSueltos, setPanelAnalisisSueltos] = useState([]);
        const [asignandoId, setAsignandoId] = useState(null); // id de análisis siendo asignado
        const [proyectoTarget, setProyectoTarget] = useState({}); // {analisisId: proyectoId}
        // Acción pendiente tras un auth exitoso (p.ej. arrancar análisis tras login)
        const [pendingAfterAuth, setPendingAfterAuth] = useState(null); // null | 'analyze'
        const [nombreProyecto, setNombreProyecto] = useState('');
        const [proyectosPrevios, setProyectosPrevios] = useState([]);
        const [proyectoMode, setProyectoMode] = useState('select');  // 'select' | 'new'
        const [proyectoSeleccionadoId, setProyectoSeleccionadoId] = useState('');
        const [versionEtiqueta, setVersionEtiqueta] = useState('');
        const [prefilledFromProyecto, setPrefilledFromProyecto] = useState(false);
        const [contexto, setContexto] = useState({
            genero: '', genero_custom: '', fase: '', objetivo: '',
            bloqueo_percibido: '', experiencia: '',
            dificultad_habitual: '',
        });
        const [fileRef, setFileRef] = useState(null); // track de referencia (opcional)
        const [comunidadOk, setComunidadOk] = useState(false); // comunidad en pruebas privadas (allowlist)
        const [resultado, setResultado] = useState(null);
        const [error, setError] = useState(null);
        const [historialCount, setHistorialCount] = useState(obtenerHistorial().length);
        // Intención "compartir": el usuario llega desde el muro de la comunidad
        // (/?compartir=1) queriendo publicar un track. Mostramos un aviso de que
        // primero hay que analizarlo (si no, la home parece no tener que ver).
        const [intencionCompartir, setIntencionCompartir] = useState(false);
        // Proyecto que llega en la URL (/?proyecto=<id>), desde el email de
        // re-enganche: al cargar los proyectos se preselecciona solo.
        const [proyectoDeepLink, setProyectoDeepLink] = useState('');
        const [versionDesfasada, setVersionDesfasada] = useState('');
        const [entorno, setEntorno] = useState('');

        // Detecta ?compartir=1 / ?proyecto=<id> al cargar y limpia la URL.
        useEffect(() => {
            try {
                const params = new URLSearchParams(window.location.search);
                let tocado = false;
                if (params.get('compartir') === '1') {
                    setIntencionCompartir(true);
                    params.delete('compartir');
                    tocado = true;
                }
                const pid = params.get('proyecto');
                if (pid) {
                    setProyectoDeepLink(pid);
                    params.delete('proyecto');
                    tocado = true;
                    // Sin sesión no se pueden listar sus proyectos, así que el
                    // deep link se perdería y acabaría creando un proyecto
                    // duplicado con el mismo track. Viene de un email personal:
                    // pedir login aquí es coherente y es la única forma de que
                    // la nueva versión caiga en el proyecto correcto.
                    if (!getAuth().token) openAuthModal('login');
                }
                if (tocado) {
                    const qs = params.toString();
                    window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : ''));
                }
            } catch (e) { /* noop */ }
        }, []);

        // Compatibilidad frontend ↔ backend: detecta un index.html cacheado.
        useEffect(() => {
            comprobarVersionFrontend(setVersionDesfasada, setEntorno);
        }, []);

        // Cargar opciones al inicio
        useEffect(() => {
            fetch(`${API_URL}/api/opciones`)
                .then(r => r.json())
                .then(data => setOpciones(data))
                .catch(() => {
                    // Fallback con opciones hardcoded si la API no está disponible
                    setOpciones({

                            {value: "estructura", label: "Estructurar las ideas"},
                            {value: "todo", label: "Todo me cuesta"},
                        ],
                    });
                });
        }, []);

        // ¿Mostramos el CTA/menú de comunidad EN LA APP? Solo si el backend nos lo
        // dice (mostrar_cta): pre-lanzamiento, únicamente insiders (tú/moderadores/

        const comprobarComunidad = () => {
            fetch(`${API_URL}/api/comunidad/habilitada`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : { mostrar_cta: false })
                .then(d => setComunidadOk(!!(d && d.mostrar_cta)))
                .catch(() => setComunidadOk(false));
        };
        useEffect(() => { comprobarComunidad(); }, [panelAuth]);

        const MAX_FILE_MB = 150;
        const handleFileRefSelected = (f) => {
            setFileRef(f);
            trackEvent('funnel_reference_added', {
                file_type: f.name.split('.').pop().toLowerCase(),
                file_size_mb: Math.round(f.size / 1024 / 1024),
            });
        };
        const handleFileSelected = (f) => {
            const sizeMB = f.size / 1024 / 1024;
            if (sizeMB > MAX_FILE_MB) {
                setError(`El archivo pesa ${Math.round(sizeMB)} MB, el máximo es ${MAX_FILE_MB} MB. Convierte a MP3 para reducir el tamaño.`);
                setScreen('upload');
                return;
            }
            setFile(f);
            setScreen('questionnaire');
            trackEvent('funnel_file_uploaded', {
                file_type: f.name.split('.').pop().toLowerCase(),
                file_size_mb: Math.round(sizeMB),
            });
        };

        const handleContextoChange = (name, value) => {
            setContexto(prev => ({ ...prev, [name]: value }));
        };

        // Fetch lista de proyectos + análisis sueltos cuando se entra al panel.
        const refreshPanelProyectos = () => {
            fetch(`${API_URL}/api/proyectos`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : { proyectos: [] })
                .then(data => setPanelProyectos((data && data.proyectos) || []))
                .catch(() => setPanelProyectos([]));
            fetch(`${API_URL}/api/analisis-sueltos`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : { analisis: [] })
                .then(data => setPanelAnalisisSueltos((data && data.analisis) || []))
                .catch(() => setPanelAnalisisSueltos([]));
        };

        // Recarga el historial del usuario (incluye proyecto_id por análisis).
        const refreshPanelHistorial = () => {
            if (!panelAuth) return;
            fetch(`${API_URL}/api/auth/historial`, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ email: panelAuth }),
            })
            .then(r => r.ok ? r.json() : null)
            .then(data => { if (data) setPanelHistorial(data.historial || []); })
            .catch(() => {});
        };

        useEffect(() => {
            if (screen !== 'panel' || !panelAuth) return;
            refreshPanelProyectos();
        }, [screen, panelAuth]);

        const asignarAnalisisAProyecto = async (analisisId) => {
            const proyectoId = proyectoTarget[analisisId];
            if (!proyectoId) return;
            setAsignandoId(analisisId);
            try {
                const r = await fetch(`${API_URL}/api/analisis/${analisisId}/asignar-proyecto`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ proyecto_id: proyectoId }),
                });
                if (r.ok) {
                    refreshPanelProyectos();
                    refreshPanelHistorial();
                    // Limpiar selector para esa fila.
                    setProyectoTarget(prev => {
                        const next = {...prev};
                        delete next[analisisId];
                        return next;
                    });
                }
            } finally {
                setAsignandoId(null);
            }
        };

        // Proyecto/versión efectivos del análisis en curso. `nombreProyecto` solo
        // se rellena al crear uno nuevo; en modo "continuar uno existente" (que es
        // justo el caso con versión anterior) hay que resolverlo del listado.
        const proyectoActual = useMemo(() => {
            const usandoExistente = proyectoMode === 'select' && proyectoSeleccionadoId;
            if (usandoExistente) {
                const p = (proyectosPrevios || []).find(x => x.id === proyectoSeleccionadoId);
                return {
                    id: proyectoSeleccionadoId,
                    nombre: (p && p.nombre) || '',
                    version: ((p && p.n_versiones) || 0) + 1,
                };
            }
            return { id: '', nombre: (nombreProyecto || '').trim(), version: 1 };
        }, [proyectoMode, proyectoSeleccionadoId, proyectosPrevios, nombreProyecto]);

        const loadProyectoDetalle = (proyectoId) => {
            setPanelView('detalle');
            setPanelProyectoActivo(null);
            setPanelExpandedVersion(null);
            fetch(`${API_URL}/api/proyectos/${proyectoId}`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (data && data.proyecto) setPanelProyectoActivo(data);
                })
                .catch(() => {});
        };

        const goBackToProyectos = () => {
            setPanelView('proyectos');
            setPanelProyectoActivo(null);
            setPanelExpandedVersion(null);
        };

        // Atajo desde el informe a la comparativa entre versiones: abre el panel
        // directamente en el detalle del proyecto y con "Progreso del proyecto"
        // ya desplegado (por defecto va colapsado, a 3 clicks de distancia).
        const handleVerComparativa = (proyectoId) => {
            if (!proyectoId) return;
            // Sin sesión, handleOpenPanel abre el modal de login y NO cambia de
            // pantalla: cargar el detalle dejaría el panel colgado en "Cargando".
            const { token } = getAuth();
            if (!panelAuth && !token) { openAuthModal('login'); return; }
            setPanelAvanceOpen(true);
            handleOpenPanel();
            loadProyectoDetalle(proyectoId);
        };

        // Normaliza una fila de análisis (sea row del historial panel o versión
        // de proyecto) en los mismos campos parseados que usa la tarjeta rica.
        const parseAnalisisRow = (row) => {
            const diag = row.diagnostico || '';
            let genero = '', fase = '', objetivo = '';
            if (typeof row.formulario === 'string') {
                const parts = row.formulario.split(' | ').map(p => p.trim());
                genero = parts[0] || '';
                fase = parts[1] || '';
                objetivo = parts[2] || '';
            } else if (row.formulario && typeof row.formulario === 'object') {
                genero = row.formulario.genero || '';
                fase = row.formulario.fase || '';
                objetivo = row.formulario.objetivo || '';
            }
            // Helper: lee una línea con prefijo "LABEL:" del texto diag.
            const lineField = (label) => {
                const re = new RegExp('^' + label + ':\\s*(.+)$', 'im');
                const m = diag.match(re);
                return m ? m[1].trim() : '';
            };
            const estado = lineField('ESTADO');
            const diagPrincipalRaw = lineField('DIAGN[ÓO]STICO PRINCIPAL');
            const diagPrincipal = diagPrincipalRaw.replace(/\s*\([^)]*\)\s*$/, '');
            const explicacion = lineField('Explicación');
            const prioRaw = lineField('PRIORIDADES');
            const prioridades = prioRaw
                ? prioRaw.split(' | ').map(p => p.replace(/^\d+\.\s*/, '').trim()).filter(Boolean)
                : [];
            const notaContextual = lineField('NOTA CONTEXTUAL');
            const motivacion = lineField('MOTIVACIÓN');
            const tipObjetivo = lineField('TIP OBJETIVO');
            const siguienteSesion = lineField('SIGUIENTE SESIÓN');
            const referenciaTemporal = lineField('REFERENCIA TEMPORAL');
            const balanceGrave = lineField('Balance grave');
            const densidad = lineField('Densidad');
            const loudnessLine = lineField('Loudness');
            const monoCompatLine = lineField('Mono compat');
            const harshnessLine = lineField('Harshness');
            const bpmMatch = diag.match(/BPM:\s*(\d+)/);
            const bpm = bpmMatch ? bpmMatch[1] : '';
            const durMatch = diag.match(/Duración:\s*(.+)/);
            const duracion = durMatch ? durMatch[1].trim().split(/\s*\|\s*|\n/)[0] : '';
            const lufsMatch = diag.match(/([-\d.]+)\s*LUFS/);
            const lufs = lufsMatch ? lufsMatch[1] : '';
            const fueUtil = row.fue_util || '';
            const comentario = row.comentario || '';
            const enlace = row.feedback_real || row.enlace_feedback_real || '';
            const est = estado.toLowerCase();
            const semaforo = est.includes('temprana') || est.includes('verde')
                ? { emoji: '🔴', color: '#f87171', bg: 'rgba(248,113,113,0.08)', border: '#7f1d1d', label: 'Fase temprana' }
                : est.includes('pulir') || est.includes('avanzado') || est.includes('azul')
                ? { emoji: '🔵', color: '#60a5fa', bg: 'rgba(96,165,250,0.08)', border: '#1e3a5f', label: 'Listo para pulir' }
                : { emoji: '🟡', color: '#facc15', bg: 'rgba(250,204,21,0.08)', border: '#713f12', label: 'En desarrollo' };
            return {
                diag, genero, fase, objetivo, estado, diagPrincipal, explicacion, prioridades,
                bpm, duracion, lufs, fueUtil, comentario, enlace, semaforo,
                notaContextual, motivacion, tipObjetivo, siguienteSesion, referenciaTemporal,
                balanceGrave, densidad, loudnessLine, monoCompatLine, harshnessLine,
            };
        };

        // Renderiza el "Diagnóstico completo" formateado en tarjetas (no <pre>).
        // Toma el row ya parseado y reproduce la estética de la pantalla original
        // de diagnóstico, hasta donde nos llega la información guardada en texto.
        const renderDiagnosticoCompleto = (parsed) => {
            const {
                diagPrincipal, explicacion, prioridades,
                notaContextual, motivacion, tipObjetivo, siguienteSesion, referenciaTemporal,
                balanceGrave, densidad, loudnessLine, monoCompatLine, harshnessLine,
                bpm, duracion, semaforo, estado,
            } = parsed;
            // Helper: color para el valor de una métrica de mezcla.
            const metricColor = (val, good, warn) => {
                const v = (val || '').toLowerCase();
                if (good.some(g => v.includes(g))) return 'accent-green';
                if (warn.some(w => v.includes(w))) return 'text-yellow-400';
                return 'text-red-400';
            };
            return (
                <div className="mt-3 space-y-3">
                    {/* Estado */}
                    {estado && (
                        <div className="rounded-lg px-4 py-3"
                             style={{ background: semaforo.bg, border: `1px solid ${semaforo.border}` }}>
                            <div className="flex items-center gap-2">
                                <span>{semaforo.emoji}</span>
                                <span className="text-sm" style={{ color: semaforo.color }}>{estado}</span>
                            </div>
                        </div>
                    )}
                    {/* Diagnóstico principal + explicación */}
                    {diagPrincipal && (
                        <div className="rounded-lg p-4" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.15)' }}>
                            <p className="text-gray-500 text-xs uppercase tracking-wider mb-2">Diagnóstico principal</p>
                            <p className="text-orange-400 text-sm font-medium">{diagPrincipal}</p>
                            {explicacion && <p className="text-gray-300 text-xs mt-2 leading-relaxed">{explicacion}</p>}
                        </div>
                    )}
                    {/* Nota contextual + motivación + referencia temporal */}
                    {(notaContextual || motivacion || referenciaTemporal) && (
                        <div className="rounded-lg p-4 bg-gray-900/40" style={{borderLeft: '3px solid var(--po-purple)'}}>
                            {motivacion && (
                                <p className="text-gray-200 text-sm font-medium mb-2">{motivacion}</p>
                            )}
                            {notaContextual && (
                                <p className="text-gray-300 text-sm leading-relaxed">{notaContextual}</p>
                            )}
                            {referenciaTemporal && (
                                <p className="text-gray-500 text-xs mt-3">{referenciaTemporal}</p>
                            )}
                        </div>
                    )}
                    {/* Prioridades */}
                    {prioridades.length > 0 && (
                        <div className="rounded-lg p-4 bg-gray-900/40">
                            <p className="text-xs accent-green font-medium uppercase tracking-wider mb-3">Prioridades</p>
                            <div className="space-y-2">
                                {prioridades.map((p, i) => (
                                    <div key={i} className="flex gap-2 items-start">
                                        <span className="flex-shrink-0 w-5 h-5 rounded-full bg-green-900 accent-green flex items-center justify-center text-xs font-bold">{i + 1}</span>
                                        <p className="text-gray-300 text-xs leading-relaxed pt-0.5">{p}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {/* Tip según objetivo */}
                    {tipObjetivo && (
                        <div className="rounded-lg p-4 bg-gray-900/40" style={{borderLeft: '3px solid #f59e0b'}}>
                            <p className="text-xs text-yellow-500 font-medium uppercase tracking-wider mb-2">Según tu objetivo</p>
                            <p className="text-gray-300 text-sm leading-relaxed">{tipObjetivo}</p>
                        </div>
                    )}
                    {/* Siguiente sesión */}
                    {siguienteSesion && (
                        <div className="rounded-lg p-4 bg-gray-900/40 border border-purple-900/40">
                            <p className="text-xs accent-purple font-medium uppercase tracking-wider mb-2">Tu próxima sesión</p>
                            <p className="text-white text-sm leading-relaxed">{siguienteSesion}</p>
                        </div>
                    )}
                    {/* Mezcla */}
                    {(balanceGrave || densidad || loudnessLine || monoCompatLine || harshnessLine || bpm || duracion) && (
                        <div className="rounded-lg p-4 bg-gray-900/40">
                            <p className="text-xs text-gray-400 font-medium uppercase tracking-wider mb-3">Mezcla</p>
                            <div className="space-y-2 text-sm">
                                {(bpm || duracion) && (
                                    <div className="flex flex-wrap gap-2 mb-2">
                                        {bpm && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{bpm} BPM</span>}
                                        {duracion && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{duracion}</span>}
                                    </div>
                                )}
                                {balanceGrave && (
                                    <div className="flex justify-between items-baseline">
                                        <span className="text-gray-400 text-xs">Balance grave</span>
                                        <span className={`text-xs ${metricColor(balanceGrave, ['normal'], ['elevado'])}`}>{balanceGrave}</span>
                                    </div>
                                )}
                                {densidad && (
                                    <div className="flex justify-between items-baseline">
                                        <span className="text-gray-400 text-xs">Densidad</span>
                                        <span className={`text-xs ${metricColor(densidad, ['baja','media'], ['alta'])}`}>{densidad}</span>
                                    </div>
                                )}
                                {loudnessLine && (
                                    <div>
                                        <span className="text-gray-400 text-xs">Loudness:</span>
                                        <span className="text-gray-300 text-xs ml-2">{loudnessLine}</span>
                                    </div>
                                )}
                                {monoCompatLine && (
                                    <div>
                                        <span className="text-gray-400 text-xs">Mono compat:</span>
                                        <span className="text-gray-300 text-xs ml-2">{monoCompatLine}</span>
                                    </div>
                                )}
                                {harshnessLine && (
                                    <div>
                                        <span className="text-gray-400 text-xs">Harshness:</span>
                                        <span className="text-gray-300 text-xs ml-2">{harshnessLine}</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Bloque expandido reutilizable (estado + diagnóstico + prioridades + datos + feedback + ver completo).
        const renderRichDetail = (parsed) => {
            const { diag, estado, semaforo, diagPrincipal, explicacion, prioridades,
                    genero, fase, objetivo, bpm, lufs, duracion, fueUtil, comentario, enlace } = parsed;
            return (
                <div className="border-t border-gray-800 fade-in">
                    <div className="px-4 py-3">
                        <div className="px-4 py-3 rounded-lg" style={{ background: semaforo.bg, border: `1px solid ${semaforo.border}` }}>
                            <span className="text-sm" style={{ color: semaforo.color }}>{estado || semaforo.label}</span>
                        </div>
                    </div>
                    {diagPrincipal && (
                        <div className="px-4 pb-3">
                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Diagnóstico principal</p>
                            <div className="rounded-lg p-3" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.15)' }}>
                                <p className="text-orange-400 text-sm font-medium">{diagPrincipal}</p>
                                {explicacion && <p className="text-gray-300 text-xs mt-2 leading-relaxed">{explicacion}</p>}
                            </div>
                        </div>
                    )}
                    {prioridades.length > 0 && (
                        <div className="px-4 pb-3">
                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Prioridades</p>
                            <div className="space-y-1.5">
                                {prioridades.map((p, i) => (
                                    <div key={i} className="flex items-start gap-2">
                                        <span className="flex-shrink-0 w-5 h-5 rounded-full bg-purple-900/40 accent-purple text-xs flex items-center justify-center font-medium">{i+1}</span>
                                        <p className="text-gray-300 text-xs leading-relaxed pt-0.5">{p}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    <div className="px-4 pb-3">
                        <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Datos</p>
                        <div className="flex flex-wrap gap-2">
                            {genero && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{genero}</span>}
                            {fase && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{fase}</span>}
                            {objetivo && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{objetivo}</span>}
                            {bpm && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{bpm} BPM</span>}
                            {lufs && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{lufs} LUFS</span>}
                            {duracion && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{duracion}</span>}
                        </div>
                    </div>
                    {(fueUtil || comentario || enlace) && (
                        <div className="px-4 pb-4">
                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Feedback</p>
                            {fueUtil && <p className="text-gray-400 text-xs mb-1">¿Fue útil? <span className={fueUtil === 'Sí' ? 'accent-green' : 'text-red-400'}>{fueUtil}</span></p>}
                            {comentario && <p className="text-gray-400 text-xs italic mb-1">"{comentario}"</p>}
                            {enlace && <div className="mt-1"><span className="accent-purple text-xs">Feedback real solicitado</span></div>}
                        </div>
                    )}
                    <div className="px-4 pb-4">
                        <details className="group">
                            <summary className="text-gray-500 text-xs cursor-pointer hover:text-gray-300 transition-colors">Ver diagnóstico completo</summary>
                            {renderDiagnosticoCompleto(parsed)}
                        </details>
                    </div>
                </div>
            );
        };

        // Devuelve una lista de 6 ítems concretos de salud de la mezcla, cada uno
        // pasado o pendiente, con su detalle. Sin números opacos: el usuario ve
        // exactamente qué falta para que cada ítem pase.
        //
        // Cada item: {label, passed: bool|null, detail}
        //   passed=null si el dato no está disponible (versión legacy / parseable).
        const computeChecklist = (v) => {
            const s = (v && v.senales) || {};
            const diag = (v && v.diagnostico) || '';
            const num = (x) => {
                const n = typeof x === 'number' ? x : parseFloat(x);
                return isNaN(n) ? null : n;
            };
            // Helper para extraer línea "LABEL: valor" del texto del diagnóstico.
            const lineField = (label) => {
                const re = new RegExp('^' + label + ':\\s*([^\\n|]+)', 'im');
                const m = diag.match(re);
                return m ? m[1].trim() : '';
            };
            // Item 1: Balance grave en rango
            const balance = lineField('Balance grave').toLowerCase();
            const balanceOk = balance === 'normal' ? true : (balance ? false : null);
            // Item 2: Sin brillo agresivo
            const h = num(s.harshness_pct);
            const harshOk = h === null ? null : h <= 18;
            // Item 3: Loudness en rango masterizable
            const lufs = num(s.lufs_integrado);
            const lufsOk = lufs === null ? null : (lufs <= -6 && lufs >= -22);
            // Item 4: Densidad sana
            const dens = lineField('Densidad').toLowerCase();
            const densOk = (dens === 'baja' || dens === 'media') ? true : (dens ? false : null);
            // Item 5: Compatibilidad mono
            const mono = lineField('Mono compat').toLowerCase();
            const monoOk = (mono === 'excelente' || mono === 'buena') ? true : (mono ? false : null);
            // Item 6: Estructura y aporte sólidos (catch-all de diagnósticos
            // estructurales/de capas/arreglos con severidad ≥ 2).
            const STRUCT_DIAG_IDS = new Set([
                'poco_contraste', 'problema_arreglo', 'mezcla_prematura',
                'carencia_espectral', 'pobreza_armonica', 'falta_impacto',
                'conflicto_armonico',
            ]);
            let structFailing = [];
            if (s.scores && typeof s.scores === 'object') {
                for (const [k, val] of Object.entries(s.scores)) {
                    const nv = typeof val === 'number' ? val : parseFloat(val);
                    if (!isNaN(nv) && nv >= 2 && STRUCT_DIAG_IDS.has(k)) {
                        structFailing.push(k);
                    }
                }
            }
            const structOk = structFailing.length === 0;

            return [
                { label: 'Mezcla balanceada en graves', passed: balanceOk,
                  detail: balance ? balance : 'sin datos' },
                { label: 'Sin brillo agresivo', passed: harshOk,
                  detail: h === null ? 'sin datos' : `${Math.round(h)}% de frames` },
                { label: 'Loudness apto para masterizar', passed: lufsOk,
                  detail: lufs === null ? 'sin datos' : `${lufs.toFixed(1)} LUFS` },
                { label: 'Densidad espectral sana', passed: densOk,
                  detail: dens ? dens : 'sin datos' },
                { label: 'Buena compatibilidad mono', passed: monoOk,
                  detail: mono ? mono : 'sin datos' },
                { label: 'Estructura, capas y arreglo sólidos', passed: structOk,
                  detail: structOk ? 'sin diagnósticos pendientes'
                                   : `${structFailing.length} ${structFailing.length === 1 ? 'aspecto pendiente' : 'aspectos pendientes'}` },
            ];
        };

        // Resumen del checklist: "N/6 puntos cubiertos".
        const checklistSummary = (items) => {
            const total = items.length;
            const ok = items.filter(i => i.passed === true).length;
            return { ok, total };
        };

        // Cambios significativos entre dos versiones: transiciones de items del
        // checklist (que pasaron / dejaron de pasar) + matices perceptivos en
        // métricas continuas (LUFS, dinámica).
        const describePerceptualDeltas = (vAnt, vAct) => {
            const out = [];
            // 1) Transiciones del checklist (lo más relevante).
            const itemsAnt = computeChecklist(vAnt);
            const itemsAct = computeChecklist(vAct);
            for (let i = 0; i < itemsAct.length; i++) {
                const a = itemsAnt[i], b = itemsAct[i];
                if (!a || !b) continue;
                if (a.passed === false && b.passed === true) {
                    out.push({ texto: `Ahora pasa: ${b.label}`, mejora: true });
                } else if (a.passed === true && b.passed === false) {
                    out.push({ texto: `Dejó de pasar: ${b.label}`, mejora: false });
                }
            }
            // 2) Matices perceptivos continuos (sin contar como pass/fail).
            const sA = (vAnt && vAnt.senales) || {};
            const sB = (vAct && vAct.senales) || {};
            const num = (x) => typeof x === 'number' ? x : parseFloat(x);
            const lA = num(sA.lufs_integrado), lB = num(sB.lufs_integrado);
            if (!isNaN(lA) && !isNaN(lB) && Math.abs(lB - lA) >= 0.5) {
                out.push(lB > lA
                    ? {texto: 'Suena con más nivel (más cuerpo y volumen)', mejora: null}
                    : {texto: 'Suena con más headroom para masterizar', mejora: null});
            }
            const dA = num(sA.rango_dinamico), dB = num(sB.rango_dinamico);
            if (!isNaN(dA) && !isNaN(dB) && Math.abs(dB - dA) >= 0.5) {
                out.push(dB > dA
                    ? {texto: 'Más dinámica, las partes respiran mejor', mejora: null}
                    : {texto: 'Más comprimida, pierde aire entre golpes', mejora: null});
            }
            return out;
        };

        // Fetch proyectos previos del usuario cuando se entra al cuestionario.
        // Lazy: no bloquea el render, si llega tarde el selector aparece tras él.
        useEffect(() => {
            if (screen !== 'questionnaire') return;
            const { token } = getAuth();
            if (!token) {
                setProyectosPrevios([]);
                setProyectoMode('new');
                return;
            }
            fetch(`${API_URL}/api/proyectos`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : { proyectos: [] })
                .then(data => {
                    const proys = (data && data.proyectos) || [];
                    setProyectosPrevios(proys);
                    // Si no tiene proyectos, modo "new" por defecto (input texto).
                    // Si tiene, modo "select" pero sin seleccionar nada todavía.
                    setProyectoMode(proys.length > 0 ? 'select' : 'new');
                    // Deep link del email de re-enganche: si el proyecto es suyo,
                    // se preselecciona (y el efecto de abajo prerrellena el form).
                    // Si no lo es o ya no existe, se ignora en silencio.
                    // Se consume una sola vez: sin esto, el siguiente track que
                    // analizase en la misma sesión se archivaría como versión
                    // del proyecto que venía en el email.
                    if (proyectoDeepLink) {
                        if (proys.some(p => p.id === proyectoDeepLink)) {
                            setProyectoMode('select');
                            setProyectoSeleccionadoId(proyectoDeepLink);
                        }
                        setProyectoDeepLink('');
                    }
                })
                .catch(() => {
                    setProyectosPrevios([]);
                    setProyectoMode('new');
                });
        }, [screen, proyectoDeepLink]);

        // Al elegir un proyecto existente, prerrellenar género/objetivo/dificultad
        // desde la última versión de ese proyecto. Fase, bloqueo y experiencia
        // se piden de nuevo (cambian entre versiones, o el usuario puede ser
        // distinto si está chequeando un proyecto ajeno).
        //
        // Nota: el `formulario` en Postgres guarda los LABELS (p.ej. "Tech House"),
        // no los `value` ("tech_house"). Mapeamos label → value antes de
        // setContexto para que los SelectField marquen la opción en morado.
        useEffect(() => {
            if (screen !== 'questionnaire') return;
            if (proyectoMode !== 'select' || !proyectoSeleccionadoId) {
                setPrefilledFromProyecto(false);
                return;
            }
            if (!opciones) return; // necesitamos las opciones para mapear label → value
            const ac = new AbortController();
            fetch(`${API_URL}/api/proyectos/${proyectoSeleccionadoId}`, {
                headers: authHeaders(),
                signal: ac.signal,
            })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (!data || !data.versiones || data.versiones.length === 0) return;
                    const ultima = data.versiones[data.versiones.length - 1];
                    const f = ultima.formulario || {};
                    // Mapea label → value usando la lista de opciones cargada.
                    const labelToValue = (opts, raw) => {
                        if (!raw || !opts) return '';
                        const s = String(raw).trim();
                        // Primero por value exacto (legacy o ya normalizado).
                        const byVal = opts.find(o => o.value === s);
                        if (byVal) return byVal.value;
                        // Luego por label exacto (case-insensitive).
                        const byLab = opts.find(o => o.label.toLowerCase() === s.toLowerCase());
                        return byLab ? byLab.value : '';
                    };

                    // Género: si la versión guardada empieza por "Otro:", marcamos 'otro'
                    // y rellenamos genero_custom con el sufijo.
                    let generoValue = '';
                    let generoCustom = ultima.genero_custom || '';
                    const rawGen = (f.genero || '').trim();
                    if (rawGen.toLowerCase().startsWith('otro:')) {
                        generoValue = 'otro';
                        if (!generoCustom) generoCustom = rawGen.slice(5).trim();
                    } else {
                        generoValue = labelToValue(opciones.generos, rawGen);
                    }
                    const objetivoValue = labelToValue(opciones.objetivos, f.objetivo);
                    const dificultadValue = labelToValue(opciones.dificultad_habitual, f.dificultad_habitual);
                    const faseValue = labelToValue(opciones.fases, f.fase);
                    const experienciaValue = labelToValue(opciones.experiencia, f.experiencia);

                    setContexto(prev => ({
                        ...prev,
                        genero: generoValue || prev.genero || '',
                        genero_custom: generoCustom || prev.genero_custom || '',
                        objetivo: objetivoValue || prev.objetivo || '',
                        dificultad_habitual: dificultadValue || prev.dificultad_habitual || '',
                        fase: faseValue || prev.fase || '',
                        experiencia: experienciaValue || prev.experiencia || '',
                        bloqueo_percibido: (f.bloqueo || prev.bloqueo_percibido || ''),
                    }));
                    setPrefilledFromProyecto(true);
                })
                .catch(() => {});
            return () => ac.abort();
        }, [screen, proyectoMode, proyectoSeleccionadoId, opciones]);

        // Si selecciona "Otro", debe escribir el género en el campo libre.
        // 64 de 95 usuarios marcaban "Otro" sin texto en la versión anterior;
        // hacerlo obligatorio nos da info real para futuras decisiones de catálogo.
        const otroGeneroValido = contexto.genero !== 'otro' || (contexto.genero_custom || '').trim().length >= 2;
        const isQuestionnaireValid = contexto.genero && otroGeneroValido && contexto.fase && contexto.objetivo && contexto.experiencia && contexto.dificultad_habitual;

        // ---- Cuestionario completo: si hay sesión analiza ya, si no abre modal de auth ----
        const handleGoToEmail = () => {
            trackEvent('funnel_questionnaire_completed', {
                genero: contexto.genero,
                fase: contexto.fase,
                experiencia: contexto.experiencia,
            });
            const saved = getAuth();
            if (panelAuth || saved.token) {
                runAnalysis();
            } else {
                // Sin sesión: abrir modal y memorizar que hay que analizar tras auth
                setPendingAfterAuth('analyze');
                openAuthModal('login');
            }
        };

        // ---- Lanzar el análisis del track (asume que hay sesión) ----
        const runAnalysis = async () => {
            setEmailError('');
            setScreen('processing');
            setError(null);
            trackEvent('funnel_analysis_started', {
                genero: contexto.genero,
                experiencia: contexto.experiencia,
            });

            const formData = new FormData();
            formData.append('audio', file);
            if (fileRef) formData.append('audio_ref', fileRef);
            Object.entries(contexto).forEach(([k, v]) => formData.append(k, v));

            try {
                const resp = await fetch(`${API_URL}/api/diagnostico`, {
                    method: 'POST',
                    body: formData,
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || 'Error procesando el track');
                }
                const data = await resp.json();

                // El email para guardar en Sheets viene de la sesión activa
                const savedAuth = getAuth();
                const sessionEmail = panelAuth || savedAuth.email || '';
                if (sessionEmail) setUserEmail(sessionEmail);

                setResultado(data);
                // Guardar en historial
                guardarEnHistorial(file.name, contexto, data, nombreProyecto);
                setHistorialCount(obtenerHistorial().length);
                // Construir texto formulario
                const labelMap = {
                    genero: opciones?.generos,
                    fase: opciones?.fases,
                    objetivo: opciones?.objetivos,
                    experiencia: opciones?.experiencia,
                    dificultad_habitual: opciones?.dificultad_habitual,
                };
                const getLabel = (field, value) => {
                    const opts = labelMap[field];
                    if (!opts) return value;
                    const found = opts.find(o => o.value === value);
                    return found ? found.label : value;
                };
                const generoLabel = contexto.genero === 'otro' && contexto.genero_custom
                    ? `Otro: ${contexto.genero_custom}`
                    : getLabel('genero', contexto.genero);
                const formularioTexto = [
                    generoLabel,
                    getLabel('fase', contexto.fase),
                    getLabel('objetivo', contexto.objetivo),
                    getLabel('experiencia', contexto.experiencia),
                    getLabel('dificultad_habitual', contexto.dificultad_habitual),
                    contexto.bloqueo_percibido ? `Bloqueo: ${contexto.bloqueo_percibido}` : '',
                ].filter(Boolean).join(' | ');

                // Construir informe diagnóstico completo
                const dx = data;
                const da = dx.datos_audio || {};
                let informe = '';
                // Estado
                informe += `ESTADO: ${dx.estado_texto || dx.estado_track || ''}\n`;
                // Diagnóstico principal
                informe += `DIAGNÓSTICO PRINCIPAL: ${dx.diagnostico_principal?.titulo || ''} (${dx.diagnostico_principal?.id || ''})\n`;
                informe += `Explicación: ${dx.diagnostico_principal?.explicacion || ''}\n`;
                // Diagnóstico secundario
                if (dx.diagnostico_secundario) {
                    informe += `DIAGNÓSTICO SECUNDARIO: ${dx.diagnostico_secundario.titulo} (${dx.diagnostico_secundario.id})\n`;
                }
                // Prioridades
                if (dx.prioridades && dx.prioridades.length > 0) {
                    informe += `PRIORIDADES: ${dx.prioridades.map((p, i) => `${i+1}. ${p}`).join(' | ')}\n`;
                }
                // Sugerencias de estructura
                if (dx.sugerencias_estructura && dx.sugerencias_estructura.length > 0) {
                    informe += `ESTRUCTURA (qué tocar y dónde): ${dx.sugerencias_estructura.map((s, i) => `${i+1}. ${s}`).join(' | ')}\n`;
                }
                // Comparación con track de referencia
                if (dx.comparacion_referencia && !dx.comparacion_referencia.error) {
                    const cr = dx.comparacion_referencia;
                    const difs = (cr.diferencias || []).map((d, i) => `${i+1}. ${d.label} (${d.severidad ? d.severidad + ' — ' : ''}${d.magnitud}): ${d.texto}`).join(' | ');
                    informe += `COMPARACIÓN CON REFERENCIA${cr.ref_filename ? ` (${cr.ref_filename})` : ''}: ${difs || 'sin diferencias relevantes'}`;
                    if (cr.coincidencias && cr.coincidencias.length > 0) informe += ` | A la par en: ${cr.coincidencias.join(', ')}`;
                    if (cr.loudness_contexto && cr.loudness_contexto.nota) informe += ` | Loudness: ${cr.loudness_contexto.nota}`;
                    if (cr.avisos && cr.avisos.length > 0) informe += ` | Avisos: ${cr.avisos.join(' / ')}`;
                    informe += '\n';
                }
                // Nota contextual
                if (dx.nota_contextual) informe += `NOTA CONTEXTUAL: ${dx.nota_contextual}\n`;
                if (dx.nota_motivacional) informe += `MOTIVACIÓN: ${dx.nota_motivacional}\n`;
                // Tips género
                if (dx.tips_genero && dx.tips_genero.length > 0) {
                    informe += `TIPS GÉNERO: ${dx.tips_genero.join(' | ')}\n`;
                }
                // No tocar
                if (dx.no_tocar_aun && dx.no_tocar_aun.length > 0) {
                    informe += `NO TOCAR AÚN: ${dx.no_tocar_aun.join(' | ')}\n`;
                }
                // Tip objetivo
                if (dx.tip_objetivo) informe += `TIP OBJETIVO: ${dx.tip_objetivo}\n`;
                // Siguiente sesión
                if (dx.siguiente_sesion) informe += `SIGUIENTE SESIÓN: ${dx.siguiente_sesion}\n`;
                // Error de foco
                if (dx.error_de_foco) informe += `ATENCIÓN: ${dx.error_de_foco_mensaje}\n`;
                // Referencia temporal
                if (dx.referencia_temporal) informe += `REFERENCIA TEMPORAL: ${dx.referencia_temporal}\n`;
                // Disclaimer
                if (dx.disclaimer) informe += `DISCLAIMER: ${dx.disclaimer}\n`;
                // Alcance del análisis
                if (dx.alcance_analisis) informe += `QUÉ EVALÚA: ${dx.alcance_analisis}\n`;
                // Datos de mezcla
                informe += `--- MEZCLA ---\n`;
                informe += `BPM: ${da.bpm != null ? da.bpm : 'no detectado'} | Duración: ${da.duracion || '?'}\n`;
                informe += `Balance grave: ${da.balance_grave || '?'}\n`;
                informe += `Densidad: ${da.densidad || '?'}\n`;
                if (da.loudness) {
                    informe += `Loudness: ${da.loudness.lufs_integrado} LUFS (${da.loudness.nivel}) | Pico: ${da.loudness.lufs_short_term_max} LUFS | Rango: ${da.loudness.rango_loudness} LU\n`;
                    // OJO: `!= null` y no truthiness. Con `&&`, un true peak de
                    // 0.0 (o -0.0) es falsy y la línea desaparecía del informe:
                    // se perdieron ~4-5% de análisis, justo los del filo.
                    const _tp = da.loudness.true_peak_dbtp;
                    const _sp = da.loudness.sample_peak_dbfs;
                    const _cat = da.loudness.categoria_picos;
                    if (_tp != null && !isNaN(_tp) && _tp > -99) {
                        // Taxonomía v2: la línea NO lleva "(clipping)". Ese
                        // vocabulario era incorrecto y contaminaría los datos
                        // nuevos con una definición que ya sabemos falsa.
                        // Sin taxonomía (no debería pasar) se mantiene el
                        // formato antiguo para no perder el dato.
                        informe += _cat
                            ? `True peak: ${_tp.toFixed(1)} dBTP\n`
                            : `True peak: ${_tp.toFixed(1)} dBTP${da.loudness.nivel_true_peak ? ` (${da.loudness.nivel_true_peak})` : ''}\n`;
                    }
                    if (_sp != null && !isNaN(_sp) && _sp > -99) {
                        informe += `Sample peak: ${_sp.toFixed(1)} dBFS\n`;
                    }
                    if (_cat) {
                        informe += `Categoría de picos: ${_cat}\n`;
                        informe += `Taxonomía de picos: v${da.loudness.peak_taxonomy_version || 2}\n`;
                    }
                    // Fase 2B. `!= null` otra vez a propósito: un recuento de 0
                    // es un dato (no hay recorte), no una ausencia de dato.
                    const _rec = da.loudness.categoria_recorte;
                    if (_rec) {
                        informe += `Recorte de muestras: ${_rec}\n`;
                        if (da.loudness.muestras_en_techo_total != null && da.loudness.recorte_medible) {
                            informe += `Muestras en el techo: ${da.loudness.muestras_en_techo_total}`;
                            informe += ` (${da.loudness.pct_muestras_en_techo}%)`;
                            informe += ` | Meseta más larga: ${da.loudness.racha_maxima_ms} ms\n`;
                        }
                    }
                }
                if (da.mono_compat) {
                    informe += `Mono compat: ${da.mono_compat.nivel_compatibilidad || 'N/A'}`;
                    if (da.mono_compat.es_stereo) {
                        informe += ` | Correlación: ${(da.mono_compat.correlacion_lr * 100).toFixed(0)}% | Pérdida: ${da.mono_compat.perdida_mono_db}dB`;
                        if (da.mono_compat.bandas) {
                            informe += ` | Graves: ${da.mono_compat.bandas.graves?.estado} | Medios: ${da.mono_compat.bandas.medios?.estado} | Agudos: ${da.mono_compat.bandas.agudos?.estado}`;
                        }
                    }
                    informe += '\n';
                }
                if (da.harshness) {
                    informe += `Harshness: ${da.harshness.tiene_harshness ? da.harshness.nivel : 'no'} | p95: ${da.harshness.pico_p95?.toFixed(1) || '?'}dB | ${da.harshness.pct_frames_harsh?.toFixed(0) || '?'}% frames\n`;
                }
                // Scores
                if (dx.scores) {
                    informe += `SCORES: ${Object.entries(dx.scores).map(([k,v]) => `${k}=${v}`).join(', ')}\n`;
                }

                // Construir señales crudas para calibración del motor
                const senales = {
                    // Identificación
                    bpm: da.bpm,
                    tempo_detectado: da.tempo_detectado,
                    tempo_fuente: da.tempo_fuente,
                    duracion: da.duracion,
                    // Espectro y balance
                    balance_grave: da.balance_grave,
                    db_grave: dx.senales?.db_grave,
                    db_media: dx.senales?.db_media,
                    db_aguda: dx.senales?.db_aguda,
                    diff_grave_media: dx.senales?.diff_grave_media,
                    densidad: da.densidad,
                    densidad_espectral: dx.senales?.densidad_espectral,
                    // Dinámica y estructura
                    contraste: da.contraste,
                    varianza_energia: dx.senales?.varianza_energia,
                    rango_dinamico: dx.senales?.rango_dinamico,
                    tiene_desarrollo: da.desarrollo_temporal,
                    cambios_significativos: dx.senales?.cambios_significativos,
                    n_bloques: da.n_bloques,
                    madurez: dx.senales?.madurez_estimada,
                    // Distribución
                    break_largo: da.distribucion?.break_largo,
                    drop_corto: da.distribucion?.drop_corto,
                    sin_intro: da.distribucion?.sin_intro,
                    sin_outro: da.distribucion?.sin_outro,
                    estructura_problematica: da.distribucion?.estructura_problematica,
                    // Armonía
                    key: da.armonia?.key,
                    modo: da.armonia?.modo,
                    key_confidence: da.armonia?.key_confidence,
                    contenido_tonal: da.armonia?.contenido_tonal,
                    consistencia_armonica: da.armonia?.consistencia_armonica,
                    complejidad_armonica: da.armonia?.complejidad_armonica,
                    ratio_tonal_percusivo: da.armonia?.ratio_tonal_percusivo,
                    n_notas_activas: da.armonia?.n_notas_activas,
                    // Loudness
                    lufs_integrado: da.loudness?.lufs_integrado,
                    lufs_short_term_max: da.loudness?.lufs_short_term_max,
                    rango_loudness: da.loudness?.rango_loudness,
                    nivel_loudness: da.loudness?.nivel,
                    // Picos — sin redondear, tal cual los mide el backend
                    true_peak_dbtp: da.loudness?.true_peak_dbtp,
                    sample_peak_dbfs: da.loudness?.sample_peak_dbfs,
                    nivel_true_peak: da.loudness?.nivel_true_peak,
                    // Taxonomía de picos (fase 2A). El campo de arriba se
                    // conserva para no romper parsers ni el histórico.
                    categoria_picos: da.loudness?.categoria_picos,
                    peak_taxonomy_version: da.loudness?.peak_taxonomy_version,
                    peak_algorithm_version: dx.versiones?.peak_algorithm_version,
                    true_peak_classification_value: da.loudness?.true_peak_classification_value,
                    sample_peak_classification_value: da.loudness?.sample_peak_classification_value,
                    severidad_picos: da.loudness?.severidad_picos,
                    // Estado del método de medición (no del archivo)
                    sample_peak_source: da.loudness?.sample_peak_source,
                    true_peak_method: da.loudness?.true_peak_method,
                    true_peak_oversampling: da.loudness?.true_peak_oversampling,
                    true_peak_validated: da.loudness?.true_peak_validated,
                    categoria_recorte: da.loudness?.categoria_recorte,
                    recorte_medible: da.loudness?.recorte_medible,
                    severidad_recorte: da.loudness?.severidad_recorte,
                    muestras_en_techo_total: da.loudness?.muestras_en_techo_total,
                    pct_muestras_en_techo: da.loudness?.pct_muestras_en_techo,
                    racha_maxima_ms: da.loudness?.racha_maxima_ms,
                    n_mesetas: da.loudness?.n_mesetas,
                    canal_afectado: da.loudness?.canal_afectado,
                    concentracion_en_transitorios: da.loudness?.concentracion_en_transitorios,
                    true_peak_ground_truth_validation_passed: da.loudness?.true_peak_ground_truth_validation_passed,
                    true_peak_internal_validation_passed: da.loudness?.true_peak_internal_validation_passed,
                    true_peak_external_validation_passed: da.loudness?.true_peak_external_validation_passed,
                    peak_measurement_sample_rate: da.loudness?.peak_measurement_sample_rate,
                    peak_measurement_channels: da.loudness?.peak_measurement_channels,
                    // Metadatos del archivo — solo registro, nada los usa aún
                    archivo_extension: da.formato?.archivo_extension,
                    archivo_container: da.formato?.archivo_container,
                    archivo_codec: da.formato?.archivo_codec,
                    archivo_subtype: da.formato?.archivo_subtype,
                    archivo_sample_format: da.formato?.archivo_sample_format,
                    archivo_storage_bits: da.formato?.archivo_storage_bits,
                    archivo_pcm_bit_depth: da.formato?.archivo_pcm_bit_depth,
                    archivo_sample_rate: da.formato?.archivo_sample_rate,
                    archivo_canales: da.formato?.archivo_canales,
                    archivo_lossy: da.formato?.archivo_lossy,
                    archivo_metadata_source: da.formato?.archivo_metadata_source,
                    // Mono compatibility
                    es_stereo: da.mono_compat?.es_stereo,
                    correlacion_lr: da.mono_compat?.correlacion_lr,
