                <div className="rounded-lg border border-[#2a2a2a] flex items-center justify-center"
                     style={{ background: '#15171a', height: 150 }}>
                    <span className="v2-sec text-gray-600">Esperando análisis espectral</span>
                </div>
            );
        }

        // --- Escala ---------------------------------------------------------
        // El 0 es el cuerpo del tema (200 Hz–2 kHz), no su banda más alta. Ver
        // el comentario largo de V2_CORREDOR: anclar al pico dejaba el corredor
        // ciego al exceso de grave justo donde más importa.
        //
        // La ventana es +24…−30 (54 dB). Con la de antes (+18…−24) cada valle
        // de la curva parecía un precipicio y había tracks reales que se
        // recortaban planos contra el techo (medido: +18.5 en 50 Hz). El
        // margen extra comprime la curva un 22 % — mismo dato, menos drama —
        // y deja sitio de sobra por arriba. Es dibujo: el veredicto no mira
        // esta ventana.
        const ref = v2Referencia(puntos);
        const ARRIBA = 24, RANGO = 54;
        const PASO = 6;
        const F0 = 20, F1 = 16000;
        // AIRE es el margen de arriba y PIE el de abajo, en % de la caja. El de
        // arriba baja de 19 a 11: con la leyenda del corredor movida a la
        // esquina ya no hay nada que alojar ahí, y esos 8 puntos eran hueco
        // vacío entre el techo y el punto más alto del corredor (que cae en
        // 13 %). El de abajo sube a 9 porque las etiquetas de frecuencia se han
        // metido dentro de la caja.
        const H = 100, AIRE = 11, PIE = 9;
        const util = H - AIRE - PIE;
        const CANAL = 40;   // px del canal de etiquetas de nivel

        const x = f => v2EspectroX(f, F0, F1);
        const y = db => v2EspectroY(db, ARRIBA, RANGO, AIRE, util);

        // --- La curva del track ---------------------------------------------
        const rel = puntos.map(p => ({ f: p.f, v: p.v - ref }));
        const pts = rel.map(p => [x(p.f), y(p.v)]);
        const curva = v2CurvaSuave(pts);

        // --- El corredor de referencia --------------------------------------
        // Percentiles reales del corpus (ver V2_CORREDOR), medidos por este
        // mismo camino. Es la única medida que hay: no queda ninguna otra
        // lectura del espectro con la que se pueda confundir.
        const corr = (() => {
            const arriba = V2_CORREDOR.map(c => [x(c.hz), y(c.hi)]);
            const abajo = V2_CORREDOR.map(c => [x(c.hz), y(c.lo)]);
            return {
                capas: v2NubeCorredor(x, y),
                // El centro estadístico, como banda p40-p60 difuminada y no
                // como línea: una mediana a trazos se leía como un dato más
                // que consultar, y solo es el "por aquí pasa el medio de la
                // distribución". Una lomita de densidad lo dice sin hablar.
                nucleo: v2PathCorredor(
                    V2_CORREDOR.map(c => [x(c.hz), y(v2PctCorredor(c, 60))]),
                    V2_CORREDOR.map(c => [x(c.hz), y(v2PctCorredor(c, 40))])),
                borde: v2CurvaSuave(arriba),
                bordeBajo: v2CurvaSuave(abajo),
            };
        })();

        // --- Tramos con desviación real -------------------------------------
        // Solo se tiñen los tramos que el motor ya ha marcado. Sin rachas, la
        // curva entera se queda blanca: la estética no fabrica problemas.
        const comp = veredicto;
        const rachas = (comp && comp.rachas) || [];
        const tramos = rachas.map(r => {
            const dentro = rel.filter(p => p.f >= r.desde && p.f <= r.hasta);
            if (dentro.length < 2) return null;
            // Se alarga medio punto a cada lado para que empalme con la blanca.
            const i0 = rel.findIndex(p => p.f === dentro[0].f);
            const i1 = rel.findIndex(p => p.f === dentro[dentro.length - 1].f);
            const trozo = rel.slice(Math.max(0, i0 - 1), Math.min(rel.length, i1 + 2));
            return {
                d: v2CurvaSuave(trozo.map(p => [x(p.f), y(p.v)])),
                color: Math.abs(r.db) >= 6 ? V2_COLOR.alerta : V2_COLOR.aviso,
                clave: `${r.desde}-${r.hasta}`,
            };
        }).filter(Boolean);
        const aviso = rachas.length ? rachas[0] : null;

        // --- Marcas del motor (frecuencia áspera) ---------------------------
        const marcasReales = (marcas || []).filter(m => m && m.f > 20 && m.f <= F1);

        // --- Rejillas --------------------------------------------------------
        const escalones = [];
        for (let db = ARRIBA; db >= ARRIBA - RANGO; db -= PASO) escalones.push(db);
        const finas = [30, 40, 60, 80, 150, 300, 400, 600, 800, 1500, 3000, 4000, 6000, 8000];
        const rotuladas = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 16000];
        // En móvil sobran la mitad: se marcan las que aguantan una columna estrecha.
        const esenciales = new Set([20, 100, 500, 1000, 5000, 16000]);
        const etiquetaHz = f => (f >= 1000 ? `${f / 1000}k` : `${f}`);

        // Techo real del archivo: un MP3 comprimido se corta antes de 16 kHz.
        const techoArchivo = detallado && fino.techo_hz ? fino.techo_hz : F1;
        const archivoLimitado = techoArchivo < F1;

        return (
            <div>
                {/* Aquí vivía la fila "Espectro, como tu analizador" con el
                    conmutador Oído/Espectro. Retirado el conmutador, la fila se
                    quedaba con un rótulo solo a la izquierda y medio ancho
                    vacío a la derecha, y costaba 30 px de la cabecera que
                    justamente había que apretar. Lo que decía sigue dicho: la
                    ficha de la esquina lleva el "+4.5 dB/oct" —la convención de
                    SPAN y Pro-Q— y "Cómo leer este gráfico" lo desarrolla. */}

                {/* Alto por proporción y no fijo. Con 292 px clavados, en una
                    tarjeta a todo lo ancho el gráfico salía a 4:1 —un panorama
                    en el que 10 dB de diferencia se veían como una ondulación—
                    mientras que en móvil quedaba casi cuadrado. Atado al ancho,
                    la pendiente de la curva significa lo mismo en cualquier
                    pantalla. Los topes evitan los dos extremos: que en móvil se
                    quede en una tira y que en un monitor ancho ocupe la
                    pantalla entera. */}
                <div className="relative rounded-lg overflow-hidden"
                     style={{ background: '#15171a', border: '1px solid #212429',
                              // El ancho va explícito: sin él, al morder el tope de
                              // alto el navegador estrecha también la caja para
                              // conservar la proporción y deja un hueco a la derecha.
                              width: '100%', aspectRatio: '2.4 / 1',
                              minHeight: 250, maxHeight: 470 }}>

                    {/* Canal de niveles. En HTML: el SVG se estira a lo ancho y
                        cualquier texto dentro saldría deformado. */}
                    <div className="absolute left-0 top-0 bottom-0 z-10" style={{ width: CANAL }}>
                        <span className="absolute cifra-v2"
                              style={{ left: 8, top: 9, fontSize: '8.5px', color: '#55555e' }}>
                            dB
                        </span>
                        {escalones.map(db => (
                            <span key={db} className="absolute cifra-v2"
                                  style={{ right: 6, top: `${y(db)}%`,
                                           transform: 'translateY(-50%)', fontSize: '9px',
                                           color: db === 0 ? '#a5a5ad' : '#565660' }}>
                                {db === 0 ? '0' : (db > 0 ? `+${db}` : `−${-db}`)}
                            </span>
                        ))}
                    </div>

                    <div className="absolute top-0 bottom-0" style={{ left: CANAL, right: 0 }}>
                        <svg viewBox={`0 0 100 ${H}`} preserveAspectRatio="none"
                             style={{ width: '100%', height: '100%', display: 'block' }}
                             role="img"
                             aria-label={comp
                                 ? (comp.dentro
                                     ? 'Espectro dentro del rango de referencia'
                                     : `Espectro fuera de la referencia en ${comp.rachas.map(r => r.zona).join(', ')}`)
                                 : 'Espectro del track'}>
                            <defs>
                                {/* El corredor se desvanece por debajo de 50 Hz, que es
                                    donde deja de juzgarse: ahí mide más de 20 dB de ancho
                                    y no distingue nada. Además era la mancha más pesada
                                    del gráfico, justo en la zona que menos informa.
                                    Por la derecha se remata con una pluma corta —poco más
                                    de una banda— solo para que el corredor no termine en
                                    un tajo vertical. Es acabado, no recorte: donde el
                                    corredor deja de opinar sigue siendo 12.5 kHz. */}
                                <linearGradient id="v2corrFade" x1="0" y1="0" x2="1" y2="0"
                                                gradientUnits="objectBoundingBox">
                                    {/* La rampa del subgrave es cóncava a propósito: entre
                                        20 y 40 Hz apenas levanta y solo llega a plena
                                        opacidad en 50, donde empieza a juzgarse. Lineal, el
                                        corredor —que ahí es anchísimo— pesaba en pantalla
                                        más que la zona que sí opina. */}
                                    <stop offset="0%" stopColor="#fff" stopOpacity="0" />
                                    <stop offset={`${x(31.5) / 100}`}
                                          stopColor="#fff" stopOpacity="0.14" />
                                    <stop offset={`${x(40) / 100}`}
                                          stopColor="#fff" stopOpacity="0.4" />
                                    <stop offset={`${x(V2_VEREDICTO_DESDE) / 100}`}
                                          stopColor="#fff" stopOpacity="1" />
                                    <stop offset={`${x(11000) / 100}`}
                                          stopColor="#fff" stopOpacity="1" />
                                    <stop offset={`${x(12500) / 100}`}
                                          stopColor="#fff" stopOpacity="0" />
                                    <stop offset="100%" stopColor="#fff" stopOpacity="0" />
                                </linearGradient>
                                {/* Difuminado leve sobre la nube entera. La caja se
                                    estira, así que el radio va desigual a propósito: en X
                                    un punto de viewBox vale muchos más píxeles que en Y, y
                                    con el mismo número el borde de arriba saldría nítido
                                    y los laterales borrosos. */}
                                <filter id="v2corrHalo" x="-6%" y="-18%" width="112%" height="136%">
                                    <feGaussianBlur stdDeviation="0.075 0.32" />
                                </filter>
                                <mask id="v2corrMask" maskUnits="userSpaceOnUse"
                                      x="0" y="0" width="100" height={H}>
                                    <rect x="0" y="0" width="100" height={H} fill="url(#v2corrFade)" />
                                </mask>
                            </defs>

                            {/* Rejilla al mínimo legible. Las verticales llegan hasta el
                                pie de la caja pero no lo cruzan, para que las cifras de
                                frecuencia no queden tachadas. */}
                            {finas.map(f => (
                                <line key={f} x1={x(f)} x2={x(f)} y1="0" y2={H - PIE}
                                      stroke="#1a1c20" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                            ))}
                            {rotuladas.map(f => (
                                <line key={f} x1={x(f)} x2={x(f)} y1="0" y2={H - PIE}
                                      stroke="#1e2126" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                            ))}
                            {escalones.map(db => (
                                <line key={db} x1="0" x2="100" y1={y(db)} y2={y(db)}
                                      stroke={db === 0 ? '#30333b' : '#202227'} strokeWidth="1"
                                      vectorEffect="non-scaling-stroke"
                                      strokeDasharray={db === 0 ? '' : '1 9'} />
                            ))}

                            {/* Catorce capas de igual opacidad entre percentiles cada vez
                                más juntos. Se suman hacia el centro y se quedan solas en
                                los extremos, así que la nube se apaga sola hacia el 5 y
                                el 95 sin degradado postizo y sin escalón entre franjas.
                                Los filos de fuera quedan como un susurro: tienen que
                                poder localizarse si alguien los busca —son el límite que
                                juzga— pero no dibujar una caja. */}
                            {corr && (
                                <g className="v2-corredor" mask="url(#v2corrMask)">
                                    <g filter="url(#v2corrHalo)">
                                        {corr.capas.map((c, k) => (
                                            <path key={k} d={c.path} fill={V2_NUBE}
                                                  fillOpacity={c.op.toFixed(3)} />
                                        ))}
                                        <path d={corr.nucleo} fill={V2_NUBE} fillOpacity="0.07" />
                                        <path d={corr.borde} fill="none" stroke="#a191d0"
                                              strokeOpacity="0.12" strokeWidth="1"
                                              vectorEffect="non-scaling-stroke" />
                                        <path d={corr.bordeBajo} fill="none" stroke="#a191d0"
                                              strokeOpacity="0.07" strokeWidth="1"
                                              vectorEffect="non-scaling-stroke" />
                                    </g>
                                </g>
                            )}

                            {/* La curva. Blanca por defecto; los tramos marcados por el
                                motor se repintan encima con su color de severidad.
                                El halo va en dos pasadas de `drop-shadow` en vez de un
                                filtro SVG: `drop-shadow` trabaja en píxeles de pantalla,
                                así que no se deforma con la caja como sí le pasaría a un
                                feGaussianBlur dentro de un viewBox estirado. La cercana
                                pega la línea al fondo, la lejana la posa sobre la nube. */}
                            <path className="v2-curva" d={curva} fill="none" stroke="#e9ecef"
                                  strokeWidth="1.55" vectorEffect="non-scaling-stroke"
                                  strokeLinejoin="round" strokeLinecap="round"
                                  style={{ filter: 'drop-shadow(0 0 1px rgba(233,236,239,.13)) '
                                                 + 'drop-shadow(0 0 3px rgba(206,218,236,.03))' }} />
                            {/* Mismo grosor que la curva base, no más: teñir un
                                tramo ya lo destaca, engordarlo lo convierte en el
                                protagonista del gráfico. */}
                            {tramos.map(t => (
                                <path key={t.clave} d={t.d} fill="none" stroke={t.color}
                                      strokeWidth="1.55" vectorEffect="non-scaling-stroke"
                                      strokeLinejoin="round" strokeLinecap="round" />
                            ))}

                            {marcasReales.map((m, k) => (
                                <line key={k} x1={x(m.f)} x2={x(m.f)} y1="0" y2={H}
                                      stroke={m.color || V2_COLOR.aviso} strokeWidth="1"
                                      strokeOpacity="0.3" vectorEffect="non-scaling-stroke"
                                      strokeDasharray="2 5" />
                            ))}
                            {aviso && (
                                <line x1={x(aviso.pico.f)} x2={x(aviso.pico.f)}
                                      y1="0" y2={y(aviso.pico.v)}
                                      stroke={V2_COLOR.aviso} strokeOpacity="0.26" strokeWidth="1"
                                      vectorEffect="non-scaling-stroke" strokeDasharray="2 5" />
                            )}
                        </svg>
                    </div>

                    {/* Leyenda del corredor. Antes era una cápsula colgada de su borde
                        alto y, aunque flotaba sobre la nube, se leía como el nombre de
                        la frecuencia que tenía justo debajo. Aquí es una clave: la
                        muestra repite el degradado de la nube —tenue, densa, tenue— así
                        que nombra la mancha entera y ninguna zona en concreto. */}
                    {corr && (
                        <span className="absolute flex items-center gap-2"
                              style={{ left: CANAL + 4, top: 9, pointerEvents: 'none' }}>
                            <span style={{ width: 17, height: 9, borderRadius: 3,
                                           // Los mismos valores que alcanza la nube:
                                           // si la muestra no se le pareciera, la
                                           // leyenda no serviría de leyenda.
                                           background: 'linear-gradient(180deg,'
                                                     + ' rgba(139,124,204,.06) 0%,'
                                                     + ' rgba(139,124,204,.50) 50%,'
                                                     + ' rgba(139,124,204,.06) 100%)',
                                           boxShadow: 'inset 0 0 0 1px rgba(161,145,208,.14)' }} />
                            <span style={{ fontSize: '8.5px', letterSpacing: '.11em',
                                           fontWeight: 600, textTransform: 'uppercase',
                                           whiteSpace: 'nowrap', color: '#8b80aa' }}>
                                Rango de referencia
                            </span>
                        </span>
                    )}

                    {/* Ficha técnica: legible para quien la entiende, secundaria
                        para el resto. Dice de qué son los dB del eje, que con el
                        0 en el cuerpo del tema no es evidente, y con qué
                        inclinación se dibuja, que es la que permite cotejar el
                        gráfico con el analizador del DAW. */}
                    <span className="absolute cifra-v2"
                          style={{ right: 12, top: 10, fontSize: '8.5px',
                                   letterSpacing: '.03em', color: '#474750' }}>
                        {/* En estrecho solo la parte imprescindible: la completa
                            no cabe en 390 px y se montaba sobre la anotación. */}
                        <span className="hidden sm:inline">sobre el cuerpo del tema · </span>
                        {detallado ? '1/3 de octava' : '6 bandas'}
                        <span className="hidden sm:inline"> · +4.5 dB/oct</span>
                    </span>

                    {/* El señalador del aviso, en HTML: dentro del SVG el círculo
                        saldría ovalado y el texto deformado. */}
                    {aviso && (() => {
                        const izq = `calc(${CANAL}px + ${x(aviso.pico.f)}% * (100% - ${CANAL}px) / 100%)`;
                        const alto = Math.min(82, Math.max(14, y(aviso.pico.v)));
                        const arr = `${alto}%`;
                        const aLaDerecha = x(aviso.pico.f) > 56;
                        // Si el pico va alto, la anotación baja: encima del todo
                        // chocaría con la leyenda del corredor, que vive en esa
                        // esquina y no se puede mover a ningún otro sitio.
                        const debajo = alto < 30;
                        return (
                            <React.Fragment>
                                <span className="absolute"
                                      style={{ left: izq, top: arr, width: 7, height: 7,
                                               marginLeft: -3.5, marginTop: -3.5,
                                               borderRadius: '50%', background: '#15171a',
                                               border: `1.2px solid ${V2_COLOR.aviso}`,
                                               pointerEvents: 'none' }} />
                                <span className="absolute"
                                      style={{ left: izq,
                                               top: `calc(${arr} ${debajo ? '+ 14px' : '- 40px'})`,
                                               transform: aLaDerecha ? 'translateX(-100%)' : 'none',
                                               marginLeft: aLaDerecha ? -9 : 9,
                                               fontSize: '9.5px', lineHeight: 1.5,
                                               pointerEvents: 'none', maxWidth: 175,
                                               textAlign: aLaDerecha ? 'right' : 'left' }}>
                                    <span style={{ color: '#d5d7db', fontWeight: 500 }}>
                                        {aviso.z.tuyo}, {Math.abs(aviso.db).toFixed(0)} dB
                                    </span>
                                    <br />
                                    <span style={{ color: '#75757e' }}>
                                        {aviso.signo > 0 ? 'sobre' : 'bajo'} la referencia
                                    </span>
                                </span>
                            </React.Fragment>
                        );
                    })()}

                    {/* La escala de frecuencia, dentro de la caja. Fuera quedaba
                        flotando debajo del marco y el gráfico no se leía como una
                        pieza cerrada. El pie del SVG (PIE) le reserva su franja y las
                        verticales de la rejilla se paran ahí, así que nada la cruza. */}
                    <div className="absolute" style={{ left: CANAL, right: 0, bottom: 7, height: 11 }}>
                        {rotuladas.map((f, i) => (
                            <span key={f}
                                  className={'absolute cifra-v2 ' + (esenciales.has(f) ? '' : 'hidden sm:inline')}
                                  style={{ left: `${x(f)}%`,
                                           transform: i === 0 ? 'translateX(0)'
                                                     : i === rotuladas.length - 1 ? 'translateX(-100%)'
                                                     : 'translateX(-50%)',
                                           fontSize: '9px', color: '#63636c' }}>
                                {etiquetaHz(f)}
                            </span>
                        ))}
                    </div>
                    <span className="absolute cifra-v2"
                          style={{ right: 11, bottom: 20, fontSize: '8px', color: '#494952' }}>Hz</span>
                </div>

                {marcasReales.map((m, k) => (
                    <p key={k} className="v2-sec text-gray-500 mt-2">{m.texto}</p>
                ))}
                {archivoLimitado && (
                    <p className="v2-sec text-gray-600 mt-2">
                        Tu archivo no lleva nada por encima de{' '}
                        {(techoArchivo / 1000).toFixed(techoArchivo % 1000 ? 1 : 0)} kHz.
                    </p>
                )}
            </div>
        );
    }

    /** Medidor de un estado con varios escalones (densidad, contraste…). */
    function V2Escalones({ valores, actual, tonos }) {
        const i = valores.indexOf((actual || '').toLowerCase());
        return (
            <div>
                <div className="flex gap-1">
                    {valores.map((v, k) => {
                        const activo = k === i;
                        const tono = tonos && tonos[v] ? V2_COLOR[tonos[v]] : '#4a4a4a';
                        return (
                            <div key={v} className="flex-1">
                                <div className="rounded-sm" style={{
                                    height: 6,
                                    background: activo ? tono : (k < i ? '#3a3a3a' : '#242424'),
                                    border: activo ? 'none' : '1px solid #333',
                                }} />
                                <div className="text-[9px] mt-1 text-center capitalize"
                                     style={{ color: activo ? '#fff' : '#5a5a5a' }}>{v}</div>
                            </div>
                        );
                    })}
                </div>
            </div>
        );
    }

    /** Tutorial destacado de la cabecera v2. Ocupa el hueco del CTA de
     *  Relesit cuando el track todavía no está para buscar sello: si hay
     *  trabajo que hacer, lo útil no es una derivación sino el tutorial de
     *  Producción Online que enseña a hacerlo — el primero del mapa del
     *  diagnóstico principal, que es el que mejor se ajusta.
     *
     *  El player de YouTube no se incrusta hasta que el usuario pulsa: la
     *  página no carga scripts de terceros en cada informe, y el clic pasa
     *  por el MISMO tracking que los tutoriales de la lista (la métrica del
     *  dashboard sigue midiendo lo mismo). Tras el clic, reproduce aquí.
     */
    function V2TutorialDestacado({ tut, diagId, userEmail }) {
        const [reproduciendo, setReproduciendo] = useState(false);
        const vid = (tut.url.match(/[?&]v=([\w-]{11})/) || [])[1];
        const registrar = () => {
            try { trackEvent('tutorial_clicked', { diagnostico: diagId, tutorial: tut.titulo }); } catch (e) {}
            try {
                fetch(`${API_URL}/api/sheets/tutorial-click`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail || '', tutorial_clickado: tut.titulo }),
                }).catch(() => {});
            } catch (e) {}
        };
        return (
            <div className="card p-5 h-full flex flex-col">
                <div className="rotulo-v2 mb-3">Tutorial recomendado</div>
                <div className="relative rounded-lg overflow-hidden"
                     style={{ background: '#101015', aspectRatio: '16 / 9' }}>
                    {reproduciendo && vid ? (
                        <iframe src={`https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0`}
                                title={tut.titulo} className="absolute inset-0 w-full h-full"
                                style={{ border: 0 }}
                                allow="autoplay; encrypted-media; picture-in-picture"
                                allowFullScreen />
                    ) : (
                        <button type="button" className="absolute inset-0 w-full h-full group"
                                style={{ padding: 0, border: 0, background: 'transparent', cursor: 'pointer' }}
                                onClick={() => {
                                    registrar();
                                    if (vid) setReproduciendo(true);
                                    else window.open(tut.url, '_blank', 'noopener');
                                }}
                                aria-label={`Ver tutorial: ${tut.titulo}`}>
                            {vid && (
                                <img src={`https://i.ytimg.com/vi/${vid}/hqdefault.jpg`} alt="" loading="lazy"
                                     className="absolute inset-0 w-full h-full object-cover opacity-85 group-hover:opacity-100 transition" />
                            )}
                            <span className="absolute inset-0 flex items-center justify-center">
                                <span className="w-12 h-12 rounded-full flex items-center justify-center transition"
                                      style={{ background: 'rgba(0,0,0,0.62)' }}>
                                    <span style={{ width: 0, height: 0, marginLeft: '3px',
                                                   borderTop: '8px solid transparent',
                                                   borderBottom: '8px solid transparent',
                                                   borderLeft: '14px solid #fff' }} />
                                </span>
                            </span>
                        </button>
                    )}
                </div>
                <p className="text-white text-sm font-medium leading-snug mt-3">{tut.titulo}</p>
                <p className="text-gray-500 text-xs mt-1 leading-snug">{tut.descripcion}</p>
            </div>
        );
    }

    /** Barra de navegación de la v2.
     *
     * La vista clásica solo tiene un botón flotante "Mi panel" en una esquina,
     * que se encima al contenido cuando la ventana se estrecha. Aquí es una
     * barra de verdad: ocupa su sitio, se queda arriba al hacer scroll y
     * reúne las cuatro cosas que se pueden hacer desde un informe.
     */
    function V2Nav({ onNuevo, onPanel, onPerfil, sesionIniciada }) {
        return (
            <div className="v2-nav">
                <div className="v2-nav-inner">
                    <a href="/" onClick={e => { e.preventDefault(); onNuevo && onNuevo(); }}
                       className="mt-logo" style={{ fontSize: '17px', padding: 0 }}>
                        <span>ment</span>
                        <span className="mt-knob" aria-hidden="true">
                            <svg viewBox="0 0 100 100" width="100%" height="100%">
                                <circle cx="50" cy="50" r="46" fill="none" stroke="#25F464" strokeWidth="8" />
                                <line x1="50" y1="12" x2="50" y2="42" stroke="#25F464" strokeWidth="10"
                                      strokeLinecap="round" />
                            </svg>
                        </span>
                        <span>track</span>
                    </a>
                    <div className="v2-nav-links">
                        <button className="v2-nav-link" onClick={onPanel}>Mis proyectos</button>
                        <a href="/ideas">Ideas</a>
                        <button className="v2-nav-link" onClick={onPerfil}>
                            {sesionIniciada ? 'Mi perfil' : 'Entrar'}
                        </button>
                        {/* En móvil solo "Nuevo": con el texto completo el botón
                            se salía de la pantalla y había que arrastrar la barra
                            para alcanzar la acción principal. */}
                        <button className="v2-nav-cta" onClick={onNuevo} style={{ marginLeft: '0.5rem' }}>
                            Nuevo<span className="hidden sm:inline"> análisis</span>
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    /** Un paso del plan: número, avance y "cómo se hace". */
    function V2Paso({ n, texto }) {
        const par = v2Partir(texto);
        return (
            <div className="flex gap-3 items-start">
                <span className="flex-shrink-0 w-5 h-5 rounded border border-[#3a3a3a] text-gray-400 flex items-center justify-center text-[11px] font-semibold mt-0.5 cifra-v2">
                    {n}
                </span>
                <div className="min-w-0">
                    {par[1]
                        ? <V2Desplegable avance={par[0]} etiqueta="Cómo se hace"><p>{par[1]}</p></V2Desplegable>
                        : <p className="text-gray-300 v2-cuerpo">{par[0]}</p>}
                </div>
            </div>
        );
    }

    // ---- Pestañas del rediseño ------------------------------------------
    // Cada una recibe el resultado entero. Lo que necesita estado o red
    // (feedback, tutoriales, CTA) NO vive aquí: se le pasa ya montado desde
    // DiagnosticoScreen, para no duplicar la lógica que ya funciona.

    const V2_TABS = [
        { id: 'resumen', label: 'Resumen' },
        { id: 'plan', label: 'Plan de acción' },
        { id: 'mezcla', label: 'Mezcla' },
        { id: 'master', label: 'Máster' },
        { id: 'detalle', label: 'Detalle' },
    ];

    function V2TabResumen({ r, extras }) {
        const prioridades = (r.prioridades || []).slice(0, 3);
        const hayExtras = extras && (extras.derivacion || extras.tutoriales || extras.feedback);
        const cuantosExtras = extras
            ? [extras.derivacion, extras.tutoriales, extras.feedback].filter(Boolean).length : 0;
        return (
            <div className="space-y-4">
                {/* Las prioridades mandan: es lo que el productor va a hacer. El
                    qué-está-mal ya lo dice la cabecera, repetirlo aquí sería
                    poner la misma frase dos veces en la misma pantalla. */}
                {prioridades.length > 0 && (
                    <V2Tarjeta titulo="Qué hacer ahora" tono="ok">
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-6 gap-y-4">
                            {prioridades.map((pp, i) => <V2Paso key={i} n={i + 1} texto={pp} />)}
                        </div>
                        {r.prioridades.length > 3 && (
                            <p className="text-gray-600 v2-sec mt-4">
                                Hay {r.prioridades.length - 3} más en «Plan de acción».
                            </p>
                        )}
                    </V2Tarjeta>
                )}

                {r.aviso_genero && (
                    <V2Tarjeta titulo="Sobre tu género" tono="aviso">
                        <p className="text-gray-300 v2-cuerpo">{r.aviso_genero}</p>
                    </V2Tarjeta>
                )}

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    {r.diagnostico_principal && r.diagnostico_principal.explicacion && (
                        <V2Tarjeta titulo="Por qué lo decimos" tono="aviso">
                            {r.diagnostico_principal.explicacion.split('\n').filter(Boolean).map((l, i) => (
                                <p key={i} className="text-gray-300 v2-cuerpo">{l}</p>
                            ))}
                        </V2Tarjeta>
                    )}
                    {r.nota_contextual && (
                        <V2Tarjeta titulo="Para tu caso concreto">
                            <V2Desplegable avance={v2Partir(r.nota_contextual, 110)[0]}>
                                <p>{v2Partir(r.nota_contextual, 110)[1]}</p>
                            </V2Desplegable>
                        </V2Tarjeta>
                    )}
                    {r.siguiente_sesion && (
                        <V2Tarjeta titulo="Tu próxima sesión">
                            <V2Desplegable avance={v2Partir(r.siguiente_sesion, 100)[0]}>
                                <p>{v2Partir(r.siguiente_sesion, 100)[1]}</p>
                            </V2Desplegable>
                        </V2Tarjeta>
                    )}
                </div>

                {(r.error_de_foco || r.diagnostico_secundario) && (
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        {r.error_de_foco && (
                            <V2Tarjeta titulo="Ojo con dónde pones el esfuerzo" tono="aviso"
                                       ancho={r.diagnostico_secundario ? 'lg:col-span-2' : 'lg:col-span-3'}>
                                <p className="text-gray-300 v2-cuerpo">{r.error_de_foco_mensaje}</p>
                            </V2Tarjeta>
                        )}
                        {r.diagnostico_secundario && (
                            <V2Tarjeta titulo="Segundo frente"
                                       ancho={r.error_de_foco ? '' : 'lg:col-span-3'}>
                                <p className="text-gray-300 v2-cuerpo">{r.diagnostico_secundario.titulo}</p>
                            </V2Tarjeta>
                        )}
                    </div>
                )}

                {/* En una línea fina, no en tarjeta: como tarjeta se quedaba
                    sola en su fila dejando dos huecos. */}
                {r.referencia_temporal && (
                    <p className="text-gray-600 text-xs">{r.referencia_temporal}</p>
                )}

                {/* Lo que rodea al diagnóstico va AQUÍ, en la primera pantalla:
                    metido tras una pestaña no lo vería nadie. La rejilla se
                    ajusta a cuántas tarjetas haya, para no dejar huecos. */}
                {hayExtras && (
                    <div className={`grid grid-cols-1 gap-4 pt-1 ${
                        cuantosExtras >= 3 ? 'lg:grid-cols-3'
                        : cuantosExtras === 2 ? 'lg:grid-cols-2' : ''}`}>
                        {extras.derivacion}
                        {extras.tutoriales}
                        {extras.feedback}
                    </div>
                )}
            </div>
        );
    }

    function V2TabPlan({ r }) {
        return (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div className="space-y-4">
                    <V2Tarjeta titulo="Todas las prioridades, en orden" tono="ok">
                        <div className="space-y-3">
                            {(r.prioridades || []).map((pp, i) => <V2Paso key={i} n={i + 1} texto={pp} />)}
                        </div>
                    </V2Tarjeta>
                    {r.sugerencias_estructura && r.sugerencias_estructura.length > 0 && (
                        <V2Tarjeta titulo="Estructura: dónde tocar">
                            <ul className="space-y-2">
                                {r.sugerencias_estructura.map((x, i) => (
                                    <li key={i} className="text-gray-300 v2-cuerpo flex gap-2">
                                        <span className="text-gray-600 flex-none">—</span>{x}
                                    </li>
                                ))}
                            </ul>
                        </V2Tarjeta>
                    )}
                </div>
                <div className="space-y-4">
                    {r.no_tocar_aun && r.no_tocar_aun.length > 0 && (
                        <V2Tarjeta titulo="No toques esto todavía" tono="aviso">
                            <p className="text-gray-600 v2-sec mb-3">
                                Tan importante como lo que hay que hacer: lo que va a hacerte perder el tiempo ahora.
                            </p>
                            <ul className="space-y-3">
                                {r.no_tocar_aun.map((x, i) => (
                                    <li key={i} className="text-gray-300 v2-cuerpo flex gap-2">
                                        <span className="text-gray-600 flex-none">×</span>{x}
                                    </li>
                                ))}
                            </ul>
                        </V2Tarjeta>
                    )}
                    {((r.tips_genero && r.tips_genero.length > 0) || r.tip_objetivo) && (
                        <V2Tarjeta titulo="Por tu género y tu objetivo">
                            {(r.tips_genero || []).map((t, i) => (
                                <p key={i} className="text-gray-300 text-sm leading-relaxed mb-2">{t}</p>
                            ))}
                            {r.tip_objetivo && (
                                <V2Desplegable avance={v2Partir(r.tip_objetivo, 100)[0]}>
                                    <p>{v2Partir(r.tip_objetivo, 100)[1]}</p>
                                </V2Desplegable>
                            )}
                        </V2Tarjeta>
                    )}
                </div>
            </div>
        );
    }

    function V2TabMezcla({ r }) {
        const d = r.datos_audio || {};
        const sg = r.senales || {};
        const m = d.mono_compat || {};
        const h = d.harshness || {};
        const disp = d.espectro_display || {};
        const vent = d.espectro_ventana || {};
        const fino = d.espectro_fino || {};
        // El veredicto lo produce el propio gráfico, comparando con el corredor
        // de referencia. Así la palabra y la curva salen de la MISMA medida: era
        // el fallo de antes, que el rótulo decía "elevado" mientras el gráfico
        // se veía recto, porque venían de sitios distintos.
        const veredicto = v2VeredictoEspectro(fino, disp);
        const tonoBalance = veredicto
            ? (veredicto.dentro ? 'ok' : 'aviso')
            : v2TonoEstado('balance_grave', d.balance_grave);
        const tonoMono = v2TonoEstado('mono', m.nivel_compatibilidad);
        const tonoDens = v2TonoEstado('densidad', d.densidad);
        const tonoContr = v2TonoEstado('contraste', d.contraste);
        const fmt = (v, dec) => (typeof v === 'number' ? v.toFixed(dec == null ? 1 : dec) : '—');
        return (
            <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                {/* Balance espectral: la barra sustituye a las tres columnas de
                    antes. Mismo dato, pero con eje de frecuencia real y en
                    escala logarítmica, que es como se oye. */}
                <V2Tarjeta ancho="lg:col-span-2 xl:col-span-3"
                           titulo="Balance espectral" tono={tonoBalance}
                           datos={veredicto ? (
                               <div className="rounded-lg px-4 py-2 text-right"
                                    style={{ border: `1px solid ${V2_COLOR[tonoBalance]}33`,
                                             background: `${V2_COLOR[tonoBalance]}0a` }}>
                                   <div style={{ fontSize: '8px', fontWeight: 600,
                                                 letterSpacing: '.17em', textTransform: 'uppercase',
                                                 color: '#6a6a74', marginBottom: 2 }}>Referencia</div>
                                   <div style={{ color: V2_COLOR[tonoBalance], fontWeight: 600,
                                                 fontSize: '17px', lineHeight: 1.05,
                                                 letterSpacing: '.05em', textTransform: 'uppercase' }}>
                                       {veredicto.dentro ? 'Dentro' : 'Fuera'}
                                   </div>
                               </div>
                           ) : (
                               <V2Dato etiqueta="Graves" valor={d.balance_grave || '—'}
                                       tono={tonoBalance} />
                           )}>
                    {(Object.keys(disp).length > 0 || (fino.bandas || []).length > 0)
                        ? <V2Espectro2 display={disp} fino={fino} ventana={vent}
                                       veredicto={veredicto} />
                        : <V2Espectro grave={sg.db_grave} media={sg.db_media} aguda={sg.db_aguda} />}
                    <div className="flex items-start gap-3 mt-4">
                        <V2IconoOnda />
                        <p style={{ fontSize: '11px', lineHeight: 1.65, color: '#7c7c86' }}>
                            {vent && !vent.track_completo
                                ? `Medido en el drop: la ventana de 10 s con más energía del tema, entre ${vent.inicio_seg}s y ${vent.fin_seg}s.`
                                : 'Medido en el drop: la ventana de 10 s con más energía del tema.'}
                        </p>
                    </div>
                    {veredicto ? (
                        <div className="flex items-start gap-3 mt-4 pt-4"
                             style={{ borderTop: '1px solid #26292f' }}>
                            {veredicto.dentro
                                ? <V2IconoCheck color={V2_COLOR.ok} />
                                : <V2IconoAviso color={V2_COLOR.aviso} />}
                            {/* En color solo el diagnóstico; la procedencia del dato
                                va en gris y en su propia línea, para que el bloque no
                                se lea como un párrafo denso. */}
                            <div>
                                {/* Descriptivo, no prescriptivo: se dice DÓNDE cae
                                    respecto a la muestra, no qué habría que hacer.
                                    "Sobra grave" implicaría que hay que bajarlo, y lo
                                    único medido es que está por encima del 95 % de una
                                    colección concreta. */}
                                <p style={{ fontSize: '13.5px', lineHeight: 1.5, color: '#b9b9c2' }}>
                                    {veredicto.dentro ? (
                                        <React.Fragment>
                                            Tu balance cae{' '}
                                            <span style={{ color: V2_COLOR.ok, fontWeight: 600 }}>
                                                dentro del rango de referencia
                                            </span>.
                                        </React.Fragment>
                                    ) : (() => {
                                        // Si todas las zonas se desvían en el mismo
                                        // sentido, una frase; si no, una por sentido.
                                        // Repetir "por encima del 95 % de la referencia"
                                        // dos veces seguidas se leía fatal.
                                        const partes = [];
                                        for (const signo of [1, -1]) {
                                            const zs = veredicto.rachas.filter(r => r.signo === signo);
                                            if (!zs.length) continue;
                                            const nombres = zs.map(r => r.z.et);
                                            const lista = nombres.length > 1
                                                ? nombres.slice(0, -1).join(', ') + ' y ' + nombres[nombres.length - 1]
                                                : nombres[0];
                                            partes.push(
                                                <React.Fragment key={signo}>
                                                    {partes.length > 0 && ' '}
                                                    {nombres.length > 1 ? 'Tienes ' : ''}
                                                    {nombres.length > 1 ? lista : zs[0].z.tuyo}
                                                    {nombres.length > 1 ? ' ' : ` ${zs[0].z.verbo} `}
                                                    <span style={{ color: V2_COLOR.aviso, fontWeight: 600 }}>
                                                        {signo > 0 ? 'por encima del 95 %' : 'por debajo del 5 %'}
                                                    </span>
                                                    {' '}de la referencia.
                                                </React.Fragment>
                                            );
                                        }
                                        return partes;
                                    })()}
                                </p>
                                <p style={{ fontSize: '11px', lineHeight: 1.6, color: '#61616b',
                                            marginTop: 3 }}>
                                    Referencia: 322 previews de catálogo de 26 sellos,
                                    sobre todo progressive y house.
                                </p>
                            </div>
                        </div>
                    ) : (
                        <p className="text-gray-400 v2-sec mt-3">
                            Diferencia graves–medios: <span className="text-white cifra-v2">{fmt(sg.diff_grave_media)} dB</span>
                        </p>
                    )}
                    <V2Desplegable etiqueta="Cómo leer este gráfico">
                        <p><span className="text-gray-300">La franja gris es la referencia.</span> Es
                           donde cae el espectro de <span className="text-gray-300">322 previews de
                           catálogo de 26 sellos</span>, medidos exactamente igual que el tuyo. Si tu
                           curva va por dentro, tu balance se parece al de un disco publicado. Lo que
                           interesa no es rozarla en un punto, sino salirse de ella en toda una zona.</p>
                        <p><span className="text-gray-300">El 0 es el cuerpo de tu tema</span> — el
                           nivel medio entre 200 Hz y 2 kHz. Así el número se lee solo: si el grave
                           está en +12, está 12 dB por encima del cuerpo, y en los discos publicados
                           esa cifra va de +1 a +17.</p>
                        <p><span className="text-gray-300">Plano es lo normal.</span> Toda la música
                           tiene más energía en el grave que en el agudo — esté bien o mal mezclada.
                           Es la estadística del material, no un defecto. Por eso los analizadores
                           inclinan la escala antes de dibujar: para que un tema bien equilibrado
                           salga recto y lo que sobresalga sea tuyo de verdad.</p>
                        <p>Esta vista lleva la <span className="text-gray-300">misma inclinación que
                           SPAN o Pro-Q</span> (+4.5 dB por octava), así que la puedes comparar
                           directamente con el analizador que tengas abierto en el DAW. Lo comprobamos
                           sobre 163 temas editados de 26 sellos: entre 100 Hz y 8 kHz, el tema
                           mediano sale casi recto.</p>
                        <p>La montaña de 50–60 Hz sigue ahí y está bien que siga: es el bombo, y es el
                           género. Lo que hay que mirar no es que exista, sino
                           <span className="text-gray-300"> cuánto sobresale</span> sobre el resto.</p>
                        <p className="text-gray-500">Antes había una segunda vista, «Oído», que
                           compensaba el gráfico con la curva de sensibilidad del oído. Se ha
                           quitado: comprobado sobre los 322 temas de la referencia, acababa
                           diciendo lo mismo que esta. Y la curva que usaba está calibrada para
                           escuchar bajito — a volumen de club el oído es bastante más plano, así
                           que corregía de más.</p>
                        <p className="text-gray-500">Qué es exactamente la referencia: 322 previews
                           de catálogo de 120 s de 26 sellos, con el género tomado del sello y no del
                           tema. La mezcla no es neutra — el 40 % es progressive house y no hay
                           techno duro, trance ni drum &amp; bass. Si produces alguno de esos, la
                           franja te aplica menos.</p>
                        <p className="text-gray-500">La franja llega hasta 12.5 kHz. No es que los
                           archivos se corten ahí —cada uno corta entre 16 y 20 kHz, según su
                           encoder— sino justamente por eso: más arriba la franja mediría la variedad
                           de compresores y no la de la música. Y por debajo de 50 Hz se dibuja pero
                           no se juzga: ahí mide más de 20 dB de ancho, así que no distingue nada, y
                           filtrar el subgrave es una decisión correcta y muy común.</p>
                        <p className="text-gray-500">Caer dentro de la franja describe dónde está tu
                           balance, no si tu tema está bien: dentro cae el 87 % de esos previews y
                           también el 79 % de los temas que se suben aquí.</p>
                        <p className="text-gray-500">Por encima de 16 kHz no se dibuja: ahí lo que hay
                           es el filtro del formato y el suelo de ruido, no música.</p>
                        <p className="text-gray-500">La lectura se hace en el punto de más energía del
                           track, no promediando de principio a fin: el promedio mezcla intro, break y
                           drop y no describe ningún momento real.</p>
                    </V2Desplegable>
                </V2Tarjeta>

                <V2Tarjeta titulo="Densidad y dinámica" tono={tonoDens}
                           datos={<V2Dato etiqueta="Densidad" valor={d.densidad || '—'} tono={tonoDens} />}>
                    <V2Escalones valores={['baja', 'media', 'alta', 'saturada']}
                                 actual={d.densidad}
                                 tonos={{ media: 'ok', alta: 'aviso', saturada: 'alerta' }} />
                    <div className="mt-4 space-y-2.5">
                        <div className="flex justify-between v2-cuerpo gap-3">
                            <span className="text-gray-400">Rango dinámico</span>
                            <span className="text-white font-medium cifra-v2">{fmt(sg.rango_dinamico)} dB</span>
                        </div>
                        <div className="flex justify-between v2-cuerpo gap-3">
                            <span className="text-gray-400">Contraste entre secciones</span>
                            <span className="font-medium cifra-v2"
                                  style={{ color: tonoContr === 'neutro' ? '#fff' : V2_COLOR[tonoContr] }}>
                                {d.contraste || '—'}
                            </span>
                        </div>
                        <div className="flex justify-between v2-cuerpo gap-3">
                            <span className="text-gray-400">Cambios significativos</span>
                            <span className="text-white font-medium cifra-v2">
                                {sg.cambios_significativos == null ? '—' : sg.cambios_significativos}
                            </span>
                        </div>
                    </div>
                    <V2Desplegable etiqueta="Qué es la densidad">
                        <p>Cuánto ocupa el sonido el espectro en todo momento. Una densidad alta
                           llena, pero deja menos sitio para que cada elemento se distinga; una baja
                           respira más, aunque puede sonar vacía. Ninguna de las dos es mejor: depende
                           de lo que busques.</p>
                    </V2Desplegable>
                </V2Tarjeta>

                <V2Tarjeta titulo="Compatibilidad mono" tono={tonoMono}
                           datos={<V2Dato etiqueta="Estado" valor={m.nivel_compatibilidad || '—'} tono={tonoMono} />}>
                    <V2Anillo pct={(m.correlacion_lr || 0) * 100}
                              tono={tonoMono === 'neutro' ? V2_COLOR.ok : V2_COLOR[tonoMono]}
                              etiqueta={`Correlación L/R · pérdida en mono ${m.perdida_mono_db == null ? '—' : m.perdida_mono_db} dB`} />
                    <V2Desplegable etiqueta="Detalle por bandas">
                        <p>{m.resumen}</p>
                        {m.bandas && Object.keys(m.bandas).map(banda => (
                            <div key={banda} className="flex justify-between text-xs gap-3">
                                <span className="capitalize text-gray-500">{banda}</span>
                                <span className="text-gray-300 cifra-v2">
                                    {(m.bandas[banda].correlacion * 100).toFixed(0)}% · {m.bandas[banda].perdida_db} dB · {m.bandas[banda].estado}
                                </span>
                            </div>
                        ))}
                    </V2Desplegable>
                </V2Tarjeta>

                {/* Aspereza: la misma barra, pero lo que importa es DÓNDE. Si el
                    motor ha localizado el pico, se marca sobre el eje. */}
                <V2Tarjeta titulo="Aspereza en medios-altos" tono={h.tiene_harshness ? 'aviso' : 'neutro'}
                           datos={<V2Dato etiqueta="Frames ásperos" valor={`${h.pct_frames_harsh == null ? '—' : h.pct_frames_harsh}%`}
                                          tono={h.tiene_harshness ? 'aviso' : 'neutro'} />}
                           ancho={h.tiene_harshness ? "xl:col-span-2" : ""}>
                    {/* La barra solo cuando hay pico que señalar: sin aspereza
                        repetiría la de arriba sin añadir nada. */}
                    {h.tiene_harshness && h.peak_freq_hz > 0 && Object.keys(disp).length > 0 && (
                        <V2Espectro2 display={disp} fino={fino} ventana={vent}
                            marcas={[{ f: h.peak_freq_hz, color: V2_COLOR.aviso,
                                       texto: `Pico áspero en ${h.peak_freq_hz} Hz${h.zona_problema ? ` · ${h.zona_problema}` : ''}` }]} />
                    )}
                    {h.tiene_harshness ? (
                        <p className="text-gray-300 text-sm mt-2">
                            Carácter <span className="text-white">{h.caracter}</span>. La aspereza vive
                            entre 2 y 6 kHz: es la zona donde el oído es más sensible y donde un exceso
                            cansa a los pocos minutos.
                        </p>
                    ) : (
                        <p className="text-gray-400 text-sm mt-2">
                            Sin picos molestos en la zona de 2 a 6 kHz, que es donde el oído es más
                            sensible.
                        </p>
                    )}
                </V2Tarjeta>
            </div>
        );
    }

    function V2TabMaster({ r }) {
        const lo = (r.datos_audio || {}).loudness || {};
        const tonoPicos = lo.severidad_picos === 'atencion' ? 'aviso' : 'neutro';
        const tonoRec = lo.severidad_recorte === 'atencion' ? 'alerta' : 'neutro';
        const tp = lo.true_peak_dbtp;
        const MIN = -3, MAX = 6;
        const pos = v => Math.max(0, Math.min(100, ((v - MIN) / (MAX - MIN)) * 100));
        const avPicos = v2Partir(lo.aviso_picos || '', 80);
        const avRec = v2Partir(lo.aviso_recorte || '', 80);
        const avSat = v2Partir(lo.aviso_saturacion || '', 90);
        return (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <V2Tarjeta titulo="Loudness"
                           datos={<><V2Dato etiqueta="LUFS" valor={lo.lufs_integrado == null ? '—' : lo.lufs_integrado} />
                                    <V2Dato etiqueta="Rango" valor={`${lo.rango_loudness == null ? '—' : lo.rango_loudness} LU`} /></>}>
                    {typeof lo.lufs_integrado === 'number' && lo.lufs_integrado > -60 && (
                        <V2BarraRango valor={lo.lufs_integrado} min={-24} max={-4} objetivoMin={-9} objetivoMax={-7} />
                    )}
                    {lo.referencia_genero && <p className="text-gray-400 v2-sec mt-3">{lo.referencia_genero}</p>}
                    <V2Desplegable etiqueta="Qué hacer con esto">
                        <p>{lo.referencia}</p>
                        <p>{lo.consejo_master}</p>
                    </V2Desplegable>
                </V2Tarjeta>

                <V2Tarjeta titulo="Picos" tono={tonoPicos}
                           datos={<><V2Dato etiqueta="True peak" valor={typeof tp === 'number' ? `${tp.toFixed(1)} dBTP` : '—'} tono={tonoPicos} />
                                    <V2Dato etiqueta="Sample peak" valor={typeof lo.sample_peak_dbfs === 'number' && lo.sample_peak_dbfs > -99 ? `${lo.sample_peak_dbfs.toFixed(1)} dBFS` : '—'} /></>}>
                    {/* La escala llega a +6: un máster recortado se va a +5 con
                        facilidad y con el tope en +3 la marca no se leía. */}
                    {typeof tp === 'number' && tp > -99 && (
                        <>
                            <div className="relative h-5 barra-v2 mb-1">
                                <div className="absolute top-0 bottom-0" style={{ left: 0, width: `${pos(-1)}%`, background: 'rgba(37,244,100,0.12)' }} />
                                <div className="absolute top-0 bottom-0" style={{ left: `${pos(-1)}%`, width: `${pos(0.3) - pos(-1)}%`, background: 'rgba(250,204,21,0.10)' }} />
                                <div className="absolute top-0 bottom-0" style={{ left: `${pos(0.3)}%`, right: 0, background: 'rgba(248,113,113,0.10)' }} />
                                <div className="absolute top-0 bottom-0 w-[2px]"
                                     style={{ left: `calc(${pos(tp)}% - 1px)`, background: tonoPicos === 'neutro' ? V2_COLOR.ok : V2_COLOR.aviso }} />
                            </div>
                            <div className="flex justify-between text-[10px] text-gray-600 mb-3 cifra-v2">
                                <span>{MIN} dBTP</span>
                                <span className="text-gray-500">−1 recomendado · 0 el techo</span>
                                <span>+{MAX}</span>
                            </div>
                        </>
                    )}
                    {lo.titulo_picos && <p className="text-white v2-cuerpo font-medium mb-1">{lo.titulo_picos}</p>}
                    <V2Desplegable avance={avPicos[0]}>
                        <p>{avPicos[1]}</p>
                        {lo.nota_lossy_picos && <p className="text-gray-500">{lo.nota_lossy_picos}</p>}
                    </V2Desplegable>
                </V2Tarjeta>

                {lo.categoria_recorte && (
                    <V2Tarjeta titulo="Recorte de muestras" tono={tonoRec}
                               datos={lo.recorte_medible
                                   ? <><V2Dato etiqueta="En el techo" valor={v2Num(lo.muestras_en_techo_total)} tono={tonoRec} />
                                       <V2Dato etiqueta="Meseta máx" valor={`${(lo.racha_maxima_ms || 0).toFixed(2)} ms`} tono={tonoRec} /></>
                                   : <V2Dato etiqueta="Medible" valor="no aplica" />}>
                        {lo.titulo_recorte && <p className="text-white v2-cuerpo font-medium mb-1">{lo.titulo_recorte}</p>}
                        <V2Desplegable avance={avRec[0]}><p>{avRec[1]}</p></V2Desplegable>
                    </V2Tarjeta>
                )}

                <V2Tarjeta titulo="Saturación dinámica" tono={lo.saturacion_dinamica === 'ok' ? 'neutro' : 'aviso'}
                           datos={<V2Dato etiqueta="Estado" valor={lo.saturacion_dinamica || '—'}
                                          tono={lo.saturacion_dinamica === 'ok' ? 'neutro' : 'aviso'} />}>
                    {lo.aviso_saturacion
                        ? <V2Desplegable avance={avSat[0]}><p>{avSat[1]}</p></V2Desplegable>
                        : lo.saturacion_dinamica === 'ok'
                        ? <p className="text-gray-400 v2-cuerpo">El limitador no ha aplastado la dinámica.</p>
                        /* Sin este caso, un estado 'moderada' sin texto asociado
                           enseñaba el indicador en amarillo y debajo "no ha
                           aplastado": la tarjeta se contradecía a sí misma. */
                        : <p className="text-gray-400 v2-cuerpo">
                              La compresión del máster está en <span className="text-white">{lo.saturacion_dinamica || '—'}</span>.
                              No llega a nivel de aviso, pero es la zona en la que conviene comparar
                              con una referencia del género antes de apretar más.
                          </p>}
                </V2Tarjeta>
            </div>
        );
    }

        const lo = d.loudness || {};

                    {fila('BPM', d.bpm == null ? 'no detectado' : d.bpm)}

                <V2Tarjeta titulo="El archivo que subiste">
                    {fila('Formato', f.archivo_container ? `${f.archivo_container} · ${f.archivo_codec}` : null)}
                    {fila('Sample rate', f.archivo_sample_rate ? `${f.archivo_sample_rate} Hz` : null)}

                    {fila('Con pérdida', f.archivo_lossy ? 'sí' : 'no')}
                </V2Tarjeta>
                <V2Tarjeta titulo="Cómo se ha medido" ancho="lg:col-span-2">
                    {fila('Método de picos', lo.true_peak_method
