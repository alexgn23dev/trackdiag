                    perdida_mono_db: da.mono_compat?.perdida_mono_db,
                    nivel_mono: da.mono_compat?.nivel_compatibilidad,
                    fase_invertida: da.mono_compat?.fase_invertida,
                    mono_graves: da.mono_compat?.bandas?.graves?.estado,
                    mono_medios: da.mono_compat?.bandas?.medios?.estado,
                    mono_agudos: da.mono_compat?.bandas?.agudos?.estado,
                    // Harshness
                    tiene_harshness: da.harshness?.tiene_harshness,
                    harshness_nivel: da.harshness?.nivel,
                    harshness_p95: da.harshness?.pico_p95,
                    harshness_pct: da.harshness?.pct_frames_harsh,
                    // Carencias
                    carencia_medios: dx.senales?.carencia_medios,
                    carencia_agudos: dx.senales?.carencia_agudos,
                    // Con qué se midió esta fila. Permite saber qué análisis son
                    // comparables entre sí sin deducirlo por la fecha, y medir
                    // cuánto tarda en propagarse un deploy.
                    frontend_version: APP_VERSION,
                    backend_version: dx.versiones?.backend_version,
                    analysis_engine_version: dx.versiones?.analysis_engine_version,
                    peak_algorithm_version: dx.versiones?.peak_algorithm_version,
                    loudness_algorithm_version: dx.versiones?.loudness_algorithm_version,
                    // Diagnósticos emitidos y scores
                    diag_principal: dx.diagnostico_principal?.id,
                    diag_secundario: dx.diagnostico_secundario?.id || null,
                    scores: dx.scores,
                    estado: dx.estado_track,
                };

                // Determinar proyecto/versión: si el usuario seleccionó uno existente,
                // pasamos proyecto_id. Si está creando uno nuevo, pasamos nombre_proyecto
                // (el backend hará get_or_create). Si por algún motivo ambos van vacíos,
                // el análisis queda como "suelto" (proyecto_id NULL).
                const usingExisting = proyectoMode === 'select' && proyectoSeleccionadoId;
                const proyectoNombrePayload = usingExisting
                    ? ''
                    : (nombreProyecto || '').trim();

                // Enviar registro: Postgres como source of truth + Sheets mirror (cutover B)
                fetch(`${API_URL}/api/sheets/registro`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        timestamp: new Date().toISOString(),
                        email: sessionEmail,
                        nombre_proyecto: proyectoNombrePayload,
                        proyecto_id: usingExisting ? proyectoSeleccionadoId : '',
                        version_etiqueta: (versionEtiqueta || '').trim(),
                        formulario: formularioTexto,
                        diagnostico: informe,
                        senales_json: JSON.stringify(senales),
                        genero_custom: contexto.genero === 'otro' ? (contexto.genero_custom || '').trim() : '',
                    }),
                }).catch(() => {});
                setScreen('diagnostico');
                trackEvent('funnel_result_viewed', {
                    diagnostico_principal: data.diagnostico_principal?.id || '',
                    estado: data.estado_track || '',
                    genero: contexto.genero,
                });
            } catch (err) {
                const msg = err.message || 'Error inesperado';
                setError(msg);
                setScreen('questionnaire');
            }
        };

        // Compat: handleSubmit antigua redirige a runAnalysis (por si algún botón sigue llamándola)
        const handleSubmit = () => runAnalysis();

        const handleReset = () => {
            setFile(null);
            setFileRef(null);
            setUserEmail('');
            setUserPassword('');
            setEmailError('');
            setNombreProyecto('');
            setProyectoSeleccionadoId('');
            setVersionEtiqueta('');
            setPrefilledFromProyecto(false);
            setContexto({
                genero: '', genero_custom: '', fase: '', objetivo: '',
                bloqueo_percibido: '', experiencia: '',
                dificultad_habitual: '',
            });
            setResultado(null);
            setError(null);
            setScreen('landing');
        };

        // =====================================================================
        // Auth helpers
        // =====================================================================
        const USERNAME_REGEX = /^[a-zA-Z0-9_-]{3,20}$/;
        const validUsername = (u) => USERNAME_REGEX.test(u);

        const resetAuthFields = () => {
            setAuthIdentifier(''); setAuthEmail(''); setAuthUsername('');
            setAuthPassword(''); setAuthError(''); setAuthInfo('');
        };

        const openAuthModal = (mode = 'login') => {
            resetAuthFields();
            setAuthMode(mode);
            setAuthOpen(true);
            trackEvent('auth_modal_opened', { mode });
        };

        const closeAuthModal = () => {
            setAuthOpen(false);
            setAuthError(''); setAuthInfo('');
            // Si había una acción pendiente y el usuario cierra sin completar, descartar
            if (pendingAfterAuth) setPendingAfterAuth(null);
        };

        // ---- Login (email O username + password) ----
        const handleLogin = async () => {
            const ident = authIdentifier.trim();
            if (!ident || authPassword.length < 8) return;
            setAuthLoading(true); setAuthError(''); setAuthInfo('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ identifier: ident, password: authPassword }),
                });
                const data = await resp.json();
                if (!resp.ok) { setAuthError(data.error || 'Error de autenticación'); setAuthLoading(false); return; }
                if (data.token) saveAuth(data.email, data.token);
                setPanelAuth(data.email);
                setPanelUsername(data.username || '');
                setPanelHistorial(data.historial || []);
                trackEvent('auth_login_success', { had_username: !!data.username });
                if (data.needs_username) {
                    // Usuario antiguo sin username — pedirle que lo elija
                    setAuthMode('set_username');
                    setAuthUsername(''); setAuthError('');
                    setAuthLoading(false);
                } else {
                    setAuthOpen(false);
                    setAuthLoading(false);
                    if (pendingAfterAuth === 'analyze') {
                        setPendingAfterAuth(null);
                        runAnalysis();
                    } else {
                        setScreen('panel');
                    }
                }
            } catch (e) { setAuthError('No se pudo conectar. Inténtalo de nuevo.'); setAuthLoading(false); }
        };

        // ---- Register (email + username + password) ----
        const handleRegister = async () => {
            if (!authEmail.includes('@')) { setAuthError('Email inválido'); return; }
            if (!validUsername(authUsername)) { setAuthError('Nombre de usuario inválido. 3-20 caracteres: letras, números, guion bajo o guion.'); return; }
            if (authPassword.length < 8) { setAuthError('La contraseña debe tener al menos 8 caracteres'); return; }
            setAuthLoading(true); setAuthError(''); setAuthInfo('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: authEmail.trim().toLowerCase(), username: authUsername.trim(), password: authPassword }),
                });
                const data = await resp.json();
                if (!resp.ok) { setAuthError(data.error || 'No se pudo crear la cuenta'); setAuthLoading(false); return; }
                if (data.token) saveAuth(data.email, data.token);
                setPanelAuth(data.email);
                setPanelUsername(data.username || '');
                setPanelHistorial([]);
                trackEvent('auth_register_success');
                setAuthOpen(false);
                setAuthLoading(false);
                if (pendingAfterAuth === 'analyze') {
                    setPendingAfterAuth(null);
                    runAnalysis();
                } else {
                    setScreen('panel');
                }
            } catch (e) { setAuthError('No se pudo conectar. Inténtalo de nuevo.'); setAuthLoading(false); }
        };

        // ---- Set username (migración para usuarios viejos) ----
        const handleSetUsername = async () => {
            if (!validUsername(authUsername)) { setAuthError('Nombre de usuario inválido. 3-20 caracteres: letras, números, guion bajo o guion.'); return; }
            setAuthLoading(true); setAuthError('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/set_username`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ username: authUsername.trim() }),
                });
                const data = await resp.json();
                if (!resp.ok) { setAuthError(data.error || 'No se pudo guardar'); setAuthLoading(false); return; }
                setPanelUsername(data.username);
                trackEvent('auth_set_username_success');
                setAuthOpen(false);
                setAuthLoading(false);
                if (pendingAfterAuth === 'analyze') {
                    setPendingAfterAuth(null);
                    runAnalysis();
                } else {
                    setScreen('panel');
                }
            } catch (e) { setAuthError('No se pudo conectar.'); setAuthLoading(false); }
        };

        // ---- Forgot password ----
        const handleForgot = async () => {
            if (!authEmail.includes('@')) { setAuthError('Email inválido'); return; }
            setAuthLoading(true); setAuthError(''); setAuthInfo('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/forgot`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: authEmail.trim().toLowerCase() }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    setAuthError(data.error || 'No se pudo procesar.');
                } else {
                    setAuthInfo(data.message || 'Si esa cuenta existe, te hemos enviado un email.');
                    trackEvent('auth_forgot_clicked');
                }
            } catch (e) { setAuthError('No se pudo conectar.'); }
            setAuthLoading(false);
        };

        // ---- Cerrar sesión ----
        const handlePanelLogout = () => {
            clearAuth();
            setPanelAuth(null); setPanelUsername(''); setPanelHistorial([]);
            setPanelSelectedEntry(null); resetAuthFields();
            setFileRef(null); // que la referencia de la sesión anterior no se cuele en el siguiente análisis
            setScreen('landing');
        };

        // ---- Abrir panel: si hay token, entrar; si no, abrir modal de login ----
        const handleOpenPanel = () => {
            const saved = getAuth();
            if (panelAuth || saved.token) {
                const email = panelAuth || saved.email;
                setPanelAuth(email);
                setPanelLoading(true);
                fetch(`${API_URL}/api/auth/historial`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ email }),
                })
                .then(r => {
                    if (r.status === 401) { clearAuth(); setPanelAuth(null); setPanelLoading(false); openAuthModal('login'); return null; }
                    return r.json();
                })
                .then(data => { if (data) { setPanelHistorial(data.historial || []); setPanelLoading(false); } })
                .catch(() => setPanelLoading(false));
                setScreen('panel');
            } else {
                openAuthModal('login');
            }
        };

        if (!opciones) {
            return (
                <div className="min-h-screen flex items-center justify-center">
                    <p className="text-gray-500">Cargando...</p>
                </div>
            );
        }

        return (
            <div>
                {/* Banda de entorno: solo si NO es producción. Un preview tiene
                    que gritarlo — es lo que impide confundirlo con la app real. */}
                {entorno && (
                    <div className="fixed bottom-0 left-0 right-0 z-50 px-4 py-1 text-center text-xs font-bold tracking-wide"
                         style={{ background: '#b45309', color: '#fff' }}>
                        ENTORNO: {entorno.toUpperCase()} — los datos de aquí no son reales
                    </div>
                )}
                {/* Aviso de versión desfasada: solo aparece si tras recargar una
                    vez el index.html sigue siendo más viejo que el backend, lo
                    que indica una caché intermedia (navegador o CDN). */}
                {versionDesfasada && (
                    <div className="fixed top-0 left-0 right-0 z-50 px-4 py-2 text-center text-xs"
                         style={{ background: 'rgba(109,16,255,0.9)', color: '#fff' }}>
                        Estás viendo una versión antigua de la app (v{APP_VERSION} frente a v{versionDesfasada}).
                        {' '}
                        <button type="button"
                                onClick={() => window.location.reload(true)}
                                style={{ background: 'transparent', border: 0, color: '#fff', textDecoration: 'underline', cursor: 'pointer', padding: 0 }}>
                            Recargar
                        </button>
                        {' '}— si persiste, vacía la caché del navegador.
                    </div>
                )}
                {/* Botón Mi panel — siempre visible arriba a la derecha (no en panel).
                    En la vista v2 del diagnóstico NO se pinta: allí hay una barra
                    de navegación propia y este botón flotante se le encimaba en
                    cuanto la ventana se estrechaba. */}
                {screen !== 'panel' && !(screen === 'diagnostico' && usarVistaV2()) && (
                    <div className="fixed top-4 right-4 z-40">
                        <button
                            onClick={handleOpenPanel}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg text-xs transition-colors"
                            style={{ background: 'rgba(109,16,255,0.15)', border: '1px solid rgba(109,16,255,0.3)', color: '#a78bfa' }}
                        >
                            {panelAuth ? (
                                <React.Fragment>
                                    <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'var(--po-green)', display: 'inline-block' }}></span>
                                    Mi panel
                                </React.Fragment>
                            ) : 'Mi panel'}
                        </button>
                    </div>
                )}

                {error && (
                    <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-900 border border-red-700 text-red-200 px-6 py-3 rounded-xl text-sm z-50 fade-in">
                        {error}
                        <button onClick={() => setError(null)} className="ml-3 text-red-400 hover:text-red-200">✕</button>
                    </div>
                )}

                {screen === 'landing' && (
                    <LandingScreen
                        onFileSelected={handleFileSelected}
                        onHistorial={() => setScreen('historial')}
                        historialCount={historialCount}
                        intencionCompartir={intencionCompartir}
                    />
                )}
                {screen === 'historial' && (
                    <HistorialScreen
                        onBack={() => setScreen('landing')}
                        onAnalizar={() => setScreen('landing')}
                    />
                )}
                {screen === 'questionnaire' && (
                    <QuestionnaireScreen
                        opciones={opciones}
                        contexto={contexto}
                        onChange={handleContextoChange}
                        onSubmit={handleGoToEmail}
                        isValid={isQuestionnaireValid}
                        nombreProyecto={nombreProyecto}
                        onNombreChange={setNombreProyecto}
                        proyectosPrevios={proyectosPrevios}
                        proyectoMode={proyectoMode}
                        onProyectoModeChange={setProyectoMode}
                        proyectoSeleccionadoId={proyectoSeleccionadoId}
                        onProyectoSeleccionadoChange={setProyectoSeleccionadoId}
                        versionEtiqueta={versionEtiqueta}
                        onVersionEtiquetaChange={setVersionEtiqueta}
                        prefilledFromProyecto={prefilledFromProyecto}
                        fileRef={fileRef}
                        onFileRefSelected={handleFileRefSelected}
                        onFileRefClear={() => setFileRef(null)}
                    />
                )}
                {/* (screen 'email' eliminada — la auth ahora pasa por el AuthModal) */}
                {screen === 'processing' && <ProcessingScreen datos={resultado?.datos_audio} conReferencia={!!fileRef} />}
                {screen === 'diagnostico' && resultado && (
                    <DiagnosticoScreen
                        resultado={resultado} onReset={handleReset} contexto={contexto} userEmail={userEmail}
                        file={file} opciones={opciones} nombreProyecto={nombreProyecto}
                        comunidadOk={comunidadOk}
                        proyectoNombreResuelto={proyectoActual.nombre}
                        versionActual={proyectoActual.version}
                        proyectoIdActual={proyectoActual.id}
                        onVerComparativa={handleVerComparativa}
                        onIrAPerfil={() => { setPanelView('perfil'); handleOpenPanel(); }}
                        onAbrirPanel={handleOpenPanel}
                        sesionIniciada={!!panelAuth}
                    />
                )}

                {/* ============ AUTH MODAL (login / register / forgot / set_username) ============ */}
                {authOpen && (
                    <div
                        className="fixed inset-0 z-50 flex items-center justify-center px-4 fade-in"
                        style={{ background: 'rgba(0,0,0,0.72)', backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}
                        onClick={(e) => { if (e.target === e.currentTarget && authMode !== 'set_username') closeAuthModal(); }}
                    >
                        <div
                            className="card relative w-full"
                            style={{ maxWidth: '420px', padding: '28px 28px 24px', borderRadius: '14px' }}
                            onClick={(e) => e.stopPropagation()}
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="authTitle"
                        >
                            {/* X cerrar (oculta en set_username) */}
                            {authMode !== 'set_username' && (
                                <button
                                    onClick={closeAuthModal}
                                    aria-label="Cerrar"
                                    className="text-gray-500 hover:text-white transition-colors"
                                    style={{ position: 'absolute', top: '14px', right: '14px', background: 'transparent', border: 0, fontSize: '20px', lineHeight: 1, cursor: 'pointer', padding: '4px 8px' }}
                                >×</button>
                            )}

                            {/* ===== LOGIN ===== */}
                            {authMode === 'login' && (
                                <div>
                                    <h2 id="authTitle" className="text-lg font-bold text-white mb-1">Inicia sesión</h2>
                                    <p className="text-gray-500 text-xs mb-5">Accede a tu panel para ver tu historial.</p>

                                    <label className="block text-xs text-gray-400 mb-1.5">Email o nombre de usuario</label>
                                    <input
                                        type="text"
                                        autoFocus
                                        value={authIdentifier}
                                        onChange={(e) => { setAuthIdentifier(e.target.value); setAuthError(''); }}
                                        placeholder="tu@email.com  o  @tu_username"
                                        className="w-full px-4 py-2.5 rounded-lg text-sm input-field mb-3"
                                        autoComplete="username"
                                    />

                                    <label className="block text-xs text-gray-400 mb-1.5">Contraseña</label>
                                    <input
                                        type="password"
                                        value={authPassword}
                                        onChange={(e) => { setAuthPassword(e.target.value); setAuthError(''); }}
                                        placeholder="Mínimo 8 caracteres"
                                        className="w-full px-4 py-2.5 rounded-lg text-sm input-field mb-2"
                                        autoComplete="current-password"
                                        onKeyDown={(e) => { if (e.key === 'Enter') handleLogin(); }}
                                    />

                                    <div className="text-right mb-4">
                                        <button
                                            type="button"
                                            onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthInfo(''); }}
                                            className="text-xs text-gray-300 hover:text-white transition-colors"
                                            style={{ background: 'transparent', border: 0, padding: 0, cursor: 'pointer' }}
                                        >¿Olvidaste tu contraseña?</button>
                                    </div>

                                    {authError && <p className="text-red-400 text-xs mb-3">{authError}</p>}

                                    <button
                                        onClick={handleLogin}
                                        disabled={!authIdentifier.trim() || authPassword.length < 8 || authLoading}
                                        className="w-full py-3 rounded-xl font-medium btn-primary text-sm transition-colors"
                                        style={{ opacity: (!authIdentifier.trim() || authPassword.length < 8 || authLoading) ? 0.6 : 1 }}
                                    >{authLoading ? 'Accediendo…' : 'Acceder'}</button>

                                    <p className="text-center text-xs text-gray-500 mt-5">
                                        ¿No tienes cuenta?{' '}
                                        <button
                                            type="button"
                                            onClick={() => { setAuthMode('register'); setAuthError(''); }}
                                            className="text-gray-300 hover:text-white transition-colors font-medium"
                                            style={{ background: 'transparent', border: 0, padding: 0, cursor: 'pointer' }}
                                        >Crea una</button>
                                    </p>
                                </div>
                            )}

                            {/* ===== REGISTER ===== */}
                            {authMode === 'register' && (
                                <div>
                                    <h2 id="authTitle" className="text-lg font-bold text-white mb-1">Crea tu cuenta</h2>
                                    <p className="text-gray-500 text-xs mb-5">Tu nombre de usuario te identificará en futuros espacios de la comunidad.</p>

                                    <label className="block text-xs text-gray-400 mb-1.5">Email</label>
                                    <input
                                        type="email"
                                        autoFocus
                                        value={authEmail}
                                        onChange={(e) => { setAuthEmail(e.target.value); setAuthError(''); }}
                                        placeholder="tu@email.com"
                                        className="w-full px-4 py-2.5 rounded-lg text-sm input-field mb-3"
                                        autoComplete="email"
                                    />

                                    <label className="block text-xs text-gray-400 mb-1.5">Nombre de usuario</label>
                                    <div className="flex items-stretch mb-1" style={{ borderRadius: '8px', overflow: 'hidden', border: '1px solid var(--po-border)' }}>
                                        <span className="flex items-center justify-center px-3 text-gray-500 text-sm" style={{ background: 'var(--po-dark)', borderRight: '1px solid var(--po-border)' }}>@</span>
                                        <input
                                            type="text"
                                            value={authUsername}
                                            onChange={(e) => { setAuthUsername(e.target.value.replace(/^@+/, '')); setAuthError(''); }}
                                            placeholder="tu_nombre_de_usuario"
                                            className="flex-1 px-3 py-2.5 text-sm input-field"
                                            style={{ border: 0, borderRadius: 0 }}
                                            autoComplete="username"
                                            maxLength={20}
                                        />
                                    </div>
                                    <p className="text-xs text-gray-600 mb-3">3-20 caracteres. Letras, números, guion bajo o guion.</p>

                                    <label className="block text-xs text-gray-400 mb-1.5">Contraseña</label>
                                    <input
                                        type="password"
                                        value={authPassword}
                                        onChange={(e) => { setAuthPassword(e.target.value); setAuthError(''); }}
                                        placeholder="Al menos 8 caracteres"
                                        className="w-full px-4 py-2.5 rounded-lg text-sm input-field mb-3"
                                        autoComplete="new-password"
                                        onKeyDown={(e) => { if (e.key === 'Enter') handleRegister(); }}
                                    />

                                    {authError && <p className="text-red-400 text-xs mb-3">{authError}</p>}

                                    <button
                                        onClick={handleRegister}
                                        disabled={!authEmail.includes('@') || !validUsername(authUsername) || authPassword.length < 8 || authLoading}
                                        className="w-full py-3 rounded-xl font-medium btn-primary text-sm transition-colors"
                                        style={{ opacity: (!authEmail.includes('@') || !validUsername(authUsername) || authPassword.length < 8 || authLoading) ? 0.6 : 1 }}
                                    >{authLoading ? 'Creando cuenta…' : 'Crear cuenta'}</button>

                                    <p className="text-center text-xs text-gray-500 mt-5">
                                        ¿Ya tienes cuenta?{' '}
                                        <button
                                            type="button"
                                            onClick={() => { setAuthMode('login'); setAuthError(''); }}
                                            className="text-gray-300 hover:text-white transition-colors font-medium"
                                            style={{ background: 'transparent', border: 0, padding: 0, cursor: 'pointer' }}
                                        >Inicia sesión</button>
                                    </p>
                                </div>
                            )}

                            {/* ===== FORGOT password ===== */}
                            {authMode === 'forgot' && (
                                <div>
                                    <h2 id="authTitle" className="text-lg font-bold text-white mb-1">¿Olvidaste tu contraseña?</h2>
                                    <p className="text-gray-500 text-xs mb-5">Indica tu email y te enviaremos un enlace para elegir una nueva. El enlace caduca en 1 hora.</p>

                                    {!authInfo ? (
                                        <>
                                            <input
                                                type="email"
                                                autoFocus
                                                value={authEmail}
                                                onChange={(e) => { setAuthEmail(e.target.value); setAuthError(''); }}
                                                onKeyDown={(e) => { if (e.key === 'Enter' && authEmail.includes('@') && !authLoading) handleForgot(); }}
                                                placeholder="tu@email.com"
                                                className="w-full px-3 py-2.5 text-sm input-field mb-3"
                                            />
                                            <button
                                                onClick={handleForgot}
                                                disabled={!authEmail.includes('@') || authLoading}
                                                className="w-full py-3 rounded-xl font-medium btn-primary text-sm transition-colors mb-3"
                                                style={{ opacity: (!authEmail.includes('@') || authLoading) ? 0.6 : 1 }}
                                            >{authLoading ? 'Enviando…' : 'Enviar enlace'}</button>
                                        </>
                                    ) : (
                                        <div className="rounded-lg p-3 mb-3" style={{ background: 'rgba(37,244,100,0.06)', border: '1px solid rgba(37,244,100,0.18)' }}>
                                            <p className="text-sm text-gray-300 leading-relaxed">{authInfo}</p>
                                        </div>
                                    )}

                                    {authError && <p className="text-red-400 text-xs mb-3">{authError}</p>}

                                    <p className="text-center text-xs text-gray-500 mt-2">
                                        <button
                                            type="button"
                                            onClick={() => { setAuthMode('login'); setAuthError(''); setAuthInfo(''); }}
                                            className="text-gray-300 hover:text-white transition-colors font-medium"
                                            style={{ background: 'transparent', border: 0, padding: 0, cursor: 'pointer' }}
                                        >← Volver al inicio de sesión</button>
                                    </p>
                                </div>
                            )}

                            {/* ===== SET USERNAME (migración de usuarios viejos) ===== */}
                            {authMode === 'set_username' && (
                                <div>
                                    <h2 id="authTitle" className="text-lg font-bold text-white mb-1">Elige tu nombre de usuario</h2>
                                    <p className="text-gray-500 text-xs mb-5">Vamos a usar nombres de usuario en próximas funciones de comunidad. Elige el tuyo (no podrás dejarlo en blanco).</p>

                                    <div className="flex items-stretch mb-1" style={{ borderRadius: '8px', overflow: 'hidden', border: '1px solid var(--po-border)' }}>
                                        <span className="flex items-center justify-center px-3 text-gray-500 text-sm" style={{ background: 'var(--po-dark)', borderRight: '1px solid var(--po-border)' }}>@</span>
                                        <input
                                            type="text"
                                            autoFocus
                                            value={authUsername}
                                            onChange={(e) => { setAuthUsername(e.target.value.replace(/^@+/, '')); setAuthError(''); }}
                                            placeholder="tu_nombre_de_usuario"
                                            className="flex-1 px-3 py-2.5 text-sm input-field"
                                            style={{ border: 0, borderRadius: 0 }}
                                            maxLength={20}
                                            onKeyDown={(e) => { if (e.key === 'Enter') handleSetUsername(); }}
                                        />
                                    </div>
                                    <p className="text-xs text-gray-600 mb-4">3-20 caracteres. Letras, números, guion bajo o guion.</p>

                                    {authError && <p className="text-red-400 text-xs mb-3">{authError}</p>}

                                    <button
                                        onClick={handleSetUsername}
                                        disabled={!validUsername(authUsername) || authLoading}
                                        className="w-full py-3 rounded-xl font-medium btn-primary text-sm transition-colors"
                                        style={{ opacity: (!validUsername(authUsername) || authLoading) ? 0.6 : 1 }}
                                    >{authLoading ? 'Guardando…' : 'Guardar y continuar'}</button>
                                </div>
                            )}
                        </div>
                    </div>
                )}

                {/* ============ PANEL DE USUARIO ============ */}
                {screen === 'panel' && panelAuth && (
                    <div className="min-h-screen px-6 py-8 fade-in">
                        <div className="max-w-3xl mx-auto">
                            {/* Header */}
                            <div className="flex items-center justify-between mb-6">
                                <div>
                                    <h2 className="text-xl font-bold text-white">Mi panel</h2>
                                    <p className="text-gray-500 text-xs mt-1">{panelUsername ? '@' + panelUsername : panelAuth} · {panelHistorial.length} {panelHistorial.length === 1 ? 'análisis' : 'análisis'}</p>
                                </div>
                                <div className="flex flex-wrap gap-2 justify-end">
                                    {resultado && (
                                        <button
                                            onClick={() => setScreen('diagnostico')}
                                            className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs transition-colors"
                                            title="Vuelve al diagnóstico que acabas de hacer (p. ej. para compartir el track)"
                                        >
                                            ← Volver al diagnóstico
                                        </button>
                                    )}
                                    <button
                                        onClick={handleReset}
                                        className="px-4 py-2 btn-primary rounded-lg text-xs transition-colors"
                                    >
                                        Nuevo análisis
                                    </button>
                                    <button
                                        onClick={() => setPanelView(panelView === 'perfil' ? 'proyectos' : 'perfil')}
                                        className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs transition-colors inline-flex items-center gap-1.5"
                                        title="Tu perfil de productor para la comunidad"
                                    >
                                        <span>👤</span>
                                        <span>Mi perfil</span>
                                    </button>
                                    {comunidadOk && (
                                        <a
                                            href="/comunidad"
                                            onClick={() => trackEvent('panel_comunidad_clicked', { from: 'user_panel' })}
                                            className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs transition-colors inline-flex items-center gap-1.5"
                                            title="Escucha tracks de otros productores y comparte los tuyos"
                                        >
                                            <span>Comunidad</span>
                                        </a>
                                    )}
                                    <a
                                        href="/ideas"
                                        onClick={() => trackEvent('panel_ideas_clicked', { from: 'user_panel' })}
                                        className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs transition-colors inline-flex items-center gap-1.5"
                                        title="Propón mejoras y vota ideas de la comunidad"
                                    >
                                        <span>💡</span>
                                        <span>Propón ideas</span>
                                    </a>
                                    <button
                                        onClick={handlePanelLogout}
                                        className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-400 rounded-lg text-xs transition-colors"
                                    >
                                        Salir
                                    </button>
                                </div>
                            </div>

                            {/* CTA de la encuesta de comunidad (en el panel) */}
                            {panelView === 'proyectos' && <EncuestaCTA origen="panel" />}

                            {/* === VISTA DE PERFIL DE COMUNIDAD === */}
                            {panelView === 'perfil' && (
                                <PerfilView
                                    opciones={opciones}
                                    username={panelUsername}
                                    onUsernameChange={(u) => setPanelUsername(u)}
                                    onClose={() => setPanelView('proyectos')}
                                />
                            )}

                            {/* === VISTA DE PROYECTOS === */}
                            {panelView === 'proyectos' && (
                                <div className="mb-8">
                                    <h3 className="text-sm font-bold text-white mb-1">Tus proyectos</h3>
                                    <p className="text-xs text-gray-500 mb-3">
                                        Para crear un proyecto nuevo, empieza un análisis y elige “+ Crear nuevo” al rellenar el campo Proyecto.
                                    </p>
                                    {panelProyectos.length > 0 ? (
                                        <div className="grid gap-3" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))'}}>
                                            {panelProyectos.map(p => (
                                                <div
                                                    key={p.id}
                                                    className="card p-4 cursor-pointer hover:bg-gray-800/30 transition-colors"
                                                    onClick={() => loadProyectoDetalle(p.id)}
                                                    style={{borderLeft: '3px solid var(--po-purple)'}}
                                                >
                                                    <div className="text-white text-sm font-medium mb-1 truncate" title={p.nombre}>
                                                        {p.nombre}
                                                    </div>
                                                    <div className="text-xs text-gray-500">
                                                        {p.n_versiones || 0} {(p.n_versiones || 0) === 1 ? 'versión' : 'versiones'}
                                                        {p.fecha_ultima_version && (
                                                            <> · última: {new Date(p.fecha_ultima_version).toLocaleDateString('es-ES', {day:'numeric', month:'short'})}</>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-xs text-gray-600 italic">Aún no hay proyectos.</div>
                                    )}
                                </div>
                            )}

                            {/* === DETALLE DE UN PROYECTO === */}
                            {panelView === 'detalle' && (
                                <div className="mb-8">
                                    <button
                                        onClick={goBackToProyectos}
                                        className="text-xs text-gray-400 hover:text-white mb-4 inline-flex items-center gap-1"
                                    >
                                        ← Volver a proyectos
                                    </button>
                                    {!panelProyectoActivo ? (
                                        <div className="text-gray-500 text-sm">Cargando proyecto...</div>
                                    ) : (
                                        <div>
                                            <h3 className="text-lg font-bold text-white mb-1">{panelProyectoActivo.proyecto.nombre}</h3>
                                            <p className="text-xs text-gray-500 mb-5">
                                                {panelProyectoActivo.versiones.length} {panelProyectoActivo.versiones.length === 1 ? 'versión' : 'versiones'}
                                            </p>

                                            {/* Avance del proyecto: lista vertical de versiones, cada una con su checklist */}
                                            {panelProyectoActivo.versiones.length >= 1 && (() => {
                                                const versiones = panelProyectoActivo.versiones;
                                                const colorScore = (s) => s.ok === s.total ? '#4ade80'
                                                    : s.ok >= s.total / 2 ? '#facc15' : '#f87171';

                                                // Punto coloreado (verde si pasa, rojo si no, gris si sin datos).
                                                const Dot = ({ passed }) => {
                                                    const color = passed === true ? '#4ade80'
                                                        : passed === false ? '#f87171' : '#4b5563';
                                                    return (
                                                        <span
                                                            className="inline-block rounded-full flex-shrink-0"
                                                            style={{ width: 10, height: 10, background: color }}
                                                        />
                                                    );
                                                };

                                                const lastSum = checklistSummary(computeChecklist(versiones[versiones.length - 1]));
                                                return (
                                                    <div className="card p-5 mb-6">
                                                        <div
                                                            onClick={() => setPanelAvanceOpen(o => !o)}
                                                            className="flex items-baseline justify-between gap-3 cursor-pointer select-none"
                                                        >
                                                            <h3 className="text-sm font-bold text-white">
                                                                Progreso del proyecto
                                                                <span className="text-xs font-normal text-gray-500 ml-2">(click para desplegar)</span>
                                                            </h3>
                                                            <div className="flex items-baseline gap-3 whitespace-nowrap">
                                                                <span className="text-xs font-semibold" style={{color: colorScore(lastSum)}}>
                                                                    {lastSum.ok}/{lastSum.total} en v{versiones[versiones.length - 1].version_num}
                                                                </span>
                                                                <span className="text-xs text-gray-500">{panelAvanceOpen ? '▾' : '▸'}</span>
                                                            </div>
                                                        </div>
                                                        {panelAvanceOpen && (
                                                        <>
                                                        <p className="text-xs text-gray-500 mt-1 mb-5">
                                                            Estado de cada versión, de la más reciente arriba a la más antigua abajo.
                                                        </p>
                                                        <div className="space-y-6">
                                                            {versiones
                                                                .map((v, idx) => ({ v, idx, vAnt: idx > 0 ? versiones[idx - 1] : null }))
                                                                .reverse()
                                                                .map(({ v, idx, vAnt }) => {
                                                                const items = computeChecklist(v);
                                                                const sum = checklistSummary(items);
                                                                const deltas = vAnt ? describePerceptualDeltas(vAnt, v) : [];
                                                                return (
                                                                    <div key={v.id}>
                                                                        {/* Header de la versión */}
                                                                        <div className="flex items-baseline justify-between gap-3 mb-3">
                                                                            <div className="text-sm text-white min-w-0">
                                                                                <strong>v{v.version_num}</strong>
                                                                                {v.version_etiqueta && (
                                                                                    <span className="text-gray-500 ml-2 text-xs truncate font-normal">— {v.version_etiqueta}</span>
                                                                                )}
                                                                            </div>
                                                                            <span className="text-xs font-semibold whitespace-nowrap" style={{color: colorScore(sum)}}>
                                                                                {sum.ok}/{sum.total} puntos cubiertos
                                                                            </span>
                                                                        </div>

                                                                        {/* Checklist */}
                                                                        <ul className="space-y-2 mb-2">
                                                                            {items.map((it, i) => (
                                                                                <li key={i} className="flex items-baseline gap-3">
                                                                                    <span className="self-center"><Dot passed={it.passed} /></span>
                                                                                    <span className="flex-1 text-sm text-gray-300 truncate">{it.label}</span>
                                                                                    <span className="text-xs text-gray-500 whitespace-nowrap">{it.detail}</span>
                                                                                </li>
                                                                            ))}
                                                                        </ul>

                                                                        {/* Cambios respecto a la versión anterior */}
                                                                        {vAnt && deltas.length > 0 && (
                                                                            <div className="mt-3 pl-5">
                                                                                <p className="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">
                                                                                    cambios vs v{vAnt.version_num}
                                                                                </p>
                                                                                <ul className="space-y-1">
                                                                                    {deltas.map((d, j) => (
                                                                                        <li key={j}
                                                                                            className="text-xs flex items-baseline gap-2"
                                                                                            style={{
                                                                                                color: d.mejora === true ? '#4ade80'
                                                                                                    : d.mejora === false ? '#f87171' : '#9ca3af',
                                                                                            }}>
                                                                                            <span>{d.mejora === true ? '↑' : d.mejora === false ? '↓' : '·'}</span>
                                                                                            <span>{d.texto}</span>
                                                                                        </li>
                                                                                    ))}
                                                                                </ul>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                        </>
                                                        )}
                                                    </div>
                                                );
                                            })()}

                                            {/* Lista de versiones desplegables — usa la tarjeta rica */}
                                            <div className="space-y-2">
                                                {panelProyectoActivo.versiones.slice().reverse().map(v => {
                                                    const isOpen = panelExpandedVersion === v.id;
                                                    const parsed = parseAnalisisRow(v);
                                                    return (
                                                        <div key={v.id} className="card overflow-hidden">
                                                            <div
                                                                className="p-4 cursor-pointer hover:bg-gray-800/30 transition-colors"
                                                                onClick={() => setPanelExpandedVersion(isOpen ? null : v.id)}
                                                            >
                                                                <div className="flex items-center justify-between">
                                                                    <div className="flex items-center gap-3 min-w-0">
                                                                        <span className="text-lg">{parsed.semaforo.emoji}</span>
                                                                        <div className="min-w-0">
                                                                            <div className="flex items-center gap-2">
                                                                                <span className="text-white font-medium text-sm">v{v.version_num}</span>
                                                                                {v.version_etiqueta && <span className="text-gray-500 text-xs truncate">— {v.version_etiqueta}</span>}
                                                                                {parsed.bpm && <span className="text-gray-600 text-xs">{parsed.bpm} BPM</span>}
                                                                            </div>
                                                                            <p className="text-gray-400 text-xs mt-0.5 truncate max-w-md">{parsed.diagPrincipal || 'Sin diagnóstico'}</p>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-3 whitespace-nowrap">
                                                                        {parsed.fueUtil && (
                                                                            <span className={parsed.fueUtil === 'Sí' ? 'accent-green text-xs' : 'text-red-400 text-xs'}>
                                                                                {parsed.fueUtil === 'Sí' ? '👍' : '👎'}
                                                                            </span>
                                                                        )}
                                                                                                                                                <span className="text-gray-600 text-xs">
                                                                            {v.timestamp ? new Date(v.timestamp).toLocaleDateString('es-ES', {day:'numeric',month:'short'}) : ''}
                                                                        </span>
                                                                        <span className="text-gray-600 text-xs">{isOpen ? '▲' : '▼'}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            {isOpen && renderRichDetail(parsed)}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* === LISTADO PLANO (legacy + sueltos) — solo cuando estamos en vista proyectos === */}
                            {panelView === 'proyectos' && (
                                <h3 className="text-sm font-bold text-white mb-3 mt-2">Todos los análisis</h3>
                            )}

                            {panelView !== 'proyectos' ? null : panelLoading ? (
                                <div className="text-center py-16">
                                    <div className="pulse-dot text-gray-500 text-sm">Cargando historial...</div>
                                </div>
                            ) : panelHistorial.length === 0 ? (
                                <div className="text-center py-16">
                                    <div className="text-3xl mb-3" style={{color: 'var(--po-medium)'}}>—</div>
                                    <p className="text-gray-500 mb-4">Aún no tienes análisis.</p>
                                    <button
                                        onClick={handleReset}
                                        className="px-6 py-3 btn-primary rounded-xl transition-colors"
                                    >
                                        Analizar mi primer track
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {panelHistorial.slice().reverse().map((row, idx) => {
                                        // Lookup proyecto por id (cada fila, barato — pocos proyectos).
                                        const proyectosById = {};
                                        (panelProyectos || []).forEach(p => { proyectosById[p.id] = p; });
                                        const rowProyectoId = row.proyecto_id || '';
                                        const rowAnalisisId = row.id || '';
                                        const rowProyecto = rowProyectoId ? proyectosById[rowProyectoId] : null;
                                        const rowProyectoNombre = rowProyecto ? rowProyecto.nombre
                                            : (row.nombre_proyecto_legacy || row.nombre_proyecto || '');
                                        const versionNum = row.version_num;
                                        const versionEtq = row.version_etiqueta || '';
                                        const puedeAsignar = !rowProyectoId && rowAnalisisId && (panelProyectos || []).length > 0;
                                        // Parsear datos del row
                                        const formulario = row.formulario || '';
                                        const diag = row.diagnostico || '';
                                        const ts = row.timestamp || '';
                                        const date = ts ? new Date(ts) : null;

                                        // Parsear formulario
                                        const parts = formulario.split(' | ').map(p => p.trim());
                                        const genero = parts[0] || '';
                                        const fase = parts[1] || '';
                                        const objetivo = parts[2] || '';

                                        // Estado
                                        const estadoMatch = diag.match(/ESTADO:\s*(.+)/i);
                                        const estado = estadoMatch ? estadoMatch[1].trim() : '';
                                        const est = estado.toLowerCase();
                                        const semaforo = est.includes('temprana') || est.includes('verde')
                                            ? { emoji: '🔴', color: '#f87171', bg: 'rgba(248,113,113,0.08)', border: '#7f1d1d', label: 'Fase temprana' }
                                            : est.includes('pulir') || est.includes('avanzado') || est.includes('azul')
                                            ? { emoji: '🔵', color: '#60a5fa', bg: 'rgba(96,165,250,0.08)', border: '#1e3a5f', label: 'Listo para pulir' }
                                            : { emoji: '🟡', color: '#facc15', bg: 'rgba(250,204,21,0.08)', border: '#713f12', label: 'En desarrollo' };

                                        // Diagnóstico principal
                                        const dpMatch = diag.match(/DIAGNÓSTICO PRINCIPAL:\s*(.+)/i);
                                        const diagPrincipal = dpMatch ? dpMatch[1].trim().replace(/\s*\([^)]*\)\s*$/, '') : '';

                                        // Explicación
                                        const explMatch = diag.match(/Explicación:\s*(.+)/i);
                                        const explicacion = explMatch ? explMatch[1].trim() : '';

                                        // Prioridades
                                        const prioMatch = diag.match(/PRIORIDADES:\s*(.+)/im);
                                        const prioridades = prioMatch ? prioMatch[1].split(' | ').map(p => p.replace(/^\d+\.\s*/, '').trim()).filter(Boolean) : [];

                                        // Mezcla
                                        const bpmMatch = diag.match(/BPM:\s*(\d+)/);
                                        const bpm = bpmMatch ? bpmMatch[1] : '';
                                        const durMatch = diag.match(/Duración:\s*(.+)/);
                                        const duracion = durMatch ? durMatch[1].trim().split('\n')[0] : '';
                                        const lufsMatch = diag.match(/([-\d.]+)\s*LUFS/);
                                        const lufs = lufsMatch ? lufsMatch[1] : '';

                                        const fueUtil = row.fue_util || '';
                                        const comentario = row.comentario || '';
                                        const enlace = row.feedback_real || row.enlace_feedback_real || '';

                                        const isExpanded = panelSelectedEntry === idx;

                                        return (
                                            <div key={idx} className="card overflow-hidden">
                                                {/* Resumen clickable */}
                                                <div
                                                    className="p-4 cursor-pointer hover:bg-gray-800/30 transition-colors"
                                                    onClick={() => setPanelSelectedEntry(isExpanded ? null : idx)}
                                                >
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-lg">{semaforo.emoji}</span>
                                                            <div>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="text-white text-sm font-medium">{genero || 'Sin género'}</span>
                                                                    {bpm && <span className="text-gray-600 text-xs">{bpm} BPM</span>}
                                                                </div>
                                                                <p className="text-gray-400 text-xs mt-0.5 max-w-md truncate">{diagPrincipal || 'Sin diagnóstico'}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            {fueUtil && (
                                                                <span className={fueUtil === 'Sí' ? 'accent-green text-xs' : 'text-red-400 text-xs'}>
                                                                    {fueUtil === 'Sí' ? '👍' : '👎'}
                                                                </span>
                                                            )}
                                                                                                                        <span className="text-gray-600 text-xs">
                                                                {date ? date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''}
                                                            </span>
                                                            <span className="text-gray-600 text-xs">{isExpanded ? '▲' : '▼'}</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Meta de proyecto: chip si está asignado, asignación inline si es huérfano */}
                                                {rowProyectoId && rowProyectoNombre && (
                                                    <div className="px-4 pb-3 -mt-1 flex items-center gap-2 flex-wrap">
                                                        <span
                                                            className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px]"
                                                            style={{background: 'rgba(168,85,247,0.18)', color: '#ffffff', border: '1px solid rgba(168,85,247,0.4)'}}
                                                            title={rowProyectoNombre}
                                                        >
                                                            <span>📁</span>
                                                            <span className="truncate" style={{maxWidth: '180px'}}>{rowProyectoNombre}</span>
                                                            {versionNum != null && <span style={{opacity: 0.8}}>· v{versionNum}</span>}
                                                            {versionEtq && <span style={{opacity: 0.7}} className="truncate" title={versionEtq}>· {versionEtq}</span>}
                                                        </span>
                                                    </div>
                                                )}
                                                {puedeAsignar && (
                                                    <div className="px-4 pb-3 -mt-1 flex items-center gap-2 flex-wrap" onClick={(e) => e.stopPropagation()}>
                                                        <span className="text-[11px] text-gray-500">Sin proyecto:</span>
                                                        <select
                                                            value={proyectoTarget[rowAnalisisId] || ''}
                                                            onChange={(e) => setProyectoTarget(prev => ({...prev, [rowAnalisisId]: e.target.value}))}
                                                            className="px-2 py-1 rounded text-[11px] input-field"
                                                            style={{minWidth: '160px'}}
                                                        >
                                                            <option value="">— Asignar a proyecto —</option>
                                                            {panelProyectos.map(p => (
                                                                <option key={p.id} value={p.id}>{p.nombre}</option>
                                                            ))}
                                                        </select>
                                                        <button
                                                            onClick={() => asignarAnalisisAProyecto(rowAnalisisId)}
                                                            disabled={!proyectoTarget[rowAnalisisId] || asignandoId === rowAnalisisId}
                                                            className="px-2 py-1 btn-primary rounded text-[11px] disabled:opacity-50 disabled:cursor-not-allowed"
                                                        >
                                                            {asignandoId === rowAnalisisId ? '...' : 'Asignar'}
                                                        </button>
                                                    </div>
                                                )}
                                                {!rowProyectoId && rowAnalisisId && (panelProyectos || []).length === 0 && (
                                                    <div className="px-4 pb-3 -mt-1">
                                                        <span className="text-[11px] text-gray-600 italic">
                                                            Sin proyecto · crea uno desde un nuevo análisis para empezar a agrupar.
                                                        </span>
                                                    </div>
                                                )}

                                                {/* Detalle expandido */}
                                                {isExpanded && (
                                                    <div className="border-t border-gray-800 fade-in">
                                                        {/* Estado */}
                                                        <div className="px-4 py-3">
                                                            <div className="px-4 py-3 rounded-lg" style={{ background: semaforo.bg, border: `1px solid ${semaforo.border}` }}>
                                                                <span className="text-sm" style={{ color: semaforo.color }}>{estado}</span>
                                                            </div>
                                                        </div>

                                                        {/* Diagnóstico */}
                                                        {diagPrincipal && (
                                                            <div className="px-4 pb-3">
                                                                <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Diagnóstico principal</p>
                                                                <div className="rounded-lg p-3" style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.15)' }}>
                                                                    <p className="text-orange-400 text-sm font-medium">{diagPrincipal}</p>
                                                                    {explicacion && <p className="text-gray-300 text-xs mt-2 leading-relaxed">{explicacion}</p>}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Prioridades */}
                                                        {prioridades.length > 0 && (
                                                            <div className="px-4 pb-3">
                                                                <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Prioridades</p>
                                                                <div className="space-y-1.5">
                                                                    {prioridades.map((p, i) => (
                                                                        <div key={i} className="flex items-start gap-2">
                                                                            <span className="flex-shrink-0 w-5 h-5 rounded-full bg-purple-900/40 accent-purple text-xs flex items-center justify-center font-medium">{i+1}</span>
                                                                            <p className="text-gray-300 text-xs leading-relaxed pt-0.5">{p}</p>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Datos rápidos */}
                                                        <div className="px-4 pb-3">
                                                            <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Datos</p>
                                                            <div className="flex flex-wrap gap-2">
                                                                {genero && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{genero}</span>}
                                                                {fase && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{fase}</span>}
                                                                {objetivo && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{objetivo}</span>}
                                                                {bpm && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{bpm} BPM</span>}
                                                                {lufs && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{lufs} LUFS</span>}
                                                                {duracion && <span className="px-2 py-1 rounded text-xs bg-gray-800 text-gray-300">{duracion}</span>}
                                                            </div>
                                                        </div>

                                                        {/* Feedback */}
                                                        {(fueUtil || comentario || enlace) && (
                                                            <div className="px-4 pb-4">
                                                                <p className="text-gray-500 text-xs uppercase tracking-wide mb-2">Feedback</p>
                                                                {fueUtil && <p className="text-gray-400 text-xs mb-1">¿Fue útil? <span className={fueUtil === 'Sí' ? 'accent-green' : 'text-red-400'}>{fueUtil}</span></p>}
                                                                {comentario && <p className="text-gray-400 text-xs italic mb-1">"{comentario}"</p>}
                                                                {enlace && (
                                                                    <div className="mt-1">
                                                                        <span className="accent-purple text-xs">Feedback real solicitado</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}

                                                        {/* Ver diagnóstico completo */}
                                                        <div className="px-4 pb-4">
                                                            <details className="group">
                                                                <summary className="text-gray-500 text-xs cursor-pointer hover:text-gray-300 transition-colors">Ver diagnóstico completo</summary>
                                                                {renderDiagnosticoCompleto(parseAnalisisRow(row))}
                                                            </details>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* Footer */}
                            <div className="text-center mt-8 mb-4">
                                <p className="text-gray-600 text-xs">Mentotrack no almacena el archivo de tu canción, solo los datos extraídos tras el análisis.</p>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    </script>
