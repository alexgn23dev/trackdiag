<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackDiag — Diagnóstico para productores</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e5e5e5; }
        .drop-zone { border: 2px dashed #333; transition: all 0.2s; }
        .drop-zone.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05); }
        .drop-zone:hover { border-color: #6d28d9; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-dot { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        input[type="range"] { -webkit-appearance: none; background: #222; height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #8b5cf6; border-radius: 50%; cursor: pointer; }
        .card { background: #141414; border: 1px solid #222; border-radius: 12px; }
        .badge-verde { background: #7f1d1d; color: #f87171; }
        .badge-desarrollo { background: #713f12; color: #facc15; }
        .badge-avanzado { background: #1e3a5f; color: #60a5fa; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const API_URL = window.location.hostname === 'localhost'
        ? 'http://localhost:8000'
        : '';

    const SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycby-LFa0ztbqPMD_E-zkRfAfSKLmiTjPjVXdAn44E_rHRHq3XYLCygZqoTlhhT8yT_Mh/exec';

    // =========================================================================
    // Componentes de UI
    // =========================================================================

    function SelectField({ label, options, value, onChange, name }) {
        return (
            <div className="mb-5">
                <label className="block text-sm font-medium text-gray-300 mb-2">{label}</label>
                <div className="grid grid-cols-2 gap-2">
                    {options.map(opt => (
                        <button
                            key={opt.value}
                            type="button"
                            onClick={() => onChange(name, opt.value)}
                            className={`px-3 py-2.5 rounded-lg text-sm text-left transition-all ${
                                value === opt.value
                                    ? 'bg-purple-600 text-white border border-purple-500'
                                    : 'bg-gray-800 text-gray-300 border border-gray-700 hover:border-gray-500'
                            }`}
                        >
                            {opt.label}
                        </button>
                    ))}
                </div>
            </div>
        );
    }

    function TextInput({ label, value, onChange, name, placeholder, maxLength }) {
        return (
            <div className="mb-5">
                <label className="block text-sm font-medium text-gray-300 mb-2">{label}</label>
                <input
                    type="text"
                    value={value}
                    onChange={(e) => onChange(name, e.target.value)}
                    placeholder={placeholder}
                    maxLength={maxLength || 200}
                    className="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 text-sm"
                />
            </div>
        );
    }

    // =========================================================================
    // Pantallas
    // =========================================================================

    // =========================================================================
    // Historial (localStorage)
    // =========================================================================

    const HISTORIAL_KEY = 'trackdiag_historial';

    function guardarEnHistorial(filename, contexto, resultado) {
        const historial = JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
        historial.unshift({
            id: Date.now(),
            fecha: new Date().toISOString(),
            archivo: filename,
            genero: contexto.genero,
            objetivo: contexto.objetivo,
            diagnostico: resultado.diagnostico_principal?.titulo || 'Sin diagnóstico',
            diagnostico_id: resultado.diagnostico_principal?.id || '',
            estado: resultado.estado_track,
            estado_texto: resultado.estado_texto,
            score: resultado.diagnostico_principal?.score || 0,
        });
        // Máximo 50 entradas
        if (historial.length > 50) historial.length = 50;
        localStorage.setItem(HISTORIAL_KEY, JSON.stringify(historial));
    }

    function obtenerHistorial() {
        return JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
    }

    function borrarEntradaHistorial(id) {
        const historial = obtenerHistorial().filter(e => e.id !== id);
        localStorage.setItem(HISTORIAL_KEY, JSON.stringify(historial));
        return historial;
    }

    function HistorialScreen({ onBack, onAnalizar }) {
        const [entradas, setEntradas] = useState(obtenerHistorial());

        const handleBorrar = (id) => {
            setEntradas(borrarEntradaHistorial(id));
        };

        const formatFecha = (iso) => {
            const d = new Date(iso);
            return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        const estadoColor = (estado) => {
            if (estado === 'verde') return 'bg-red-900/30 text-red-400';
            if (estado === 'avanzado') return 'bg-blue-900/30 text-blue-400';
            return 'bg-yellow-900/30 text-yellow-400';
        };

        return (
            <div className="min-h-screen px-4 py-8 fade-in">
                <div className="max-w-2xl mx-auto">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-xl font-bold text-white">Historial de análisis</h2>
                        <button onClick={onBack} className="text-gray-500 hover:text-gray-300 text-sm transition-colors">
                            ← Volver
                        </button>
                    </div>

                    {entradas.length === 0 ? (
                        <div className="text-center py-16">
                            <div className="text-3xl mb-3">📭</div>
                            <p className="text-gray-500 mb-4">Aún no has analizado ningún track.</p>
                            <button
                                onClick={onAnalizar}
                                className="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-xl transition-colors"
                            >
                                Analizar mi primer track
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {entradas.map(e => (
                                <div key={e.id} className="card p-4 flex items-center justify-between gap-4">
                                    <div className="flex-1 min-w-0">
                                        <p className="text-gray-200 text-sm font-medium truncate">{e.archivo}</p>
                                        <p className="text-gray-500 text-xs mt-1">{formatFecha(e.fecha)}</p>
                                    </div>
                                    <div className="flex items-center gap-3 flex-shrink-0">
                                        <span className={`text-xs px-2 py-1 rounded-full ${estadoColor(e.estado)}`}>
                                            {e.estado_texto || e.estado}
                                        </span>
                                        <span className="text-gray-400 text-xs max-w-[140px] truncate hidden sm:block" title={e.diagnostico}>
                                            {e.diagnostico}
                                        </span>
                                        <button
                                            onClick={() => handleBorrar(e.id)}
                                            className="text-gray-600 hover:text-red-400 text-xs transition-colors"
                                            title="Eliminar"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>
                            ))}
                            <p className="text-gray-600 text-xs text-center pt-2">
                                {entradas.length} análisis guardados en este navegador
                            </p>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    // =========================================================================
    // Pantallas
    // =========================================================================

    function LandingScreen({ onStart, onHistorial, historialCount }) {
        return (
            <div className="min-h-screen flex flex-col items-center justify-center px-4 fade-in">
                <div className="max-w-lg text-center">
                    <div className="text-4xl mb-3">🎛️</div>
                    <h1 className="text-3xl font-bold text-white mb-4">TrackDiag</h1>
                    <p className="text-gray-400 text-lg mb-2">
                        Detecta qué debería corregirse antes, qué no conviene tocar todavía
                        y cuál es el siguiente paso para avanzar con tu track.
                    </p>
                    <p className="text-gray-500 text-sm mb-8">
                        No te damos más información. Te damos dirección.
                    </p>
                    <button
                        onClick={onStart}
                        className="px-8 py-4 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-lg transition-colors"
                    >
                        Analizar mi track
                    </button>
                    {historialCount > 0 && (
                        <button
                            onClick={onHistorial}
                            className="block mx-auto mt-4 text-gray-500 hover:text-gray-300 text-sm transition-colors"
                        >
                            Ver historial ({historialCount})
                        </button>
                    )}
                </div>
            </div>
        );
    }

    function UploadScreen({ onFileSelected, file }) {
        const [isDragging, setIsDragging] = useState(false);
        const inputRef = useRef(null);

        const handleDrop = (e) => {
            e.preventDefault();
            setIsDragging(false);
            const f = e.dataTransfer.files[0];
            if (f) onFileSelected(f);
        };

        const handleChange = (e) => {
            const f = e.target.files[0];
            if (f) onFileSelected(f);
        };

        return (
            <div className="min-h-screen flex flex-col items-center justify-center px-4 fade-in">
                <div className="max-w-lg w-full">
                    <h2 className="text-2xl font-bold text-white mb-2 text-center">Sube tu track</h2>
                    <p className="text-gray-400 text-sm mb-6 text-center">
                        WAV, MP3, FLAC o AIFF · Máximo 10 minutos
                    </p>

                    <div
                        className={`drop-zone rounded-xl p-12 text-center cursor-pointer ${isDragging ? 'active' : ''}`}
                        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                        onDragLeave={() => setIsDragging(false)}
                        onDrop={handleDrop}
                        onClick={() => inputRef.current?.click()}
                    >
                        <input
                            ref={inputRef}
                            type="file"
                            accept=".mp3,.wav,.flac,.aiff,.aif,.ogg"
                            onChange={handleChange}
                            className="hidden"
                        />
                        {file ? (
                            <div>
                                <div className="text-2xl mb-2">✅</div>
                                <p className="text-white font-medium">{file.name}</p>
                                <p className="text-gray-500 text-sm mt-1">
                                    {(file.size / 1024 / 1024).toFixed(1)} MB
                                </p>
                            </div>
                        ) : (
                            <div>
                                <div className="text-3xl mb-3 text-gray-500">📂</div>
                                <p className="text-gray-400">
                                    Arrastra tu archivo aquí o haz clic para seleccionar
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    function QuestionnaireScreen({ opciones, contexto, onChange, onSubmit, isValid }) {
        return (
            <div className="min-h-screen flex flex-col items-center py-12 px-4 fade-in">
                <div className="max-w-lg w-full">
                    <h2 className="text-2xl font-bold text-white mb-1">Cuéntanos sobre tu track</h2>
                    <p className="text-gray-400 text-sm mb-8">
                        Esto nos ayuda a no interpretar el audio a ciegas.
                    </p>

                    <SelectField
                        label="¿Qué género estás produciendo?"
                        options={opciones.generos}
                        value={contexto.genero}
                        onChange={onChange}
                        name="genero"
                    />

                    <SelectField
                        label="¿En qué fase crees que está el track?"
                        options={opciones.fases}
                        value={contexto.fase}
                        onChange={onChange}
                        name="fase"
                    />

                    <SelectField
                        label="¿Cuál es tu objetivo con este track?"
                        options={opciones.objetivos}
                        value={contexto.objetivo}
                        onChange={onChange}
                        name="objetivo"
                    />

                    <TextInput
                        label="¿Qué crees que no funciona?"
                        value={contexto.bloqueo_percibido}
                        onChange={onChange}
                        name="bloqueo_percibido"
                        placeholder="Ej: suena repetitivo, no me convence el drop, la mezcla está turbia..."
                    />

                    <SelectField
                        label="¿Cuánto tiempo llevas produciendo?"
                        options={opciones.experiencia}
                        value={contexto.experiencia}
                        onChange={onChange}
                        name="experiencia"
                    />

                    <SelectField
                        label="¿Qué es lo que más te cuesta normalmente?"
                        options={opciones.dificultad_habitual}
                        value={contexto.dificultad_habitual}
                        onChange={onChange}
                        name="dificultad_habitual"
                    />

                    <button
                        onClick={onSubmit}
                        disabled={!isValid}
                        className={`w-full mt-6 px-6 py-4 rounded-xl font-semibold text-lg transition-all ${
                            isValid
                                ? 'bg-purple-600 hover:bg-purple-500 text-white'
                                : 'bg-gray-800 text-gray-500 cursor-not-allowed'
                        }`}
                    >
                        Analizar track
                    </button>
                </div>
            </div>
        );
    }

    function ProcessingScreen({ datos }) {
        const steps = [
            "Cargando audio...",
            `${datos?.bpm ? datos.bpm + ' BPM detectados' : 'Detectando tempo...'}`,
            "Analizando distribución de energía...",
            "Evaluando balance espectral...",
            "Cruzando con tu contexto...",
            "Generando diagnóstico..."
        ];
        const [currentStep, setCurrentStep] = useState(0);

        useEffect(() => {
            const interval = setInterval(() => {
                setCurrentStep(prev => prev < steps.length - 1 ? prev + 1 : prev);
            }, 800);
            return () => clearInterval(interval);
        }, []);

        return (
            <div className="min-h-screen flex flex-col items-center justify-center px-4 fade-in">
                <div className="max-w-md w-full text-center">
                    <div className="flex items-center justify-center gap-2 mb-8">
                        <div className="w-2 h-2 rounded-full bg-purple-500 pulse-dot"></div>
                        <div className="w-2 h-2 rounded-full bg-purple-500 pulse-dot" style={{animationDelay: '0.3s'}}></div>
                        <div className="w-2 h-2 rounded-full bg-purple-500 pulse-dot" style={{animationDelay: '0.6s'}}></div>
                    </div>
                    <div className="space-y-3">
                        {steps.map((step, i) => (
                            <p
                                key={i}
                                className={`text-sm transition-all duration-300 ${
                                    i <= currentStep ? 'text-gray-300' : 'text-gray-700'
                                } ${i === currentStep ? 'text-white font-medium' : ''}`}
                            >
                                {i < currentStep ? '✓ ' : i === currentStep ? '→ ' : ''}{step}
                            </p>
                        ))}
                    </div>
                </div>
            </div>
        );
    }

    function DiagnosticoScreen({ resultado, onReset, contexto, userEmail }) {
        const r = resultado;
        const d = r.datos_audio;
        const [feedbackStep, setFeedbackStep] = useState(0); // 0=results, 1=util?, 2=feedback real
        const [feedbackUtil, setFeedbackUtil] = useState(null); // true/false
        const [feedbackComentario, setFeedbackComentario] = useState('');
        const [feedbackEnlace, setFeedbackEnlace] = useState('');
        const [feedbackEnviado, setFeedbackEnviado] = useState(false);
        const [feedbackRealEnviado, setFeedbackRealEnviado] = useState(false);

        const semaforoConfig = r.estado_track === 'verde'
            ? { color: '#f87171', bg: 'rgba(248,113,113,0.10)', border: '#7f1d1d', label: 'Fase temprana', icon: '🔴' }
            : r.estado_track === 'avanzado'
            ? { color: '#60a5fa', bg: 'rgba(96,165,250,0.10)', border: '#1e3a5f', label: 'Listo para pulir', icon: '🔵' }
            : { color: '#facc15', bg: 'rgba(250,204,21,0.10)', border: '#713f12', label: 'En desarrollo', icon: '🟡' };

        return (
            <div className="min-h-screen py-12 px-4 fade-in">
                <div className="max-w-2xl mx-auto">

                    {/* ===== RESUMEN VISUAL ===== */}
                    <div className="card p-8 mb-6 text-center" style={{borderTop: `3px solid ${semaforoConfig.color}`}}>
                        <div className="text-2xl mb-2">{semaforoConfig.icon}</div>
                        <p className="text-sm font-medium uppercase tracking-wider mb-2" style={{color: semaforoConfig.color}}>
                            {semaforoConfig.label}
                        </p>
                        <h2 className="text-xl font-bold text-white mb-2">{r.diagnostico_principal.titulo}</h2>
                        <p className="text-gray-400 text-sm mb-6">{r.estado_texto}</p>

                        {/* Top 3 prioridades inline */}
                        <div className="text-left space-y-3 max-w-md mx-auto">
                            {r.prioridades.slice(0, 3).map((p, i) => (
                                <div key={i} className="flex gap-3 items-start">
                                    <span className="flex-shrink-0 w-6 h-6 rounded-full bg-green-900 text-green-400 flex items-center justify-center text-xs font-bold">{i + 1}</span>
                                    <p className="text-gray-300 text-sm">{p}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Diagnóstico principal — detalles expandibles */}
                    <details className="card p-6 mb-4">
                        <summary className="cursor-pointer">
                            <span className="text-xs text-purple-400 font-medium uppercase tracking-wider">Diagnóstico principal — por qué</span>
                        </summary>
                        <div className="mt-4 text-gray-400 text-sm whitespace-pre-line">{r.diagnostico_principal.explicacion}</div>
                    </details>

                    {/* Nota contextual personalizada */}
                    {r.nota_contextual && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid #8b5cf6'}}>
                            {r.nota_motivacional && (
                                <p className="text-purple-300 text-sm font-medium mb-2">{r.nota_motivacional}</p>
                            )}
                            <p className="text-gray-300 text-sm leading-relaxed">{r.nota_contextual}</p>
                            {r.referencia_temporal && (
                                <p className="text-gray-500 text-xs mt-3">{r.referencia_temporal}</p>
                            )}
                        </div>
                    )}

                    {/* Error de foco */}
                    {r.error_de_foco && (
                        <div className="card p-5 mb-4 border-yellow-600">
                            <p className="text-xs text-yellow-400 font-medium uppercase tracking-wider mb-2">Atención</p>
                            <p className="text-gray-300 text-sm">{r.error_de_foco_mensaje}</p>
                        </div>
                    )}

                    {/* Diagnóstico secundario */}
                    {r.diagnostico_secundario && (
                        <div className="card p-5 mb-4">
                            <p className="text-xs text-gray-500 font-medium uppercase tracking-wider mb-2">También se detecta</p>
                            <p className="text-gray-300">{r.diagnostico_secundario.titulo}</p>
                        </div>
                    )}

                    {/* Prioridades extra (si hay más de 3) */}
                    {r.prioridades.length > 3 && (
                        <div className="card p-6 mb-4">
                            <p className="text-xs text-green-400 font-medium uppercase tracking-wider mb-3">Prioridades adicionales</p>
                            <div className="space-y-3">
                                {r.prioridades.slice(3).map((p, i) => (
                                    <div key={i} className="flex gap-3">
                                        <span className="flex-shrink-0 w-6 h-6 rounded-full bg-green-900 text-green-400 flex items-center justify-center text-xs font-bold">{i + 4}</span>
                                        <p className="text-gray-300 text-sm">{p}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tips de género */}
                    {r.tips_genero && r.tips_genero.length > 0 && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid #6366f1'}}>
                            <p className="text-xs text-indigo-400 font-medium uppercase tracking-wider mb-3">Contexto de género</p>
                            <div className="space-y-2">
                                {r.tips_genero.map((tip, i) => (
                                    <p key={i} className="text-gray-300 text-sm leading-relaxed">{tip}</p>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* No tocar aún */}
                    {r.no_tocar_aun && r.no_tocar_aun.length > 0 && (
                        <div className="card p-6 mb-4">
                            <p className="text-xs text-red-400 font-medium uppercase tracking-wider mb-3">No tocar todavía</p>
                            <div className="space-y-2">
                                {r.no_tocar_aun.map((item, i) => (
                                    <p key={i} className="text-gray-400 text-sm">— {item}</p>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tip según objetivo */}
                    {r.tip_objetivo && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid #f59e0b'}}>
                            <p className="text-xs text-yellow-500 font-medium uppercase tracking-wider mb-2">Según tu objetivo</p>
                            <p className="text-gray-300 text-sm leading-relaxed">{r.tip_objetivo}</p>
                        </div>
                    )}

                    {/* Siguiente sesión */}
                    <div className="card p-6 mb-4 border-purple-800">
                        <p className="text-xs text-purple-400 font-medium uppercase tracking-wider mb-2">Tu próxima sesión</p>
                        <p className="text-white text-sm leading-relaxed">{r.siguiente_sesion}</p>
                    </div>

                    {/* Disclaimer */}
                    {r.disclaimer && (
                        <div className="card p-5 mb-4" style={{borderLeft: '3px solid #555'}}>
                            <p className="text-gray-500 text-xs leading-relaxed">{r.disclaimer}</p>
                        </div>
                    )}

                    {/* Mezcla */}
                    <details className="card p-5 mb-4" open>
                        <summary className="text-xs text-gray-400 font-medium uppercase tracking-wider cursor-pointer">
                            Mezcla
                        </summary>
                        <div className="mt-4 space-y-4 text-sm">

                            {/* Balance grave */}
                            <div>
                                <div className="flex justify-between items-baseline">
                                    <span className="text-gray-400">Balance grave</span>
                                    <span className={
                                        d.balance_grave === 'normal' ? 'text-green-400' :
                                        d.balance_grave === 'elevado' ? 'text-yellow-400' :
                                        'text-red-400'
                                    }>{d.balance_grave}</span>
                                </div>
                                <p className="text-gray-600 text-xs mt-1">Relación entre la energía de graves y medios.</p>
                                {d.balance_grave === 'elevado' && (
                                    <p className="text-yellow-400/70 text-xs mt-1">Los graves están algo por encima de lo habitual. Revisa si el kick o el sub están compitiendo con los medios. Prueba a bajar 2-3dB en la zona de 60-120Hz o aplicar sidechain al sub con el kick.</p>
                                )}
                                {d.balance_grave === 'excesivo' && (
                                    <p className="text-red-400/70 text-xs mt-1">Los graves dominan la mezcla. Esto puede sonar bien en auriculares pero en un club será barro. Reduce el sub o el kick, y comprueba con un analizador que no estés acumulando energía por debajo de 50Hz.</p>
                                )}
                            </div>

                            {/* Densidad */}
                            <div>
                                <div className="flex justify-between items-baseline">
                                    <span className="text-gray-400">Densidad</span>
                                    <span className={
                                        d.densidad === 'baja' || d.densidad === 'media' ? 'text-green-400' :
                                        d.densidad === 'alta' ? 'text-yellow-400' :
                                        'text-red-400'
                                    }>{d.densidad}</span>
                                </div>
                                <p className="text-gray-600 text-xs mt-1">Cuánto del espectro frecuencial está ocupado a la vez.</p>
                                {d.densidad === 'alta' && (
                                    <p className="text-yellow-400/70 text-xs mt-1">La mezcla está algo cargada. Revisa si hay elementos que se pisan en la misma zona frecuencial. Prueba a silenciar pistas una a una para identificar cuáles sobran o necesitan EQ.</p>
                                )}
                                {d.densidad === 'saturada' && (
                                    <p className="text-red-400/70 text-xs mt-1">El espectro está muy ocupado — casi no hay hueco entre elementos. Esto causa fatiga auditiva y pierde definición. Elimina o baja capas que no aporten, aplica EQ sustractivo agresivo, y prioriza: menos es más.</p>
                                )}
                            </div>

                            {/* Loudness (LUFS) */}
                            {d.loudness && d.loudness.lufs_integrado > -99 && (() => {
                                const esSesion = contexto && (contexto.objetivo === 'pinchar' || contexto.objetivo === 'todo');
                                const esSellos = contexto && contexto.objetivo === 'sellos';
                                // Para sesión/pinchar: >-8 es verde, -8 a -12 amarillo, <-12 bajo
                                // Para sellos: -10 a -6 verde (headroom para mastering)
                                // Para aprender: usar nivel estándar
                                let loudnessColor;
                                let loudnessTip = '';
                                if (esSesion) {
                                    loudnessColor = d.loudness.lufs_integrado > -8 ? 'text-green-400' :
                                                    d.loudness.lufs_integrado > -12 ? 'text-yellow-400' :
                                                    'text-blue-400';
                                    if (d.loudness.lufs_integrado <= -12) {
                                        loudnessTip = 'Para tocar en sesión, tu track está bajo. Los DJs mezclan con tracks a -6/-8 LUFS. Si tu track está mucho más bajo, perderá impacto en la mezcla. Sube el limiter o revisa tu cadena de master.';
                                    } else if (d.loudness.lufs_integrado > -5) {
                                        loudnessTip = 'Cuidado: muy comprimido. Aunque suena fuerte, has perdido dinámica. En un sistema grande puede sonar plano y fatigante.';
                                    }
                                } else if (esSellos) {
                                    loudnessColor = d.loudness.lufs_integrado >= -10 && d.loudness.lufs_integrado <= -6 ? 'text-green-400' :
                                                    d.loudness.lufs_integrado > -6 ? 'text-yellow-400' :
                                                    d.loudness.lufs_integrado >= -14 ? 'text-yellow-400' :
                                                    'text-blue-400';
                                    if (d.loudness.lufs_integrado > -6) {
                                        loudnessTip = 'Tu track suena fuerte, bien. Pero asegúrate de que tu mezcla suene bien también sin la cadena de mastering — si el sello te firma, probablemente te pidan la versión sin masterizar para que lo haga su ingeniero. Guarda siempre el proyecto sin mastering y comprueba que la mezcla funcione por sí sola aunque suene más baja en volumen.';
                                    } else if (d.loudness.lufs_integrado < -14) {
                                        loudnessTip = 'El nivel está bajo. Para enviar un demo a un sello, envía siempre tu mejor versión — masterizada y a volumen competitivo. Si te firman y quieren masterizarlo ellos, les mandas la versión sin mastering después. Por eso es clave que tu mezcla suene bien por sí sola, sin depender de la cadena de mastering para sonar bien.';
                                    } else if (d.loudness.lufs_integrado >= -10 && d.loudness.lufs_integrado <= -6) {
                                        loudnessTip = 'Buen nivel para un demo a sellos. Recuerda: envía siempre tu mejor versión masterizada. Si te firman y quieren re-masterizar, les mandas la versión sin mastering. Asegúrate de que tu mezcla suene bien por sí sola sin la cadena de mastering.';
                                    }
                                } else {
                                    loudnessColor = d.loudness.nivel === 'moderado' ? 'text-green-400' :
                                                    d.loudness.nivel === 'bajo' ? 'text-blue-400' :
                                                    d.loudness.nivel === 'alto' ? 'text-yellow-400' :
                                                    d.loudness.nivel === 'muy_alto' ? 'text-red-400' :
                                                    'text-gray-400';
                                    if (d.loudness.nivel === 'bajo') {
                                        loudnessTip = 'El volumen general es bajo. No te preocupes en las fases de producción, pero cuando vayas a exportar la versión final, necesitarás un limiter en el master.';
                                    } else if (d.loudness.nivel === 'muy_alto') {
                                        loudnessTip = 'El track está muy comprimido. Has perdido rango dinámico — los drops y breaks suenan al mismo nivel. Baja el limiter y deja respirar la mezcla.';
                                    }
                                }
                                return (
                                <div>
                                    <div className="border-t border-gray-800 pt-4 mt-4">
                                        <div className="flex justify-between items-baseline">
                                            <span className="text-gray-400">Loudness</span>
                                            <span className={loudnessColor}>{d.loudness.lufs_integrado} LUFS</span>
                                        </div>
                                        <p className="text-gray-600 text-xs mt-1">{d.loudness.referencia}</p>
                                        {loudnessTip && (
                                            <p className={`text-xs mt-1 ${loudnessColor.replace('text-', 'text-').replace('400', '400/70')}`}>{loudnessTip}</p>
                                        )}
                                    </div>

                                    <div className="mt-3 grid grid-cols-2 gap-3">
                                        <div>
                                            <span className="text-gray-500 text-xs">Pico short-term</span>
                                            <p className="text-gray-300 text-sm">{d.loudness.lufs_short_term_max} LUFS</p>
                                            <p className="text-gray-600 text-xs">El momento más fuerte del track.</p>
                                        </div>
                                        <div>
                                            <span className="text-gray-500 text-xs">Rango</span>
                                            <p className="text-gray-300 text-sm">{d.loudness.rango_loudness} LU</p>
                                            <p className="text-gray-600 text-xs">Diferencia entre lo más fuerte y lo más suave. Más rango = más dinámica.</p>
                                        </div>
                                    </div>
                                </div>
                                );
                            })()}

                            {/* Mono compatibility */}
                            {d.mono_compat && d.mono_compat.es_stereo && (
                                <div>
                                    <div className="border-t border-gray-800 pt-4 mt-4">
                                        <div className="flex justify-between items-baseline">
                                            <span className="text-gray-400">Compatibilidad mono</span>
                                            <span className={
                                                d.mono_compat.nivel_compatibilidad === 'excelente' ? 'text-green-400' :
                                                d.mono_compat.nivel_compatibilidad === 'buena' ? 'text-blue-400' :
                                                d.mono_compat.nivel_compatibilidad === 'problematica' ? 'text-yellow-400' :
                                                'text-red-400'
                                            }>{d.mono_compat.nivel_compatibilidad}</span>
                                        </div>
                                        <p className="text-gray-600 text-xs mt-1">{d.mono_compat.resumen}</p>
                                        {d.mono_compat.nivel_compatibilidad === 'problematica' && (
                                            <p className="text-yellow-400/70 text-xs mt-1">Algunas frecuencias se cancelan al sumar a mono. En un club con sistema mono (muy común), perderás parte de tu mezcla. Revisa elementos con mucho stereo widening, especialmente en graves y medios.</p>
                                        )}
                                        {d.mono_compat.nivel_compatibilidad === 'critica' && (
                                            <p className="text-red-400/70 text-xs mt-1">Hay cancelaciones de fase serias. En mono perderás energía audible. Comprueba que el kick y el bass estén centrados, y reduce el stereo widener en los elementos importantes. Usa el botón mono de tu DAW para escuchar cómo suena.</p>
                                        )}
                                    </div>

                                    <div className="mt-3 grid grid-cols-2 gap-3">
                                        <div>
                                            <span className="text-gray-500 text-xs">Correlación L/R</span>
                                            <p className="text-gray-300 text-sm">{(d.mono_compat.correlacion_lr * 100).toFixed(0)}%</p>
                                            <p className="text-gray-600 text-xs">Similitud entre canales. 100% = idénticos.</p>
                                        </div>
                                        <div>
                                            <span className="text-gray-500 text-xs">Pérdida en mono</span>
                                            <p className={d.mono_compat.perdida_mono_db < -2 ? 'text-yellow-400 text-sm' : 'text-gray-300 text-sm'}>
                                                {d.mono_compat.perdida_mono_db > 0 ? '+' : ''}{d.mono_compat.perdida_mono_db} dB
                                            </p>
                                            <p className="text-gray-600 text-xs">Energía perdida al sumar a mono. Más de -2dB puede ser audible.</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-2 mt-3">
                                        {['graves', 'medios', 'agudos'].map(banda => (
                                            <div key={banda} className="text-center p-2 rounded-lg bg-gray-800/50">
                                                <span className="text-gray-500 text-xs block capitalize">{banda}</span>
                                                <span className={
                                                    d.mono_compat.bandas[banda].estado === 'ok' ? 'text-green-400 text-sm' :
                                                    d.mono_compat.bandas[banda].estado === 'revisar' ? 'text-yellow-400 text-sm' :
                                                    'text-red-400 text-sm'
                                                }>
                                                    {d.mono_compat.bandas[banda].estado === 'ok' ? '✓ ok' :
                                                     d.mono_compat.bandas[banda].estado === 'revisar' ? '⚠ revisar' : '✗ problema'}
                                                </span>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Recomendaciones por banda */}
                                    {(() => {
                                        const bandasRevisar = ['graves', 'medios', 'agudos'].filter(b => d.mono_compat.bandas[b].estado === 'revisar' || d.mono_compat.bandas[b].estado === 'problema');
                                        if (bandasRevisar.length === 0) return null;
                                        const tips = {
                                            graves: 'Los graves (kick, bass, sub) deberían estar siempre en mono o casi mono. Revisa si tienes un stereo widener afectando al bajo o al kick — desactívalo en esa zona.',
                                            medios: 'Los medios llevan la información principal del track (voces, leads, plucks). Si se pierden en mono, tu track sonará vacío en sistemas mono. Reduce el widening en esos elementos.',
                                            agudos: 'Los agudos toleran mejor la expansión estéreo, pero conviene asegurarse de que no se pierda información importante (voces o leads principales, efectos importantes…).',
                                        };
                                        return (
                                            <div className="mt-3 space-y-1">
                                                {bandasRevisar.map(b => (
                                                    <p key={b} className="text-yellow-400/70 text-xs">{tips[b]}</p>
                                                ))}
                                                <p className="text-yellow-400/70 text-xs mt-2">Haz un test mono en tu DAW (switch mono en master o plugin tipo Utility) y fíjate si algún elemento importante pierde mucho volumen o se degrada en exceso. Es normal que al pasar tu track a mono se pierda parte de la experiencia, eso no es malo, pero debes ser crítico y encontrar un buen balance — eso es lo que llamamos "compatibilidad estéreo".</p>
                                            </div>
                                        );
                                    })()}

                                    {!['graves', 'medios', 'agudos'].some(b => d.mono_compat.bandas[b].estado === 'revisar' || d.mono_compat.bandas[b].estado === 'problema') && (
                                        <p className="text-gray-600 text-xs mt-2">Los graves deben ser siempre mono-compatibles. Los agudos toleran más expansión estéreo, pero conviene asegurarse de que no se pierde información importante.</p>
                                    )}
                                </div>
                            )}

                            {d.mono_compat && !d.mono_compat.es_stereo && (
                                <div className="border-t border-gray-800 pt-4 mt-4">
                                    <div className="flex justify-between items-baseline">
                                        <span className="text-gray-400">Compatibilidad mono</span>
                                        <span className="text-gray-500">N/A</span>
                                    </div>
                                    <p className="text-gray-600 text-xs mt-1">El archivo es mono — no aplica análisis estéreo.</p>
                                </div>
                            )}

                            {/* Harshness — medios-altos chirriantes */}
                            {d.harshness && (
                                <div className="border-t border-gray-800 pt-4 mt-4">
                                    <div className="flex justify-between items-baseline">
                                        <span className="text-gray-400">Medios-altos (harshness)</span>
                                        <span className={
                                            d.harshness.tiene_harshness && d.harshness.nivel === 'severo' ? 'text-red-400' :
                                            d.harshness.tiene_harshness && d.harshness.nivel === 'notable' ? 'text-yellow-400' :
                                            d.harshness.tiene_harshness && d.harshness.nivel === 'leve' ? 'text-yellow-300' :
                                            'text-green-400'
                                        }>
                                            {d.harshness.tiene_harshness
                                                ? d.harshness.nivel === 'severo' ? 'Chirriante'
                                                : d.harshness.nivel === 'notable' ? 'Algo duro'
                                                : 'Ligeramente alto'
                                                : 'Correcto'}
                                        </span>
                                    </div>
                                    {d.harshness.tiene_harshness && (
                                        <div className="mt-2">
                                            <p className="text-gray-500 text-xs">
                                                En un {d.harshness.pct_frames_harsh.toFixed(0)}% del track, los medios-altos dominan sobre los medios. Picos de hasta {d.harshness.pico_p95.toFixed(1)}dB por encima.
                                                {d.harshness.zona_problema === 'presencia' && ' Zona afectada: presencia (2-6kHz) — sintes, voces o percusiones.'}
                                                {d.harshness.zona_problema === 'brillos' && ' Zona afectada: brillos (6-8kHz) — hi-hats, crashes o efectos.'}
                                                {d.harshness.zona_problema === 'ambas' && ' Todo el rango de medios-altos está elevado.'}
                                            </p>
                                            {d.harshness.nivel === 'notable' && (
                                                <p className="text-yellow-400/70 text-xs mt-1">Prueba un EQ dinámico (como TDR Nova, gratis) en el bus master, atenuando 2-3dB en la zona de 3-5kHz solo cuando supere un umbral. Así no pierdes brillo general.</p>
                                            )}
                                            {d.harshness.nivel === 'severo' && (
                                                <p className="text-red-400/70 text-xs mt-1">Identifica qué elementos causan el chirriante: sintes con mucho overtone, percusiones con ataque agresivo, o saturaciones. Trata cada uno por separado con EQ sustractivo en 2-6kHz antes de tocar el master.</p>
                                            )}
                                        </div>
                                    )}
                                    {!d.harshness.tiene_harshness && (
                                        <p className="text-gray-600 text-xs mt-1">No se detectan picos molestos en medios-altos.</p>
                                    )}
                                </div>
                            )}
                        </div>
                    </details>

                    {/* Datos del track (colapsable) */}
                    <details className="card p-5 mb-8">
                        <summary className="text-xs text-gray-500 font-medium uppercase tracking-wider cursor-pointer">
                            Datos del track
                        </summary>
                        <div className="mt-3 space-y-3 text-sm">
                            <div className="flex justify-between items-baseline">
                                <span className="text-gray-500">BPM</span>
                                <span className="text-gray-300">{d.bpm}</span>
                            </div>
                            <p className="text-gray-600 text-xs">Tempo detectado del track.</p>

                            <div className="flex justify-between items-baseline">
                                <span className="text-gray-500">Duración</span>
                                <span className="text-gray-300">{d.duracion}</span>
                            </div>
                            <p className="text-gray-600 text-xs">Duración total del audio analizado.</p>

                        </div>
                    </details>

                    {/* ===== FEEDBACK POST-ANÁLISIS ===== */}
                    {feedbackStep === 0 && (
                        <div className="card p-6 mb-6 text-center">
                            <p className="text-gray-300 text-sm mb-4">¿Te ha sido útil este diagnóstico?</p>
                            <div className="flex gap-3 justify-center">
                                <button
                                    onClick={() => { setFeedbackUtil(true); setFeedbackStep(1); }}
                                    className="px-5 py-2.5 bg-green-900/40 hover:bg-green-900/60 text-green-400 rounded-lg transition-colors text-sm"
                                >
                                    Sí, me ha ayudado
                                </button>
                                <button
                                    onClick={() => { setFeedbackUtil(false); setFeedbackStep(1); }}
                                    className="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-400 rounded-lg transition-colors text-sm"
                                >
                                    No mucho
                                </button>
                            </div>
                        </div>
                    )}

                    {feedbackStep === 1 && !feedbackEnviado && (
                        <div className="card p-6 mb-6 fade-in">
                            <p className="text-gray-300 text-sm mb-1">
                                {feedbackUtil
                                    ? '¡Genial! ¿Algo que quieras comentar?'
                                    : '¿Qué podríamos mejorar? Tu feedback nos ayuda mucho.'}
                            </p>
                            <textarea
                                value={feedbackComentario}
                                onChange={(e) => setFeedbackComentario(e.target.value)}
                                placeholder={feedbackUtil ? 'Opcional: cuéntanos qué te ha parecido más útil...' : '¿Qué esperabas que no has encontrado?'}
                                maxLength={500}
                                rows={3}
                                className="w-full mt-3 px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 text-sm resize-none"
                            />
                            <div className="flex gap-3 mt-3 justify-end">
                                <button
                                    onClick={() => { setFeedbackStep(2); }}
                                    className="text-gray-500 text-xs hover:text-gray-400 transition-colors"
                                >
                                    Saltar
                                </button>
                                <button
                                    onClick={() => {
                                        // Guardar feedback en localStorage (y opcionalmente enviar a API)
                                        const fb = {
                                            timestamp: new Date().toISOString(),
                                            util: feedbackUtil,
                                            comentario: feedbackComentario,
                                            diagnostico: r.diagnostico_principal?.id,
                                        };
                                        const feedbacks = JSON.parse(localStorage.getItem('trackdiag_feedbacks') || '[]');
                                        feedbacks.push(fb);
                                        localStorage.setItem('trackdiag_feedbacks', JSON.stringify(feedbacks));
                                        // Intentar enviar a API (fire & forget)
                                        fetch(`${API_URL}/api/feedback`, {
                                            method: 'POST',
                                            headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify(fb),
                                        }).catch(() => {});
                                        // Enviar a Google Sheets
                                        fetch(SHEETS_WEBHOOK, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify({
                                                tipo: 'feedback_util',
                                                email: userEmail,
                                                util: feedbackUtil ? 'Sí' : 'No',
                                                comentario: feedbackComentario || '',
                                            }),
                                        }).catch(() => {});
                                        setFeedbackEnviado(true);
                                        setTimeout(() => setFeedbackStep(2), 1200);
                                    }}
                                    className="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors text-sm"
                                >
                                    Enviar
                                </button>
                            </div>
                        </div>
                    )}

                    {feedbackStep === 1 && feedbackEnviado && (
                        <div className="card p-6 mb-6 text-center fade-in">
                            <p className="text-green-400 text-sm">Gracias por tu feedback</p>
                        </div>
                    )}

                    {feedbackStep === 2 && (
                        <div className="card p-6 mb-6 fade-in" style={{borderLeft: '3px solid #8b5cf6'}}>
                            <p className="text-purple-400 text-sm font-medium mb-3">¿Quieres feedback real gratis?</p>
                            <p className="text-gray-300 text-sm leading-relaxed mb-3">
                                Sube tu canción aquí y yo mismo (Alex) escucharé y te mandaré un feedback personalizado para ti (limitado a 100).
                            </p>
                            <p className="text-gray-400 text-sm leading-relaxed mb-1">
                                ¿Por qué hago esto?
                            </p>
                            <p className="text-gray-500 text-xs leading-relaxed mb-4">
                                TrackDiag no almacena tu música por defecto, pero la mejor manera de entrenar el motor de análisis es con música real + feedback real. Así que, si quieres formar parte de la mejora de este proyecto y además llevarte feedback sin coste para ti, este es un momento único. Solo lo haré con las 100 primeras personas que apliquen.
                            </p>

                            {!feedbackRealEnviado ? (
                                <div>
                                    <input
                                        type="text"
                                        value={feedbackEnlace}
                                        onChange={(e) => setFeedbackEnlace(e.target.value)}
                                        placeholder="Pega tu enlace de Drive, Dropbox o WeTransfer..."
                                        className="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 text-sm mb-3"
                                    />
                                    <div className="flex gap-3 justify-end">
                                        <button
                                            onClick={() => setFeedbackStep(3)}
                                            className="text-gray-500 text-xs hover:text-gray-400 transition-colors"
                                        >
                                            No, gracias
                                        </button>
                                        <button
                                            onClick={() => {
                                                if (!feedbackEnlace.trim()) return;
                                                const req = {
                                                    timestamp: new Date().toISOString(),
                                                    email: userEmail || '',
                                                    enlace: feedbackEnlace.trim(),
                                                    diagnostico_id: r.diagnostico_principal?.id,
                                                    genero: contexto?.genero,
                                                    objetivo: contexto?.objetivo,
                                                };
                                                // Guardar local
                                                const reqs = JSON.parse(localStorage.getItem('trackdiag_feedback_requests') || '[]');
                                                reqs.push(req);
                                                localStorage.setItem('trackdiag_feedback_requests', JSON.stringify(reqs));
                                                // Enviar a Google Sheets (actualizar fila existente)
                                                fetch(SHEETS_WEBHOOK, {
                                                    method: 'POST',
                                                    body: JSON.stringify({
                                                        tipo: 'feedback_real',
                                                        email: userEmail,
                                                        enlace: feedbackEnlace.trim(),
                                                    }),
                                                }).catch(() => {});
                                                setFeedbackRealEnviado(true);
                                            }}
                                            disabled={!feedbackEnlace.trim()}
                                            className={`px-5 py-2 rounded-lg transition-colors text-sm ${
                                                feedbackEnlace.trim()
                                                    ? 'bg-purple-600 hover:bg-purple-700 text-white'
                                                    : 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                            }`}
                                        >
                                            Quiero feedback
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="text-center py-2 fade-in">
                                    <p className="text-green-400 text-sm mb-1">Recibido. Alex revisará tu track en las próximas 48h.</p>
                                    <p className="text-gray-500 text-xs">Te contactaremos por el medio que uses para compartir el enlace.</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Acciones */}
                    <div className="text-center mt-4 mb-4">
                        <button
                            onClick={onReset}
                            className="px-6 py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl transition-colors"
                        >
                            Analizar otro track
                        </button>
                    </div>

                    {/* Footer privacidad */}
                    <div className="text-center mb-8">
                        <p className="text-gray-600 text-xs">TrackDiag no almacena el archivo de tu canción, solo los datos extraídos tras el análisis.</p>
                    </div>
                </div>
            </div>
        );
    }

    // =========================================================================
    // App principal
    // =========================================================================

    function App() {
        const [screen, setScreen] = useState('landing'); // landing | upload | questionnaire | email | processing | diagnostico | historial | panel_login | panel
        const [file, setFile] = useState(null);
        const [opciones, setOpciones] = useState(null);
        const [userEmail, setUserEmail] = useState('');
        const [userPassword, setUserPassword] = useState('');
        const [emailError, setEmailError] = useState('');
        const [emailLoading, setEmailLoading] = useState(false);
        // Panel de usuario
        const [panelEmail, setPanelEmail] = useState('');
        const [panelPassword, setPanelPassword] = useState('');
        const [panelLoading, setPanelLoading] = useState(false);
        const [panelError, setPanelError] = useState('');
        const [panelHistorial, setPanelHistorial] = useState([]);
        const [panelAuth, setPanelAuth] = useState(null); // email autenticado
        const [panelSelectedEntry, setPanelSelectedEntry] = useState(null);
        const [contexto, setContexto] = useState({
            genero: '', fase: '', objetivo: '',
            bloqueo_percibido: '', experiencia: '',
            dificultad_habitual: '',
        });
        const [resultado, setResultado] = useState(null);
        const [error, setError] = useState(null);
        const [historialCount, setHistorialCount] = useState(obtenerHistorial().length);

        // Cargar opciones al inicio
        useEffect(() => {
            fetch(`${API_URL}/api/opciones`)
                .then(r => r.json())
                .then(data => setOpciones(data))
                .catch(() => {
                    // Fallback con opciones hardcoded si la API no está disponible
                    setOpciones({
                        generos: [
                            {value: "tech_house", label: "Tech House"},
                            {value: "house", label: "House"},
                            {value: "techno", label: "Techno"},
                            {value: "progressive_house", label: "Progressive House"},
                            {value: "trance", label: "Trance"},
                            {value: "melodic_techno", label: "Melodic Techno"},
                            {value: "deep_house", label: "Deep House"},
                            {value: "otro", label: "Otro"},
                        ],
                        fases: [
                            {value: "idea", label: "Idea inicial / loop"},
                            {value: "arreglo_en_progreso", label: "Arreglo en progreso"},
                            {value: "ajustando_mezcla", label: "Arreglo cerrado, ajustando mezcla"},
                            {value: "casi_listo", label: "Creo que está casi listo"},
                        ],
                        objetivos: [
                            {value: "pinchar", label: "Publicar y tocar en sesión"},
                            {value: "aprender", label: "Practicar y aprender"},
                            {value: "sellos", label: "Enviar demo a sellos"},
                            {value: "todo", label: "Todo lo anterior"},
                        ],
                        experiencia: [
                            {value: "menos_6m", label: "Menos de 6 meses"},
                            {value: "6m_2a", label: "6 meses a 2 años"},
                            {value: "2a_5a", label: "2 a 5 años"},
                            {value: "mas_5a", label: "Más de 5 años"},
                        ],
                        dificultad_habitual: [
                            {value: "terminar", label: "Terminar tracks"},
                            {value: "sonidos", label: "Encontrar buenos sonidos"},
                            {value: "mezcla", label: "Que la mezcla suene bien"},
                            {value: "estructura", label: "Estructurar las ideas"},
                            {value: "todo", label: "Todo me cuesta"},
                        ],
                    });
                });
        }, []);

        const handleFileSelected = (f) => {
            setFile(f);
            setScreen('questionnaire');
        };

        const handleContextoChange = (name, value) => {
            setContexto(prev => ({ ...prev, [name]: value }));
        };

        const isQuestionnaireValid = contexto.genero && contexto.fase && contexto.objetivo && contexto.experiencia && contexto.dificultad_habitual;

        const handleGoToEmail = () => {
            setScreen('email');
        };

        const handleSubmit = async () => {
            setEmailError('');

            // Ir directo a la pantalla de procesamiento para que el usuario vea actividad
            setScreen('processing');
            setError(null);

            // Lanzar auth y audio en paralelo
            const authPromise = fetch(`${API_URL}/api/auth/acceder`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: userEmail.trim().toLowerCase(), password: userPassword }),
            }).then(async (resp) => {
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'Error de autenticación');
                return data;
            });

            const formData = new FormData();
            formData.append('audio', file);
            Object.entries(contexto).forEach(([k, v]) => formData.append(k, v));
            const audioPromise = fetch(`${API_URL}/api/diagnostico`, {
                method: 'POST',
                body: formData,
            }).then(async (resp) => {
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || 'Error procesando el track');
                }
                return resp.json();
            });

            try {
                // Esperar ambos en paralelo
                const [authData, data] = await Promise.all([authPromise, audioPromise]);

                // Auth OK
                setPanelAuth(authData.email);
                setPanelHistorial(authData.historial || []);

                setResultado(data);
                // Guardar en historial
                guardarEnHistorial(file.name, contexto, data);
                setHistorialCount(obtenerHistorial().length);
                // Construir texto formulario
                const labelMap = {
                    genero: opciones?.generos,
                    fase: opciones?.fases,
                    objetivo: opciones?.objetivos,
                    experiencia: opciones?.experiencia,
                    dificultad_habitual: opciones?.dificultad_habitual,
                };
                const getLabel = (field, value) => {
                    const opts = labelMap[field];
                    if (!opts) return value;
                    const found = opts.find(o => o.value === value);
                    return found ? found.label : value;
                };
                const formularioTexto = [
                    getLabel('genero', contexto.genero),
                    getLabel('fase', contexto.fase),
                    getLabel('objetivo', contexto.objetivo),
                    getLabel('experiencia', contexto.experiencia),
                    getLabel('dificultad_habitual', contexto.dificultad_habitual),
                    contexto.bloqueo_percibido ? `Bloqueo: ${contexto.bloqueo_percibido}` : '',
                ].filter(Boolean).join(' | ');

                // Construir informe diagnóstico completo
                const dx = data;
                const da = dx.datos_audio || {};
                let informe = '';
                // Estado
                informe += `ESTADO: ${dx.estado_texto || dx.estado_track || ''}\n`;
                // Diagnóstico principal
                informe += `DIAGNÓSTICO PRINCIPAL: ${dx.diagnostico_principal?.titulo || ''} (${dx.diagnostico_principal?.id || ''})\n`;
                informe += `Explicación: ${dx.diagnostico_principal?.explicacion || ''}\n`;
                // Diagnóstico secundario
                if (dx.diagnostico_secundario) {
                    informe += `DIAGNÓSTICO SECUNDARIO: ${dx.diagnostico_secundario.titulo} (${dx.diagnostico_secundario.id})\n`;
                }
                // Prioridades
                if (dx.prioridades && dx.prioridades.length > 0) {
                    informe += `PRIORIDADES: ${dx.prioridades.map((p, i) => `${i+1}. ${p}`).join(' | ')}\n`;
                }
                // Nota contextual
                if (dx.nota_contextual) informe += `NOTA CONTEXTUAL: ${dx.nota_contextual}\n`;
                if (dx.nota_motivacional) informe += `MOTIVACIÓN: ${dx.nota_motivacional}\n`;
                // Tips género
                if (dx.tips_genero && dx.tips_genero.length > 0) {
                    informe += `TIPS GÉNERO: ${dx.tips_genero.join(' | ')}\n`;
                }
                // No tocar
                if (dx.no_tocar_aun && dx.no_tocar_aun.length > 0) {
                    informe += `NO TOCAR AÚN: ${dx.no_tocar_aun.join(' | ')}\n`;
                }
                // Tip objetivo
                if (dx.tip_objetivo) informe += `TIP OBJETIVO: ${dx.tip_objetivo}\n`;
                // Siguiente sesión
                if (dx.siguiente_sesion) informe += `SIGUIENTE SESIÓN: ${dx.siguiente_sesion}\n`;
                // Error de foco
                if (dx.error_de_foco) informe += `ATENCIÓN: ${dx.error_de_foco_mensaje}\n`;
                // Referencia temporal
                if (dx.referencia_temporal) informe += `REFERENCIA TEMPORAL: ${dx.referencia_temporal}\n`;
                // Disclaimer
                if (dx.disclaimer) informe += `DISCLAIMER: ${dx.disclaimer}\n`;
                // Datos de mezcla
                informe += `--- MEZCLA ---\n`;
                informe += `BPM: ${da.bpm || '?'} | Duración: ${da.duracion || '?'}\n`;
                informe += `Balance grave: ${da.balance_grave || '?'}\n`;
                informe += `Densidad: ${da.densidad || '?'}\n`;
                if (da.loudness) {
                    informe += `Loudness: ${da.loudness.lufs_integrado} LUFS (${da.loudness.nivel}) | Pico: ${da.loudness.lufs_short_term_max} LUFS | Rango: ${da.loudness.rango_loudness} LU\n`;
                }
                if (da.mono_compat) {
                    informe += `Mono compat: ${da.mono_compat.nivel_compatibilidad || 'N/A'}`;
                    if (da.mono_compat.es_stereo) {
                        informe += ` | Correlación: ${(da.mono_compat.correlacion_lr * 100).toFixed(0)}% | Pérdida: ${da.mono_compat.perdida_mono_db}dB`;
                        if (da.mono_compat.bandas) {
                            informe += ` | Graves: ${da.mono_compat.bandas.graves?.estado} | Medios: ${da.mono_compat.bandas.medios?.estado} | Agudos: ${da.mono_compat.bandas.agudos?.estado}`;
                        }
                    }
                    informe += '\n';
                }
                if (da.harshness) {
                    informe += `Harshness: ${da.harshness.tiene_harshness ? da.harshness.nivel : 'no'} | p95: ${da.harshness.pico_p95?.toFixed(1) || '?'}dB | ${da.harshness.pct_frames_harsh?.toFixed(0) || '?'}% frames\n`;
                }
                // Scores
                if (dx.scores) {
                    informe += `SCORES: ${Object.entries(dx.scores).map(([k,v]) => `${k}=${v}`).join(', ')}\n`;
                }

                // Enviar a Google Sheets
                fetch(SHEETS_WEBHOOK, {
                    method: 'POST',
                    body: JSON.stringify({
                        tipo: 'registro',
                        timestamp: new Date().toISOString(),
                        email: userEmail,
                        formulario: formularioTexto,
                        diagnostico: informe,
                    }),
                }).catch(() => {});
                setScreen('diagnostico');
            } catch (err) {
                const msg = err.message || 'Error inesperado';
                // Si es error de auth, volver a la pantalla de email
                if (msg.includes('autenticación') || msg.includes('Contraseña') || msg.includes('conectar') || msg.includes('base de datos') || msg.includes('4 caracteres')) {
                    setEmailError(msg);
                    setScreen('email');
                } else {
                    setError(msg);
                    setScreen('questionnaire');
                }
            }
        };

        const handleReset = () => {
            setFile(null);
            setUserEmail('');
            setUserPassword('');
            setEmailError('');
            setContexto({
                genero: '', fase: '', objetivo: '',
                bloqueo_percibido: '', experiencia: '',
                dificultad_habitual: '',
            });
            setResultado(null);
            setError(null);
            setScreen('landing');
        };

        // ---- Auth: acceder con contraseña ----
        const handleAccederPanel = async () => {
            if (!panelEmail.includes('@') || panelPassword.length < 4) return;
            setPanelLoading(true);
            setPanelError('');
            try {
                const resp = await fetch(`${API_URL}/api/auth/acceder`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: panelEmail.trim().toLowerCase(), password: panelPassword }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    setPanelError(data.error || 'Error de autenticación');
                    setPanelLoading(false);
                    return;
                }
                setPanelAuth(data.email);
                setPanelHistorial(data.historial || []);
                setScreen('panel');
            } catch (e) {
                setPanelError('No se pudo conectar. Inténtalo de nuevo.');
            }
            setPanelLoading(false);
        };

        // ---- Panel: cerrar sesión ----
        const handlePanelLogout = () => {
            setPanelAuth(null);
            setPanelHistorial([]);
            setPanelEmail('');
            setPanelPassword('');
            setPanelError('');
            setPanelSelectedEntry(null);
            setScreen('landing');
        };

        // ---- Panel: abrir ----
        const handleOpenPanel = () => {
            if (panelAuth) {
                // Ya autenticado, refrescar historial sin pedir contraseña
                setPanelLoading(true);
                fetch(`${API_URL}/api/auth/historial`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: panelAuth }),
                })
                .then(r => r.json())
                .then(data => { setPanelHistorial(data.historial || []); setPanelLoading(false); })
                .catch(() => setPanelLoading(false));
                setScreen('panel');
            } else {
                setScreen('panel_login');
            }
        };

        if (!opciones) {
            return (
                <div className="min-h-screen flex items-center justify-center">
                    <p className="text-gray-500">Cargando...</p>
                </div>
            );
        }

        return (
            <div>
                {/* Botón Mi panel — siempre visible arriba a la derecha */}
                {screen !== 'panel_login' && screen !== 'panel' && (
                    <div className="fixed top-4 right-4 z-40">
                        <button
                            onClick={handleOpenPanel}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg text-xs transition-colors"
                            style={{ background: 'rgba(139,92,246,0.15)', border: '1px solid rgba(139,92,246,0.3)', color: '#a78bfa' }}
                        >
                            {panelAuth ? (
                                <React.Fragment>
                                    <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#4ade80', display: 'inline-block' }}></span>
                                    Mi panel
                                </React.Fragment>
                            ) : 'Mi panel'}
                        </button>
                    </div>
                )}

                {error && (
                    <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-900 border border-red-700 text-red-200 px-6 py-3 rounded-xl text-sm z-50 fade-in">
                        {error}
                        <button onClick={() => setError(null)} className="ml-3 text-red-400 hover:text-red-200">✕</button>
                    </div>
                )}

                {screen === 'landing' && (
                    <LandingScreen
                        onStart={() => setScreen('upload')}
