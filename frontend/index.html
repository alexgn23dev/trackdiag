                    {fila('Medidor certificado', lo.true_peak_validated == null ? null : (lo.true_peak_validated ? 'sí' : 'no'))}
                    {fila('Motor', r.versiones && r.versiones.analysis_engine_version)}
                    {fila('Taxonomía de picos', lo.peak_taxonomy_version ? `v${lo.peak_taxonomy_version}` : null)}
                </V2Tarjeta>
                {r.alcance_analisis && (
                    <V2Tarjeta titulo="Alcance del análisis">
                        <p className="text-gray-400 text-xs leading-relaxed">{r.alcance_analisis}</p>
                    </V2Tarjeta>
                )}
            </div>
        );
    }

    function DiagnosticoScreen({ resultado, onReset, contexto, userEmail, file, opciones, nombreProyecto, onIrAPerfil, comunidadOk,
                                proyectoNombreResuelto, versionActual, proyectoIdActual, onVerComparativa,
                                onAbrirPanel, sesionIniciada }) {
        const r = resultado;
        const d = r.datos_audio;
        const [feedbackStep, setFeedbackStep] = useState(0); // 0=coincide?, 1=detalle, 2=feedback real
        const [feedbackCoincide, setFeedbackCoincide] = useState(null); // 'si', 'masomenos', 'no'
        const [feedbackProblemaReal, setFeedbackProblemaReal] = useState('');
        const [feedbackNoDetectado, setFeedbackNoDetectado] = useState('');
        const [feedbackComentario, setFeedbackComentario] = useState('');
        const [feedbackEnlace, setFeedbackEnlace] = useState('');
        const [feedbackEnviado, setFeedbackEnviado] = useState(false);
        const [feedbackRealEnviado, setFeedbackRealEnviado] = useState(false);
        const [showTutoriales, setShowTutoriales] = useState(false);
        // Rediseño (v2): interruptor por URL y pestaña activa. Se resuelve
        // una sola vez para que no cambie de vista a mitad de sesión.
        const [v2Activo] = useState(usarVistaV2);
        const [v2Tab, setV2Tab] = useState('resumen');

        // Sticky bar de feedback: aparece tras 20s en la pantalla del diagnóstico
        // si el usuario no ha respondido todavía. Resuelve el problema medido en
        // el histórico: 87% de los análisis se cierran sin que el usuario haga
        // scroll al widget del fondo. La barra se autoesconde al responder o al
        // dismiss explícito (no vuelve en esa sesión).
        const [stickyFeedbackVisible, setStickyFeedbackVisible] = useState(false);
        const [stickyFeedbackDismissed, setStickyFeedbackDismissed] = useState(false);
        const feedbackWidgetRef = useRef(null);

        useEffect(() => {
            if (feedbackStep !== 0 || stickyFeedbackDismissed) return;
            const t = setTimeout(() => setStickyFeedbackVisible(true), 20000);
            return () => clearTimeout(t);
        }, [feedbackStep, stickyFeedbackDismissed]);

        useEffect(() => {
            // Si el usuario empieza a responder por el widget de abajo,
            // ocultar la barra sticky.
            if (feedbackStep > 0) setStickyFeedbackVisible(false);
        }, [feedbackStep]);

        const responderDesdeSticky = (valor) => {
            setFeedbackCoincide(valor);
            setFeedbackStep(1);
            setStickyFeedbackVisible(false);
            // Pequeño delay para que React renderice el step 1 antes de scrollear
            setTimeout(() => {
                feedbackWidgetRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
        };

        // Tutoriales para este diagnóstico
        const diagId = r.diagnostico_principal?.id || 'sin_diagnostico';
        const tutoriales = TUTORIALES_MAP[diagId] || TUTORIALES_MAP['sin_diagnostico'] || [];
        // También añadir tutoriales del diagnóstico secundario si existe
        const secId = r.diagnostico_secundario?.id;
        const tutorialesSecundario = secId && TUTORIALES_MAP[secId] ? TUTORIALES_MAP[secId] : [];
        // Combinar sin duplicados (por URL)
        const allTutoriales = [...tutoriales];
        tutorialesSecundario.forEach(t => {
            if (!allTutoriales.some(existing => existing.url === t.url)) {
                allTutoriales.push(t);
            }
        });

        // Variante del CTA al Máster según la categoría dominante del análisis
        const masterCta = resolverVarianteMaster(r);

        const semaforoConfig = r.estado_track === 'verde'
            ? { color: '#f87171', bg: 'rgba(248,113,113,0.10)', border: '#7f1d1d', label: 'Fase temprana', icon: '🔴' }
            : r.estado_track === 'avanzado'
            ? { color: '#60a5fa', bg: 'rgba(96,165,250,0.10)', border: '#1e3a5f', label: 'Listo para pulir', icon: '🔵' }
            : { color: '#facc15', bg: 'rgba(250,204,21,0.10)', border: '#713f12', label: 'En desarrollo', icon: '🟡' };

        // El widget de calibración se guarda en una variable para que lo
        // usen LAS DOS vistas: la clásica lo pinta donde siempre y el
        // rediseño lo mete en la primera pantalla. Duplicarlo habría
        // significado mantener dos veces un formulario de tres pasos que
        // ya funciona.
        // La barra flotante de feedback también se comparte entre vistas.
        // Vive fuera del contenedor principal (position: fixed), así que
        // basta con pintarla al final de cualquiera de las dos.
        const barraFeedback = (
            <>
                    {/* Sticky feedback bar — aparece tras 20s si el usuario no ha respondido */}
                    {stickyFeedbackVisible && (
                        <div
                            className="fixed left-0 right-0 z-40 fade-in"
                            style={{
                                bottom: 0,
                                background: 'rgba(15, 15, 17, 0.96)',
                                backdropFilter: 'blur(10px)',
                                borderTop: '1px solid rgba(139, 92, 246, 0.35)',
                                boxShadow: '0 -8px 24px rgba(0,0,0,0.4)',
                            }}
                        >
                            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
                                <p className="text-gray-200 text-sm flex-1 min-w-0">
                                    <span className="hidden sm:inline">¿Te ha servido el diagnóstico? </span>
                                    <span className="sm:hidden">¿Útil? </span>
                                    <span className="text-gray-500 text-xs">Tu respuesta calibra el motor.</span>
                                </p>
                                <div className="flex gap-1.5 flex-shrink-0">
                                    <button
                                        onClick={() => responderDesdeSticky('si')}
                                        className="px-3 py-1.5 rounded-lg text-xs font-medium bg-green-900/40 hover:bg-green-900/60 accent-green transition-colors"
                                    >
                                        Sí
                                    </button>
                                    <button
                                        onClick={() => responderDesdeSticky('masomenos')}
                                        className="px-3 py-1.5 rounded-lg text-xs font-medium bg-yellow-900/30 hover:bg-yellow-900/50 text-yellow-400 transition-colors"
                                    >
                                        Parcial
                                    </button>
                                    <button
                                        onClick={() => responderDesdeSticky('no')}
                                        className="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors"
                                    >
                                        No
                                    </button>
                                    <button
                                        onClick={() => { setStickyFeedbackVisible(false); setStickyFeedbackDismissed(true); }}
                                        className="px-2 py-1.5 rounded-lg text-xs text-gray-600 hover:text-gray-400 transition-colors"
                                        aria-label="Cerrar"
                                    >
                                        ✕
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
            </>
        );

        const bloqueFeedback = (
                    <>
                        {/* ===== FEEDBACK POST-ANÁLISIS — Calibración ===== */}
                        <div ref={feedbackWidgetRef}>
                        {feedbackStep === 0 && (
                            <div className="card p-6 mb-6 text-center">
                                <p className="text-gray-300 text-sm mb-2">¿El diagnóstico coincide con lo que percibías como problema?</p>
                                <p className="text-gray-500 text-xs mb-4">Tu respuesta nos ayuda a mejorar el motor de análisis</p>
                                <div className="flex flex-col sm:flex-row gap-3 justify-center">
                                    <button
                                        onClick={() => { setFeedbackCoincide('si'); setFeedbackStep(1); }}
                                        className="px-5 py-2.5 bg-green-900/40 hover:bg-green-900/60 accent-green rounded-lg transition-colors text-sm"
                                    >
                                        Sí, dio en el clavo
                                    </button>
                                    <button
                                        onClick={() => { setFeedbackCoincide('masomenos'); setFeedbackStep(1); }}
                                        className="px-5 py-2.5 bg-yellow-900/30 hover:bg-yellow-900/50 text-yellow-400 rounded-lg transition-colors text-sm"
                                    >
                                        Más o menos
                                    </button>
                                    <button
                                        onClick={() => { setFeedbackCoincide('no'); setFeedbackStep(1); }}
                                        className="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-400 rounded-lg transition-colors text-sm"
                                    >
                                        No, mi problema es otro
                                    </button>
                                </div>
                            </div>
                        )}

                        {feedbackStep === 1 && !feedbackEnviado && (
                            <div className="card p-6 mb-6 fade-in">
                                {feedbackCoincide === 'si' ? (
                                    <div>
                                        <p className="accent-green text-sm mb-3">¡Genial! ¿Algo que quieras comentar?</p>
                                        <textarea
                                            value={feedbackComentario}
                                            onChange={(e) => setFeedbackComentario(e.target.value)}
                                            placeholder="Opcional: ¿qué te ha parecido más útil?"
                                            maxLength={500}
                                            rows={2}
                                            className="w-full px-4 py-3 rounded-lg text-sm input-field resize-none"
                                        />
                                    </div>
                                ) : (
                                    <div>
                                        <p className="text-gray-300 text-sm mb-3">
                                            {feedbackCoincide === 'no'
                                                ? 'Entendido. Cuéntanos más para que podamos mejorar:'
                                                : 'Gracias. Cuéntanos qué faltó o qué sobró:'}
                                        </p>
                                        <div>
                                            <label className="block text-xs text-gray-500 mb-1">¿Cuál crees que es el problema real de tu track que Mentotrack no haya identificado?</label>
                                            <textarea
                                                value={feedbackProblemaReal}
                                                onChange={(e) => setFeedbackProblemaReal(e.target.value)}
                                                placeholder="Ej.: Creo que el problema es la estructura, no el balance. No detectó que el clap está muy alto..."
                                                maxLength={500}
                                                rows={3}
                                                className="w-full px-4 py-3 rounded-lg text-sm input-field resize-none"
                                            />
                                        </div>
                                    </div>
                                )}
                                <div className="flex gap-3 mt-3 justify-end">
                                    <button
                                        onClick={() => { setFeedbackStep(2); }}
                                        className="text-gray-500 text-xs hover:text-gray-400 transition-colors"
                                    >
                                        Saltar
                                    </button>
                                    <button
                                        onClick={() => {
                                            const fb = {
                                                timestamp: new Date().toISOString(),
                                                coincide: feedbackCoincide,
                                                problema_real: feedbackProblemaReal,
                                                no_detectado: feedbackNoDetectado,
                                                comentario: feedbackComentario,
                                                diagnostico: r.diagnostico_principal?.id,
                                            };
                                            // Enviar a API local (con JWT auth)
                                            fetch(`${API_URL}/api/feedback`, {
                                                method: 'POST',
                                                headers: authHeaders(),
                                                body: JSON.stringify(fb),
                                            }).catch(() => {});
                                            // Enviar feedback a Google Sheets via backend proxy
                                            const comentarioCompleto = [
                                                feedbackCoincide === 'si' ? '[COINCIDE]' : feedbackCoincide === 'masomenos' ? '[PARCIAL]' : '[NO COINCIDE]',
                                                feedbackProblemaReal ? `Problema real: ${feedbackProblemaReal}` : '',
                                                feedbackNoDetectado ? `No detectado: ${feedbackNoDetectado}` : '',
                                                feedbackComentario ? `Comentario: ${feedbackComentario}` : '',
                                            ].filter(Boolean).join(' | ');
                                            fetch(`${API_URL}/api/sheets/feedback`, {
                                                method: 'POST',
                                                headers: {'Content-Type': 'application/json'},
                                                body: JSON.stringify({
                                                    email: userEmail,
                                                    fue_util: feedbackCoincide === 'si' ? 'Sí' : feedbackCoincide === 'masomenos' ? 'Parcial' : 'No',
                                                    comentario: comentarioCompleto,
                                                }),
                                            }).catch(() => {});
                                            setFeedbackEnviado(true);
                                            trackEvent('funnel_feedback_given', {
                                                coincide: feedbackCoincide,
                                                tiene_comentario: !!(feedbackComentario || feedbackProblemaReal || feedbackNoDetectado),
                                            });
                                            setTimeout(() => setFeedbackStep(2), 1200);
                                        }}
                                        className="px-5 py-2 btn-primary rounded-lg transition-colors text-sm"
                                    >
                                        Enviar
                                    </button>
                                </div>
                            </div>
                        )}

                        {feedbackStep === 1 && feedbackEnviado && (
                            <div className="card p-6 mb-6 text-center fade-in">
                                <p className="accent-green text-sm">Gracias, tu feedback mejora el motor</p>
                            </div>
                        )}

                        {feedbackStep === 2 && (
                            <div className="card p-6 mb-6 fade-in" style={{borderLeft: '3px solid var(--po-purple)'}}>
                                <p className="accent-purple text-sm font-medium mb-3">¿Quieres ayudar a mejorar esta app?</p>
                                <p className="text-gray-300 text-sm leading-relaxed mb-4">
                                    Hasta ahora tu música no se ha almacenado, pero si me compartes un enlace la escucharé personalmente para mejorar el motor de análisis. Gracias a tu música, y nuestro feedback real y humano podremos hacer una mejor herramienta para nuestra comunidad. Gracias por formar parte de esto :) - Alex
                                </p>

                                {!feedbackRealEnviado ? (
                                    <div>
                                        <input
                                            type="text"
                                            value={feedbackEnlace}
                                            onChange={(e) => setFeedbackEnlace(e.target.value)}
                                            placeholder="Pega tu enlace de Soundcloud o Dropbox"
                                            className="w-full px-4 py-3 rounded-lg text-sm input-field mb-3"
                                        />
                                        <div className="flex gap-3 justify-end">
                                            <button
                                                onClick={() => setFeedbackStep(3)}
                                                className="text-gray-500 text-xs hover:text-gray-400 transition-colors"
                                            >
                                                No, gracias
                                            </button>
                                            <button
                                                onClick={() => {
                                                    if (!feedbackEnlace.trim()) return;
                                                    // Enviar enlace de feedback real via backend proxy
                                                    fetch(`${API_URL}/api/sheets/feedback-real`, {
                                                        method: 'POST',
                                                        headers: {'Content-Type': 'application/json'},
                                                        body: JSON.stringify({
                                                            email: userEmail,
                                                            enlace: feedbackEnlace.trim(),
                                                        }),
                                                    }).catch(() => {});
                                                    // Enviar a API local (con JWT auth)
                                                    fetch(`${API_URL}/api/feedback-request`, {
                                                        method: 'POST',
                                                        headers: authHeaders(),
                                                        body: JSON.stringify({
                                                            enlace: feedbackEnlace.trim(),
                                                            diagnostico_id: r.diagnostico_principal?.id,
                                                            genero: contexto?.genero,
                                                            objetivo: contexto?.objetivo,
                                                        }),
                                                    }).catch(() => {});
                                                    setFeedbackRealEnviado(true);
                                                }}
                                                disabled={!feedbackEnlace.trim()}
                                                className={`px-5 py-2 rounded-lg transition-colors text-sm ${
                                                    feedbackEnlace.trim()
                                                        ? 'btn-primary'
                                                        : 'btn-primary'
                                                }`}
                                            >
                                                Quiero feedback
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-2 fade-in">
                                        <p className="accent-green text-sm mb-1">Recibido. Alex revisará tu track pronto.</p>
                                        <p className="text-gray-500 text-xs">Te contactaremos por el medio que uses para compartir el enlace.</p>
                                    </div>
                                )}
                            </div>
                        )}
                        </div>
                    </>
        );

        // =====================================================================
        // Vista v2 — el rediseño. Se activa con ?v2=1.
        // =====================================================================
        // Reutiliza TODO lo que ya funciona: el widget de calibración, el modal
        // de tutoriales, las tarjetas de derivación y compartir en comunidad
        // son los mismos componentes que usa la vista clásica. Lo único nuevo
        // es la disposición.
        if (v2Activo) {
            const cfgV2 = r.estado_track === 'verde'
                ? { color: V2_COLOR.alerta, label: 'Fase temprana' }
                : r.estado_track === 'avanzado'
                ? { color: V2_COLOR.info, label: 'Listo para pulir' }
                : { color: V2_COLOR.aviso, label: 'En desarrollo' };
            const loV2 = d.loudness || {};
            const tonoPicosV2 = loV2.severidad_picos === 'atencion' ? 'aviso' : 'neutro';
            const avisosV2 = {
                master: loV2.severidad_picos === 'atencion'
                        || loV2.severidad_recorte === 'atencion'
                        || (loV2.saturacion_dinamica && loV2.saturacion_dinamica !== 'ok'),
                mezcla: (d.harshness && d.harshness.tiene_harshness)
                        || d.balance_grave === 'elevado',
            };

            // Derivación: exactamente la misma regla que la vista clásica —
            // una tarjeta y solo una, Relesit si el track sale fino.
            // Si el track sale fino, lo primero que tiene que ver el usuario es
            // "búscale sello", no el plan de arreglos: ya no hay nada urgente
            // que arreglar. Por eso Relesit sube por encima de las pestañas y
            // el Máster se queda abajo, con el resto de derivaciones.
            const esRelesit = (diagId === 'sin_diagnostico' || r.estado_track === 'avanzado')
                              && r.estado_track !== 'verde';
            const tarjetaRelesit = esRelesit ? (
                <RelesitCTA diagId={diagId} estado={r.estado_track} userEmail={userEmail}
                            bpm={d && d.bpm} clase="h-full"
                            genero={contexto && (contexto.genero === 'otro' ? (contexto.genero_custom || '') : contexto.genero)} />
            ) : null;
            // La columna derecha de la cabecera: Relesit si el track está para
            // sello; si no, el tutorial que mejor encaja (el primero del mapa
            // del diagnóstico principal). Gracias al fallback 'sin_diagnostico'
            // del mapa, este hueco no queda vacío nunca.
            const tutorialDestacadoV2 = !esRelesit && allTutoriales.length > 0 ? allTutoriales[0] : null;
            const bloqueDerechoV2 = tarjetaRelesit || (tutorialDestacadoV2
                ? <V2TutorialDestacado tut={tutorialDestacadoV2} diagId={diagId} userEmail={userEmail} />
                : null);
            // Si el destacado es un tutorial, la lista de abajo no lo repite.
            const listaTutorialesV2 = tutorialDestacadoV2
                ? allTutoriales.slice(1, 4) : allTutoriales.slice(0, 3);
            const derivacionV2 = esRelesit ? null : (
                <MasterCTA diagId={diagId} variante={masterCta.variante}
                           categoria={masterCta.categoria} userEmail={userEmail} />
            );

            // Tutoriales: en la vista clásica están tras un botón al final del
            // informe. Aquí se enseñan directamente — que estuvieran escondidos
            // es una de las hipótesis de por qué solo los usa el 4,6 %.
            const tutorialesV2 = listaTutorialesV2.length > 0 ? (
                <div className="card p-5">
                    <div className="rotulo-v2 mb-3">Tutoriales para esto</div>
                    <ul className="space-y-3">
                        {listaTutorialesV2.map((tut, i) => {
                            const vid = (tut.url.match(/[?&]v=([\w-]{11})/) || [])[1];
                            return (
                                <li key={i}>
                                    <a href={tut.url} target="_blank" rel="noopener"
                                       onClick={() => {
                                           trackEvent('tutorial_clicked', { diagnostico: diagId, tutorial: tut.titulo });
                                           try {
                                               fetch(`${API_URL}/api/sheets/tutorial-click`, {
                                                   method: 'POST',
                                                   headers: { 'Content-Type': 'application/json' },
                                                   body: JSON.stringify({ email: userEmail || '', tutorial_clickado: tut.titulo }),
                                               }).catch(() => {});
                                           } catch (e) {}
                                       }}
                                       className="flex gap-3 items-start group">
                                        {vid && (
                                            <span className="relative rounded overflow-hidden bg-[#1a1a1a]"
                                                  style={{ flex: '0 0 104px', width: 104 }}>
                                                <img src={`https://i.ytimg.com/vi/${vid}/mqdefault.jpg`} alt="" loading="lazy"
                                                     className="w-full object-cover opacity-80 group-hover:opacity-100 transition"
                                                     style={{ height: 59 }} />
                                                <span className="absolute inset-0 flex items-center justify-center">
                                                    <span className="w-6 h-6 rounded-full bg-black/60 flex items-center justify-center">
                                                        <span style={{ width: 0, height: 0, marginLeft: '2px',
                                                                       borderTop: '4px solid transparent',
                                                                       borderBottom: '4px solid transparent',
                                                                       borderLeft: '7px solid #fff' }} />
                                                    </span>
                                                </span>
                                            </span>
                                        )}
                                        <span className="min-w-0">
                                            <span className="text-gray-200 text-sm leading-snug group-hover:text-white transition block">{tut.titulo}</span>
                                            <span className="text-gray-600 text-xs mt-1 leading-snug block">{tut.descripcion}</span>
                                        </span>
                                    </a>
                                </li>
                            );
                        })}
                    </ul>
                </div>
            ) : null;

            return (
                <div className="min-h-screen fade-in v2-wrap">
                    <V2Nav onNuevo={onReset} onPanel={onAbrirPanel} onPerfil={onIrAPerfil}
                           sesionIniciada={sesionIniciada} />
                    <div className="max-w-7xl mx-auto px-4 sm:px-5 py-5">
                        {/* Cabecera a dos columnas iguales: a la izquierda el
                            veredicto con sus cifras, a la derecha la acción —
                            Relesit si el track está para sello, y si no el
                            tutorial que mejor encaja. A media pantalla los
                            chips pasan bajo el titular, así que el bloque va
                            en columna con las cifras abajo. */}
                        <div className={bloqueDerechoV2
                            ? 'grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4 items-stretch'
                            : 'mb-4'}>
                            <div className="card p-5 h-full flex flex-col justify-between gap-4"
                                 style={{ borderTop: `2px solid ${cfgV2.color}` }}>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                                        <span className="punto-v2" style={{ background: cfgV2.color }} />
                                        <span className="rotulo-v2" style={{ color: cfgV2.color }}>{cfgV2.label}</span>
                                        <span className="text-gray-600 text-xs">· {r.estado_texto}</span>
                                    </div>
                                    <h1 className="text-white text-lg xl:text-xl font-bold leading-snug break-words">
                                        {r.diagnostico_principal.titulo}
                                    </h1>
                                </div>
                                <div className="flex gap-2 flex-wrap min-w-0">
                                    <V2Dato etiqueta="Duración" valor={d.duracion} />
                                    <V2Dato etiqueta="BPM" valor={d.bpm == null ? '—' : d.bpm} />
                                    <V2Dato etiqueta="LUFS" valor={loV2.lufs_integrado == null ? '—' : loV2.lufs_integrado} />
                                    <V2Dato etiqueta="True peak"
                                            valor={typeof loV2.true_peak_dbtp === 'number' && loV2.true_peak_dbtp > -99
                                                   ? loV2.true_peak_dbtp.toFixed(1) : '—'}
                                            tono={tonoPicosV2} />
                                    <V2Dato etiqueta="Mono" valor={(d.mono_compat && d.mono_compat.nivel_compatibilidad) || '—'} />
                                </div>
                            </div>
                            {bloqueDerechoV2 && <div className="min-w-0">{bloqueDerechoV2}</div>}
                        </div>

                        {/* min-w-0 y shrink-0: sin ellos la fila crece hasta caber
                            en vez de desplazarse, y en móvil la página entera se
                            iba a 489 px de ancho por culpa de la última pestaña. */}
                        <div className="flex gap-1 mb-4 border-b border-[#2e2e2e] overflow-x-auto min-w-0"
                             style={{ scrollbarWidth: 'none' }}>
                            {V2_TABS.map(t => (
                                <button key={t.id} onClick={() => setV2Tab(t.id)}
                                        className={`tab-v2 shrink-0 px-4 py-2.5 text-sm text-gray-400 flex items-center gap-2 ${v2Tab === t.id ? 'on' : ''}`}>
                                    {t.label}
                                    {avisosV2[t.id] && <span className="punto-v2" style={{ background: V2_COLOR.aviso }}
                                                             title="Hay algo que mirar aquí" />}
                                </button>
                            ))}
                        </div>

                        <div className="fade-in" key={v2Tab}>
                            {v2Tab === 'resumen' && (
                                <V2TabResumen r={r} extras={{
                                    derivacion: derivacionV2,
                                    tutoriales: tutorialesV2,
                                    // El widget en tarjeta se quitó: Alex lo prefiere
                                    // como en la vista clásica, en la barra flotante
                                    // de abajo. Aquí solo estorbaba una tarjeta más.
                                    feedback: null,
                                }} />
                            )}
                            {v2Tab === 'plan' && <V2TabPlan r={r} />}
                            {v2Tab === 'mezcla' && <V2TabMezcla r={r} />}
                            {v2Tab === 'master' && <V2TabMaster r={r} />}
                            {v2Tab === 'detalle' && <V2TabDetalle r={r} />}
                        </div>

                        {comunidadOk && (
                            <div className="mt-6">
                                <CompartirComunidad file={file} resultado={r} contexto={contexto}
                                                    opciones={opciones} nombreProyecto={nombreProyecto}
                                                    onIrAPerfil={onIrAPerfil} />
                            </div>
                        )}

                        <div className="mt-8 flex flex-wrap gap-3 items-center justify-between border-t border-[#2e2e2e] pt-5">
                            <p className="text-gray-600 text-xs max-w-xl">{r.nota_motivacional}</p>
                            <button onClick={() => { try { sessionStorage.removeItem('mt_v2'); } catch (e) {}
                                                     location.search = ''; }}
                                    className="btn-secondary px-3 py-1.5 rounded v2-sec"
                                    title="Vuelve a la vista de siempre">
                                Vista clásica
                            </button>
                        </div>

                        {/* El mismo cierre que la vista clásica. Debajo va el
                            footer global del sitio, que es HTML estático fuera
                            del SPA y aparece en las dos vistas. */}
                        <div className="text-center mb-8 mt-6">
                            <p className="text-gray-600 text-xs">
                                Mentotrack no almacena el archivo de tu canción, solo los datos
                                extraídos tras el análisis.
                            </p>
                        </div>
                    </div>
                    {barraFeedback}
                </div>
            );
        }

        return (
            <div className="min-h-screen py-12 px-6 fade-in">
                <div className="max-w-2xl mx-auto">

                    {/* ===== RESUMEN VISUAL ===== */}
                    <div className="card p-8 mb-6 text-center" style={{borderTop: `3px solid ${semaforoConfig.color}`}}>
                        <div className="text-2xl mb-2">{semaforoConfig.icon}</div>
                        <p className="text-sm font-medium uppercase tracking-wider mb-2" style={{color: semaforoConfig.color}}>
                            {semaforoConfig.label}
                        </p>
                        <h2 className="text-xl font-bold text-white mb-2">{r.diagnostico_principal.titulo}</h2>
                        <p className="text-gray-400 text-sm mb-1">{r.estado_texto}</p>
                        <p className="text-gray-600 text-xs mb-5">Duración: {d.duracion}</p>

                        {/* Top 3 prioridades inline */}
                        <div className="text-left space-y-3 max-w-md mx-auto">
                            {r.prioridades.slice(0, 3).map((p, i) => (
                                <div key={i} className="flex gap-3 items-start">
                                    <span className="flex-shrink-0 w-6 h-6 rounded-full bg-green-900 accent-green flex items-center justify-center text-xs font-bold">{i + 1}</span>
                                    <p className="text-gray-300 text-sm">{p}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Aviso de género fuera de scope (vallenato, pop, rock…) */}
                    {r.aviso_genero && (
                        <div
                            className="card p-4 mb-6 text-left"
                            style={{
                                background: 'rgba(250, 204, 21, 0.06)',
                                borderLeft: '3px solid #facc15',
                            }}
                        >
                            <p className="text-yellow-400 text-xs font-medium mb-1 uppercase tracking-wider">Aviso de género</p>
                            <p className="text-gray-300 text-sm leading-relaxed">{r.aviso_genero}</p>
                        </div>
                    )}

                    {/* Diagnóstico principal — detalles expandibles */}
                    <details className="card p-6 mb-4">
                        <summary className="cursor-pointer">
                            <span className="text-xs accent-purple font-medium uppercase tracking-wider">Diagnóstico principal — por qué</span>
                        </summary>
                        <div className="mt-4 text-gray-400 text-sm whitespace-pre-line">{r.diagnostico_principal.explicacion}</div>
                    </details>

                    {/* Nota contextual personalizada */}
                    {r.nota_contextual && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid var(--po-purple)'}}>
                            {r.nota_motivacional && (
                                <p className="text-gray-200 text-sm font-medium mb-2">{r.nota_motivacional}</p>
                            )}
                            <p className="text-gray-300 text-sm leading-relaxed">{r.nota_contextual}</p>
                            {r.referencia_temporal && (
                                <p className="text-gray-500 text-xs mt-3">{r.referencia_temporal}</p>
                            )}
                        </div>
                    )}

                    {/* Error de foco */}
                    {r.error_de_foco && (
                        <div className="card p-5 mb-4 border-yellow-600">
                            <p className="text-xs text-yellow-400 font-medium uppercase tracking-wider mb-2">Atención</p>
                            <p className="text-gray-300 text-sm">{r.error_de_foco_mensaje}</p>
                        </div>
                    )}

                    {/* Diagnóstico secundario */}
                    {r.diagnostico_secundario && (
                        <div className="card p-5 mb-4">
                            <p className="text-xs text-gray-500 font-medium uppercase tracking-wider mb-2">También se detecta</p>
                            <p className="text-gray-300">{r.diagnostico_secundario.titulo}</p>
                        </div>
                    )}

                    {/* Prioridades extra (si hay más de 3) */}
                    {r.prioridades.length > 3 && (
                        <div className="card p-6 mb-4">
                            <p className="text-xs accent-green font-medium uppercase tracking-wider mb-3">Prioridades adicionales</p>
                            <div className="space-y-3">
                                {r.prioridades.slice(3).map((p, i) => (
                                    <div key={i} className="flex gap-3">
                                        <span className="flex-shrink-0 w-6 h-6 rounded-full bg-green-900 accent-green flex items-center justify-center text-xs font-bold">{i + 4}</span>
                                        <p className="text-gray-300 text-sm">{p}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Sugerencias de estructura — concretas y localizadas */}
                    {r.sugerencias_estructura && r.sugerencias_estructura.length > 0 && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid #f59e0b'}}>
                            <p className="text-xs text-yellow-500 font-medium uppercase tracking-wider mb-3">Estructura — qué tocar y dónde</p>
                            <div className="space-y-3">
                                {r.sugerencias_estructura.map((s, i) => (
                                    <div key={i} className="flex gap-3">
                                        <span className="flex-shrink-0 w-6 h-6 rounded-full bg-yellow-900 text-yellow-400 flex items-center justify-center text-xs font-bold">{i + 1}</span>
                                        <p className="text-gray-300 text-sm leading-relaxed">{s}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Comparación con track de referencia */}
                    {r.comparacion_referencia && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid #22d3ee'}}>
                            <p className="text-xs font-medium uppercase tracking-wider mb-1" style={{color: '#22d3ee'}}>
                                Comparación con tu referencia
                            </p>
                            {r.comparacion_referencia.error ? (
                                <p className="text-gray-400 text-sm leading-relaxed mt-2">{r.comparacion_referencia.error}</p>
                            ) : (
                                <div>
                                    {r.comparacion_referencia.ref_filename && (
                                        <p className="text-xs text-gray-500 mb-3 truncate">{r.comparacion_referencia.ref_filename}</p>
                                    )}
                                    {(r.comparacion_referencia.avisos || []).map((a, i) => (
                                        <p key={i} className="text-xs text-yellow-500 leading-relaxed mb-2">⚠ {a}</p>
                                    ))}
                                    {(r.comparacion_referencia.diferencias || []).length > 0 ? (
                                        <div className="space-y-3 mt-2">
                                            {r.comparacion_referencia.diferencias.map((d, i) => {
                                                // Titular cualitativo: el dB es balance relativo, no un movimiento
                                                // de EQ — el descriptor (algo/bastante/mucho) es lo robusto.
                                                const mag = d.magnitud || '';
                                                const esNumerica = /dB|LU/.test(mag);
                                                const titular = esNumerica
                                                    ? `${d.severidad || 'algo'} por ${mag.trim().startsWith('+') ? 'encima' : 'debajo'}`
                                                    : mag;
                                                const label = d.label || '';
                                                return (
                                                    <div key={i} className="flex gap-3">
                                                        <span className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold" style={{background: 'rgba(34,211,238,0.15)', color: '#22d3ee'}}>{i + 1}</span>
                                                        <div className="min-w-0">
                                                            <p className="text-sm font-medium text-gray-200">
                                                                {label.charAt(0).toUpperCase() + label.slice(1)}
                                                                <span className="text-xs ml-2" style={{color: '#22d3ee'}}>{titular}</span>
                                                                {esNumerica && <span className="text-xs ml-1.5 text-gray-600">({mag})</span>}
                                                            </p>
                                                            <p className="text-gray-300 text-sm leading-relaxed mt-0.5">{d.texto}</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <p className="text-gray-300 text-sm leading-relaxed mt-2">
                                            En lo que medimos, tu track va muy en línea con la referencia. Las diferencias que queden están por debajo de lo que consideramos relevante.
                                        </p>
                                    )}
                                    {r.comparacion_referencia.n_diferencias_extra > 0 && (
                                        <p className="text-xs text-gray-500 mt-3">
                                            Hay {r.comparacion_referencia.n_diferencias_extra} diferencia{r.comparacion_referencia.n_diferencias_extra > 1 ? 's' : ''} menor{r.comparacion_referencia.n_diferencias_extra > 1 ? 'es' : ''} más; te mostramos solo lo que más importa.
                                        </p>
                                    )}
                                    {(r.comparacion_referencia.coincidencias || []).length > 0 && (
                                        <p className="text-xs text-gray-400 mt-3 leading-relaxed">
                                            <span style={{color: 'var(--po-green)'}}>Vas a la par con tu referencia en:</span> {r.comparacion_referencia.coincidencias.join(', ')}.
                                        </p>
                                    )}
                                    {r.comparacion_referencia.loudness_contexto && r.comparacion_referencia.loudness_contexto.nota && (
                                        <p className="text-xs text-gray-500 mt-3 leading-relaxed">{r.comparacion_referencia.loudness_contexto.nota}</p>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Tips de género */}
                    {r.tips_genero && r.tips_genero.length > 0 && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid #6366f1'}}>
                            <p className="text-xs text-indigo-400 font-medium uppercase tracking-wider mb-3">Contexto de género</p>
                            <div className="space-y-2">
                                {r.tips_genero.map((tip, i) => (
                                    <p key={i} className="text-gray-300 text-sm leading-relaxed">{tip}</p>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* No tocar aún */}
                    {r.no_tocar_aun && r.no_tocar_aun.length > 0 && (
                        <div className="card p-6 mb-4">
                            <p className="text-xs text-red-400 font-medium uppercase tracking-wider mb-3">No tocar todavía</p>
                            <div className="space-y-2">
                                {r.no_tocar_aun.map((item, i) => (
                                    <p key={i} className="text-gray-400 text-sm">— {item}</p>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tip según objetivo */}
                    {r.tip_objetivo && (
                        <div className="card p-6 mb-4" style={{borderLeft: '3px solid #f59e0b'}}>
                            <p className="text-xs text-yellow-500 font-medium uppercase tracking-wider mb-2">Según tu objetivo</p>
                            <p className="text-gray-300 text-sm leading-relaxed">{r.tip_objetivo}</p>
                        </div>
                    )}

                    {/* Siguiente sesión + promesa de la comparativa entre versiones.
                        La comparativa v1→v2 ya existe en el detalle de proyecto, pero
                        solo se descubre cuando ya tienes 2 versiones — de ahí que se
                        anuncie aquí, que es donde el usuario lee qué hacer después.
                        Con v2+ ya no se promete: se enlaza la comparativa que existe. */}
                    <div className="card p-6 mb-4 border-purple-800">
                        <p className="text-xs accent-purple font-medium uppercase tracking-wider mb-2">Tu próxima sesión</p>
                        <p className="text-white text-sm leading-relaxed">{r.siguiente_sesion}</p>
                        {/* Solo si el análisis pertenece a un proyecto: sin él no
                            hay nada con lo que comparar y la promesa no se podría
                            cumplir. */}
                        {(proyectoIdActual || (proyectoNombreResuelto || nombreProyecto || '').trim()) && (
                            <PromesaComparativa
                                diagId={diagId}
                                userEmail={userEmail}
                                nombre={proyectoNombreResuelto || nombreProyecto || ''}
                                version={versionActual || 1}
                                proyectoId={proyectoIdActual || ''}
                                onVerComparativa={onVerComparativa}
                            />
                        )}
                    </div>

                    {/* Disclaimer */}
                    {r.disclaimer && (
                        <div className="card p-5 mb-4" style={{borderLeft: '3px solid #555'}}>
                            <p className="text-gray-500 text-xs leading-relaxed">{r.disclaimer}</p>
                        </div>
                    )}

                    {/* Alcance del análisis — qué evalúa y qué no (siempre visible) */}
                    {r.alcance_analisis && (
                        <div className="card p-4 mb-4" style={{borderLeft: '3px solid #3f3f46'}}>
                            <p className="text-gray-500 text-xs leading-relaxed">
                                <span className="text-gray-400">Qué evalúa este análisis · </span>
                                {r.alcance_analisis}
                            </p>
                        </div>
                    )}

                    {/* Mezcla */}
                    <details className="card p-5 mb-4" open>
                        <summary className="text-xs text-gray-400 font-medium uppercase tracking-wider cursor-pointer">
                            Mezcla
                        </summary>
                        <div className="mt-4 space-y-4 text-sm">

                            {/* Balance grave */}
                            <div>
                                <div className="flex justify-between items-baseline">
                                    <span className="text-gray-400">Balance grave</span>
                                    <span className={
                                        d.balance_grave === 'normal' ? 'accent-green' :
                                        d.balance_grave === 'elevado' ? 'text-yellow-400' :
                                        'text-red-400'
                                    }>{d.balance_grave}</span>
                                </div>
                                <p className="text-gray-600 text-xs mt-1">Relación entre la energía de graves y medios.</p>
                                {d.balance_grave === 'elevado' && (
                                    <p className="text-yellow-400/70 text-xs mt-1">Los graves están algo por encima de lo habitual. Revisa si el kick o el sub están compitiendo con los medios. Prueba a bajar 2-3dB en la zona de 60-120Hz o aplicar sidechain al sub con el kick.</p>
                                )}
                                {d.balance_grave === 'excesivo' && (
                                    <p className="text-red-400/70 text-xs mt-1">Los graves dominan la mezcla. Esto puede sonar bien en auriculares pero en un club será barro. Reduce el sub o el kick, y comprueba con un analizador que no estés acumulando energía por debajo de 50Hz.</p>
                                )}
                            </div>

                            {/* Densidad */}
                            <div>
                                <div className="flex justify-between items-baseline">
                                    <span className="text-gray-400">Densidad</span>
                                    <span className={
                                        d.densidad === 'baja' || d.densidad === 'media' ? 'accent-green' :
                                        d.densidad === 'alta' ? 'text-yellow-400' :
                                        'text-red-400'
                                    }>{d.densidad}</span>
                                </div>
                                <p className="text-gray-600 text-xs mt-1">Cuánto del espectro frecuencial está ocupado a la vez.</p>
                                {d.densidad === 'alta' && (
                                    <p className="text-yellow-400/70 text-xs mt-1">La mezcla está algo cargada. Revisa si hay elementos que se pisan en la misma zona frecuencial. Prueba a silenciar pistas una a una para identificar cuáles sobran o necesitan EQ.</p>
                                )}
                                {d.densidad === 'saturada' && (
                                    <p className="text-red-400/70 text-xs mt-1">El espectro está muy ocupado — casi no hay hueco entre elementos. Esto causa fatiga auditiva y pierde definición. Elimina o baja capas que no aporten, aplica EQ sustractivo agresivo, y prioriza: menos es más.</p>
                                )}
                            </div>

                            {/* Loudness (LUFS) */}
                            {d.loudness && d.loudness.lufs_integrado > -99 && (() => {
                                const esSesion = contexto && (contexto.objetivo === 'pinchar' || contexto.objetivo === 'todo');
                                const esSellos = contexto && contexto.objetivo === 'sellos';
                                // Para sesión/pinchar: >-8 es verde, -8 a -12 amarillo, <-12 bajo
                                // Para sellos: -10 a -6 verde (headroom para mastering)
                                // Para aprender: usar nivel estándar
                                let loudnessColor;
                                let loudnessTip = '';
                                if (esSesion) {
                                    loudnessColor = d.loudness.lufs_integrado > -8 ? 'accent-green' :
                                                    d.loudness.lufs_integrado > -12 ? 'text-yellow-400' :
                                                    'text-blue-400';
                                    if (d.loudness.lufs_integrado <= -12) {
                                        loudnessTip = 'Para tocar en sesión, tu track está bajo. Los DJs mezclan con tracks a -6/-8 LUFS. Si tu track está mucho más bajo, perderá impacto en la mezcla. Sube el limiter o revisa tu cadena de master.';
                                    } else if (d.loudness.lufs_integrado > -5) {
                                        loudnessTip = 'Cuidado: muy comprimido. Aunque suena fuerte, has perdido dinámica. En un sistema grande puede sonar plano y fatigante.';
                                    }
                                } else if (esSellos) {
                                    loudnessColor = d.loudness.lufs_integrado >= -10 && d.loudness.lufs_integrado <= -6 ? 'accent-green' :
                                                    d.loudness.lufs_integrado > -6 ? 'text-yellow-400' :
                                                    d.loudness.lufs_integrado >= -14 ? 'text-yellow-400' :
                                                    'text-blue-400';
                                    if (d.loudness.lufs_integrado > -6) {
                                        loudnessTip = 'Tu track suena fuerte, bien. Pero asegúrate de que tu mezcla suene bien también sin la cadena de mastering — si el sello te firma, probablemente te pidan la versión sin masterizar para que lo haga su ingeniero. Guarda siempre el proyecto sin mastering y comprueba que la mezcla funcione por sí sola aunque suene más baja en volumen.';
                                    } else if (d.loudness.lufs_integrado < -14) {
                                        loudnessTip = 'El nivel está bajo. Para enviar un demo a un sello, envía siempre tu mejor versión — masterizada y a volumen competitivo. Si te firman y quieren masterizarlo ellos, les mandas la versión sin mastering después. Por eso es clave que tu mezcla suene bien por sí sola, sin depender de la cadena de mastering para sonar bien.';
                                    } else if (d.loudness.lufs_integrado >= -10 && d.loudness.lufs_integrado <= -6) {
                                        loudnessTip = 'Buen nivel para un demo a sellos. Recuerda: envía siempre tu mejor versión masterizada. Si te firman y quieren re-masterizar, les mandas la versión sin mastering. Asegúrate de que tu mezcla suene bien por sí sola sin la cadena de mastering.';
                                    }
                                } else {
                                    loudnessColor = d.loudness.nivel === 'moderado' ? 'accent-green' :
                                                    d.loudness.nivel === 'bajo' ? 'text-blue-400' :
                                                    d.loudness.nivel === 'alto' ? 'text-yellow-400' :
                                                    d.loudness.nivel === 'muy_alto' ? 'text-red-400' :
                                                    'text-gray-400';
                                    if (d.loudness.nivel === 'bajo') {
                                        loudnessTip = 'El volumen general es bajo. No te preocupes en las fases de producción, pero cuando vayas a exportar la versión final, necesitarás un limiter en el master.';
                                    } else if (d.loudness.nivel === 'muy_alto') {
                                        loudnessTip = 'El track está muy comprimido. Has perdido rango dinámico — los drops y breaks suenan al mismo nivel. Baja el limiter y deja respirar la mezcla.';
                                    }
                                }
                                return (
                                <div>
                                    <div className="border-t border-gray-800 pt-4 mt-4">
                                        <div className="flex justify-between items-baseline">
                                            <span className="text-gray-400">Loudness</span>
                                            <span className={loudnessColor}>{d.loudness.lufs_integrado} LUFS</span>
                                        </div>
                                        <p className="text-gray-600 text-xs mt-1">{d.loudness.referencia}</p>
                                        {d.loudness.referencia_genero && (
                                            <p className="text-gray-500 text-xs mt-1">{d.loudness.referencia_genero}</p>
                                        )}
                                        {d.loudness.consejo_master && (
                                            <p className="text-gray-400 text-xs mt-2 italic">{d.loudness.consejo_master}</p>
                                        )}
                                        {d.loudness.aviso_saturacion && (
                                            <div className={`mt-3 p-2 rounded border-l-2 ${d.loudness.saturacion_dinamica === 'extrema' ? 'border-red-400 bg-red-400/5' : 'border-yellow-400 bg-yellow-400/5'}`}>
                                                <p className={`text-xs font-medium ${d.loudness.saturacion_dinamica === 'extrema' ? 'text-red-400' : 'text-yellow-400'}`}>
                                                    {d.loudness.saturacion_dinamica === 'extrema' ? '⚠ Saturación dinámica extrema' : 'Compresión elevada'}
                                                </p>
                                                <p className="text-gray-300 text-xs mt-1">{d.loudness.aviso_saturacion}</p>
                                            </div>
                                        )}
                                        {/* Taxonomía de picos (fase 2A). Sustituye al aviso
                                            antiguo, que llamaba "clipping digital" a un over de
                                            true peak sin haber contado una sola muestra recortada.
                                            Los campos viejos siguen viajando en la respuesta para
                                            los parsers, pero ya no se pintan.
                                            Fallback: un análisis anterior a 2A no trae
                                            `aviso_picos`, así que se muestra el texto que tenía. */}
                                        {d.loudness.aviso_picos ? (
                                            <div className={`mt-3 p-2 rounded border-l-2 ${d.loudness.severidad_picos === 'atencion' ? 'border-yellow-400 bg-yellow-400/5' : 'border-gray-600 bg-white/5'}`}>
                                                <p className={`text-xs font-medium ${d.loudness.severidad_picos === 'atencion' ? 'text-yellow-400' : 'text-gray-300'}`}>
                                                    {d.loudness.titulo_picos}
                                                </p>
                                                <p className="text-gray-300 text-xs mt-1">{d.loudness.aviso_picos}</p>
                                                {d.loudness.nota_lossy_picos && (
                                                    <p className="text-gray-500 text-xs mt-1">{d.loudness.nota_lossy_picos}</p>
                                                )}
                                            </div>
                                        ) : d.loudness.aviso_true_peak ? (
                                            <div className="mt-3 p-2 rounded border-l-2 border-yellow-400 bg-yellow-400/5">
                                                <p className="text-xs font-medium text-yellow-400">True peak</p>
                                                <p className="text-gray-300 text-xs mt-1">{d.loudness.aviso_true_peak}</p>
                                            </div>
                                        ) : null}
                                        {/* Fase 2B — muestras a fondo de escala. Es lo único
                                            que puede AFIRMAR que la onda está recortada; el
                                            true peak de arriba solo dice si la onda asoma
                                            entre muestras.
                                            El caso limpio se resuelve en una línea: un
                                            informe sin problemas no debe llenarse de párrafos.
                                            El resto sí se explica entero — la idea es formar
                                            al productor, no solo etiquetarle el archivo. */}
                                        {d.loudness.categoria_recorte === 'sin_muestras_en_techo' ? (
                                            <p className="text-gray-500 text-xs mt-2">
                                                Ninguna muestra del archivo llega al techo: la forma de onda está entera.
                                            </p>
                                        ) : d.loudness.aviso_recorte ? (
                                            <div className={`mt-3 p-2 rounded border-l-2 ${d.loudness.severidad_recorte === 'atencion' ? 'border-yellow-400 bg-yellow-400/5' : 'border-gray-600 bg-white/5'}`}>
                                                <p className={`text-xs font-medium ${d.loudness.severidad_recorte === 'atencion' ? 'text-yellow-400' : 'text-gray-300'}`}>
                                                    {d.loudness.titulo_recorte}
                                                </p>
                                                <p className="text-gray-300 text-xs mt-1">{d.loudness.aviso_recorte}</p>
                                                {d.loudness.racha_maxima_ms > 0 && (
                                                    <p className="text-gray-500 text-xs mt-1">
                                                        Medido: {d.loudness.muestras_en_techo_total} muestras en el techo
                                                        {' '}({d.loudness.pct_muestras_en_techo}% del archivo) ·
                                                        {' '}meseta más larga {d.loudness.racha_maxima_ms} ms
                                                        {d.loudness.canal_afectado ? ` · canal ${d.loudness.canal_afectado}` : ''}
                                                    </p>
                                                )}
                                            </div>
                                        ) : null}
                                        {loudnessTip && (
                                            <p className={`text-xs mt-1 ${loudnessColor.replace('text-', 'text-').replace('400', '400/70')}`}>{loudnessTip}</p>
                                        )}
                                    </div>

                                    <div className="mt-3 grid grid-cols-2 gap-3">
                                        <div>
                                            <span className="text-gray-500 text-xs">Pico short-term</span>
                                            <p className="text-gray-300 text-sm">{fmtMedida(d.loudness.lufs_short_term_max, 1, ' LUFS')}</p>
                                            <p className="text-gray-600 text-xs">El momento más fuerte del track.</p>
                                        </div>
                                        <div>
                                            <span className="text-gray-500 text-xs">Rango</span>
                                            <p className="text-gray-300 text-sm">{fmtMedida(d.loudness.rango_loudness, 1, ' LU')}</p>
                                            <p className="text-gray-600 text-xs">Diferencia entre lo más fuerte y lo más suave. Más rango = más dinámica.</p>
                                        </div>
                                    </div>

                                    {/* Picos — siempre visibles. El true peak es el dato
                                        principal; el sample peak va como técnico secundario.
                                        Fase 1: solo se muestran, sin color ni juicio nuevo. */}
                                    <div className="mt-3 grid grid-cols-2 gap-3">
                                        <div>
                                            <span className="text-gray-500 text-xs">True peak</span>
                                            <p className="text-gray-300 text-sm">{fmtMedida(d.loudness.true_peak_dbtp, 1, ' dBTP')}</p>
                                            <p className="text-gray-600 text-xs">El pico real reconstruido, incluyendo lo que ocurre entre muestras.</p>
                                        </div>
                                        <div>
                                            <span className="text-gray-600 text-xs">Sample peak</span>
                                            <p className="text-gray-500 text-sm">{fmtMedida(d.loudness.sample_peak_dbfs, 1, ' dBFS')}</p>
                                            <p className="text-gray-600 text-xs">El valor más alto de las muestras del archivo.</p>

    // =========================================================================
