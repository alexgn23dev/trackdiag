    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W2FMW2T70F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-W2FMW2T70F');
      function trackEvent(name, params) {
        try { gtag('event', name, params || {}); } catch(e) {}
      }
      // Embudo CTA — session_id anónimo persistente en localStorage para
      // enlazar eventos del mismo navegador entre páginas (SPA + /consultoria).
      window.mtSessionId = function() {
        try {
          var sid = localStorage.getItem('mt_session_id');
          if (!sid) {
            sid = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
            localStorage.setItem('mt_session_id', sid);
          }
          return sid;
        } catch(e) { return ''; }
      };
      // Envío fire-and-forget de eventos del embudo al backend.
      window.mtCtaEvent = function(evento, extra) {
        try {
          var body = Object.assign({ evento: evento, session_id: window.mtSessionId() }, extra || {});
          fetch('/api/cta-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            keepalive: true,
          }).catch(function(){});

    <style>
        @font-face {
            font-family: 'Termina';
            src: url('Termina-Demi.woff2') format('woff2'),
                 url('Termina-Demi.woff') format('woff');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --po-dark: #2C2C2C;
            --po-medium: #4C4C4C;
            --po-light: #BCBCBC;
            --po-white: #FFFFFF;
            --po-green: #25F464;
            --po-purple: #6D10FF;
            --po-bg: #1a1a1a;
            --po-card: #242424;
            --po-border: #3a3a3a;
        }
        body { font-family: 'Arimo', sans-serif; background: var(--po-bg); color: var(--po-light); }
        h1, h2, h3, .font-heading { font-family: 'Termina', sans-serif; letter-spacing: -0.01em; }
        .drop-zone { border: 2px dashed var(--po-border); transition: all 0.3s ease; }
        .drop-zone.active { border-color: var(--po-green); background: rgba(37, 244, 100, 0.04); }
        .drop-zone:hover { border-color: var(--po-purple); background: rgba(109, 16, 255, 0.03); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-dot { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        input[type="range"] { -webkit-appearance: none; background: var(--po-medium); height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--po-purple); border-radius: 50%; cursor: pointer; }
        .card { background: var(--po-card); border: 1px solid var(--po-border); border-radius: 12px; }
        .badge-verde { background: rgba(248,113,113,0.1); color: #f87171; }
        .badge-desarrollo { background: rgba(250,204,21,0.1); color: #facc15; }
        .badge-avanzado { background: rgba(96,165,250,0.1); color: #60a5fa; }
        .btn-primary { background: var(--po-purple); color: var(--po-white); transition: all 0.2s; }
        .btn-primary:hover { background: #5a0dd6; }
        .btn-primary:disabled { background: var(--po-medium); color: #777; cursor: not-allowed; }
        .btn-secondary { background: var(--po-dark); color: var(--po-light); border: 1px solid var(--po-border); transition: all 0.2s; }
        .btn-secondary:hover { background: var(--po-medium); }
        .input-field { background: var(--po-dark); border: 1px solid var(--po-border); color: var(--po-white); }
        .input-field:focus { outline: none; border-color: var(--po-purple); }
        .input-field::placeholder { color: #666; }
        .accent-green { color: var(--po-green); }
        .accent-purple { color: var(--po-white); }
        /* --- Portada (rediseño ago-2026, prototipo de Alex) ---------------
           Solo la usa LandingScreen. Sustituye a .wave-bg, que era el fondo
           de la portada anterior y no lo usaba nadie más. */
        .home-v3 {
            background:
                radial-gradient(ellipse 60% 50% at 10% 92%, rgba(109,16,255,0.16), transparent 68%),
                radial-gradient(ellipse 45% 40% at 92% 4%, rgba(109,16,255,0.07), transparent 70%),

        }
        .paso-card { background: rgba(255,255,255,0.025); border: 1px solid #232331; border-radius: 14px; }
        .paso-conn { width: 18px; height: 2px; flex: none; align-self: center; background: rgba(109,16,255,0.55); }
        .paso-num {
            width: 22px; height: 22px; border-radius: 50%; flex: none;
            background: rgba(37,244,100,0.12); color: var(--po-green);
            font-size: 11px; font-weight: 700;

        }
        .avatar-v3 { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #12121a; flex: none; }
        .avatar-v3 + .avatar-v3 { margin-left: -11px; }
        .pill-fmt {
            font-size: 12px; letter-spacing: .02em; color: var(--po-green);
            border: 1px solid rgba(37,244,100,0.3); border-radius: 999px;
            padding: 5px 14px;
        }
        /* El interior de la zona de arrastre va un punto más oscuro que la
           tarjeta; en reglas y no en línea para no pisar el hover/active. */
        .home-v3 .drop-zone { background: #101017; }
        .home-v3 .drop-zone:hover { background: rgba(109,16,255,0.04); }
        .home-v3 .drop-zone.active { background: rgba(37,244,100,0.04); }
        /* === Rediseño del diagnóstico (v2) ================================
           Se activa con ?v2=1. Convive con la vista clásica: nada de esto se
           aplica salvo que el marcado v2 esté en pantalla. */
        .rotulo-v2 {
            font-size: 10px; font-weight: 700; letter-spacing: .12em;
            text-transform: uppercase; color: #7a7a7a;
        }
        /* Punto de estado: sustituye a los emojis de semáforo */
        .punto-v2 { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
        /* Cifras de ancho fijo, para que las columnas de números no bailen */
        .cifra-v2 { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
        .tab-v2 { border-bottom: 2px solid transparent; transition: all .18s; white-space: nowrap; }
        .tab-v2:hover { color: #fff; }
        .tab-v2.on { border-bottom-color: var(--po-white); color: #fff; }
        .barra-v2 { background: #1c1c1c; border: 1px solid var(--po-border); border-radius: 3px; overflow: hidden; }
        .v2-wrap { overflow-x: hidden; max-width: 100%; }

        /* --- Barra de navegación de la v2 ---------------------------------
           Sustituye al botón flotante "Mi panel", que se encimaba al contenido
           en cuanto la ventana se estrechaba. Al ser sticky y ocupar su propio
           alto, nada puede quedar debajo. */
        .v2-nav {
            position: sticky; top: 0; z-index: 45;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: saturate(140%) blur(10px);
            -webkit-backdrop-filter: saturate(140%) blur(10px);
            border-bottom: 1px solid #2a2a2a;
        }
        .v2-nav-inner {
            max-width: 80rem; margin: 0 auto;
            padding: 0.6rem 1.25rem;
            display: flex; align-items: center; gap: 1rem;
        }
        .v2-nav a, .v2-nav button.v2-nav-link {
            color: #9a9a9a; font-size: 12.5px; text-decoration: none;
            padding: 0.35rem 0.6rem; border-radius: 6px;
            transition: color .15s, background .15s; white-space: nowrap;
            background: transparent; border: 0; cursor: pointer;
        }
        .v2-nav a:hover, .v2-nav button.v2-nav-link:hover { color: #fff; background: #232323; }
        .v2-nav .v2-nav-cta {
            color: #fff; background: var(--po-purple);
            padding: 0.4rem 0.85rem; border-radius: 7px; font-size: 12.5px;
            font-weight: 600; border: 0; cursor: pointer; white-space: nowrap;
            transition: background .15s;
        }
        .v2-nav .v2-nav-cta:hover { background: #5a0dd6; }
        .v2-nav-links { display: flex; align-items: center; gap: 0.15rem; margin-left: auto; }
        @media (max-width: 720px) {
            .v2-nav-inner { padding: 0.5rem 0.85rem; gap: 0.5rem; }
            .v2-nav-links { gap: 0; overflow-x: auto; }
            .v2-nav a, .v2-nav button.v2-nav-link { padding: 0.3rem 0.45rem; font-size: 12px; }
        }

        /* --- Escala tipográfica de la v2 ----------------------------------
           El cuerpo de las tarjetas iba a `text-sm` (14 px), que al lado de los
           rótulos de 10 px se veía enorme. Se baja un escalón: 13 px para el
           cuerpo y 11 px para lo secundario, que es la proporción que usa el
           resto de la web. */
        .v2-cuerpo { font-size: 13px; line-height: 1.55; }
        .v2-sec { font-size: 11px; line-height: 1.5; }
        /* Entrada del espectro: fundido, primero el corredor y después la curva.
           Se intentó trazar la curva de izquierda a derecha con stroke-dasharray
           y se descartó: combinado con vector-effect="non-scaling-stroke" el
           guion se mide en píxeles de pantalla, así que en un gráfico ancho la
           curva se cortaba sobre los 5 kHz, y con pathLength="1" salía a
           trazos. Un fallo invisible en pantallas estrechas no compensa una
           animación que además es opcional. */
        .v2-corredor { animation: v2Fundido 520ms ease-out both; }
        .v2-curva    { animation: v2Fundido 460ms ease-out 140ms both; }
        @keyframes v2Fundido { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .v2-curva, .v2-corredor { animation: none; opacity: 1; }
        }

        /* El widget de calibración se reutiliza tal cual dentro de una tarjeta
           estrecha. Sus botones usan `sm:flex-row`, que depende del ANCHO DE
           VENTANA y no del de la tarjeta: en escritorio se ponían en fila
           dentro de 400 px y el texto salía a una palabra por línea. Aquí se
           fuerza la columna. */
        .v2-feedback .flex-col.sm\\:flex-row { flex-direction: column !important; }
        .v2-feedback button { white-space: normal; }

        /* Selected option style */
        .opt-selected { background: var(--po-purple) !important; color: var(--po-white) !important; border-color: var(--po-purple) !important; }
        .opt-default { background: var(--po-dark); color: var(--po-light); border: 1px solid var(--po-border); }
        .opt-default:hover { border-color: var(--po-medium); }
        /* Mentotrack wordmark */
        .mt-logo {

        .mt-logo .mt-knob {

            transform: rotate(40deg);
        }
        .mt-logo.mt-logo--inv { color: #2C2C2C; }

<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;

    const API_URL = window.location.hostname === 'localhost'
        ? 'http://localhost:8000'
        : '';

    // Versión de este index.html. Tiene que coincidir con la que devuelve
    // /api/health. Si no coincide, este fichero viene de la caché del
    // navegador y puede estar dejando de enviar campos que el backend ya
    // espera — se recarga una sola vez y, si aun así no cuadra, se avisa.
    const APP_VERSION = '0.5.90';

    function comprobarVersionFrontend(onDesfase, onEntorno) {
        fetch(`${API_URL}/api/health`, { cache: 'no-store' })
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                // /api/health solo devuelve `entorno` cuando NO es producción.
                // Evita el peor accidente de un preview: creer que miras prod.
                if (data && data.entorno) onEntorno && onEntorno(data.entorno);
                const backend = data && data.version;
                if (!backend || backend === APP_VERSION) return;
                // Guarda contra bucles: solo se recarga una vez por versión.
                const yaIntentado = sessionStorage.getItem('mt_reload_version');
                if (yaIntentado !== backend) {
                    sessionStorage.setItem('mt_reload_version', backend);
                    window.location.reload();
                    return;
                }
                // Recargamos y sigue sin cuadrar: hay una caché intermedia.
                // No insistimos, avisamos.
                onDesfase && onDesfase(backend);
            })
            .catch(() => {});
    }

    // Formatea una medida numérica para la UI, o devuelve "—".
    // Un análisis antiguo no trae los campos nuevos (undefined), un fallo de
    // medición los deja en el centinela -99, y un JSON raro puede colar NaN o
    // null. Ninguno de esos debe llegar nunca a pantalla como tal.
    const SENTINELA_SIN_DATO = -99;
    function fmtMedida(valor, decimales = 1, sufijo = '') {
        const n = typeof valor === 'number' ? valor : parseFloat(valor);
        if (valor === null || valor === undefined || !isFinite(n)) return '—';
        if (n <= SENTINELA_SIN_DATO) return '—';
        return n.toFixed(decimales) + sufijo;
    }

    // =========================================================================
    // Componentes de UI
    // =========================================================================

    function SelectField({ label, options, value, onChange, name }) {
        return (
            <div className="mb-5">
                <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>{label}</label>
                <div className="grid grid-cols-2 gap-2">
                    {options.map(opt => (
                        <button
                            key={opt.value}
                            type="button"
                            onClick={() => onChange(name, opt.value)}
                            className={`px-3 py-2.5 rounded-lg text-sm text-left transition-all ${
                                value === opt.value ? 'opt-selected' : 'opt-default'
                            }`}
                        >
                            {opt.label}
                        </button>
                    ))}
                </div>
            </div>
        );
    }

    function TextInput({ label, value, onChange, name, placeholder, maxLength }) {
        return (
            <div className="mb-5">
                <label className="block text-sm font-medium mb-2" style={{color: 'var(--po-light)'}}>{label}</label>
                <input
                    type="text"
                    value={value}
                    onChange={(e) => onChange(name, e.target.value)}
                    placeholder={placeholder}
                    maxLength={maxLength || 200}
                    className="w-full px-4 py-3 rounded-lg text-sm input-field"
                />
            </div>
        );
    }

    // =========================================================================
    // Pantallas
    // =========================================================================

    // =========================================================================
    // Historial (localStorage)
    // =========================================================================

    const HISTORIAL_KEY = 'mentotrack_historial';

    function guardarEnHistorial(filename, contexto, resultado, proyecto) {
        const historial = JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
        const da = resultado.datos_audio || {};
        historial.unshift({
            id: Date.now(),
            fecha: new Date().toISOString(),
            archivo: filename,
            proyecto: (proyecto || filename || '').trim().toLowerCase(),
            genero: contexto.genero,
            objetivo: contexto.objetivo,
            diagnostico: resultado.diagnostico_principal?.titulo || 'Sin diagnóstico',
            diagnostico_id: resultado.diagnostico_principal?.id || '',
            diagnostico_secundario_id: resultado.diagnostico_secundario?.id || null,
            estado: resultado.estado_track,
            estado_texto: resultado.estado_texto,
            score: resultado.diagnostico_principal?.score || 0,
            // Scores completos para comparación de progreso
            scores: resultado.scores || {},
            // Datos de audio clave para evolución
            lufs: da.loudness?.lufs_integrado ?? null,
            densidad: da.densidad || null,
            balance_grave: da.balance_grave || null,
            bpm: da.bpm || null,
            mono_nivel: da.mono_compat?.nivel_compatibilidad || null,
            harshness_nivel: da.harshness?.nivel || null,
        });
        // Máximo 50 entradas
        if (historial.length > 50) historial.length = 50;
        localStorage.setItem(HISTORIAL_KEY, JSON.stringify(historial));
    }

    function obtenerHistorial() {
        return JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
    }

    function borrarEntradaHistorial(id) {
        const historial = obtenerHistorial().filter(e => e.id !== id);
        localStorage.setItem(HISTORIAL_KEY, JSON.stringify(historial));
        return historial;
    }

    function HistorialScreen({ onBack, onAnalizar }) {
        const [entradas, setEntradas] = useState(obtenerHistorial());

        const handleBorrar = (id) => {
            setEntradas(borrarEntradaHistorial(id));
        };

        const formatFecha = (iso) => {
            const d = new Date(iso);
            return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        const estadoColor = (estado) => {
            if (estado === 'verde') return 'bg-red-900/30 text-red-400';
            if (estado === 'avanzado') return 'bg-blue-900/30 text-blue-400';
            return 'bg-yellow-900/30 text-yellow-400';
        };

        return (
            <div className="min-h-screen px-6 py-8 fade-in">
                <div className="max-w-2xl mx-auto">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-xl font-bold text-white">Historial de análisis</h2>
                        <button onClick={onBack} className="text-gray-500 hover:text-gray-300 text-sm transition-colors">
                            ← Volver
                        </button>
                    </div>

                    {entradas.length === 0 ? (
                        <div className="text-center py-16">
                            <div className="text-3xl mb-3" style={{color: 'var(--po-medium)'}}>—</div>
                            <p className="text-gray-500 mb-4">Aún no has analizado ningún track.</p>
                            <button
                                onClick={onAnalizar}
                                className="px-6 py-3 btn-primary rounded-xl transition-colors"
                            >
                                Analizar mi primer track
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {entradas.map(e => (
                                <div key={e.id} className="card p-4 flex items-center justify-between gap-4">
                                    <div className="flex-1 min-w-0">
                                        <p className="text-gray-200 text-sm font-medium truncate">{e.archivo}</p>
                                        <p className="text-gray-500 text-xs mt-1">{formatFecha(e.fecha)}</p>
                                    </div>
                                    <div className="flex items-center gap-3 flex-shrink-0">
                                        <span className={`text-xs px-2 py-1 rounded-full ${estadoColor(e.estado)}`}>
                                            {e.estado_texto || e.estado}
                                        </span>
                                        <span className="text-gray-400 text-xs max-w-[140px] truncate hidden sm:block" title={e.diagnostico}>
                                            {e.diagnostico}
                                        </span>
                                        <button
                                            onClick={() => handleBorrar(e.id)}
                                            className="text-gray-600 hover:text-red-400 text-xs transition-colors"
                                            title="Eliminar"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>
                            ))}
                            <p className="text-gray-600 text-xs text-center pt-2">
                                {entradas.length} análisis guardados en este navegador
                            </p>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    function QuestionnaireScreen({
        opciones, contexto, onChange, onSubmit, isValid,
        nombreProyecto, onNombreChange,
        proyectosPrevios, proyectoMode, onProyectoModeChange,
        proyectoSeleccionadoId, onProyectoSeleccionadoChange,
        versionEtiqueta, onVersionEtiquetaChange,
        prefilledFromProyecto,
        fileRef, onFileRefSelected, onFileRefClear,
    }) {
        const refInputRef = useRef(null);
        const [refError, setRefError] = useState('');
        const handleRefChange = (e) => {
            const f = e.target.files[0];
            e.target.value = ''; // permite re-seleccionar el mismo archivo
            if (!f) return;
            const sizeMB = f.size / 1024 / 1024;
            if (sizeMB > 150) {
                setRefError(`El track de referencia pesa ${Math.round(sizeMB)} MB, el máximo es 150 MB. Convierte a MP3 para reducir el tamaño.`);
                return;
            }
            setRefError('');
            onFileRefSelected(f);
        };
        const tieneProyectos = (proyectosPrevios || []).length > 0;
        const proyectoSeleccionado = tieneProyectos && proyectoMode === 'select'
            ? proyectosPrevios.find(p => p.id === proyectoSeleccionadoId)
            : null;
        const versionPrevista = proyectoSeleccionado
            ? (proyectoSeleccionado.n_versiones || 0) + 1

            "Analizando distribución de energía...",

        const [currentStep, setCurrentStep] = useState(0);

        useEffect(() => {

            return () => clearInterval(interval);

            <div className="min-h-screen flex flex-col items-center justify-center px-6 fade-in">

    // =====================================================================
    // Espejo de engine/contextualizador.py. Se comprueba en
    // backend/tests/test_genero_no_electronico.py que las dos listas coincidan.
    const GENEROS_ELECTRONICOS = [
        "tech", "techno", "house", "trance", "minimal", "ambient", "drum",
        "dnb", "d&b", "garage", "dubstep", "electro", "edm", "dance",
        "downtempo", "breakbeat", "breaks", "psy", "hardstyle", "hardcore",
        "dub techno", "deep", "future", "club", "rave",
    ];
    const GENEROS_NO_ELECTRONICOS = [
        "vallenato", "salsa", "bachata", "merengue", "cumbia", "mariachi",
        "ranchera", "banda", "mambo", "rumba", "tango", "samba", "bossa",
        "reggaeton", "reggaetón", "dembow", "perreo",
        "pop ", " pop", "indie pop", "k-pop", "kpop",
        "rock", "metal", "punk", "grunge", "hardcore punk",
        "rap", "hip hop", "hip-hop", "trap latino", "drill",
        "jazz", "blues", "soul", "gospel", "r&b", "rnb",
        "country", "folk", "bluegrass",
        "reggae", "ska",
        "classical", "clásica", "clasica", "sinfónic", "sinfonic",
        "opera", "ópera", "flamenco", "fandango",
        "vals", "paso doble", "polka", "celta", "afrobeat", "afrobeats",
    ];

    /** ¿El género escrito a mano queda fuera del alcance del motor?
     *
     * Misma regla que el backend: si el texto contiene alguna palabra
     * claramente electrónica NO se avisa, aunque también contenga una de la
     * otra lista. Evita marcar "rock electrónico" o "indie dance pop". */
    function esGeneroNoElectronico(texto) {
        // Sin quitar las tildes, "electro" no casa con "electrónico" y
        // "rock electrónico" saldría marcado — el falso positivo que la lista
        // blanca dice evitar. Mismo criterio que _sin_tildes() en el backend.
        const t = (texto || '').toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (t.length < 2) return false;
        // Se normalizan también las palabras de la lista, para que dé igual
        // cómo estén escritas ahí.
        const n = k => k.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (GENEROS_ELECTRONICOS.some(k => t.includes(n(k)))) return false;
        return GENEROS_NO_ELECTRONICOS.some(k => t.includes(n(k)));
    }

        mezcla_prematura: 'estructura',
        track_verde: 'estructura',
        // Desactivadas en el motor (score 0); mapeadas por si se reactivan:
        conflicto_armonico: 'general',
        pobreza_armonica: 'general',
    };

    // Resuelve variante + categoría dominante. Ningún dx del motor cubre
    // master/loudness: esa variante sale de los avisos de loudness/true peak.
    function resolverVarianteMaster(r) {
        const diagId = (r && r.diagnostico_principal && r.diagnostico_principal.id) || 'sin_diagnostico';
        if (diagId !== 'sin_diagnostico' && MASTER_CTA_MAPEO[diagId]) {
            return { variante: MASTER_CTA_MAPEO[diagId], categoria: diagId };
        }
        const loud = (r && r.datos_audio && r.datos_audio.loudness) || {};
        if (loud.aviso_true_peak) return { variante: 'mastering', categoria: 'true_peak' };
        if (loud.aviso_saturacion || loud.nivel === 'muy_alto') return { variante: 'mastering', categoria: 'loudness' };
        return { variante: 'general', categoria: 'general' };
    }

    function MasterCTA({ diagId, variante, categoria, userEmail }) {
        useEffect(() => {
            try { trackEvent('cta_master_visto', { diagnostico: diagId, variante, categoria }); } catch (e) {}
            try { window.mtCtaEvent && window.mtCtaEvent('master_visto', { diagnostico_id: categoria || '', email: userEmail || '' }); } catch (e) {}
        }, [diagId]);
        const url = 'https://producciononline.com/master/?utm_source=mentotrack&utm_medium=app&utm_campaign=derivacion&utm_content=' + encodeURIComponent(categoria || 'general');
        return (
            <a
                href={url}
                target="_blank"
                rel="noopener"
                onClick={() => {
                    try { trackEvent('cta_master_clicked', { diagnostico: diagId, variante, categoria }); } catch (e) {}
                    try { window.mtCtaEvent && window.mtCtaEvent('master_clicked', { diagnostico_id: categoria || '', email: userEmail || '' }); } catch (e) {}
                }}
                className="block card p-5 mb-6 transition-all"
                style={{
                    background: 'linear-gradient(135deg, rgba(139,92,246,0.08) 0%, rgba(99,102,241,0.05) 100%)',

                    textDecoration: 'none',
                    cursor: 'pointer',
                }}
            >
                <p className="text-white text-sm font-semibold mb-1">
                    Este análisis te dice qué falla. El Máster te enseña a arreglarlo.
                </p>
                <p className="text-gray-400 text-xs leading-relaxed mb-3">
                    {MASTER_CTA_VARIANTES[variante] || MASTER_CTA_VARIANTES.general}
                </p>
                <span className="inline-flex items-center gap-1.5 text-white text-sm font-medium">
                    Ver el Máster →

        );
    }


    // =====================================================================
    // Compartir con la comunidad — card + modal en la pantalla de diagnóstico.
    // Requiere: perfil completo, aceptar el descargo. El archivo se reutiliza
    // del análisis recién hecho (sigue en memoria del navegador).
    // =====================================================================
    const DESCARGO_COMUNIDAD = "Al compartir confirmas que este track es tuyo y conservas todos sus derechos. " +
        "Lo publicas con tu nombre y bajo tu responsabilidad: Mentotrack es el espacio donde se muestra y no se hace " +
        "responsable del uso que terceros puedan hacer de lo publicado. Y la regla de oro: respeta la autoría de lo que " +
        "escuchas — aquí se viene a ayudar, no a copiar.";

    function CompartirComunidad({ file, resultado, contexto, opciones, nombreProyecto, onIrAPerfil }) {
        const [open, setOpen] = useState(false);
        const [estado, setEstado] = useState('form'); // form | cargando | sin_perfil | enviando | ok
        const [error, setError] = useState('');

        const [mensaje, setMensaje] = useState('');
        const [bpmEdit, setBpmEdit] = useState('');
        const [aceptado, setAceptado] = useState(false);

        const d = resultado?.datos_audio || {};
        const labelDe = (lista, val) => ((opciones?.[lista] || []).find(o => o.value === val)?.label) || val || '—';
        const estiloLabel = contexto.genero === 'otro' ? (contexto.genero_custom || 'Otro') : labelDe('generos', contexto.genero);

        const abrir = () => {
            setOpen(true);
            setError('');
            setTitulo(t => t || nombreProyecto || (file?.name || '').replace(/\.[^.]+$/, ''));
            setBpmEdit(b => b || (d.bpm ? String(d.bpm) : ''));
            setEstado('cargando');
            trackEvent('comunidad_share_opened', {});
            fetch(`${API_URL}/api/perfil`, { headers: authHeaders() })
                .then(r => {
                    if (r.status === 401) {
                        // Sesión caducada ≠ perfil incompleto: mensaje honesto
                        setEstado('form');
                        setError('Tu sesión ha caducado. Recarga la página e inicia sesión de nuevo para compartir.');
                        return undefined;
                    }
                    return r.ok ? r.json() : false;
                })
                .then(data => {
                    if (data === undefined) return; // 401 ya gestionado
                    if (!data || !data.perfil) { setEstado('form'); return; } // error → el backend re-valida al enviar
                    setEstado(data.perfil.perfil_completo ? 'form' : 'sin_perfil');
                })
                .catch(() => setEstado('form')); // si falla el check, el backend re-valida igualmente
        };

        const compartir = async () => {
            if (!aceptado || !titulo.trim() || estado === 'enviando') return;
            // BPM: si lo han escrito, debe ser válido (no descartarlo en silencio)
            if (bpmEdit !== '') {
                const b = Number(bpmEdit);
                if (!Number.isFinite(b) || b < 40 || b > 300) {
                    setError('El BPM debe estar entre 40 y 300 (o deja el campo vacío).');
                    return;
                }
            }
            setEstado('enviando');
            setError('');
            const fd = new FormData();
            fd.append('audio', file);
            fd.append('titulo', titulo.trim());
            fd.append('mensaje', mensaje.trim());
            fd.append('estilo', contexto.genero || '');
            fd.append('estilo_custom', contexto.genero === 'otro' ? (contexto.genero_custom || '') : '');
            fd.append('bpm', bpmEdit || '');
            fd.append('objetivo', contexto.objetivo || '');
            fd.append('lufs', d.loudness?.lufs_integrado ?? '');
            fd.append('balance', d.balance_grave || '');
            fd.append('mono_correlacion', d.mono_compat?.correlacion_lr ?? '');
            fd.append('mono_nivel', d.mono_compat?.nivel_compatibilidad || '');
            fd.append('estado_track', resultado.estado_track || '');
            fd.append('descargo', 'si');
            try {
                const { token } = getAuth();
                const resp = await fetch(`${API_URL}/api/comunidad/compartir`, {
                    method: 'POST',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {},
                    body: fd,

                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    if (data.codigo === 'perfil_incompleto') { setEstado('sin_perfil'); return; }
                    // reciprocidad: mensaje del backend ya es claro y motivador
                    throw new Error(data.error || 'No se pudo publicar');
                }
                setEstado('ok');
                trackEvent('comunidad_share_submitted', { estilo: contexto.genero });
            } catch (e) {
                setEstado('form');
                setError(e.message || 'No se pudo publicar. Inténtalo de nuevo.');
            }
        };

        if (!file) return null;

        return (
            <React.Fragment>
                {/* Card CTA */}

                            )}

                            {estado === 'sin_perfil' && (
                                <div className="text-center py-4">
                                    <p className="text-white text-sm font-medium mb-2">Antes de compartir, completa tu perfil</p>
                                    <p className="text-gray-400 text-xs leading-relaxed mb-5" style={{maxWidth: '380px', margin: '0 auto 20px'}}>
                                        Tu perfil (experiencia, estilos, trayectoria) es lo que verán los demás junto a tu track
                                        y tus comentarios. Es lo que da credibilidad al feedback en la comunidad — se rellena en un minuto.
                                    </p>
                                    <button onClick={() => { setOpen(false); onIrAPerfil(); }} className="px-5 py-2.5 btn-primary rounded-lg text-sm font-semibold">
                                        Completar mi perfil
                                    </button>
                                </div>
                            )}

                            {(estado === 'form' || estado === 'enviando') && (
                                <div>
                                    <h3 className="text-white text-base font-bold mb-4">Compartir con la comunidad</h3>

                                    <label className="block text-xs font-medium mb-1.5" style={{color: 'var(--po-light)'}}>Título</label>
                                    <input type="text" value={titulo} onChange={e => setTitulo(e.target.value)} maxLength={120}
                                        className="w-full px-4 py-3 rounded-lg text-sm input-field mb-4" placeholder="Nombre del track" />

                                    <label className="block text-xs font-medium mb-1.5" style={{color: 'var(--po-light)'}}>

                                    </label>
                                    <textarea value={mensaje} onChange={e => setMensaje(e.target.value)} maxLength={300} rows={2}
                                        className="w-full px-4 py-3 rounded-lg text-sm input-field mb-4" style={{resize: 'vertical'}}
                                        placeholder="Ej: WIP de melodic techno. No sé si el break es muy largo ni si el bajo pega en el drop." />

                                    <div className="flex gap-3 mb-4">
                                        <div className="flex-1">
                                            <label className="block text-xs font-medium mb-1.5" style={{color: 'var(--po-light)'}}>
                                                BPM <span style={{color: 'var(--po-medium)'}}>(corrígelo si el detector falló)</span>
                                            </label>
                                            <input type="number" value={bpmEdit} onChange={e => setBpmEdit(e.target.value)} min={40} max={300}
                                                className="w-full px-4 py-3 rounded-lg text-sm input-field" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-medium mb-1.5" style={{color: 'var(--po-light)'}}>Estilo</label>
                                            <div className="px-4 py-3 rounded-lg text-sm" style={{border: '1px solid #2e2e33', color: '#e5e5e5'}}>{estiloLabel}</div>
                                        </div>
                                    </div>

                                    {/* Datos del análisis que acompañan al post */}
                                    <p className="text-xs font-medium mb-1.5" style={{color: 'var(--po-light)'}}>Se publica junto a estos datos del análisis:</p>
                                    <div className="flex flex-wrap gap-1.5 mb-4">
                                        {d.loudness?.lufs_integrado != null && <span className="text-xs px-2 py-1 rounded-full text-gray-300" style={{background: 'rgba(255,255,255,0.06)'}}>{d.loudness.lufs_integrado} LUFS</span>}
                                        {d.balance_grave && <span className="text-xs px-2 py-1 rounded-full text-gray-300" style={{background: 'rgba(255,255,255,0.06)'}}>balance: {d.balance_grave}</span>}
                                        {d.mono_compat?.nivel_compatibilidad && <span className="text-xs px-2 py-1 rounded-full text-gray-300" style={{background: 'rgba(255,255,255,0.06)'}}>mono: {d.mono_compat.nivel_compatibilidad}</span>}
                                        <span className="text-xs px-2 py-1 rounded-full text-gray-300" style={{background: 'rgba(255,255,255,0.06)'}}>objetivo: {labelDe('objetivos', contexto.objetivo)}</span>
                                    </div>

                                    <div className="rounded-lg p-3 mb-4" style={{background: 'rgba(255,255,255,0.03)', border: '1px solid #2e2e33'}}>
                                        <label className="flex items-start gap-2.5 cursor-pointer">
                                            <input type="checkbox" checked={aceptado} onChange={e => setAceptado(e.target.checked)} className="mt-0.5" />
                                            <span className="text-xs text-gray-400 leading-relaxed">{DESCARGO_COMUNIDAD}</span>
                                        </label>
                                    </div>

                                    {error && <p className="text-xs text-red-400 mb-3">{error}</p>}

                                    <div className="flex gap-3">
                                        <button onClick={compartir} disabled={!aceptado || !titulo.trim() || estado === 'enviando'}
                                            className="flex-1 px-5 py-3 btn-primary rounded-lg text-sm font-semibold"
                                            style={(!aceptado || !titulo.trim() || estado === 'enviando') ? {opacity: 0.5, cursor: 'not-allowed'} : {}}>
                                            {estado === 'enviando' ? 'Publicando…' : 'Publicar track'}
                                        </button>
                                        <button onClick={() => setOpen(false)} disabled={estado === 'enviando'}
                                            className="px-5 py-3 btn-secondary rounded-lg text-sm">Cancelar</button>
                                    </div>
                                    {estado === 'enviando' && (
                                        <p className="text-xs text-gray-500 mt-2 text-center">Subiendo el audio — puede tardar unos segundos…</p>
                                    )}
                                </div>
                            )}

                            {estado === 'ok' && (
                                <div className="text-center py-6">
                                    <div className="text-3xl mb-3">🤝</div>
                                    <p className="text-white text-sm font-medium mb-2">¡Track publicado en la comunidad!</p>
                                    <p className="text-gray-400 text-xs mb-5">Ya está en el muro para que otros productores lo escuchen. Pásate a escuchar los suyos y devuélveles el feedback.</p>
                                    <div className="flex gap-3 justify-center">
                                        <a href="/comunidad" className="px-5 py-2.5 btn-primary rounded-lg text-sm font-semibold">Ver en la comunidad</a>
                                        <button onClick={() => setOpen(false)} className="px-5 py-2.5 btn-secondary rounded-lg text-sm">Cerrar</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </React.Fragment>
        );
    }


    // =====================================================================
    // CTA in-app de la encuesta de comunidad — visible tras un análisis y en
    // el panel, para no depender solo de quien recibió el email. Se oculta a
    // quien ya respondió (email o app) o cierra el aviso.
    // =====================================================================
    function EncuestaCTA({ origen }) {
        const [estado, setEstado] = useState('check'); // check | mostrar | votado | oculto
        const [opciones, setOpciones] = useState({});
        const [intro, setIntro] = useState('');
        const [comentario, setComentario] = useState('');
        const [comOk, setComOk] = useState(false);

        useEffect(() => {
            try { if (localStorage.getItem('mt_encuesta_cerrada')) { setEstado('oculto'); return; } } catch (e) {}
            const { token } = getAuth();
            if (!token) { setEstado('oculto'); return; }
            let vivo = true;
            fetch(`${API_URL}/api/encuesta/estado`, { headers: authHeaders() })
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    if (!vivo) return;
                    if (d && d.mostrar) { setOpciones(d.opciones || {}); setIntro(d.intro || ''); setEstado('mostrar'); }
                    else setEstado('oculto');
                })
                .catch(() => { if (vivo) setEstado('oculto'); });
            return () => { vivo = false; };
        }, []);

        const votar = (op) => {
            setEstado('votado');
            trackEvent('encuesta_voto_inapp', { opcion: op, origen: origen || '' });
            fetch(`${API_URL}/api/encuesta/voto-auth`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ o: op }) }).catch(() => {});
        };
        const enviarComentario = () => {
            const c = comentario.trim(); if (!c) return;
            fetch(`${API_URL}/api/encuesta/comentario-auth`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ comentario: c }) })
                .then(r => { if (r.ok) setComOk(true); }).catch(() => {});
        };
        const cerrar = () => { try { localStorage.setItem('mt_encuesta_cerrada', '1'); } catch (e) {} setEstado('oculto'); };

        if (estado === 'check' || estado === 'oculto') return null;

        return (
            <div className="card p-5 mb-4" style={{borderLeft: '3px solid var(--po-purple)'}}>
                <div className="flex items-start justify-between gap-3">
                    <p className="text-xs accent-purple font-medium uppercase tracking-wider mb-1">Una pregunta rápida</p>
                    {estado === 'mostrar' && (
                        <button onClick={cerrar} title="Cerrar" className="text-gray-600 hover:text-gray-400 text-sm leading-none">✕</button>
                    )}
                </div>

                {estado === 'mostrar' && (
                    <div>
                        <p className="text-white text-sm leading-relaxed mb-3">{intro}</p>
                        <div className="flex flex-col gap-2">
                            {Object.entries(opciones).map(([val, txt]) => (
                                <button key={val} onClick={() => votar(val)}
                                    className="px-4 py-2.5 rounded-lg text-xs text-left transition-colors"
                                    style={{background: 'rgba(168,85,247,0.06)', border: '1px solid rgba(168,85,247,0.25)', color: 'var(--po-light)'}}
                                    onMouseOver={e => e.currentTarget.style.background = 'rgba(168,85,247,0.16)'}
                                    onMouseOut={e => e.currentTarget.style.background = 'rgba(168,85,247,0.06)'}>
                                    {txt}
                                </button>
                            ))}
                        </div>
                    </div>
                )}

                {estado === 'votado' && (
                    <div>
                        <p className="text-white text-sm mb-2" style={{color: 'var(--po-green)'}}>✓ ¡Gracias! Tu respuesta nos ayuda a decidir qué construir.</p>
                        {!comOk ? (
                            <div className="mt-2">
                                <textarea value={comentario} onChange={e => setComentario(e.target.value)} maxLength={2000} rows={2}
                                    placeholder="¿Quieres añadir algo? Qué te animaría o te frenaría… (opcional)"
                                    className="w-full px-3 py-2 rounded-lg text-sm input-field" style={{resize: 'vertical'}} />
                                <button onClick={enviarComentario} className="mt-2 px-4 py-2 btn-secondary rounded-lg text-xs">Enviar comentario</button>
                            </div>
                        ) : (
                            <p className="text-xs text-gray-500">✓ Comentario guardado. ¡Gracias!</p>
                        )}
                    </div>
                )}
            </div>
        );
    }


    // =========================================================================
    // REDISEÑO DEL DIAGNÓSTICO (v2) — piezas
    // =========================================================================
    // Se activa con ?v2=1 y convive con la vista clásica; ninguna de estas
    // funciones se ejecuta si el interruptor está apagado.
    //
    // Qué resuelve, respecto a la vista de siempre:
    //   * el ancho: 1280 px y rejillas, en vez de una columna de 672;
    //   * el volumen de texto: cada tarjeta enseña un avance y guarda el resto;
    //   * la orientación: cinco pestañas en vez de ~25 secciones apiladas.
    // El prototipo con el que se validó está en docs/rediseno/.

    const V2_MORADO = '#6D10FF';

    /** Onda abstracta, para la línea de "medido en el drop". */
    const V2IconoOnda = () => (
        <svg width="26" height="14" viewBox="0 0 26 14" fill="none" aria-hidden="true"
             style={{ flexShrink: 0, marginTop: 1 }}>
            <path d="M1 7h2.2l1.6-4.6L7 11.4l2-8.2 2 6.6 1.8-3.4 1.7 5.2 2-7 1.9 4.4L20.4 7H25"
                  stroke={V2_MORADO} strokeWidth="1.3" strokeLinecap="round"
                  strokeLinejoin="round" opacity="0.85" />
        </svg>
    );

    /** Check en círculo, para el veredicto favorable. */
    const V2IconoCheck = ({ color }) => (
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"
             style={{ flexShrink: 0, marginTop: 2 }}>
            <circle cx="8" cy="8" r="6.6" stroke={color} strokeWidth="1.3" />
            <path d="M5.2 8.2l2 2 3.6-4" stroke={color} strokeWidth="1.5"
                  strokeLinecap="round" strokeLinejoin="round" />
        </svg>
    );

    /** Aviso: mismo peso visual que el check, sin alarmismo. */
    const V2IconoAviso = ({ color }) => (
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"
             style={{ flexShrink: 0, marginTop: 2 }}>
            <circle cx="8" cy="8" r="6.6" stroke={color} strokeWidth="1.3" />
            <path d="M8 4.6v4.2" stroke={color} strokeWidth="1.5" strokeLinecap="round" />
            <circle cx="8" cy="11.2" r="0.85" fill={color} />
        </svg>
    );
    // El ámbar y el rojo bajan de saturación respecto al amarillo puro que
    // había: en un panel oscuro el #facc15 grita, y hacía que dos zonas fuera
    // de rango parecieran un problema mayor del que el análisis dice que es.
    // Mismo significado, menos volumen.
    const V2_COLOR = { neutro: '#3a3a3a', ok: '#25F464', aviso: '#dda75a',
                       alerta: '#d97b73', info: '#60a5fa' };

    /** ¿Pide el usuario la vista nueva? Interruptor por URL: ?v2=1 la enciende,
     *  ?v2=0 la apaga. Se recuerda en la sesión para que no se pierda al
     *  navegar dentro de la app. */
    function usarVistaV2() {
        try {
            const p = new URLSearchParams(location.search).get('v2');
            if (p === '1') { sessionStorage.setItem('mt_v2', '1'); return true; }
            if (p === '0') { sessionStorage.removeItem('mt_v2'); return false; }
            return sessionStorage.getItem('mt_v2') === '1';
        } catch (e) { return false; }
    }

    /** Miles con separador: 253164 es ilegible, 253.164 no. */
    function v2Num(n) {
        return typeof n === 'number' ? n.toLocaleString('es-ES') : n;
    }

    /** Corta un texto largo por la primera frase; el resto queda para desplegar.
     *  Las prioridades del motor son párrafos de 400 caracteres y algunas son
     *  UNA sola frase encadenada con puntos y coma: por eso hay, además del
     *  corte por punto, un tope por longitud. */
    function v2Partir(texto, minimo, tope) {
        minimo = minimo || 90; tope = tope || 240;
        if (!texto || texto.length <= minimo + 40) return [texto || '', ''];
        const re = /\.\s/g;
        let m;
        while ((m = re.exec(texto)) !== null) {
            if (m.index >= minimo) {
                const avance = texto.slice(0, m.index + 1);
                if (avance.length <= tope) return [avance, texto.slice(m.index + 2)];
                break;
            }
        }
        const trozo = texto.slice(0, tope);
        const corte = Math.max(trozo.lastIndexOf('; '), trozo.lastIndexOf(', '));
        const i = corte > minimo ? corte : trozo.lastIndexOf(' ');
        if (i <= minimo) return [texto, ''];
        return [texto.slice(0, i) + '…', texto.slice(i + 1)];
    }

    /** Dato suelto en formato panel: rótulo arriba, valor abajo. */
    function V2Dato({ etiqueta, valor, tono }) {
        const color = (!tono || tono === 'neutro') ? '#e5e5e5' : V2_COLOR[tono];
        return (
            <div className="px-3 py-1.5 rounded border border-[#333] bg-[#1e1e1e]">
                <div className="rotulo-v2 leading-tight">{etiqueta}</div>
                <div className="text-sm font-semibold leading-tight cifra-v2 mt-0.5" style={{ color }}>{valor}</div>
            </div>
        );
    }

    /** Avance visible + resto desplegable. Es lo que resuelve el exceso de texto. */
    function V2Desplegable({ avance, children, etiqueta }) {
        const [abierto, setAbierto] = useState(false);
        const hayResto = React.Children.toArray(children).some(
            c => c && (typeof c !== 'object' || c.props === undefined || c.props.children));
        return (
            <div>
                {avance && <p className="text-gray-300 v2-cuerpo">{avance}</p>}
                {abierto && <div className="mt-2.5 text-gray-400 v2-cuerpo space-y-2 fade-in">{children}</div>}
                {hayResto && (
                    <button onClick={() => setAbierto(!abierto)}
                            className="mt-2 text-xs transition"
                            style={{ color: abierto ? '#8a8a93' : '#9a6bff' }}
                            onMouseEnter={e => (e.currentTarget.style.color = '#b393ff')}
                            onMouseLeave={e => (e.currentTarget.style.color = abierto ? '#8a8a93' : '#9a6bff')}>
                        {abierto ? '− Ocultar' : '+ ' + (etiqueta || 'Saber más')}
                    </button>
                )}
            </div>
        );
    }

    /** Tarjeta. Sin icono: el estado va en un punto de color junto al rótulo, y
     *  el borde de color aparece SOLO si hay algo que mirar — si todo lleva
     *  color, el color deja de avisar. */
    function V2Tarjeta({ titulo, tono, datos, children, ancho }) {
        const t = tono || 'neutro';
        return (
            <div className={`card p-5 ${ancho || ''}`}
                 style={t === 'neutro' ? undefined : { borderTop: `1px solid ${V2_COLOR[t]}99` }}>
                <div className="flex items-start justify-between gap-3 mb-3">
                    <div className="flex items-center gap-2 min-w-0">
                        {t !== 'neutro' && <span className="punto-v2" style={{ background: V2_COLOR[t] }} />}
                        <span className="rotulo-v2">{titulo}</span>
                    </div>
                    {datos && <div className="flex gap-2 flex-wrap justify-end">{datos}</div>}
                </div>
                {children}
            </div>
        );
    }

    /** Barra con la zona objetivo marcada: un número suelto no dice si está bien. */
    function V2BarraRango({ valor, min, max, objetivoMin, objetivoMax }) {
        const pct = v => Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
        const dentro = valor >= objetivoMin && valor <= objetivoMax;
        return (
            <div>
                <div className="relative h-5 barra-v2">
                    <div className="absolute top-0 bottom-0"
                         style={{ left: `${pct(objetivoMin)}%`, width: `${pct(objetivoMax) - pct(objetivoMin)}%`,
                                  background: 'rgba(37,244,100,0.12)', borderLeft: '1px solid rgba(37,244,100,0.3)',
                                  borderRight: '1px solid rgba(37,244,100,0.3)' }} />
                    <div className="absolute top-0 bottom-0 w-[2px]"
                         style={{ left: `calc(${pct(valor)}% - 1px)`, background: dentro ? V2_COLOR.ok : V2_COLOR.aviso }} />
                </div>
                <div className="flex justify-between text-[10px] text-gray-600 mt-1 cifra-v2">
                    <span>{min}</span>
                    <span className="text-gray-500">objetivo {objetivoMin} a {objetivoMax}</span>
                    <span>{max}</span>
                </div>
            </div>
        );
    }

    /** Las tres bandas del espectro, de un vistazo. */
    function V2Espectro({ grave, media, aguda }) {
        const vals = [{ n: 'Graves', v: grave }, { n: 'Medios', v: media }, { n: 'Agudos', v: aguda }];
        const suelo = -75, techo = -20;
        const alto = v => Math.max(4, Math.min(100, (((v == null ? suelo : v) - suelo) / (techo - suelo)) * 100));
        return (
            <div className="flex items-end gap-3 h-24">
                {vals.map(b => (
                    <div key={b.n} className="flex-1 flex flex-col items-center justify-end h-full">
                        <span className="text-[10px] text-gray-500 mb-1 cifra-v2">
                            {b.v == null ? '—' : b.v.toFixed(0)}
                        </span>
                        <div className="w-full rounded-sm" style={{ height: `${alto(b.v)}%`, background: '#4a4a4a' }} />
                        <span className="rotulo-v2 mt-1.5">{b.n}</span>
                    </div>
                ))}
            </div>
        );
    }

    /** Anillo de porcentaje: correlación mono y similares. */
    function V2Anillo({ pct, etiqueta, tono }) {
        const r = 24, c = 2 * Math.PI * r;
        const p = Math.max(0, Math.min(100, pct || 0));
        return (
            <div className="flex items-center gap-3">
                <svg width="58" height="58" viewBox="0 0 58 58" className="flex-shrink-0">
                    <circle cx="29" cy="29" r={r} fill="none" stroke="#2e2e2e" strokeWidth="5" />
                    <circle cx="29" cy="29" r={r} fill="none" stroke={tono || V2_COLOR.ok} strokeWidth="5"
                            strokeLinecap="round" strokeDasharray={`${(c * p) / 100} ${c}`}
                            transform="rotate(-90 29 29)" />
                    <text x="29" y="33" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="600">
                        {Math.round(p)}%
                    </text>
                </svg>
                <span className="v2-sec text-gray-400">{etiqueta}</span>
            </div>
        );
    }

    /** Color de una zona del espectro según lo cargada que esté.
     *  Verde = poca energía, rojo = mucha. Es DESCRIPTIVO, no un veredicto:
     *  que los graves estén rojos en un techno es lo normal. El juicio lo
     *  ponen las etiquetas del motor (balance elevado, carencia de medios…),
     *  no el color. */
    function v2ColorNivel(n) {
        const v = Math.max(0, Math.min(100, n || 0));
        if (v < 25) return '#25F464';
        if (v < 45) return '#a3e635';
        if (v < 65) return '#facc15';
        if (v < 82) return '#fb923c';
        return '#f87171';
    }

    /** Traduce los estados del motor a un tono. El vocabulario sale de
     *  extractor.py: no se inventa ninguna categoría aquí. */
    function v2TonoEstado(campo, valor) {
        const v = (valor || '').toLowerCase();
        if (campo === 'balance_grave')
            return v === 'normal' ? 'ok' : v === 'elevado' ? 'aviso' : v === 'excesivo' ? 'alerta' : 'neutro';
        if (campo === 'mono')
            return (v === 'excelente' || v === 'buena') ? 'ok'
                 : (v === 'critica' || v === 'problematica') ? 'alerta'
                 : v ? 'aviso' : 'neutro';
        if (campo === 'densidad')
            // "baja" no se pinta: en un minimal es lo normal y en un boceto es
            // síntoma. El motor ya lo dice en el diagnóstico si toca.
            return v === 'media' ? 'ok' : v === 'alta' ? 'aviso' : v === 'saturada' ? 'alerta' : 'neutro';
        if (campo === 'contraste')
            return v === 'alto' ? 'ok' : v === 'bajo' ? 'aviso' : 'neutro';
        return 'neutro';
    }

    // Las seis bandas del extractor, con su rango real. El ancho de cada una
    // en la barra va en escala logarítmica, que es como se oye la frecuencia:
    // de 60 a 200 Hz se percibe un salto parecido al de 4 a 8 kHz.
    // Corredor de referencia: dónde cae el espectro de la música ya editada.
    // Percentiles de 322 previews independientes de 26 sellos, medidos con el mismo código
    // que el track del usuario (mismo tercio de octava, misma ventana del drop,
    // misma inclinación) y anclados igual que la curva que se dibuja encima.
    // Se regenera con backend/scripts/calibrar_corredor.py.
    //
    // El 0 es el CUERPO del tema (media de 200 Hz a 2 kHz), no su banda más
    // alta. Anclar al pico parecía natural pero tenía un punto ciego serio: el
    // 87 % de los temas pica entre 50 y 80 Hz, así que ahí todo el mundo valía 0
    // por construcción y el corredor NO podía detectar exceso de grave justo
    // donde más importa (medido: en 50 Hz la mediana y el p95 valían los dos
    // 0.0). Anclando al cuerpo hay 6.6 dB de margen, y el número se explica
    // solo: "tu grave está X dB por encima del cuerpo del tema".
    //
    // Se corta en 12.5 kHz a propósito, pero NO porque el corpus esté cortado
    // ahí — auditado: cada archivo corta donde le deja su encoder, entre 16 y
    // 20 kHz (mediana 18.3, p10 16.0, y 27 de 327 por debajo de 16). El motivo
    // es esa misma heterogeneidad: arriba el corredor mide la variedad de
    // encoders, no la de la música, y por eso se ensancha a 20.7 dB en 16 kHz
    // y a 64 en 20 kHz.
    //
    // Cinco percentiles y no dos: lo/hi son el 5-95 (el rango habitual, 11.1 dB
    // de ancho mediano) y lo2/hi2 el 25-75 (donde cae la MITAD de los discos,
    // 4.4 dB). Se dibujan como dos bandas anidadas, así que la densidad del
    // corredor codifica lo típico que es cada zona en vez de ser un degradado
    // decorativo. El veredicto sigue usando solo el 5-95.
    const V2_CORREDOR = [
        { hz: 20, lo: -33.4, lo2: -29.3, med: -26.4, hi2: -22.3, hi: -12.2 },
        { hz: 25, lo: -30.9, lo2: -26.1, med: -22.7, hi2: -17.8, hi: -6.2 },
        { hz: 31.5, lo: -23.4, lo2: -15.6, med: -11.5, hi2: -4.4, hi: 4.9 },
        { hz: 40, lo: -13.2, lo2: -2.6, med: 2.4, hi2: 6.9, hi: 11.8 },
        { hz: 50, lo: 0.9, lo2: 7.6, med: 10.2, hi2: 12.6, hi: 16.9 },
        { hz: 63, lo: 2.5, lo2: 6.6, med: 8.9, hi2: 11.2, hi: 15.0 },
        { hz: 80, lo: 1.3, lo2: 4.3, med: 6.6, hi2: 9.1, hi: 12.5 },
        { hz: 100, lo: -1.2, lo2: 2.5, med: 4.8, hi2: 7.2, hi: 11.0 },
        { hz: 125, lo: -2.6, lo2: 1.1, med: 3.4, hi2: 6.0, hi: 9.4 },
        { hz: 160, lo: -2.7, lo2: 0.4, med: 2.1, hi2: 4.3, hi: 8.4 },
        { hz: 200, lo: -2.7, lo2: -0.6, med: 1.4, hi2: 3.6, hi: 7.1 },
        { hz: 250, lo: -4.4, lo2: -1.1, med: 0.7, hi2: 2.4, hi: 4.6 },
        { hz: 315, lo: -3.5, lo2: -1.0, med: 0.7, hi2: 2.1, hi: 4.8 },
        { hz: 400, lo: -3.3, lo2: -1.2, med: 0.3, hi2: 2.1, hi: 4.8 },
        { hz: 500, lo: -3.5, lo2: -1.5, med: -0.2, hi2: 1.2, hi: 3.2 },
        { hz: 630, lo: -4.2, lo2: -1.5, med: -0.2, hi2: 1.5, hi: 3.8 },
        { hz: 800, lo: -4.3, lo2: -1.7, med: -0.2, hi2: 1.1, hi: 3.9 },
        { hz: 1000, lo: -3.7, lo2: -1.7, med: -0.5, hi2: 0.8, hi: 2.6 },
        { hz: 1250, lo: -3.9, lo2: -1.8, med: -0.4, hi2: 0.8, hi: 2.6 },
        { hz: 1600, lo: -4.4, lo2: -2.0, med: -0.8, hi2: 0.6, hi: 2.6 },
        { hz: 2000, lo: -4.7, lo2: -2.4, med: -1.0, hi2: 0.3, hi: 2.4 },
        { hz: 2500, lo: -5.8, lo2: -2.9, med: -1.0, hi2: 0.5, hi: 3.0 },
        { hz: 3150, lo: -5.4, lo2: -2.7, med: -0.7, hi2: 1.0, hi: 3.7 },
        { hz: 4000, lo: -5.9, lo2: -2.1, med: 0.5, hi2: 2.3, hi: 5.0 },
        { hz: 5000, lo: -6.0, lo2: -0.6, med: 1.8, hi2: 3.7, hi: 6.6 },
        { hz: 6300, lo: -5.0, lo2: 0.8, med: 3.3, hi2: 5.5, hi: 8.4 },
        { hz: 8000, lo: -5.5, lo2: 1.2, med: 3.9, hi2: 6.4, hi: 9.2 },
        { hz: 10000, lo: -7.3, lo2: 0.7, med: 3.6, hi2: 5.9, hi: 8.9 },
        { hz: 12500, lo: -10.1, lo2: -1.7, med: 1.8, hi2: 4.3, hi: 7.7 },
    ];

    /** Zonas con nombre, para poder decir DÓNDE cae fuera de la referencia.
     *  `tuyo` y `verbo` existen para construir la frase con la concordancia
     *  correcta: "Tus graves están" pero "Tu presencia está". */
    const V2_ZONAS = [
        { f0: 0,    f1: 60,    et: 'el sub',           tuyo: 'Tu sub',        verbo: 'está' },
        { f0: 60,   f1: 200,   et: 'los graves',       tuyo: 'Tus graves',    verbo: 'están' },
        { f0: 200,  f1: 800,   et: 'los medios bajos', tuyo: 'Tus medios bajos', verbo: 'están' },
        { f0: 800,  f1: 4000,  et: 'los medios',       tuyo: 'Tus medios',    verbo: 'están' },
        { f0: 4000, f1: 8000,  et: 'la presencia',     tuyo: 'Tu presencia',  verbo: 'está' },
        { f0: 8000, f1: 20000, et: 'el aire',          tuyo: 'Tu aire',       verbo: 'está' },
    ];

    /** Compara la curva con el corredor de referencia.
     *
     * La regla no es "no salirse nunca": con 29 bandas y un corredor del 5 al
     * 95, salirse en alguna es lo normal — medido, solo el 26 % de los discos
     * publicados se queda dentro en TODAS. Una banda suelta fuera es la textura
     * del tema. Lo que describe una zona es una RACHA.
     *
     * Calibrado sobre los mismos 322 previews, mirando de 50 Hz para arriba: con
     * rachas de 4 bandas seguidas sale "equilibrado" el 87 % de los discos
     * publicados y el 79 % de los tracks de usuario.
     *
     * Esos 8 puntos de separación son POCOS, y hay que tenerlo presente: esto
     * no distingue a un aficionado de un profesional, ni pretende hacerlo. Lo
     * que dice es literalmente lo que dice — si el balance tonal cae donde
     * suele caer el de la música editada — y resulta que el de casi todo el
     * mundo cae ahí. Por eso el rótulo habla de "balance" y no de "resultado",
     * y por eso el corredor se dibuja como contexto y no como aprobado.
     */
    const V2_RACHA_MINIMA = 4;
    // El veredicto solo mira de 50 Hz para arriba. Por debajo el corredor mide
    // entre 21 y 28 dB de ancho — cabe casi cualquier cosa, así que un aviso ahí
    // no informa — y además muchísimos temas van filtrados por debajo de 30 Hz a
    // propósito, que es una decisión correcta y no un defecto. El corredor SÍ se
    // sigue dibujando ahí: como contexto vale, como juez no.
    const V2_VEREDICTO_DESDE = 50;
    const V2_TILT = 1.5;          // ver el comentario largo en V2Espectro2
    const V2_TOPE_DIBUJO = 16000;
    const V2_CUERPO = [200, 2000];  // la referencia de 0 dB; ver V2_CORREDOR

    /** Nivel del cuerpo del tema: el 0 de la escala. */
    function v2Referencia(puntos) {
        const c = puntos.filter(q => q.f >= V2_CUERPO[0] && q.f <= V2_CUERPO[1]);
        if (!c.length) return puntos.length ? Math.max(...puntos.map(q => q.v)) : 0;
        return c.reduce((s, q) => s + q.v, 0) / c.length;
    }

    /** Los puntos del espectro, ya inclinados y recortados. Una sola función
     *  para el gráfico y para el veredicto: si divergieran, el rótulo volvería
     *  a contradecir a la curva, que es justo lo que se venía de arreglar. */
    function v2PuntosEspectro(fino, display) {
        const detallado = !!(fino && fino.bandas && fino.bandas.length);
        if (!detallado && (!display || Object.keys(display).length === 0)) return [];
        return (detallado
            ? fino.bandas.map(b => ({ f: b.hz, v: b.db }))
                         .filter(q => typeof q.v === 'number')
            : V2_BANDAS.map(b => ({ f: Math.sqrt(Math.max(b.f0, 20) * b.f1), v: display[b.k] }))
                       .filter(q => typeof q.v === 'number')
        ).map(q => ({ f: q.f, v: q.v + V2_TILT * Math.log2(q.f / 1000) }))
         .filter(q => q.f <= V2_TOPE_DIBUJO);
    }

    /** Veredicto del balance, calculado fuera del componente para que la tarjeta
     *  lo tenga en el primer render (nada de useEffect: parpadeaba). */
    function v2VeredictoEspectro(fino, display) {
        const pts = v2PuntosEspectro(fino, display);
        if (pts.length < 2) return null;
        const ref = v2Referencia(pts);
        return v2CompararCorredor(pts.map(q => ({ f: q.f, v: q.v - ref })));
    }
    function v2CompararCorredor(puntos) {
        const ref = new Map(V2_CORREDOR.map(c => [c.hz, c]));
        const fuera = puntos.map(p => {
            const c = p.f >= V2_VEREDICTO_DESDE ? ref.get(p.f) : null;
            if (!c) return 0;
            if (p.v > c.hi) return p.v - c.hi;
            if (p.v < c.lo) return p.v - c.lo;
            return 0;
        });
        // Rachas del mismo signo: sobra en una zona, o falta, pero no las dos.
        const rachas = [];
        let i = 0;
        while (i < fuera.length) {
            if (!fuera[i] || !ref.has(puntos[i].f)) { i++; continue; }
            const signo = Math.sign(fuera[i]);
            let j = i;
            while (j < fuera.length && Math.sign(fuera[j]) === signo
                   && ref.has(puntos[j].f) && puntos[j].f >= V2_VEREDICTO_DESDE) j++;
            if (j - i >= V2_RACHA_MINIMA) {
                let k = i;
                for (let m = i; m < j; m++) if (Math.abs(fuera[m]) > Math.abs(fuera[k])) k = m;
                rachas.push({ desde: puntos[i].f, hasta: puntos[j - 1].f, signo,
                              pico: puntos[k], db: fuera[k], bandas: j - i });
            }
            i = j;
        }
        rachas.sort((a, b) => Math.abs(b.db) - Math.abs(a.db));
        // La zona se decide por MAYORÍA de bandas de la racha, no por la banda
        // con más desviación: una racha de 50 a 200 Hz cuyo pico cayera justo
        // en 200 se etiquetaba "medios bajos" siendo casi toda graves.
        const zona = r => {
            const cuenta = new Map();
            for (const p of puntos) {
                if (p.f < r.desde || p.f > r.hasta) continue;
                const z = V2_ZONAS.find(q => p.f >= q.f0 && p.f < q.f1) || V2_ZONAS[0];
                cuenta.set(z, (cuenta.get(z) || 0) + 1);
            }
            let mejor = V2_ZONAS[0], max = -1;
            for (const [z, n] of cuenta) if (n > max) { mejor = z; max = n; }
            return mejor;
        };
        return {
            // "dentro" describe una posición medida, no un juicio de calidad.
            // Ver el comentario de arriba: esto separa 8 puntos entre discos
            // publicados y temas de usuario, así que no puede afirmar que un
            // balance esté bien o mal — solo dónde cae respecto a la muestra.
            dentro: rachas.length === 0,
            rachas: rachas.map(r => { const z = zona(r); return { ...r, z, zona: z.et }; }),
            fuera,
        };
    }

    const V2_BANDAS = [
        { k: 'sub',       f0: 20,   f1: 60,    et: 'Sub' },
        { k: 'graves',    f0: 60,   f1: 200,   et: 'Graves' },
        { k: 'low_mid',   f0: 200,  f1: 800,   et: 'Medios bajos' },
        { k: 'mid',       f0: 800,  f1: 4000,  et: 'Medios' },
        { k: 'presencia', f0: 4000, f1: 8000,  et: 'Presencia' },
        { k: 'air',       f0: 8000, f1: 20000, et: 'Aire' },
    ];

    /** Barra del espectro audible, de 20 Hz a 20 kHz, coloreada por cuánta
     *  energía tiene cada zona. Permite ver de un vistazo dónde está cargado
     *  el track. Acepta marcas (`marcas`) para señalar una frecuencia
     *  concreta, como el pico de aspereza. */
    /** Espectro del track en el drop. Una sola lectura.
     *
     * Hubo dos: la física (lo que enseña un analizador) y una compensada con la
     * ponderación A, conmutables con una pestaña "Oído". Se retiró la segunda
     * (ago-2026) y conviene saber por qué, porque la idea vuelve sola:
     *
     *   · No decía nada nuevo. La ponderación A es un desplazamiento fijo por
     *     banda, así que corre la curva y el corredor por igual. Medido sobre
     *     los 322 previews y 19 temas de usuario: la desviación respecto al
     *     corredor correlaciona 0.9994 entre las dos vistas, con 0.03 dB de
     *     diferencia media. Era la misma medida dibujada en otro eje.
     *   · Y podía contradecir a la insignia. Aquella vista se anclaba al pico
     *     del tema en vez de al cuerpo, y con ese anclaje sí es una estadística
     *     distinta: 27 de 322 previews (8 %) habrían visto REFERENCIA/DENTRO
     *     en la cabecera con la curva saliéndose del corredor en pantalla.
     *   · Además la ponderación A es la curva de 40 fon —escucha a volumen
     *     bajo—. Esta música se oye a 85-100 dB SPL, donde las isofónicas son
     *     mucho más planas, así que compensaba de más. Como ilustración valía;
     *     como juez, le habría dado autoridad que no tiene.
     *
     * El motor sigue calculando `db_pond` y `espectro_display_pond`: ya no los
     * lee nadie, pero son el dato crudo si la vista vuelve.
     *
     * Se dibuja sobre una escala de dB FIJA, no normalizada 0-100: normalizar
     * pone siempre una banda arriba del todo y otra abajo, por pequeña que sea
     * la diferencia real, y fabrica montañas donde no las hay.
     */
    /* ==================================================================
       BALANCE ESPECTRAL
       ==================================================================
       Regla que manda sobre todas las demás: la interfaz NUNCA puede sugerir
       un problema que el análisis no haya detectado. De ahí salen casi todas
       las decisiones de abajo — que el corredor sea morado apagado y no rojo,
       que la curva sea blanca y solo se tiña donde el motor ha marcado algo, y
       que no haya relleno hasta el fondo (una montaña alta no es un defecto:
       toda la música tiene el grave alto).

       Geometría, en helpers separados para que se lean solos:
         v2EspectroX()        frecuencia → % horizontal (log)
         v2EspectroY()        dB → % vertical
         v2CurvaSuave()       los 31 puntos → path, sin overshoot
         v2PathCorredor()     los percentiles → polígono cerrado
    */

    /** Frecuencia a porcentaje horizontal. Log, que es como se oye. */
    function v2EspectroX(f, f0, f1) {
        const lg = Math.log10;
        const v = Math.min(Math.max(f, f0), f1);
        return ((lg(v) - lg(f0)) / (lg(f1) - lg(f0))) * 100;
    }

    /** dB a porcentaje vertical, con aire arriba y un margen abajo. */
    function v2EspectroY(db, arriba, rango, aire, util) {
        const t = Math.max(0, Math.min(1, (arriba - db) / rango));
        return aire + t * util;
    }

    /** Cúbica monótona por tramos (Fritsch–Carlson, 1980).
     *
     *  Sustituye a la Catmull-Rom con tensión 1/2 que había. Aquella usaba la
     *  mitad de la distancia de control estándar, y por eso se veía la unión
     *  entre puntos: parecía una polilínea redondeada más que una curva.
     *
     *  Esta usa la distancia completa (h/3) —así que suaviza el doble— pero
     *  antes limita las tangentes, que es lo que garantiza que NO puede
     *  overshootear. En concreto:
     *
     *    · en un máximo o mínimo local la tangente se pone a 0, así que la
     *      curva no se pasa de largo ni inventa un pico más alto que el dato;
     *    · si una tangente es demasiado grande para el tramo, se escala hacia
     *      dentro del círculo de radio 3 de De Boor–Swartz.
     *
     *  Consecuencia: entre dos bandas medidas la curva nunca sale del intervalo
     *  que forman. En un gráfico de diagnóstico eso no es un detalle estético —
     *  un spline que se pasa dibujaría un exceso de energía que no existe.
     */
    function v2CurvaSuave(pts) {
        const n = pts.length;
        if (n < 2) return '';
        const f = v => v.toFixed(2);
        if (n === 2) return `M ${f(pts[0][0])},${f(pts[0][1])} L ${f(pts[1][0])},${f(pts[1][1])}`;

        const h = [], d = [];
        for (let i = 0; i < n - 1; i++) {
            h[i] = pts[i + 1][0] - pts[i][0];
            d[i] = h[i] ? (pts[i + 1][1] - pts[i][1]) / h[i] : 0;
        }
        const m = new Array(n);
        m[0] = d[0];
        m[n - 1] = d[n - 2];
        for (let i = 1; i < n - 1; i++) {
            // Cambio de signo = extremo local: tangente plana, sin pasarse.
            m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
        }
        for (let i = 0; i < n - 1; i++) {
            if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
            const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
            if (s > 9) {
                const t = 3 / Math.sqrt(s);
                m[i] = t * a * d[i];
                m[i + 1] = t * b * d[i];
            }
        }
        let out = `M ${f(pts[0][0])},${f(pts[0][1])}`;
        for (let i = 0; i < n - 1; i++) {
            out += ` C ${f(pts[i][0] + h[i] / 3)},${f(pts[i][1] + m[i] * h[i] / 3)}`
                 + ` ${f(pts[i + 1][0] - h[i] / 3)},${f(pts[i + 1][1] - m[i + 1] * h[i] / 3)}`
                 + ` ${f(pts[i + 1][0])},${f(pts[i + 1][1])}`;
        }
        return out;
    }

    /** El corredor, como polígono cerrado: borde alto de ida, bajo de vuelta.
     *
     *  Los dos bordes van con la MISMA cúbica monótona que la curva del track.
     *  Antes se unían con rectas y a 29 bandas eso se veía: el corredor salía
     *  facetado mientras la curva de encima iba suave, y esa diferencia de
     *  acabado era justo lo que hacía leer la franja como una pegatina en vez
     *  de como el fondo del gráfico.
     *
     *  La cúbica monótona es simétrica al invertir el eje X, así que el borde
     *  de vuelta es esa misma curva recorrida al revés: basta con encadenarla
     *  cambiando su `M` inicial por un `L`.
     */
    function v2PathCorredor(arriba, abajo) {
        if (arriba.length < 2 || abajo.length < 2) return '';
        const vuelta = v2CurvaSuave(abajo.slice().reverse());
        return `${v2CurvaSuave(arriba)} L ${vuelta.slice(2)} Z`;
    }

    /** La nube del corredor: capas anidadas entre percentiles simétricos.
     *
     *  Con dos bandas (5-95 y 25-75) el corredor se leía como dos franjas con
     *  un escalón entre ellas. Aquí se dibujan catorce parejas —(5,95), luego
     *  (8.2, 91.8)… hasta rozar la mediana— todas con la misma opacidad baja.
     *  Con ocho todavía se distinguían las capas donde la nube es ancha; con
     *  catorce el salto entre una y otra cae por debajo de lo que se ve.
     *  Donde el corpus se concentra las capas se apilan y la nube se espesa;
     *  donde se dispersa quedan separadas y se desvanece sola. La densidad que
     *  se ve ES la de la muestra, no un degradado decorativo: el sub, que es la
     *  zona donde más se diferencian los discos, sale difuso porque de verdad
     *  lo es.
     *
     *  Los cinco percentiles medidos siguen fijando la forma; entre ellos se
     *  interpola lineal y eso solo reparte sombreado. El borde exterior sigue
     *  siendo exactamente el 5-95, que es el que juzga.
     */
    const V2_CAPAS_NUBE = 14;
    const V2_ANCLAS_PCT = [[5, 'lo'], [25, 'lo2'], [50, 'med'], [75, 'hi2'], [95, 'hi']];
    // El morado de marca (#6D10FF) apilado capa sobre capa sale eléctrico: en los
    // medios, donde el 25-75 mide 4 dB, las capas se juntan y el corredor
    // parecía un tubo de neón. Este es el mismo tono aclarado y desaturado, que
    // a igual densidad se lee como tela y no como luz. Solo para la nube: el
    // resto de la interfaz sigue con el morado de marca.
    const V2_NUBE = '#8b7ccc';

    function v2PctCorredor(c, p) {
        for (let i = 1; i < V2_ANCLAS_PCT.length; i++) {
            if (p <= V2_ANCLAS_PCT[i][0]) {
                const a = V2_ANCLAS_PCT[i - 1], b = V2_ANCLAS_PCT[i];
                return c[a[1]] + (c[b[1]] - c[a[1]]) * ((p - a[0]) / (b[0] - a[0]));
            }
        }
        return c.hi;
    }

    function v2NubeCorredor(x, y) {
        // La opacidad de cada capa va en rampa cuadrática: las de fuera casi
        // no pintan (el 5-95 entero queda en un velo) y las de dentro cargan
        // el peso. Con opacidad uniforme la nube era una neblina pareja que
        // invadía medio gráfico; así el perfil es halo tenue → cuerpo (25-75)
        // → centro, sin que se distinga ninguna capa suelta.
        const capas = [];
        for (let k = 0; k < V2_CAPAS_NUBE; k++) {
            const d = (k / V2_CAPAS_NUBE) * 45;
            const t = k / (V2_CAPAS_NUBE - 1);
            capas.push({
                path: v2PathCorredor(
                    V2_CORREDOR.map(c => [x(c.hz), y(v2PctCorredor(c, 95 - d))]),
                    V2_CORREDOR.map(c => [x(c.hz), y(v2PctCorredor(c, 5 + d))])),
                op: 0.026 + 0.055 * t * t,
            });
        }
        return capas;
    }

    function V2Espectro2({ display, fino, ventana, marcas, veredicto }) {
        const detallado = !!(fino && fino.bandas && fino.bandas.length);
        const puntos = v2PuntosEspectro(fino, display);

        // Sin datos no se dibuja una curva falsa: se dice que no los hay.
        if (puntos.length < 2) {
            return (
