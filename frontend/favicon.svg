<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo redondeado oscuro: garantiza visibilidad en pestañas claras -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- Anillo del knob (mismo gesto que el wordmark "ment[O]track") -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#F2F2F2" stroke-width="2.2"/>
  <!-- Tick diagonal en verde de marca (#25F464) -->
  <line x1="10" y1="22" x2="22" y2="10" stroke="#25F464" stroke-width="3" stroke-linecap="round"/>
</svg>
