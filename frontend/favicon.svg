  <circle cx="16" cy="16" r="9" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- Indicador del knob (posición ~2 o'clock) -->
  <line x1="16" y1="16" x2="16" y2="8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Marcas alrededor -->
  <circle cx="16" cy="4" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="24" cy="8" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="27" cy="16" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="24" cy="24" r="1.2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="8" cy="24" r="1.2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="5" cy="16" r="1.2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="8" cy="8" r="1.2" fill="rgba(255,255,255,0.5)"/>
